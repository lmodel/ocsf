---
id: https://w3id.org/lmodel/ocsf/ocsf_events_findings
name: ocsf_events_findings
title: 'OCSF event classes: Findings'
description: Findings events report findings, detections, and possible resolutions of malware,
  anomalies, or other actions performed by security products.
version: 1.9.0
source: https://github.com/ocsf/ocsf-schema/tree/1.9.0
license: Apache-2.0
see_also:
  - https://lmodel.github.io/ocsf
  - https://schema.ocsf.io/1.9.0/
prefixes:
  ocsf: https://w3id.org/lmodel/ocsf/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  attack: https://w3id.org/lmodel/attack/
  cve: https://w3id.org/lmodel/cve/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  stix: https://w3id.org/lmodel/stix/
default_prefix: ocsf
default_range: string
imports:
  - linkml:types
  - ocsf_core
  - ocsf_objects
  - ocsf_events_base
classes:
  OcsfFindingEvent:
    title: Finding
    description: The Finding event is a generic event that defines a set of attributes available
      in the Findings category.
    class_uri: ocsf:OcsfFindingEvent
    abstract: true
    is_a: OcsfBaseEvent
    mixins:
      - OcsfIncidentProfile
    in_subset:
      - ocsf_category_findings
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: finding
      ocsf_category: findings
      ocsf_profiles: incident
    slots:
      - comment
      - finding_info
      - notes
      - resources
      - vendor_attributes
    slot_usage:
      activity_id:
        description: The normalized identifier of the finding activity. Use <code>1</code>
          (Create) when a finding is first generated, <code>2</code> (Update) when an existing
          finding is modified (e.g., severity change, new evidence), and <code>3</code> (Close)
          when a finding is resolved or dismissed.
      activity_name:
        description: The finding activity name, as defined by the <code>activity_id</code>.
          When <code>activity_id</code> is <code>99</code> (Other), this <b>must</b> contain
          the source-specific activity label.
      category_uid:
        equals_number: 2
      comment:
        description: A user provided comment about the finding.
        annotations:
          ocsf_group: context
      confidence:
        description: The confidence, normalized to the caption of the confidence_id value.
          In the case of 'Other', it is defined by the event source and should be the same
          as <code>confidence_score</code> if also populated..
        annotations:
          ocsf_group: context
      confidence_id:
        description: The normalized confidence refers to the accuracy of the analytics that
          produced the finding. An analytic with a low confidence means that the finding scope
          is wide and may create finding reports that are noisy or may not be malicious in
          nature.
        annotations:
          ocsf_group: context
          ocsf_sibling: confidence
      confidence_score:
        annotations:
          ocsf_group: context
      device:
        description: Describes the affected device/host. It can be used in conjunction with
          <code>resources</code> or when there are multiple devices affected. E.g. The role
          of the device as target or actor, specific details about a cloud resource compute
          instance, etc.<p>If a single device is the source of the finding, use the <code>Host</code>
          profile and populate <code>device</code>.</p>
        recommended: false
        annotations:
          ocsf_group: context
      end_time:
        description: The time of the most recent event or finding that contributed to this
          finding.
      finding_info:
        required: true
        annotations:
          ocsf_group: primary
      notes:
        description: Additional notes related to the finding. Each note in the array can include
          a comment, the user who made the comment, the time when the note was created, and
          the time when the note was last modified (typically by the same user). Notes can
          be used to provide additional context, explanations, or observations by analysts
          related to the finding over time.
        annotations:
          ocsf_group: context
      resources:
        title: Affected Resources
        description: Describes details about resources that were the target of the activity
          that triggered the finding.
        recommended: true
        annotations:
          ocsf_group: context
      start_time:
        description: The time of the earliest event or finding that contributed to this finding.
      status:
        description: The finding lifecycle status label, normalized to the caption of the
          <code>status_id</code> value. When <code>status_id</code> is <code>99</code> (Other),
          this <b>must</b> contain the source-specific status label.
        recommended: false
        annotations:
          ocsf_group: context
      status_id:
        description: 'The normalized finding lifecycle status identifier. Unlike the status
          of an activity event, which indicates the success or failure of the activity, finding
          status tracks the review and triage workflow: whether the finding is new, being
          investigated, suppressed, or resolved. Producers should set this to reflect the
          current state of the finding in their system (e.g., <code>1</code> for newly created
          findings, <code>4</code> when remediated).'
        annotations:
          ocsf_group: context
          ocsf_sibling: status
      time:
        description: The finding creation time - when the finding was first generated, not
          when the underlying activity occurred. For the time range of contributing events,
          use <code>start_time</code> and <code>end_time</code>.
      vendor_attributes:
        annotations:
          ocsf_group: context
  OcsfApplicationSecurityPostureFinding:
    title: Application Security Posture Finding
    description: 'The Application Security Posture Finding event is a notification about any
      bug, defect, deficiency, exploit, vulnerability, weakness or any other issue with software
      and related systems. Application Security Posture Findings typically involve reporting
      on the greater context including compliance, impacted resources, remediation guidance,
      specific code defects, and/or vulnerability metadata. Application Security Posture Findings
      can be reported by Threat & Vulnerability Management (TVM) tools, Application Security
      Posture Management (ASPM) tools, or other similar tools. Note: if the event producer
      is a security control, the <code>security_control</code> profile should be applied and
      its <code>attacks</code> information, if present, should be duplicated into the <code>finding_info</code>
      object. <br><strong>Note: </strong>If the Finding is an incident, i.e. requires incident
      workflow, also apply the <code>incident</code> profile or aggregate this finding into
      an <code>Incident Finding</code>.'
    class_uri: ocsf:OcsfApplicationSecurityPostureFinding
    is_a: OcsfFindingEvent
    in_subset:
      - ocsf_category_findings
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: application_security_posture_finding
      ocsf_category: findings
      ocsf_profiles: cloud container data_classification datetime host incident linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_constraints: '{"at_least_one": ["application", "compliance", "remediation", "vulnerabilities"]}'
    any_of:
      - slot_conditions:
          application:
            required: true
      - slot_conditions:
          compliance:
            required: true
      - slot_conditions:
          remediation:
            required: true
      - slot_conditions:
          vulnerabilities:
            required: true
    slots:
      - application
      - compliance
      - remediation
      - vulnerabilities
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Create
            description: A finding was created.
          - equals_number: 2
            title: Update
            description: A finding was updated.
          - equals_number: 3
            title: Close
            description: A finding was closed.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      application:
        title: Related Application
        recommended: true
        annotations:
          ocsf_group: primary
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Findings</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Application
          Security Posture Finding</code>.'
      class_uid:
        equals_number: 2007
      comment:
        deprecated: Use the <code>notes</code> attribute instead.
        annotations:
          ocsf_group: context
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: notes
      compliance:
        title: Related Compliance
        description: Provides compliance context to vulnerabilities and other weaknesses that
          are reported as part of an Application Security or Vulnerability Management tool's
          built-in compliance framework mapping.
        recommended: true
        annotations:
          ocsf_group: primary
      end_time_dt:
        description: The time of the most recent event or finding that contributed to this
          finding.
      remediation:
        description: Describes the recommended remediation steps to address identified vulnerabilities
          or weaknesses.
        recommended: true
        annotations:
          ocsf_group: context
      resources:
        description: Describes details about the resource/resources that are affected by the
          vulnerability/vulnerabilities.
      start_time_dt:
        description: The time of the earliest event or finding that contributed to this finding.
      status_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The status is unknown.
          - equals_number: 1
            title: New
            description: The Finding is new and yet to be reviewed.
          - equals_number: 2
            title: In Progress
            description: The Finding is under review.
          - equals_number: 3
            title: Suppressed
            description: The Finding was reviewed, determined to be benign or a false positive
              and is now suppressed.
          - equals_number: 4
            title: Resolved
            description: The Finding was reviewed, remediated and is now considered resolved.
          - equals_number: 5
            title: Archived
            description: The Finding was archived.
          - equals_number: 6
            title: Deleted
            description: The Finding was deleted. For example, it might have been created
              in error.
          - equals_number: 99
            title: Other
            description: The status is not mapped. See the <code>status</code> attribute,
              which contains a data source specific value.
      time_dt:
        description: The finding creation time - when the finding was first generated, not
          when the underlying activity occurred. For the time range of contributing events,
          use <code>start_time</code> and <code>end_time</code>.
      type_uid:
        any_of:
          - equals_number: 200700
            title: 'Application Security Posture Finding: Unknown'
          - equals_number: 200701
            title: 'Application Security Posture Finding: Create'
            description: A finding was created.
          - equals_number: 200702
            title: 'Application Security Posture Finding: Update'
            description: A finding was updated.
          - equals_number: 200703
            title: 'Application Security Posture Finding: Close'
            description: A finding was closed.
          - equals_number: 200799
            title: 'Application Security Posture Finding: Other'
      vulnerabilities:
        recommended: true
        annotations:
          ocsf_group: primary
  OcsfComplianceFinding:
    title: Compliance Finding
    description: 'Compliance Finding events describe results of evaluations performed against
      resources, to check compliance with various Industry Frameworks or Security Standards
      such as <code>NIST SP 800-53, CIS AWS Foundations Benchmark v1.4.0, ISO/IEC 27001</code>
      etc. Note: if the event producer is a security control, the <code>security_control</code>
      profile should be applied and its <code>attacks</code> information, if present, should
      be duplicated into the <code>finding_info</code> object. <br><strong>Note: </strong>If
      the Finding is an incident, i.e. requires incident workflow, also apply the <code>incident</code>
      profile or aggregate this finding into an <code>Incident Finding</code>.'
    class_uri: ocsf:OcsfComplianceFinding
    is_a: OcsfFindingEvent
    in_subset:
      - ocsf_category_findings
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: compliance_finding
      ocsf_category: findings
      ocsf_profiles: cloud container data_classification datetime host incident linux/linux_users
        macos/macos_users osint record_integrity security_control
    slots:
      - compliance
      - evidences
      - remediation
      - resource
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Create
            description: A finding was created.
          - equals_number: 2
            title: Update
            description: A finding was updated.
          - equals_number: 3
            title: Close
            description: A finding was closed.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Findings</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Compliance
          Finding</code>.'
      class_uid:
        equals_number: 2003
      comment:
        deprecated: Use the <code>notes</code> attribute instead.
        annotations:
          ocsf_group: context
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: notes
      compliance:
        required: true
        annotations:
          ocsf_group: primary
      end_time_dt:
        description: The time of the most recent event or finding that contributed to this
          finding.
      evidences:
        description: Describes various evidence artifacts associated with the compliance finding.
        annotations:
          ocsf_group: context
      remediation:
        recommended: true
        annotations:
          ocsf_group: context
      resource:
        description: Describes details about the resource that is the subject of the compliance
          check.
        deprecated: Use the <code>resources</code> attribute instead.
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_deprecated_since: 1.3.0
          ocsf_superseded_by: resources
      resources:
        description: Describes details about the resource/resources that are the subject of
          the compliance check.
        annotations:
          ocsf_group: primary
      start_time_dt:
        description: The time of the earliest event or finding that contributed to this finding.
      status_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The status is unknown.
          - equals_number: 1
            title: New
            description: The Finding is new and yet to be reviewed.
          - equals_number: 2
            title: In Progress
            description: The Finding is under review.
          - equals_number: 3
            title: Suppressed
            description: The Finding was reviewed, determined to be benign or a false positive
              and is now suppressed.
          - equals_number: 4
            title: Resolved
            description: The Finding was reviewed, remediated and is now considered resolved.
          - equals_number: 5
            title: Archived
            description: The Finding was archived.
          - equals_number: 6
            title: Deleted
            description: The Finding was deleted. For example, it might have been created
              in error.
          - equals_number: 99
            title: Other
            description: The status is not mapped. See the <code>status</code> attribute,
              which contains a data source specific value.
      time_dt:
        description: The finding creation time - when the finding was first generated, not
          when the underlying activity occurred. For the time range of contributing events,
          use <code>start_time</code> and <code>end_time</code>.
      type_uid:
        any_of:
          - equals_number: 200300
            title: 'Compliance Finding: Unknown'
          - equals_number: 200301
            title: 'Compliance Finding: Create'
            description: A finding was created.
          - equals_number: 200302
            title: 'Compliance Finding: Update'
            description: A finding was updated.
          - equals_number: 200303
            title: 'Compliance Finding: Close'
            description: A finding was closed.
          - equals_number: 200399
            title: 'Compliance Finding: Other'
  OcsfDataSecurityFinding:
    title: Data Security Finding
    description: 'A Data Security Finding describes detections or alerts generated by various
      data security products such as Data Loss Prevention (DLP), Data Classification, Secrets
      Management, Digital Rights Management (DRM), Data Security Posture Management (DSPM),
      and similar tools. These detections or alerts can be created using fingerprinting, statistical
      analysis, machine learning or other methodologies. The finding describes the actors
      and endpoints who accessed or own the sensitive data, as well as the resources which
      store the sensitive data. Note: if the event producer is a security control, the <code>security_control</code>
      profile should be applied and its <code>attacks</code> information, if present, should
      be duplicated into the <code>finding_info</code> object. <br><strong>Note: </strong>If
      the Finding is an incident, i.e. requires incident workflow, also apply the <code>incident</code>
      profile  or aggregate this finding into an <code>Incident Finding</code>.'
    class_uri: ocsf:OcsfDataSecurityFinding
    is_a: OcsfFindingEvent
    in_subset:
      - ocsf_category_findings
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: data_security_finding
      ocsf_category: findings
      ocsf_profiles: cloud container data_classification datetime host incident linux/linux_users
        macos/macos_users osint record_integrity security_control
    slots:
      - data_security
      - database
      - databucket
      - dst_endpoint
      - file
      - src_endpoint
      - table
    slot_usage:
      activity_id:
        description: The normalized identifier of the Data Security Finding activity.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Create
            description: A new Data Security finding is created.
          - equals_number: 2
            title: Update
            description: An existing Data Security finding is updated with more information.
          - equals_number: 3
            title: Close
            description: An existing Data Security finding is closed, this can be due to any
              resolution (e.g., True Positive, False Positive, etc.).
          - equals_number: 4
            title: Suppressed
            description: An existing Data Security finding is suppressed due to inaccurate
              detection techniques or a known true negative.
            deprecated: Use <code>status_id</code> attribute instead.
            annotations:
              ocsf_deprecated_since: 1.4.0
              ocsf_superseded_by: status_id
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      activity_name:
        description: The Data Security finding activity name, as defined by the <code>activity_id</code>.
      actor:
        description: Describes details about the actor implicated in the data security finding.
          Either an actor that owns a particular digital file or information store, or an
          actor which accessed classified or sensitive data.
        recommended: true
        annotations:
          ocsf_group: context
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Findings</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Data Security
          Finding</code>.'
      class_uid:
        equals_number: 2006
      comment:
        deprecated: Use the <code>notes</code> attribute instead.
        annotations:
          ocsf_group: context
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: notes
      data_security:
        recommended: true
        annotations:
          ocsf_group: context
      database:
        description: Describes the database where classified or sensitive data is stored in,
          or was accessed from. Databases are typically datastore services that contain an
          organized collection of structured and/or semi-structured data.
        recommended: true
        annotations:
          ocsf_group: primary
      databucket:
        description: Describes the databucket where classified or sensitive data is stored
          in, or was accessed from. The data bucket object is a basic container that holds
          data, typically organized through the use of data partitions.
        recommended: true
        annotations:
          ocsf_group: primary
      device:
        description: Describes the device where classified or sensitive data is stored in,
          or was accessed from.
        recommended: true
      dst_endpoint:
        description: Describes the endpoint where classified or sensitive data is stored in,
          or was accessed from.
        recommended: true
        annotations:
          ocsf_group: context
      end_time_dt:
        description: The time of the most recent event or finding that contributed to this
          finding.
      file:
        description: Describes a file that contains classified or sensitive data.
        recommended: true
        annotations:
          ocsf_group: primary
      impact:
        recommended: false
        annotations:
          ocsf_group: context
      impact_id:
        recommended: false
        annotations:
          ocsf_group: context
          ocsf_sibling: impact
          ocsf_source_note: impact value; impact level
      impact_score:
        recommended: false
        annotations:
          ocsf_group: context
      is_alert:
        description: Indicates that the event is considered to be an alertable signal. For
          example, an <code>activity_id</code> of 'Create' could constitute an alertable signal
          and the value would be <code>true</code>, while 'Close' likely would not and either
          omit the attribute or set its value to <code>false</code>.  Note that other events
          with the <code>security_control</code> profile may also be deemed alertable signals
          and may also carry <code>is_alert = true</code> attributes.
        annotations:
          ocsf_group: primary
      resources:
        title: Additional Resources
        description: Describes details about additional resources, where classified or sensitive
          data is stored in, or was accessed from. <p> You can populate this object, if the
          specific resource type objects available in the class (<code>database, databucket,
          table, file</code>) aren't sufficient; OR <br> You can also choose to duplicate
          <code>uid, name</code> of the specific resources objects, for a consistent access
          to resource uids across all findings.
        annotations:
          ocsf_group: primary
      risk_details:
        annotations:
          ocsf_group: context
      risk_level:
        annotations:
          ocsf_group: context
      risk_level_id:
        annotations:
          ocsf_group: context
          ocsf_sibling: risk_level
          ocsf_suppress_checks: enum_convention
      risk_score:
        annotations:
          ocsf_group: context
      src_endpoint:
        description: Details about the source endpoint where classified or sensitive data
          was accessed from.
        recommended: true
        annotations:
          ocsf_group: context
      start_time_dt:
        description: The time of the earliest event or finding that contributed to this finding.
      status_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The status is unknown.
          - equals_number: 1
            title: New
            description: The Finding is new and yet to be reviewed.
          - equals_number: 2
            title: In Progress
            description: The Finding is under review.
          - equals_number: 3
            title: Suppressed
            description: The Finding was reviewed, determined to be benign or a false positive
              and is now suppressed.
          - equals_number: 4
            title: Resolved
            description: The Finding was reviewed, remediated and is now considered resolved.
          - equals_number: 5
            title: Archived
            description: The Finding was archived.
          - equals_number: 6
            title: Deleted
            description: The Finding was deleted. For example, it might have been created
              in error.
          - equals_number: 99
            title: Other
            description: The status is not mapped. See the <code>status</code> attribute,
              which contains a data source specific value.
      table:
        description: Describes the table where classified or sensitive data is stored in,
          or was accessed from. The table object represents a table within a structured relational
          database, warehouse, lake, or similar.
        recommended: true
        annotations:
          ocsf_group: primary
      time_dt:
        description: The finding creation time - when the finding was first generated, not
          when the underlying activity occurred. For the time range of contributing events,
          use <code>start_time</code> and <code>end_time</code>.
      type_uid:
        any_of:
          - equals_number: 200600
            title: 'Data Security Finding: Unknown'
          - equals_number: 200601
            title: 'Data Security Finding: Create'
            description: A new Data Security finding is created.
          - equals_number: 200602
            title: 'Data Security Finding: Update'
            description: An existing Data Security finding is updated with more information.
          - equals_number: 200603
            title: 'Data Security Finding: Close'
            description: An existing Data Security finding is closed, this can be due to any
              resolution (e.g., True Positive, False Positive, etc.).
          - equals_number: 200604
            title: 'Data Security Finding: Suppressed'
            description: An existing Data Security finding is suppressed due to inaccurate
              detection techniques or a known true negative.
            deprecated: Use <code>status_id</code> attribute instead.
            annotations:
              ocsf_deprecated_since: 1.4.0
              ocsf_superseded_by: status_id
          - equals_number: 200699
            title: 'Data Security Finding: Other'
  OcsfDetectionFinding:
    title: Detection Finding
    description: 'A Detection Finding describes detections or alerts generated by security
      products using correlation engines, detection engines or other methodologies.<br><strong>Note:
      </strong>If the event producer is a security control, the <code>Security Control</code>
      profile should be applied and its <code>attacks</code> information, if present, should
      be duplicated into the <code>finding_info</code> object. <br><strong>Note: </strong>If
      the Finding is an incident, i.e. requires incident workflow, also apply the <code>Incident</code>
      profile or aggregate the finding into an <code>Incident Finding</code>.<p><strong>Note:
      </strong>Findings are mutable and as such have a lifecycle, via <code>Update</code>
      activities. When modeling atomic alerts, you are encouraged to consider using the <code>Security
      Control</code> profile with the activity event associated with the alert. See the referenced
      article below.'
    class_uri: ocsf:OcsfDetectionFinding
    see_also:
      - https://github.com/ocsf/ocsf-docs/blob/main/articles/modeling-alerts.md
    is_a: OcsfFindingEvent
    in_subset:
      - ocsf_category_findings
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: detection_finding
      ocsf_category: findings
      ocsf_profiles: cloud container data_classification datetime host incident linux/linux_users
        macos/macos_users osint record_integrity security_control
    slots:
      - anomaly_analyses
      - evidences
      - remediation
      - vulnerabilities
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Create
            description: A finding was created.
