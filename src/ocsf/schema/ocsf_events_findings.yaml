  OcsfIncidentFinding:
    title: Incident Finding
    description: 'An Incident Finding reports the creation, update, or closure of security
      incidents as a result of detections and/or analytics. <br><strong>Note: </strong><code>Incident
      Finding</code> implicitly includes the <code>incident</code> profile and it should be
      added to the <code>metadata.profiles[]</code> array.'
    class_uri: ocsf:OcsfIncidentFinding
    is_a: OcsfBaseEvent
    in_subset:
      - ocsf_category_findings
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: incident_finding
      ocsf_category: findings
      ocsf_profiles: cloud container data_classification datetime host incident linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_constraints: '{"at_least_one": ["assignee", "assignee_group"]}'
    any_of:
      - slot_conditions:
          assignee:
            required: true
      - slot_conditions:
          assignee_group:
            required: true
    slots:
      - assignee
      - assignee_group
      - comment
      - desc
      - finding_info_list
      - impact
      - impact_id
      - impact_score
      - is_suspected_breach
      - notes
      - priority
      - priority_id
      - src_url
      - ticket
      - tickets
      - vendor_attributes
      - verdict
      - verdict_id
    slot_usage:
      activity_id:
        description: The normalized identifier of the incident activity. Use <code>1</code>
          (Create) when an incident is first opened, <code>2</code> (Update) when an existing
          incident is modified (e.g., new findings added, priority changed, assignee updated),
          and <code>3</code> (Close) when the incident is resolved.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Create
            description: Reports the creation of an Incident.
          - equals_number: 2
            title: Update
            description: Reports updates to an Incident.
          - equals_number: 3
            title: Close
            description: Reports closure of an Incident .
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      activity_name:
        description: The incident activity name, as defined by the <code>activity_id</code>.
          When <code>activity_id</code> is <code>99</code> (Other), this <b>must</b> contain
          the source-specific activity label.
      assignee:
        annotations:
          ocsf_group: context
      assignee_group:
        annotations:
          ocsf_group: context
      attacks:
        description: An array of attack objects, each describing a tactic, technique, and/or
          sub-technique associated with the Incident.
        see_also:
          - https://attack.mitre.org
        annotations:
          ocsf_group: context
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Findings</code>.'
      category_uid:
        equals_number: 2
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Incident
          Finding</code>.'
      class_uid:
        equals_number: 2005
      comment:
        description: Additional user supplied details for updating or closing the incident.
        deprecated: Use the <code>notes</code> attribute instead.
        annotations:
          ocsf_group: context
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: notes
      confidence:
        annotations:
          ocsf_group: context
      confidence_id:
        description: The normalized identifier of the confidence level for this incident,
          representing a summary across all aggregated findings. It reflects the accuracy
          of the analytics that produced those findings. A lower confidence value indicates
          a wider finding scope that may produce noisy or potentially non-malicious reports.
          When the value is <code>99</code> (Other), the <code>confidence</code> attribute
          must contain the incident-specific label.
        annotations:
          ocsf_group: context
          ocsf_sibling: confidence
      confidence_score:
        description: The confidence score assigned to the incident by the system or analyst,
          expressed on a source-specific numeric scale. This score provides finer-grained
          confidence information than the categorical <code>confidence_id</code> value. When
          <code>confidence_id</code> is <code>99</code> (Other), the <code>confidence</code>
          attribute should reflect the same assessment if both are populated.
        annotations:
          ocsf_group: context
      desc:
        description: The short description of the Incident.
        recommended: true
        annotations:
          ocsf_group: primary
      end_time:
        description: The time of the most recent event or finding that contributed to this
          incident.
      end_time_dt:
        description: The time of the most recent event or finding that contributed to this
          incident.
      finding_info_list:
        required: true
        annotations:
          ocsf_group: primary
      impact:
        recommended: true
        annotations:
          ocsf_group: primary
      impact_id:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: impact
          ocsf_source_note: impact value; impact level
      impact_score:
        recommended: true
        annotations:
          ocsf_group: primary
      is_suspected_breach:
        annotations:
          ocsf_group: context
      notes:
        description: Additional notes related to the finding. Each note in the array can include
          a comment, the user who made the comment, the time when the note was created, and
          the time when the note was last modified (typically by the same user). Notes can
          be used to provide additional context, explanations, or observations by analysts
          related to the incident over time.
        annotations:
          ocsf_group: context
      priority:
        annotations:
          ocsf_group: context
      priority_id:
        recommended: true
        annotations:
          ocsf_group: context
          ocsf_sibling: priority
      src_url:
        description: A Url link used to access the original incident.
        recommended: true
        annotations:
          ocsf_group: primary
      start_time:
        description: The time of the earliest event or finding that contributed to this incident.
      start_time_dt:
        description: The time of the earliest event or finding that contributed to this incident.
      status:
        description: The incident lifecycle status label, normalized to the caption of the
          <code>status_id</code> value. When <code>status_id</code> is <code>99</code> (Other),
          this <b>must</b> contain the source-specific status label.
      status_id:
        description: The normalized incident lifecycle status identifier. This tracks the
          incident management workflow from initial triage through resolution. Producers should
          set this to reflect the current state in their incident management system.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The status is unknown.
          - equals_number: 1
            title: New
            description: The service desk has received the incident but has not assigned it
              to an agent.
          - equals_number: 2
            title: In Progress
            description: The incident has been assigned to an agent but has not been resolved.
              The agent is actively working with the user to diagnose and resolve the incident.
          - equals_number: 3
            title: On Hold
            description: The incident requires some information or response from the user
              or from a third party.
          - equals_number: 4
            title: Resolved
            description: The service desk has confirmed that the incident is resolved.
          - equals_number: 5
            title: Closed
            description: The incident is resolved and no further action is necessary.
          - equals_number: 99
            title: Other
            description: The status is not mapped. See the <code>status</code> attribute,
              which contains a data source specific value.
        required: true
        recommended: false
      ticket:
        deprecated: Use <code>tickets</code> instead.
        annotations:
          ocsf_group: context
          ocsf_deprecated_since: 1.5.0
          ocsf_superseded_by: tickets
      tickets:
        annotations:
          ocsf_group: context
      time:
        description: The incident creation time - when the incident was first opened, not
          when the underlying activity occurred. For the time range of contributing events,
          use <code>start_time</code> and <code>end_time</code>.
      time_dt:
        description: The incident creation time - when the incident was first opened, not
          when the underlying activity occurred. For the time range of contributing events,
          use <code>start_time</code> and <code>end_time</code>.
      type_uid:
        any_of:
          - equals_number: 200500
            title: 'Incident Finding: Unknown'
          - equals_number: 200501
            title: 'Incident Finding: Create'
            description: Reports the creation of an Incident.
          - equals_number: 200502
            title: 'Incident Finding: Update'
            description: Reports updates to an Incident.
          - equals_number: 200503
            title: 'Incident Finding: Close'
            description: Reports closure of an Incident .
          - equals_number: 200599
            title: 'Incident Finding: Other'
      verdict:
        recommended: true
        annotations:
          ocsf_group: primary
      verdict_id:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: verdict
