---
id: https://w3id.org/lmodel/ocsf
name: ocsf
title: Open Cybersecurity Schema Framework (OCSF)
description: A LinkML model of the Open Cybersecurity Schema Framework, the open standard
  for normalising security events that the OCSF project publishes. It renders OCSF 1.9.0 with
  OCSF's own keys and integer values, so a real event validates unchanged against the class
  its class_uid names.
version: 1.9.0
source: https://github.com/ocsf/ocsf-schema/tree/1.9.0
license: Apache-2.0
see_also:
  - https://lmodel.github.io/ocsf
  - https://schema.ocsf.io/1.9.0/
prefixes:
  ocsf: https://w3id.org/lmodel/ocsf/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  attack: https://w3id.org/lmodel/attack/
  cve: https://w3id.org/lmodel/cve/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  stix: https://w3id.org/lmodel/stix/
default_prefix: ocsf
default_range: string
imports:
  - linkml:types
  - ocsf_core
  - ocsf_objects
  - ocsf_events_application
  - ocsf_events_base
  - ocsf_events_discovery
  - ocsf_events_findings
  - ocsf_events_iam
  - ocsf_events_network
  - ocsf_events_remediation
  - ocsf_events_system
  - ocsf_events_unmanned_systems
  - ocsf_events_win
keywords:
  - security events
  - OCSF
  - event normalisation
  - security telemetry
  - observability
comments:
  - The version is OCSF's own. upstream/ holds the tag's files and the compiler's output,
    scripts/ocsf_to_linkml.py writes these modules from them, tests/test_coverage.py holds
    the schema to them both ways, and scripts/check_upstream_release.py reports when the tag
    moves.
