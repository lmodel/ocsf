      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Discovery</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Network Connection
          Query</code>.'
      class_uid:
        equals_number: 5012
      connection_info:
        required: true
        annotations:
          ocsf_group: primary
      process:
        description: The process that owns the socket.
        required: true
        annotations:
          ocsf_group: primary
      state:
        description: The state of the socket, normalized to the caption of the state_id value.
          In the case of 'Other', it is defined by the event source.
        recommended: true
        annotations:
          ocsf_group: primary
      state_id:
        description: The state of the socket.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The socket state is unknown.
          - equals_number: 1
            title: ESTABLISHED
            description: The socket has an established connection between a local application
              and a remote peer.
          - equals_number: 2
            title: SYN_SENT
            description: The socket is actively trying to establish a connection to a remote
              peer.
          - equals_number: 3
            title: SYN_RECV
            description: The socket has passively received a connection request from a remote
              peer.
          - equals_number: 4
            title: FIN_WAIT1
            description: The socket connection has been closed by the local application, the
              remote peer has not yet acknowledged the close, and the system is waiting for
              it to close its half of the connection.
          - equals_number: 5
            title: FIN_WAIT2
            description: The socket connection has been closed by the local application, the
              remote peer has acknowledged the close, and the system is waiting for it to
              close its half of the connection.
          - equals_number: 6
            title: TIME_WAIT
            description: The socket connection has been closed by the local application, the
              remote peer has closed its half of the connection, and the system is waiting
              to be sure that the remote peer received the last acknowledgement.
          - equals_number: 7
            title: CLOSED
            description: The socket is not in use.
          - equals_number: 8
            title: CLOSE_WAIT
            description: The socket connection has been closed by the remote peer, and the
              system is waiting for the local application to close its half of the connection.
          - equals_number: 9
            title: LAST_ACK
            description: The socket connection has been closed by the remote peer, the local
              application has closed its half of the connection, and the system is waiting
              for the remote peer to acknowledge the close.
          - equals_number: 10
            title: LISTEN
            description: The socket is listening for incoming connections.
          - equals_number: 11
            title: CLOSING
            description: The socket connection has been closed by the local application and
              the remote peer simultaneously, and the remote peer has not yet acknowledged
              the close attempt of the local application.
          - equals_number: 99
            title: Other
            description: The state is not mapped. See the <code>state</code> attribute, which
              contains a data source specific value.
        required: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: state
      type_uid:
        any_of:
          - equals_number: 501200
            title: 'Network Connection Query: Unknown'
          - equals_number: 501201
            title: 'Network Connection Query: Query'
