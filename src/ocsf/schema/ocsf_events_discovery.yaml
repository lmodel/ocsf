        description: 'The event category name, as defined by category_uid value: <code>Discovery</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Device Config
          State Change</code>.'
      class_uid:
        equals_number: 5019
      device:
        description: The device that is impacted by the state change.
        required: true
        recommended: false
        annotations:
          ocsf_group: primary
      prev_security_level:
        recommended: true
        annotations:
          ocsf_group: primary
      prev_security_level_id:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: prev_security_level
      prev_security_states:
        description: The previous security states of the device.
        recommended: true
        annotations:
          ocsf_group: primary
      security_level:
        recommended: true
        annotations:
          ocsf_group: primary
      security_level_id:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: security_level
      security_states:
        description: The current security states of the device.
        recommended: true
        annotations:
          ocsf_group: primary
      state:
        title: Config Change State
        description: The Config Change Stat, normalized to the caption of the state_id value.
          In the case of 'Other', it is defined by the source.
      state_id:
        title: Config Change State ID
        description: The Config Change State of the managed entity.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The Config Change state is unknown.
          - equals_number: 1
            title: Disabled
            description: Config State Changed to Disabled.
          - equals_number: 2
            title: Enabled
            description: Config State Changed to Enabled.
          - equals_number: 99
            title: Other
            description: The Config Change is not mapped. See the <code>state</code> attribute,
              which contains data source specific values.
        recommended: true
      type_uid:
        any_of:
          - equals_number: 501900
            title: 'Device Config State Change: Unknown'
          - equals_number: 501901
            title: 'Device Config State Change: Log'
            description: The discovered information is via a log.
          - equals_number: 501902
            title: 'Device Config State Change: Collect'
            description: The discovered information is via a collection process.
          - equals_number: 501999
            title: 'Device Config State Change: Other'
  OcsfEvidenceInfo:
    title: Live Evidence Info
    description: Data collected directly from devices that represents forensic information
      pulled, queried, or discovered from devices that may indicate malicious activity. It
      contains a number of child objects, each representing a distinct evidence domain (network
      connections, file artifacts, registry entries, etc.). When mapping raw telemetry data
      users should select Query Evidence and then the appropriate child object that best matches
      the evidence type.
    class_uri: ocsf:OcsfEvidenceInfo
    is_a: OcsfDiscoveryResultEvent
    in_subset:
      - ocsf_category_discovery
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: evidence_info
      ocsf_category: discovery
      ocsf_profiles: cloud container data_classification datetime host linux/linux_users macos/macos_users
        osint record_integrity security_control
    slots:
      - query_evidence
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Query
            description: The discovered results are via a query request.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Discovery</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Live Evidence
          Info</code>.'
      class_uid:
        equals_number: 5040
      device:
        description: An addressable device, computer system or host from which evidence was
          collected.
        required: true
        recommended: false
        annotations:
          ocsf_group: primary
      query_evidence:
        description: The specific resulting evidence information that was queried or discovered
          based on the query type. Contains various child objects corresponding to the query_type_id
          values.
        required: true
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 504000
            title: 'Live Evidence Info: Unknown'
          - equals_number: 504001
            title: 'Live Evidence Info: Query'
            description: The discovered results are via a query request.
          - equals_number: 504099
            title: 'Live Evidence Info: Other'
