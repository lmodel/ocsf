---
id: https://w3id.org/lmodel/ocsf/ocsf_events_discovery
name: ocsf_events_discovery
title: 'OCSF event classes: Discovery'
description: Discovery events report the existence and state of devices, files, configurations,
  processes, registry keys, and other objects.
version: 1.9.0
source: https://github.com/ocsf/ocsf-schema/tree/1.9.0
license: Apache-2.0
see_also:
  - https://lmodel.github.io/ocsf
  - https://schema.ocsf.io/1.9.0/
prefixes:
  ocsf: https://w3id.org/lmodel/ocsf/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  attack: https://w3id.org/lmodel/attack/
  cve: https://w3id.org/lmodel/cve/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  stix: https://w3id.org/lmodel/stix/
default_prefix: ocsf
default_range: string
imports:
  - linkml:types
  - ocsf_core
  - ocsf_objects
  - ocsf_events_base
classes:
  OcsfDiscoveryEvent:
    title: Discovery
    description: The Discovery event is a generic event that defines a set of attributes available
      in Discovery category events. As a generic event, it could be used to log events that
      are not otherwise defined by the Discovery specific event classes.
    class_uri: ocsf:OcsfDiscoveryEvent
    abstract: true
    is_a: OcsfBaseEvent
    in_subset:
      - ocsf_category_discovery
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: discovery
      ocsf_category: discovery
    slot_usage:
      category_uid:
        equals_number: 5
  OcsfDiscoveryResultEvent:
    title: Discovery Result
    description: Discovery Result events report the results of a discovery request.
    class_uri: ocsf:OcsfDiscoveryResultEvent
    abstract: true
    is_a: OcsfBaseEvent
    in_subset:
      - ocsf_category_discovery
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: discovery_result
      ocsf_category: discovery
    slots:
      - query_info
      - query_result
      - query_result_id
    slot_usage:
      category_uid:
        equals_number: 5
      query_info:
        description: The search details associated with the query request.
        recommended: true
        annotations:
          ocsf_group: primary
      query_result:
        recommended: true
        annotations:
          ocsf_group: primary
      query_result_id:
        required: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: query_result
  OcsfAdminGroupQuery:
    title: Admin Group Query
    description: Admin Group Query events report information about administrative groups.
    class_uri: ocsf:OcsfAdminGroupQuery
    deprecated: Use the <code>evidence_info</code> class.
    is_a: OcsfDiscoveryResultEvent
    in_subset:
      - ocsf_category_discovery
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: admin_group_query
      ocsf_category: discovery
      ocsf_profiles: cloud container data_classification datetime host linux/linux_users macos/macos_users
        osint record_integrity security_control
      ocsf_deprecated_since: 1.5.0
      ocsf_superseded_by: evidence_info
    slots:
      - group
      - users
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Query
            description: The discovered results are via a query request.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Discovery</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Admin Group
          Query</code>.'
      class_uid:
        equals_number: 5009
      group:
        description: The administrative group.
        required: true
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 500900
            title: 'Admin Group Query: Unknown'
          - equals_number: 500901
            title: 'Admin Group Query: Query'
            description: The discovered results are via a query request.
          - equals_number: 500999
            title: 'Admin Group Query: Other'
      users:
        description: The users that belong to the administrative group.
        recommended: true
        annotations:
          ocsf_group: primary
  OcsfCloudResourcesInventoryInfo:
    title: Cloud Resources Inventory Info
    description: Cloud Resources Inventory Info events report cloud asset inventory data.
      This data can be either logged or proactively collected. For example, use this event
      class when creating an inventory of cloud resource information from a Configuration
      Management Database (CMDB), Cyber Asset Attack Surface Management (CAASM), direct public
      cloud service provider APIs, Software-as-a-Service (SaaS) APIs, or otherwise.
    class_uri: ocsf:OcsfCloudResourcesInventoryInfo
    is_a: OcsfDiscoveryEvent
    in_subset:
      - ocsf_category_discovery
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: cloud_resources_inventory_info
      ocsf_category: discovery
      ocsf_profiles: cloud container data_classification datetime host linux/linux_users macos/macos_users
        osint record_integrity security_control
      ocsf_constraints: '{"at_least_one": ["cloud", "container", "database", "databucket",
        "idp", "resources", "table"]}'
    any_of:
      - slot_conditions:
          cloud:
            required: true
      - slot_conditions:
          container:
            required: true
      - slot_conditions:
          database:
            required: true
      - slot_conditions:
          databucket:
            required: true
      - slot_conditions:
          idp:
            required: true
      - slot_conditions:
          resources:
            required: true
      - slot_conditions:
          table:
            required: true
    slots:
      - container
      - database
      - databucket
      - idp
      - region
      - resources
      - table
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Log
            description: The discovered information is via a log.
          - equals_number: 2
            title: Collect
            description: The discovered information is via a collection process.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Discovery</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Cloud Resources
          Inventory Info</code>.'
      class_uid:
        equals_number: 5023
      cloud:
        description: Cloud service provider or SaaS platform metadata about the cloud resource(s)
          that are being discovered by an inventory process.
        recommended: true
        annotations:
          ocsf_group: primary
      container:
        description: A cloud-based container image or running container discovered by an inventory
          process.
        recommended: true
        annotations:
          ocsf_group: primary
      database:
        description: A cloud-based database discovered by an inventory process.
        recommended: true
        annotations:
          ocsf_group: primary
      databucket:
        description: A cloud-based data bucket or other object storage discovered by an inventory
          process.
        recommended: true
        annotations:
          ocsf_group: primary
      idp:
        description: The Identity Provider that is being discovered by an inventory process,
          or that is related to the cloud resource(s) being discovered by an inventory process.
        recommended: true
        annotations:
          ocsf_group: primary
      region:
        description: The cloud region where the resource is located, e.g., <code>us-isof-south-1</code>,
          <code>eastus2</code>, <code>us-central1</code>, etc.
        recommended: true
        annotations:
          ocsf_group: context
      resources:
        title: Cloud Resources
        description: The cloud resource(s) that are being discovered by an inventory process.
          Use this object if there is not a direct object match in the class.
        recommended: true
        annotations:
          ocsf_group: primary
      table:
        description: A cloud-based database table discovered by an inventory process.
        recommended: true
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 502300
            title: 'Cloud Resources Inventory Info: Unknown'
          - equals_number: 502301
            title: 'Cloud Resources Inventory Info: Log'
            description: The discovered information is via a log.
          - equals_number: 502302
            title: 'Cloud Resources Inventory Info: Collect'
            description: The discovered information is via a collection process.
          - equals_number: 502399
            title: 'Cloud Resources Inventory Info: Other'
