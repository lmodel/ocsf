      class_uid:
        equals_number: 5002
      device:
        description: The device that is being discovered by an inventory process.
        required: true
        recommended: false
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 500200
            title: 'Device Config State: Unknown'
          - equals_number: 500201
            title: 'Device Config State: Log'
            description: The discovered information is via a log.
          - equals_number: 500202
            title: 'Device Config State: Collect'
            description: The discovered information is via a collection process.
          - equals_number: 500299
            title: 'Device Config State: Other'
