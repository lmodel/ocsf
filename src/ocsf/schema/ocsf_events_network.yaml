        description: The value of the SMTP HELO or EHLO command sent by the initiator (client).
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_deprecated_since: 1.4.0
          ocsf_superseded_by: command
      src_endpoint:
        description: The initiator (client) sending the email.
        recommended: true
        annotations:
          ocsf_group: primary
      to:
        description: The recipient address from the transmission envelope. This may differ
          from the 'To' header and represents where the message was actually delivered.
        recommended: true
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 400900
            title: 'Email Activity: Unknown'
          - equals_number: 400901
            title: 'Email Activity: Send'
          - equals_number: 400902
            title: 'Email Activity: Receive'
          - equals_number: 400903
            title: 'Email Activity: Scan'
            description: 'Email being scanned (example: security scanning)'
          - equals_number: 400904
            title: 'Email Activity: Trace'
            description: Follow an email message as it travels through an organization. The
