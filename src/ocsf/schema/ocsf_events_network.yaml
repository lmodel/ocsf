---
id: https://w3id.org/lmodel/ocsf/ocsf_events_network
name: ocsf_events_network
title: 'OCSF event classes: Network Activity'
description: Network Activity events.
version: 1.9.0
source: https://github.com/ocsf/ocsf-schema/tree/1.9.0
license: Apache-2.0
see_also:
  - https://lmodel.github.io/ocsf
  - https://schema.ocsf.io/1.9.0/
prefixes:
  ocsf: https://w3id.org/lmodel/ocsf/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  attack: https://w3id.org/lmodel/attack/
  cve: https://w3id.org/lmodel/cve/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  stix: https://w3id.org/lmodel/stix/
default_prefix: ocsf
default_range: string
imports:
  - linkml:types
  - ocsf_core
  - ocsf_objects
  - ocsf_events_base
classes:
  OcsfNetworkEvent:
    title: Network
    description: Network event is a generic event that defines a set of attributes available
      in the Network category.
    class_uri: ocsf:OcsfNetworkEvent
    abstract: true
    see_also:
      - https://d3fend.mitre.org/event/d3f:NetworkEvent/
    is_a: OcsfBaseEvent
    mixins:
      - OcsfNetworkProxyProfile
      - OcsfLoadBalancerProfile
      - OcsfAiOperationProfile
    in_subset:
      - ocsf_category_network
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: network
      ocsf_category: network
      ocsf_profiles: network_proxy load_balancer ai_operation
      ocsf_constraints: '{"at_least_one": ["dst_endpoint", "src_endpoint"]}'
    related_mappings:
      - d3f:NetworkEvent
    slots:
      - app_name
      - app_protocol_name
      - connection_info
      - cumulative_traffic
      - dst_endpoint
      - ja4_fingerprint_list
      - network_observation_point
      - observation_point
      - observation_point_id
      - packet_list
      - proxy
      - src_endpoint
      - tls
      - traffic
    slot_usage:
      app_name:
        description: The network application name identified by tools such as NBAR or App
          ID (e.g., youtube, facebook, webex). This represents a specific network application
          that uses standard protocols (such as https or quic) to deliver its service.
        annotations:
          ocsf_group: context
      app_protocol_name:
        description: 'The application-layer (Layer 7) protocol name identified by deep packet
          inspection or packet parsing (e.g., <code>https</code>, <code>quic</code>, <code>ssh</code>,
          <code>dns</code>), expressed as an IANA-registered service name from the IANA Service
          Name and Transport Protocol Port Number Registry.


          <p><b>Note:</b> Port numbers alone are not always a reliable indicator of the actual
          application protocol in use.</p>'
        see_also:
          - https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml
        annotations:
          ocsf_group: context
      category_uid:
        equals_number: 4
      connection_info:
        recommended: true
        annotations:
          ocsf_group: primary
      cumulative_traffic:
        description: 'The cumulative (running total) network traffic aggregated from the start
          of a flow or session. Use when reporting: (1) total accumulated bytes/packets since
          flow initiation, (2) combined aggregation models where both incremental deltas and
          running totals are reported together (populate both <code>traffic</code> for the
          delta and this attribute for the cumulative total), or (3) final summary metrics
          when a long-lived connection closes. This represents the sum of all activity from
          flow start to the current observation, not a delta or point-in-time value.'
        annotations:
          ocsf_group: context
      dst_endpoint:
        description: The responder (server) in a network connection.
        recommended: true
        annotations:
          ocsf_group: primary
      ja4_fingerprint_list:
        annotations:
          ocsf_group: context
      network_observation_point:
        description: The network endpoint that observes or inspects network traffic as a third-party
          system, used when the observer is neither the source nor the destination of the
          communication (when <code>observation_point_id</code> = 3). Examples include network
          taps, span ports, inline security devices, or packet capture systems that monitor
          traffic between other endpoints.
        annotations:
          ocsf_group: context
      observation_point:
        description: Indicates whether the source network endpoint, destination network endpoint,
          or neither served as the observation point for the activity. The value is normalized
          to the caption of the <code>observation_point_id</code>.
        annotations:
          ocsf_group: context
      observation_point_id:
        description: The normalized identifier of the observation point. The observation point
          identifier indicates whether the source network endpoint, destination network endpoint,
          or neither served as the observation point for the activity.
        annotations:
          ocsf_group: context
          ocsf_sibling: observation_point
      packet_list:
        annotations:
          ocsf_group: context
      proxy:
        recommended: true
        annotations:
          ocsf_deprecated_since: 1.1.0
          ocsf_group: primary
          ocsf_superseded_by: proxy_endpoint
      src_endpoint:
        description: The initiator (client) of the network connection.
        recommended: true
        annotations:
          ocsf_group: primary
      tls:
        annotations:
          ocsf_group: context
      traffic:
        description: 'The network traffic for this observation period. Use when reporting:
          (1) delta values (bytes/packets transferred since the last observation), (2) instantaneous
          measurements at a specific point in time, or (3) standalone single-event metrics.
          This attribute represents a point-in-time measurement or incremental change, not
          a running total. For accumulated totals across multiple observations or the lifetime
          of a flow, use <code>cumulative_traffic</code> instead.'
        recommended: true
        annotations:
          ocsf_group: primary
  OcsfDhcpActivity:
    title: DHCP Activity
    description: DHCP Activity events report MAC to IP assignment via DHCP from a client or
      server.
    class_uri: ocsf:OcsfDhcpActivity
    see_also:
      - https://d3fend.mitre.org/event/d3f:DHCPEvent/
    is_a: OcsfNetworkEvent
    mixins:
      - OcsfCloudProfile
    in_subset:
      - ocsf_category_network
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: dhcp_activity
      ocsf_category: network
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        load_balancer macos/macos_users network_proxy osint record_integrity security_control
      ocsf_constraints: '{"at_least_one": ["dst_endpoint", "src_endpoint"]}'
    related_mappings:
      - d3f:DHCPEvent
    any_of:
      - slot_conditions:
          dst_endpoint:
            required: true
      - slot_conditions:
          src_endpoint:
            required: true
    slots:
      - is_renewal
      - lease_dur
      - relay
      - transaction_uid
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Discover
            description: DHCPDISCOVER
          - equals_number: 2
            title: Offer
            description: DHCPOFFER
          - equals_number: 3
            title: Request
            description: DHCPREQUEST
          - equals_number: 4
            title: Decline
            description: DHCPDECLINE
          - equals_number: 5
            title: Ack
            description: 'DHCPACK: The server accepts the request by sending the client a
              DHCP Acknowledgment message.'
          - equals_number: 6
            title: Nak
            description: DHCPNAK
          - equals_number: 7
            title: Release
            description: 'DHCPRELEASE: A DHCP client sends a DHCPRELEASE packet to the server
              to release the IP address and cancel any remaining lease.'
          - equals_number: 8
            title: Inform
            description: DHCPINFORM
          - equals_number: 9
            title: Expire
            description: 'DHCPEXPIRE: A DHCP lease expired.'
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Network
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>DHCP Activity</code>.'
      class_uid:
        equals_number: 4004
      dst_endpoint:
        description: The responder (server) of the DHCP connection.
      is_renewal:
        description: Indicates whether this is a lease/session renewal event.
        recommended: true
        annotations:
          ocsf_group: primary
      lease_dur:
        recommended: true
        annotations:
          ocsf_group: primary
      load_balancer:
        annotations:
          ocsf_group: primary
          ocsf_profiles: load_balancer
      observation_point_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The observation point is unknown.
          - equals_number: 1
            title: Source
            description: The source network endpoint is the observation point.
          - equals_number: 2
            title: Destination
            description: The destination network endpoint is the observation point.
          - equals_number: 3
            title: Neither
            description: Neither the source nor destination network endpoint is the observation
              point. Refer to the <code>network_observation_point</code> attribute for details.
          - equals_number: 4
            title: Both
            description: Both the source and destination network endpoint are the observation
              point. This typically occurs in localhost or internal communications where the
              source and destination are the same endpoint, often resulting in a <code>connection_info.direction</code>
              of <code>Local</code>.
          - equals_number: 99
            title: Other
            description: The observation point is not mapped. See the <code>observation_point</code>
              attribute for a data source specific value.
      proxy:
        annotations:
          ocsf_group: primary
          ocsf_deprecated_since: 1.1.0
          ocsf_superseded_by: proxy_endpoint
      proxy_connection_info:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_endpoint:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_http_request:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_http_response:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_tls:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_traffic:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      relay:
        recommended: true
        annotations:
          ocsf_group: primary
      src_endpoint:
        description: The initiator (client) of the DHCP connection.
      transaction_uid:
        description: The unique identifier of the transaction. This is typically a random
          number generated from the client to associate a dhcp request/response pair.
        recommended: true
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 400400
            title: 'DHCP Activity: Unknown'
          - equals_number: 400401
            title: 'DHCP Activity: Discover'
            description: DHCPDISCOVER
          - equals_number: 400402
            title: 'DHCP Activity: Offer'
            description: DHCPOFFER
          - equals_number: 400403
            title: 'DHCP Activity: Request'
            description: DHCPREQUEST
          - equals_number: 400404
            title: 'DHCP Activity: Decline'
            description: DHCPDECLINE
          - equals_number: 400405
            title: 'DHCP Activity: Ack'
            description: 'DHCPACK: The server accepts the request by sending the client a
              DHCP Acknowledgment message.'
          - equals_number: 400406
            title: 'DHCP Activity: Nak'
            description: DHCPNAK
          - equals_number: 400407
            title: 'DHCP Activity: Release'
            description: 'DHCPRELEASE: A DHCP client sends a DHCPRELEASE packet to the server
              to release the IP address and cancel any remaining lease.'
          - equals_number: 400408
            title: 'DHCP Activity: Inform'
            description: DHCPINFORM
          - equals_number: 400409
            title: 'DHCP Activity: Expire'
            description: 'DHCPEXPIRE: A DHCP lease expired.'
          - equals_number: 400499
            title: 'DHCP Activity: Other'
  OcsfDnsActivity:
    title: DNS Activity
    description: DNS Activity events report DNS queries and answers as seen on the network.
    class_uri: ocsf:OcsfDnsActivity
    see_also:
      - https://d3fend.mitre.org/event/d3f:DNSEvent/
    is_a: OcsfNetworkEvent
    in_subset:
      - ocsf_category_network
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: dns_activity
      ocsf_category: network
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        load_balancer macos/macos_users network_proxy osint record_integrity security_control
      ocsf_constraints: '{"at_least_one": ["dst_endpoint", "src_endpoint"]}'
    related_mappings:
      - d3f:DNSEvent
    any_of:
      - slot_conditions:
          dst_endpoint:
            required: true
      - slot_conditions:
          src_endpoint:
            required: true
    slots:
      - answers
      - authority
      - flag_ids
      - flags
      - opcode
      - opcode_id
      - query
      - query_additional
      - query_time
      - query_time_dt
      - rcode
      - rcode_id
      - response_additional
      - response_time
      - response_time_dt
      - transaction_id
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Query
            description: The DNS query request.
          - equals_number: 2
            title: Response
            description: The DNS query response.
          - equals_number: 6
            title: Traffic
            description: Bidirectional DNS request and response traffic.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      answers:
        recommended: true
        annotations:
          ocsf_group: primary
      authority:
        annotations:
          ocsf_group: context
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Network
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>DNS Activity</code>.'
      class_uid:
        equals_number: 4003
      connection_info:
        recommended: false
        annotations:
          ocsf_group: context
      flag_ids:
        title: DNS Header Flags
        description: The list of DNS message header flag IDs. For Query events, populated
          from the query header (RD, CD). For Response and Traffic events, populated from
          the response header, which is the complete and authoritative source as it echoes
          all client-set flags and adds server-set flags.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The flag is unknown.
          - equals_number: 1
            title: Authoritative Answer
            description: The responding server is authoritative for the domain. Set by the
              server in responses only.
          - equals_number: 2
            title: Truncated Response
            description: The response was truncated because it exceeded the maximum UDP message
              size.
          - equals_number: 3
            title: Recursion Desired
            description: The client requests that the server perform recursive resolution.
              Set by the client and echoed in the response.
          - equals_number: 4
            title: Recursion Available
            description: The server supports recursive resolution. Set by the server in responses.
          - equals_number: 5
            title: Authentic Data
            description: All data in the response has been cryptographically verified (DNSSEC).
              Set by the server.
          - equals_number: 6
            title: Checking Disabled
            description: The client requests that the server disable DNSSEC validation. Set
              by the client and echoed in the response.
          - equals_number: 99
            title: Other
            description: The flag is not mapped. See the <code>flags</code> attribute, which
              contains a data source specific value.
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: flags
      flags:
        title: DNS Header Flags
        description: The list of DNS message header flags, normalized to the captions of the
          <code>flag_ids</code> values.
        annotations:
          ocsf_group: context
      load_balancer:
        annotations:
          ocsf_group: primary
          ocsf_profiles: load_balancer
      observation_point_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The observation point is unknown.
          - equals_number: 1
            title: Source
            description: The source network endpoint is the observation point.
          - equals_number: 2
            title: Destination
            description: The destination network endpoint is the observation point.
          - equals_number: 3
            title: Neither
            description: Neither the source nor destination network endpoint is the observation
              point. Refer to the <code>network_observation_point</code> attribute for details.
          - equals_number: 4
            title: Both
            description: Both the source and destination network endpoint are the observation
              point. This typically occurs in localhost or internal communications where the
              source and destination are the same endpoint, often resulting in a <code>connection_info.direction</code>
              of <code>Local</code>.
          - equals_number: 99
            title: Other
            description: The observation point is not mapped. See the <code>observation_point</code>
              attribute for a data source specific value.
      opcode:
        annotations:
          ocsf_group: context
      opcode_id:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_suppress_checks: enum_convention
      proxy:
        annotations:
          ocsf_group: primary
          ocsf_deprecated_since: 1.1.0
          ocsf_superseded_by: proxy_endpoint
      proxy_connection_info:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_endpoint:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_http_request:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_http_response:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_tls:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_traffic:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      query:
        recommended: true
        annotations:
          ocsf_group: primary
      query_additional:
        annotations:
          ocsf_group: context
      query_time:
        recommended: true
        annotations:
          ocsf_group: occurrence
      query_time_dt:
        annotations:
          ocsf_group: occurrence
          ocsf_profiles: datetime
      rcode:
        description: The DNS server response code, normalized to the caption of the rcode_id
          value. In the case of 'Other', it is defined by the event source.
        recommended: true
        annotations:
          ocsf_group: primary
      rcode_id:
        description: The normalized identifier of the DNS server response code. See RFC 6895.
        any_of:
          - equals_number: 0
            title: NoError
            description: No Error.
          - equals_number: 1
            title: FormError
            description: Format Error.
          - equals_number: 2
            title: ServError
            description: Server Failure.
          - equals_number: 3
            title: NXDomain
            description: Non-Existent Domain.
          - equals_number: 4
            title: NotImp
            description: Not Implemented.
          - equals_number: 5
            title: Refused
            description: Query Refused.
          - equals_number: 6
            title: YXDomain
            description: Name Exists when it should not.
          - equals_number: 7
            title: YXRRSet
            description: RR Set Exists when it should not.
          - equals_number: 8
            title: NXRRSet
            description: RR Set that should exist does not.
          - equals_number: 9
            title: NotAuth
            description: Not Authorized or Server Not Authoritative for zone.
          - equals_number: 10
            title: NotZone
            description: Name not contained in zone.
          - equals_number: 11
            title: DSOTYPENI
            description: DSO-TYPE Not Implemented.
          - equals_number: 16
            title: BADVERS
            description: Bad EDNS OPT Version. Indicates that the client requested an EDNS
              version that the server does not support.
          - equals_number: 17
            title: BADKEY
            description: Key not recognized.
          - equals_number: 18
            title: BADTIME
            description: Signature out of time window.
          - equals_number: 19
            title: BADMODE
            description: Bad TKEY Mode.
          - equals_number: 20
            title: BADNAME
            description: Duplicate key name.
          - equals_number: 21
            title: BADALG
            description: Algorithm not supported.
          - equals_number: 22
            title: BADTRUNC
            description: Bad Truncation.
          - equals_number: 23
            title: BADCOOKIE
            description: Bad/missing Server Cookie.
          - equals_number: 24
            title: Unassigned
            description: 'The codes deemed to be unassigned by the RFC (unassigned codes:
              12-15, 24-3840, 4096-65534).'
          - equals_number: 25
            title: Reserved
            description: 'The codes deemed to be reserved by the RFC (codes: 3841-4095, 65535).'
          - equals_number: 99
            title: Other
            description: The dns response code is not defined by the RFC.
        see_also:
          - https://datatracker.ietf.org/doc/html/rfc6895
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: rcode
      response_additional:
        annotations:
          ocsf_group: context
      response_time:
        recommended: true
        annotations:
          ocsf_group: occurrence
      response_time_dt:
        annotations:
          ocsf_group: occurrence
          ocsf_profiles: datetime
      traffic:
        recommended: false
        annotations:
          ocsf_group: context
      transaction_id:
        title: DNS Transaction ID
        description: The 16-bit DNS transaction identifier assigned by the client and echoed
          unchanged in the server response. This value is the same for both the query and
          response messages.
        recommended: true
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 400300
            title: 'DNS Activity: Unknown'
          - equals_number: 400301
            title: 'DNS Activity: Query'
            description: The DNS query request.
          - equals_number: 400302
            title: 'DNS Activity: Response'
            description: The DNS query response.
          - equals_number: 400306
            title: 'DNS Activity: Traffic'
            description: Bidirectional DNS request and response traffic.
          - equals_number: 400399
            title: 'DNS Activity: Other'
  OcsfEmailActivity:
    title: Email Activity
    description: Email Activity events report SMTP protocol and email activities including
      those with embedded URLs and files. See the <code>Email</code> object for details.
    class_uri: ocsf:OcsfEmailActivity
    see_also:
      - https://d3fend.mitre.org/event/d3f:EmailEvent/
    is_a: OcsfBaseEvent
    mixins:
      - OcsfAiOperationProfile
    in_subset:
      - ocsf_category_network
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: email_activity
      ocsf_category: network
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
    related_mappings:
      - d3f:EmailEvent
    slots:
      - attempt
      - banner
      - command
      - direction
      - direction_id
      - dst_endpoint
      - email
      - email_auth
      - from
      - message_trace_uid
      - protocol_name
      - smtp_hello
      - src_endpoint
      - to
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Send
          - equals_number: 2
            title: Receive
          - equals_number: 3
            title: Scan
            description: 'Email being scanned (example: security scanning)'
          - equals_number: 4
            title: Trace
            description: Follow an email message as it travels through an organization. The
              <code>message_trace_uid</code> should be populated when selected.
            see_also:
              - https://learn.microsoft.com/en-us/Exchange/monitoring/trace-an-email-message/message-trace-modern-eac
          - equals_number: 5
            title: MTA Relay
            description: Email processed by an MTA, typically combining send, receive, and
              scan operations into a single activity.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      attempt:
        description: The attempt number for attempting to deliver the email.
        annotations:
          ocsf_group: context
      banner:
        annotations:
          ocsf_group: context
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Network
          Activity</code>.'
      category_uid:
        equals_number: 4
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Email Activity</code>.'
      class_uid:
        equals_number: 4009
      command:
        description: The command issued by the initiator (client), such as SMTP HELO or EHLO.
        recommended: true
        annotations:
          ocsf_group: primary
      direction:
        description: The direction of the email, as defined by the <code>direction_id</code>
          value.
        annotations:
          ocsf_group: context
      direction_id:
        description: <p>The direction of the email relative to the scanning host or organization.</p>Email
          scanned at an internet gateway might be characterized as inbound to the organization
          from the Internet, outbound from the organization to the Internet, or internal within
          the organization. Email scanned at a workstation might be characterized as inbound
          to, or outbound from the workstation.
        any_of:
