  OcsfNetworkActivity:
    title: Network Activity
    description: Network Activity events report network connection and traffic activity.
    class_uri: ocsf:OcsfNetworkActivity
    see_also:
      - https://d3fend.mitre.org/event/d3f:NetworkConnectionEvent/
    is_a: OcsfNetworkEvent
    in_subset:
      - ocsf_category_network
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: network_activity
      ocsf_category: network
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        load_balancer macos/macos_users network_proxy osint record_integrity security_control
      ocsf_constraints: '{"at_least_one": ["dst_endpoint", "src_endpoint"]}'
    related_mappings:
      - d3f:NetworkConnectionEvent
    any_of:
      - slot_conditions:
          dst_endpoint:
            required: true
      - slot_conditions:
          src_endpoint:
            required: true
    slots:
      - initiator
      - initiator_id
      - is_src_dst_assignment_known
      - url
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Open
            description: A new network connection was opened.
          - equals_number: 2
            title: Close
            description: The network connection was closed.
          - equals_number: 3
            title: Reset
            description: The network connection was abnormally terminated or closed by a middle
              device like firewalls.
          - equals_number: 4
            title: Fail
            description: The network connection failed. For example a connection timeout or
              no route to host.
          - equals_number: 5
            title: Refuse
            description: The network connection was refused. For example an attempt to connect
              to a server port which is not open.
          - equals_number: 6
            title: Traffic
            description: Network traffic report.
          - equals_number: 7
            title: Listen
            description: A network endpoint began listening for new network connections.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Network
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Network Activity</code>.'
      class_uid:
        equals_number: 4001
      dst_endpoint:
        description: The destination endpoint of the network activity — typically the responder.
          In bi-flow or asymmetric flow scenarios, this endpoint may represent the true initiator
          of the original communication. Use <code>initiator_id</code> to determine which
          endpoint actually initiated the communication.
      initiator:
        description: The endpoint that initiated the network communication, normalized to
          the caption of <code>initiator_id</code>. In the case of <code>Other</code>, it
          is defined by the event source.
        annotations:
          ocsf_group: context
      initiator_id:
        description: The normalized identifier of the endpoint that initiated the network
          communication. Use this field to disambiguate source and destination roles in bi-directional
          or asymmetric flow scenarios.
        any_of:
          - equals_number: 0
            title: Unknown
          - equals_number: 1
            title: Source Endpoint
            description: The <code>src_endpoint</code> is the true initiator and the source/destination
              assignment is correct.
          - equals_number: 2
            title: Destination Endpoint
            description: The <code>dst_endpoint</code> is the true initiator and the source/destination
              assignment is reversed.
          - equals_number: 99
            title: Other
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: initiator
      is_src_dst_assignment_known:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: initiator_id
      load_balancer:
        annotations:
          ocsf_group: primary
          ocsf_profiles: load_balancer
      observation_point_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The observation point is unknown.
          - equals_number: 1
            title: Source
            description: The source network endpoint is the observation point.
          - equals_number: 2
            title: Destination
            description: The destination network endpoint is the observation point.
          - equals_number: 3
            title: Neither
            description: Neither the source nor destination network endpoint is the observation
              point. Refer to the <code>network_observation_point</code> attribute for details.
          - equals_number: 4
            title: Both
            description: Both the source and destination network endpoint are the observation
              point. This typically occurs in localhost or internal communications where the
              source and destination are the same endpoint, often resulting in a <code>connection_info.direction</code>
              of <code>Local</code>.
          - equals_number: 99
            title: Other
            description: The observation point is not mapped. See the <code>observation_point</code>
              attribute for a data source specific value.
      proxy:
        annotations:
          ocsf_group: primary
          ocsf_deprecated_since: 1.1.0
          ocsf_superseded_by: proxy_endpoint
      proxy_connection_info:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_endpoint:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_http_request:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_http_response:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_tls:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      proxy_traffic:
        annotations:
          ocsf_group: context
          ocsf_profiles: network_proxy
      src_endpoint:
        description: The source endpoint of the network activity — typically the initiator.
          In bi-flow or asymmetric flow scenarios, this endpoint may represent the response
          side of communication originally initiated by the destination. Use <code>initiator_id</code>
          to determine which endpoint actually initiated the communication.
      type_uid:
        any_of:
          - equals_number: 400100
            title: 'Network Activity: Unknown'
          - equals_number: 400101
            title: 'Network Activity: Open'
            description: A new network connection was opened.
          - equals_number: 400102
            title: 'Network Activity: Close'
            description: The network connection was closed.
          - equals_number: 400103
            title: 'Network Activity: Reset'
            description: The network connection was abnormally terminated or closed by a middle
              device like firewalls.
          - equals_number: 400104
            title: 'Network Activity: Fail'
            description: The network connection failed. For example a connection timeout or
              no route to host.
          - equals_number: 400105
            title: 'Network Activity: Refuse'
            description: The network connection was refused. For example an attempt to connect
              to a server port which is not open.
          - equals_number: 400106
            title: 'Network Activity: Traffic'
            description: Network traffic report.
          - equals_number: 400107
            title: 'Network Activity: Listen'
            description: A network endpoint began listening for new network connections.
          - equals_number: 400199
            title: 'Network Activity: Other'
      url:
        description: The URL details relevant to the network traffic.
        recommended: true
        annotations:
          ocsf_group: primary
