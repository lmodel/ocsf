          - equals_number: 1
            title: Inbound
            description: Email Inbound, from the Internet or outside network destined for
              an entity inside network.
          - equals_number: 2
            title: Outbound
            description: Email Outbound, from inside the network destined for an entity outside
              network.
          - equals_number: 3
            title: Internal
            description: Email Internal, from inside the network destined for an entity inside
              network.
          - equals_number: 4
            title: Local
            description: Local network connection (<code>localhost</code>). The connection
              is intra-device, originating from and destined for services running on the same
              device.
          - equals_number: 99
            title: Other
            description: The direction is not mapped. See the <code>direction</code> attribute,
              which contains a data source specific value.
