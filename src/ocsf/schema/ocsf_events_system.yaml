  OcsfProcessActivity:
    title: Process Activity
    description: Process Activity events report when a process launches, injects, opens or
      terminates another process, successful or otherwise.
    class_uri: ocsf:OcsfProcessActivity
    see_also:
      - https://d3fend.mitre.org/event/d3f:ProcessEvent/
    is_a: OcsfSystemEvent
    in_subset:
      - ocsf_category_system
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: process_activity
      ocsf_category: system
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_associations: '{"actor.user": ["device"], "device": ["actor.user"]}'
    related_mappings:
      - d3f:ProcessEvent
    slots:
      - actual_permissions
      - exit_code
      - injection_type
      - injection_type_id
      - launch_type
      - launch_type_id
      - module
      - process
      - requested_permissions
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Launch
            description: A request by the actor to launch another process. Refer to the <code>launch_type_id</code>
              attribute for details of the specific launch type.
          - equals_number: 2
            title: Terminate
            description: A request by the actor to terminate a process. This activity is most
              commonly reflexive, this being the case when a process exits at its own initiation.
              Note too that Windows security products cannot always identify the actor in
              the case of inter-process termination. In this case, <code>actor.process</code>
              and <code>process</code> refer to the exiting process, i.e. indistinguishable
              from the reflexive case.
          - equals_number: 3
            title: Open
            description: A request by the actor to obtain a handle or descriptor to a process
              with the aim of performing further actions upon that process. The target is
              usually a different process but this activity can also be reflexive.
          - equals_number: 4
            title: Inject
            description: A request by the actor to execute code within the context of a process.
              The target is usually a different process but this activity can also be reflexive.
              Refer to the <code>injection_type_id</code> attribute for details of the specific
              injection type.
            see_also:
              - https://github.com/ocsf/ocsf-docs/blob/main/faqs/schema-faq.md#when-should-i-use-a-module-activity-load-event-and-when-should-i-use-a-process-activity-inject-event
          - equals_number: 5
            title: Set User ID
            description: A request by the actor to change its user identity by invoking the
              <code>setuid()</code> system call. Common programs like <code>su</code> and
              <code>sudo</code> use this mechanism. Note that the <em>impersonation</em> mechanism
              on Windows is not directly equivalent because it acts at the thread level.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
        see_also:
          - https://www.man7.org/linux/man-pages/man2/setuid.2.html
      actor:
        description: The actor that performed the activity on the target <code>process</code>.
          For example, the process that started a new process or injected code into another
          process.
      actual_permissions:
        description: The permissions that were granted to the process in a platform-native
          format.
        recommended: true
        annotations:
          ocsf_group: primary
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>System
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Process Activity</code>.'
      class_uid:
        equals_number: 1007
      exit_code:
        recommended: true
        annotations:
          ocsf_group: primary
      injection_type:
        recommended: true
        annotations:
          ocsf_group: primary
      injection_type_id:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: injection_type
      launch_type:
        recommended: true
        annotations:
          ocsf_group: primary
      launch_type_id:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: launch_type
      module:
        description: The module that was injected by the actor process.
        recommended: true
        annotations:
          ocsf_group: primary
      process:
        description: The process that was launched, injected into, opened, or terminated.
        required: true
        annotations:
          ocsf_group: primary
      requested_permissions:
        description: The permissions mask that was requested by the process.
        recommended: true
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 100700
            title: 'Process Activity: Unknown'
          - equals_number: 100701
            title: 'Process Activity: Launch'
            description: A request by the actor to launch another process. Refer to the <code>launch_type_id</code>
              attribute for details of the specific launch type.
          - equals_number: 100702
            title: 'Process Activity: Terminate'
            description: A request by the actor to terminate a process. This activity is most
              commonly reflexive, this being the case when a process exits at its own initiation.
              Note too that Windows security products cannot always identify the actor in
              the case of inter-process termination. In this case, <code>actor.process</code>
              and <code>process</code> refer to the exiting process, i.e. indistinguishable
              from the reflexive case.
          - equals_number: 100703
            title: 'Process Activity: Open'
            description: A request by the actor to obtain a handle or descriptor to a process
              with the aim of performing further actions upon that process. The target is
              usually a different process but this activity can also be reflexive.
          - equals_number: 100704
            title: 'Process Activity: Inject'
            description: A request by the actor to execute code within the context of a process.
              The target is usually a different process but this activity can also be reflexive.
              Refer to the <code>injection_type_id</code> attribute for details of the specific
              injection type.
            see_also:
              - https://github.com/ocsf/ocsf-docs/blob/main/faqs/schema-faq.md#when-should-i-use-a-module-activity-load-event-and-when-should-i-use-a-process-activity-inject-event
          - equals_number: 100705
            title: 'Process Activity: Set User ID'
            description: A request by the actor to change its user identity by invoking the
              <code>setuid()</code> system call. Common programs like <code>su</code> and
              <code>sudo</code> use this mechanism. Note that the <em>impersonation</em> mechanism
              on Windows is not directly equivalent because it acts at the thread level.
          - equals_number: 100799
            title: 'Process Activity: Other'
