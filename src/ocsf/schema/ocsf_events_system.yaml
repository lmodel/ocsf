          - equals_number: 101001
            title: 'Peripheral Activity: Connect'
            description: A peripheral device was connected to the system.
          - equals_number: 101002
            title: 'Peripheral Activity: Disconnect'
            description: A peripheral device was disconnected from the system.
          - equals_number: 101003
            title: 'Peripheral Activity: Enable'
            description: A peripheral device was enabled on the system.
          - equals_number: 101004
            title: 'Peripheral Activity: Disable'
