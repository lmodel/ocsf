  OcsfKernelExtensionActivity:
    title: Kernel Extension Activity
    description: Kernel Extension events report when a driver/extension is loaded or unloaded
      into the kernel
    class_uri: ocsf:OcsfKernelExtensionActivity
    see_also:
      - https://d3fend.mitre.org/event/d3f:KernelModuleEvent/
    is_a: OcsfSystemEvent
    in_subset:
      - ocsf_category_system
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: kernel_extension_activity
      ocsf_category: system
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_associations: '{"actor.user": ["device"], "device": ["actor.user"]}'
    related_mappings:
      - d3f:KernelModuleEvent
    slots:
      - driver
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Load
            description: A driver/extension was loaded into the kernel
          - equals_number: 2
            title: Unload
            description: A driver/extension was unloaded (removed) from the kernel
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
