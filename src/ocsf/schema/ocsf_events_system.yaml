---
id: https://w3id.org/lmodel/ocsf/ocsf_events_system
name: ocsf_events_system
title: 'OCSF event classes: System Activity'
description: System Activity events.
version: 1.9.0
source: https://github.com/ocsf/ocsf-schema/tree/1.9.0
license: Apache-2.0
see_also:
  - https://lmodel.github.io/ocsf
  - https://schema.ocsf.io/1.9.0/
prefixes:
  ocsf: https://w3id.org/lmodel/ocsf/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  attack: https://w3id.org/lmodel/attack/
  cve: https://w3id.org/lmodel/cve/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  stix: https://w3id.org/lmodel/stix/
default_prefix: ocsf
default_range: string
imports:
  - linkml:types
  - ocsf_core
  - ocsf_objects
  - ocsf_events_base
classes:
  OcsfSystemEvent:
    title: System Activity
    description: The System Activity event is a generic event that defines a set of attributes
      available in the system activity events. As a generic event, it could be used to log
      events that are not otherwise defined by the System Activity category.
    class_uri: ocsf:OcsfSystemEvent
    abstract: true
    is_a: OcsfBaseEvent
    mixins:
      - OcsfAiOperationProfile
    in_subset:
      - ocsf_category_system
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: system
      ocsf_category: system
      ocsf_profiles: ai_operation
      ocsf_associations: '{"actor.user": ["device"], "device": ["actor.user"]}'
    slot_usage:
      actor:
        required: true
        annotations:
          ocsf_group: primary
      category_uid:
        equals_number: 1
      device:
        required: true
        recommended: false
        annotations:
          ocsf_group: primary
  OcsfClipboardActivity:
    title: Clipboard Activity
    description: Clipboard Activity events report when a process performs an action on a clipboard.
    class_uri: ocsf:OcsfClipboardActivity
    is_a: OcsfSystemEvent
    in_subset:
      - ocsf_category_system
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: clipboard_activity
      ocsf_category: system
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_associations: '{"actor.user": ["device"], "device": ["actor.user"]}'
    slots:
      - clipboard
      - source_process
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Read
            description: A clipboard was read from. In user-interface terms, this is a 'paste'
              operation. If present, <code>source_process</code> is the process which performed
              the <code>Write</code> activity or, in other words, the process from which the
              data was copied.
          - equals_number: 2
            title: Write
            description: A clipboard was written to. In user-interface terms, this is a 'copy'
              or 'cut' operation.
          - equals_number: 3
            title: Clear
            description: A clipboard was cleared.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>System
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Clipboard
          Activity</code>.'
      class_uid:
        equals_number: 1012
      clipboard:
        description: The clipboard that is the target of the activity.
        required: true
        annotations:
          ocsf_group: primary
      source_process:
        description: For a <code>Read</code> activity, this is the process which performed
          the <code>Write</code>. In other words, <code>actor.process</code> is the process
          performing the paste and <code>source_process</code> is the process that performed
          the copy.
        annotations:
          ocsf_group: context
      type_uid:
        any_of:
          - equals_number: 101200
            title: 'Clipboard Activity: Unknown'
          - equals_number: 101201
            title: 'Clipboard Activity: Read'
            description: A clipboard was read from. In user-interface terms, this is a 'paste'
              operation. If present, <code>source_process</code> is the process which performed
              the <code>Write</code> activity or, in other words, the process from which the
              data was copied.
          - equals_number: 101202
            title: 'Clipboard Activity: Write'
            description: A clipboard was written to. In user-interface terms, this is a 'copy'
              or 'cut' operation.
          - equals_number: 101203
            title: 'Clipboard Activity: Clear'
            description: A clipboard was cleared.
          - equals_number: 101299
            title: 'Clipboard Activity: Other'
  OcsfDevicePowerStateActivity:
    title: Device Power State Activity
    description: Device Power State Activity events report activities related to power state
      changes of a system.
    class_uri: ocsf:OcsfDevicePowerStateActivity
    see_also:
      - https://d3fend.mitre.org/event/d3f:HardwareDeviceStateEvent/
    is_a: OcsfSystemEvent
    in_subset:
      - ocsf_category_system
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: device_power_state_activity
      ocsf_category: system
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_associations: '{"actor.user": ["device"], "device": ["actor.user"]}'
    related_mappings:
      - d3f:HardwareDeviceStateEvent
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Power On
            description: A power-on activity was reported for the system.
          - equals_number: 2
            title: Power Off
            description: A power-off activity was reported for the system, including graceful
              shutdowns and hard power-off events. For graceful or software-initiated shutdowns,
              the <code>actor</code> may be specified when known.
          - equals_number: 3
            title: Sleep
            description: A sleep activity was reported for the system.
          - equals_number: 4
            title: Hibernate
            description: A hibernate activity was reported for the system.
          - equals_number: 5
            title: Reboot
            description: A reboot activity was reported for the system.
          - equals_number: 6
            title: Wake
            description: A wake activity was reported for the system.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      actor:
        description: The actor that performed the activity on the <code>device</code> object.
        required: false
        annotations:
          ocsf_group: context
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>System
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Device Power
          State Activity</code>.'
      class_uid:
        equals_number: 1011
      device:
        description: The host or device that changed power state.
      type_uid:
        any_of:
          - equals_number: 101100
            title: 'Device Power State Activity: Unknown'
          - equals_number: 101101
            title: 'Device Power State Activity: Power On'
            description: A power-on activity was reported for the system.
          - equals_number: 101102
            title: 'Device Power State Activity: Power Off'
            description: A power-off activity was reported for the system, including graceful
              shutdowns and hard power-off events. For graceful or software-initiated shutdowns,
              the <code>actor</code> may be specified when known.
          - equals_number: 101103
            title: 'Device Power State Activity: Sleep'
            description: A sleep activity was reported for the system.
          - equals_number: 101104
            title: 'Device Power State Activity: Hibernate'
            description: A hibernate activity was reported for the system.
          - equals_number: 101105
            title: 'Device Power State Activity: Reboot'
            description: A reboot activity was reported for the system.
          - equals_number: 101106
            title: 'Device Power State Activity: Wake'
            description: A wake activity was reported for the system.
          - equals_number: 101199
            title: 'Device Power State Activity: Other'
  OcsfEventLogActvity:
    title: Event Log Activity
    description: Event Log Activity events report actions pertaining to the system's event
      logging service(s), such as disabling logging or clearing the log data.
    class_uri: ocsf:OcsfEventLogActvity
    see_also:
      - https://d3fend.mitre.org/event/d3f:EventLogEvent/
    is_a: OcsfSystemEvent
    in_subset:
      - ocsf_category_system
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: event_log_actvity
      ocsf_category: system
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_constraints: '{"at_least_one": ["log_file", "log_name", "log_provider", "log_type",
        "log_type_id"]}'
      ocsf_associations: '{"actor.user": ["device"], "device": ["actor.user"]}'
    related_mappings:
      - d3f:EventLogEvent
    slots:
      - dst_endpoint
      - file
      - log_name
      - log_provider
      - log_type
      - log_type_id
      - src_endpoint
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Clear
            description: Clear the event log database, file, or cache.
          - equals_number: 2
            title: Delete
            description: Delete the event log database, file, or cache.
          - equals_number: 3
            title: Export
            description: Export the event log database, file, or cache.
          - equals_number: 4
            title: Archive
            description: Archive the event log database, file, or cache.
          - equals_number: 5
            title: Rotate
            description: Rotate the event log database, file, or cache.
          - equals_number: 6
            title: Start
            description: Start the event logging service.
          - equals_number: 7
            title: Stop
            description: Stop the event logging service.
          - equals_number: 8
            title: Restart
            description: Restart the event logging service.
          - equals_number: 9
            title: Enable
            description: Enable the event logging service.
          - equals_number: 10
            title: Disable
            description: Disable the event logging service.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      actor:
        description: The actor that performed the activity.
        required: false
        recommended: true
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>System
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Event Log
          Activity</code>.'
      class_uid:
        equals_number: 1008
      device:
        description: The device that reported the event.
        required: false
        recommended: true
      dst_endpoint:
        description: The <p style='display:inline;color:red'>targeted</p> endpoint for the
          event log activity.
        recommended: true
        annotations:
          ocsf_group: primary
      file:
        description: 'The file <p style=''display:inline;color:red''>targeted by</p> the activity.
          Example: <code>/var/log/audit.log</code>'
        recommended: true
        annotations:
          ocsf_group: primary
      log_name:
        description: 'The name of the event log <p style=''display:inline;color:red''>targeted
          by</p> the activity. Example: Windows <code>Security</code>.'
        recommended: true
        annotations:
          ocsf_group: primary
      log_provider:
        description: 'The logging provider or logging service <p style=''display:inline;color:red''>targeted
          by</p> the activity.<br />Example: <code>Microsoft-Windows-Security-Auditing</code>,
          <code>Auditd</code>, or <code>Syslog</code>.'
        recommended: true
        annotations:
          ocsf_group: primary
      log_type:
        recommended: true
        annotations:
          ocsf_group: primary
      log_type_id:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: log_type
      src_endpoint:
        description: The source endpoint for the event log activity.
        recommended: true
        annotations:
          ocsf_group: primary
      status_code:
        description: 'The event status code, as reported by the event source.<br />Example:
          <code>0</code>, <code>8</code>, or <code>21</code> for <a target=''_blank'' href=''https://learn.microsoft.com/en-us/previous-versions/windows/desktop/eventlogprov/cleareventlog-method-in-class-win32-nteventlogfile''>Windows
          ClearEventLog</a>.'
      status_detail:
        description: 'The status detail contains additional information about the event outcome.<br
          />Example: <code>Success</code>, <code>Privilege Missing</code>, or <code>Invalid
          Parameter</code> for <a target=''_blank'' href=''https://learn.microsoft.com/en-us/previous-versions/windows/desktop/eventlogprov/cleareventlog-method-in-class-win32-nteventlogfile''>Windows
          ClearEventLog</a>.'
      type_uid:
        any_of:
          - equals_number: 100800
            title: 'Event Log Activity: Unknown'
          - equals_number: 100801
            title: 'Event Log Activity: Clear'
            description: Clear the event log database, file, or cache.
          - equals_number: 100802
            title: 'Event Log Activity: Delete'
            description: Delete the event log database, file, or cache.
          - equals_number: 100803
            title: 'Event Log Activity: Export'
            description: Export the event log database, file, or cache.
          - equals_number: 100804
            title: 'Event Log Activity: Archive'
            description: Archive the event log database, file, or cache.
          - equals_number: 100805
            title: 'Event Log Activity: Rotate'
            description: Rotate the event log database, file, or cache.
          - equals_number: 100806
            title: 'Event Log Activity: Start'
            description: Start the event logging service.
          - equals_number: 100807
            title: 'Event Log Activity: Stop'
            description: Stop the event logging service.
          - equals_number: 100808
            title: 'Event Log Activity: Restart'
            description: Restart the event logging service.
          - equals_number: 100809
            title: 'Event Log Activity: Enable'
            description: Enable the event logging service.
          - equals_number: 100810
            title: 'Event Log Activity: Disable'
            description: Disable the event logging service.
          - equals_number: 100899
            title: 'Event Log Activity: Other'
  OcsfFileActivity:
    title: File System Activity
    description: File System Activity events report when a process performs an action on a
      file or folder.
    class_uri: ocsf:OcsfFileActivity
    see_also:
      - https://d3fend.mitre.org/event/d3f:FileEvent/
    is_a: OcsfSystemEvent
    in_subset:
      - ocsf_category_system
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: file_activity
      ocsf_category: system
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_associations: '{"actor.user": ["device"], "device": ["actor.user"]}'
    related_mappings:
      - d3f:FileEvent
    slots:
      - access_mask
      - component
      - connection_uid
      - create_mask
      - file
      - file_diff
      - file_result
    slot_usage:
      access_mask:
        annotations:
          ocsf_group: context
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Create
            description: A request to create a new file on a file system.
          - equals_number: 2
            title: Read
            description: A request to read data from a file on a file system.
          - equals_number: 3
            title: Update
            description: A request to write data to a file on a file system.
          - equals_number: 4
            title: Delete
            description: A request to delete a file on a file system.
          - equals_number: 5
            title: Rename
            description: A request to rename a file on a file system.
          - equals_number: 6
            title: Set Attributes
            description: A request to set attributes for a file on a file system.
          - equals_number: 7
            title: Set Security
            description: A request to set security for a file on a file system.
          - equals_number: 8
            title: Get Attributes
            description: A request to get attributes for a file on a file system.
          - equals_number: 9
            title: Get Security
            description: A request to get security for a file on a file system.
          - equals_number: 10
            title: Encrypt
            description: A request to encrypt a file on a file system.
          - equals_number: 11
            title: Decrypt
            description: A request to decrypt a file on a file system.
          - equals_number: 12
            title: Mount
            description: A request to mount a file on a file system.
          - equals_number: 13
            title: Unmount
            description: A request to unmount a file from a file system.
          - equals_number: 14
            title: Open
            description: A request to create a file handle.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      actor:
        description: The actor that performed the activity on the <code>file</code> object
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>System
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>File System
          Activity</code>.'
      class_uid:
        equals_number: 1001
      component:
        description: '<p>The name or relative pathname of a sub-component of the data object,
          if applicable. </p>For example: <code>attachment.doc</code>, <code>attachment.zip/bad.doc</code>,
          or <code>part.mime/part.cab/part.uue/part.doc</code>.'
        recommended: true
        annotations:
          ocsf_group: primary
      connection_uid:
        annotations:
          ocsf_group: context
      create_mask:
        recommended: true
        annotations:
          ocsf_group: primary
      file:
        description: The file that is the target of the activity.
        required: true
        annotations:
          ocsf_group: primary
      file_diff:
        recommended: true
        annotations:
          ocsf_group: primary
      file_result:
        description: The resulting file object when the activity was allowed and successful.
        recommended: true
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 100100
            title: 'File System Activity: Unknown'
          - equals_number: 100101
            title: 'File System Activity: Create'
            description: A request to create a new file on a file system.
          - equals_number: 100102
            title: 'File System Activity: Read'
            description: A request to read data from a file on a file system.
          - equals_number: 100103
            title: 'File System Activity: Update'
            description: A request to write data to a file on a file system.
          - equals_number: 100104
            title: 'File System Activity: Delete'
            description: A request to delete a file on a file system.
          - equals_number: 100105
            title: 'File System Activity: Rename'
            description: A request to rename a file on a file system.
          - equals_number: 100106
            title: 'File System Activity: Set Attributes'
            description: A request to set attributes for a file on a file system.
          - equals_number: 100107
            title: 'File System Activity: Set Security'
            description: A request to set security for a file on a file system.
          - equals_number: 100108
            title: 'File System Activity: Get Attributes'
            description: A request to get attributes for a file on a file system.
          - equals_number: 100109
            title: 'File System Activity: Get Security'
            description: A request to get security for a file on a file system.
          - equals_number: 100110
            title: 'File System Activity: Encrypt'
            description: A request to encrypt a file on a file system.
          - equals_number: 100111
            title: 'File System Activity: Decrypt'
            description: A request to decrypt a file on a file system.
          - equals_number: 100112
            title: 'File System Activity: Mount'
            description: A request to mount a file on a file system.
          - equals_number: 100113
            title: 'File System Activity: Unmount'
            description: A request to unmount a file from a file system.
          - equals_number: 100114
            title: 'File System Activity: Open'
            description: A request to create a file handle.
          - equals_number: 100199
            title: 'File System Activity: Other'
  OcsfKernelActivity:
