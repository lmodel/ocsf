          - equals_number: 1
            title: Create
          - equals_number: 2
            title: Read
          - equals_number: 3
            title: Delete
          - equals_number: 4
            title: Invoke
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
