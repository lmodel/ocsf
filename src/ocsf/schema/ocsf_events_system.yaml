      category_name:
        description: 'The event category name, as defined by category_uid value: <code>System
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Kernel Extension
          Activity</code>.'
      class_uid:
        equals_number: 1002
      driver:
        required: true
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 100200
            title: 'Kernel Extension Activity: Unknown'
          - equals_number: 100201
            title: 'Kernel Extension Activity: Load'
            description: A driver/extension was loaded into the kernel
          - equals_number: 100202
            title: 'Kernel Extension Activity: Unload'
            description: A driver/extension was unloaded (removed) from the kernel
          - equals_number: 100299
            title: 'Kernel Extension Activity: Other'
  OcsfMemoryActivity:
    title: Memory Activity
    description: Memory Activity events report when a process has memory allocated, read/modified,
      or other manipulation activities - such as a buffer overflow or turning off data execution
      protection (DEP).
    class_uri: ocsf:OcsfMemoryActivity
    see_also:
      - https://d3fend.mitre.org/event/d3f:MemoryEvent/
    is_a: OcsfSystemEvent
    in_subset:
      - ocsf_category_system
