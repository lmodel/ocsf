  OcsfScanActivity:
    title: Scan Activity
    description: Scan events report the start, completion, and results of a scan job. The
      scan event includes the number of items that were scanned and the number of detections
      that were resolved.
    class_uri: ocsf:OcsfScanActivity
    is_a: OcsfApplicationEvent
    in_subset:
      - ocsf_category_application
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: scan_activity
      ocsf_category: application
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
    slots:
      - command_uid
      - num_detections
      - num_files
      - num_folders
      - num_network_items
      - num_processes
      - num_registry_items
      - num_resolutions
      - num_skipped_items
      - num_trusted_items
      - scan
      - schedule_uid
      - total
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Started
            description: The scan was started.
          - equals_number: 2
            title: Completed
            description: The scan was completed.
          - equals_number: 3
            title: Cancelled
            description: The scan was cancelled.
          - equals_number: 4
            title: Duration Violation
            description: The allocated scan time was insufficient to complete the requested
              scan.
          - equals_number: 5
            title: Pause Violation
            description: The scan was paused, either by the user or by program constraints
              (e.g. scans that are suspended during certain time intervals), and not resumed
              within the allotted time.
          - equals_number: 6
            title: Error
            description: The scan could not be completed due to an internal error.
