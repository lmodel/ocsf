          - equals_number: 11
            title: Unlock
            description: Unlock a file.
          - equals_number: 12
            title: Share
            description: Share a file.
          - equals_number: 13
            title: Unshare
            description: Unshare a file.
          - equals_number: 14
            title: Open
            description: Open a file.
          - equals_number: 15
            title: Sync
