---
id: https://w3id.org/lmodel/ocsf/ocsf_events_application
name: ocsf_events_application
title: 'OCSF event classes: Application Activity'
description: Application Activity events report detailed information about the behavior of
  applications and services.
version: 1.9.0
source: https://github.com/ocsf/ocsf-schema/tree/1.9.0
license: Apache-2.0
see_also:
  - https://lmodel.github.io/ocsf
  - https://schema.ocsf.io/1.9.0/
prefixes:
  ocsf: https://w3id.org/lmodel/ocsf/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  attack: https://w3id.org/lmodel/attack/
  cve: https://w3id.org/lmodel/cve/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  stix: https://w3id.org/lmodel/stix/
default_prefix: ocsf
default_range: string
imports:
  - linkml:types
  - ocsf_core
  - ocsf_objects
  - ocsf_events_base
classes:
  OcsfApplicationEvent:
    title: Application Activity
    description: The abstract parent of OCSF's Application Activity event classes.
    class_uri: ocsf:OcsfApplicationEvent
    abstract: true
    is_a: OcsfBaseEvent
    mixins:
      - OcsfAiOperationProfile
    in_subset:
      - ocsf_category_application
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: application
      ocsf_category: application
      ocsf_profiles: ai_operation
    slot_usage:
      category_uid:
        equals_number: 6
  OcsfApiActivity:
    title: API Activity
    description: API events describe general CRUD (Create, Read, Update, Delete) API activities,
      e.g. (AWS Cloudtrail)
    class_uri: ocsf:OcsfApiActivity
    is_a: OcsfApplicationEvent
    mixins:
      - OcsfTraceProfile
    in_subset:
      - ocsf_category_application
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: api_activity
      ocsf_category: application
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control trace
    slots:
      - dst_endpoint
      - http_request
      - http_response
      - resources
      - src_endpoint
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Create
            description: The API call in the event pertains to a 'create' activity.
          - equals_number: 2
            title: Read
            description: The API call in the event pertains to a 'read' activity.
          - equals_number: 3
            title: Update
            description: The API call in the event pertains to a 'update' activity.
          - equals_number: 4
            title: Delete
            description: The API call in the event pertains to a 'delete' activity.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      actor:
        required: true
        annotations:
          ocsf_group: primary
      api:
        required: true
        annotations:
          ocsf_group: primary
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Application
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>API Activity</code>.'
      class_uid:
        equals_number: 6003
      dst_endpoint:
        recommended: true
        annotations:
          ocsf_group: primary
      http_request:
        description: Details about the underlying http request.
        recommended: true
        annotations:
          ocsf_group: primary
      http_response:
        description: Details about the underlying http response.
        recommended: true
        annotations:
          ocsf_group: primary
      resources:
        description: Details about resources that were affected by the activity/event.
        recommended: true
        annotations:
          ocsf_group: primary
      src_endpoint:
        description: Details about the source of the activity.
        required: true
        annotations:
          ocsf_group: primary
      trace:
        annotations:
          ocsf_group: primary
          ocsf_profiles: trace
      type_uid:
        any_of:
          - equals_number: 600300
            title: 'API Activity: Unknown'
          - equals_number: 600301
            title: 'API Activity: Create'
            description: The API call in the event pertains to a 'create' activity.
          - equals_number: 600302
            title: 'API Activity: Read'
            description: The API call in the event pertains to a 'read' activity.
          - equals_number: 600303
            title: 'API Activity: Update'
            description: The API call in the event pertains to a 'update' activity.
          - equals_number: 600304
            title: 'API Activity: Delete'
            description: The API call in the event pertains to a 'delete' activity.
          - equals_number: 600399
            title: 'API Activity: Other'
  OcsfApplicationError:
    title: Application Error
    description: Application Error events describe issues with an applications. The error
      message should be put in the event's <code>message</code> attribute. The <code>metadata.product</code>
      attribute can be used to capture the originating application information. The <code>host</code>
      profile can used to include the generating device information. This class is helpful
      for applications that generate or handle OCSF events and can also be used for errors
      in upstream products and services.
    class_uri: ocsf:OcsfApplicationError
    is_a: OcsfApplicationEvent
    in_subset:
      - ocsf_category_application
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: application_error
      ocsf_category: application
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: General Error
            description: The application has experienced an error.
          - equals_number: 2
            title: Translation Error
            description: The application has experienced an error translating (mapping) a
              raw event to OCSF. Including the original raw event in the raw_data field is
              highly recommended.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Application
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Application
          Error</code>.'
      class_uid:
        equals_number: 6008
      message:
        description: The error message as reported by the application.
      type_uid:
        any_of:
          - equals_number: 600800
            title: 'Application Error: Unknown'
          - equals_number: 600801
            title: 'Application Error: General Error'
            description: The application has experienced an error.
          - equals_number: 600802
            title: 'Application Error: Translation Error'
            description: The application has experienced an error translating (mapping) a
              raw event to OCSF. Including the original raw event in the raw_data field is
              highly recommended.
          - equals_number: 600899
            title: 'Application Error: Other'
  OcsfApplicationLifecycle:
    title: Application Lifecycle
    description: Application Lifecycle events report installation, removal, start, stop of
      an application or service.
    class_uri: ocsf:OcsfApplicationLifecycle
    see_also:
      - https://d3fend.mitre.org/event/d3f:ApplicationEvent/
    is_a: OcsfApplicationEvent
    in_subset:
      - ocsf_category_application
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: application_lifecycle
      ocsf_category: application
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_constraints: '{"at_least_one": ["app", "application"]}'
    related_mappings:
      - d3f:ApplicationEvent
    any_of:
      - slot_conditions:
          app:
            required: true
      - slot_conditions:
          application:
            required: true
    slots:
      - app
      - application
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Install
            description: Install the application.
          - equals_number: 2
            title: Remove
            description: Remove the application.
          - equals_number: 3
            title: Start
            description: Start the application.
          - equals_number: 4
            title: Stop
            description: Stop the application.
          - equals_number: 5
            title: Restart
            description: Restart the application.
          - equals_number: 6
            title: Enable
            description: Enable the application.
          - equals_number: 7
            title: Disable
            description: Disable the application.
          - equals_number: 8
            title: Update
            description: Update the application.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      app:
        description: The application that was affected by the lifecycle event.  This also
          applies to self-updating application systems.
        annotations:
          ocsf_group: context
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: application
      application:
        description: The application that was affected by the lifecycle event. This also applies
          to self-updating application systems. Product identity, such as vendor and version,
          can be conveyed via the nested <code>product</code> attribute.
        recommended: true
        annotations:
          ocsf_group: primary
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Application
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Application
          Lifecycle</code>.'
      class_uid:
        equals_number: 6002
      type_uid:
        any_of:
          - equals_number: 600200
            title: 'Application Lifecycle: Unknown'
          - equals_number: 600201
            title: 'Application Lifecycle: Install'
            description: Install the application.
          - equals_number: 600202
            title: 'Application Lifecycle: Remove'
            description: Remove the application.
          - equals_number: 600203
            title: 'Application Lifecycle: Start'
            description: Start the application.
          - equals_number: 600204
            title: 'Application Lifecycle: Stop'
            description: Stop the application.
          - equals_number: 600205
            title: 'Application Lifecycle: Restart'
            description: Restart the application.
          - equals_number: 600206
            title: 'Application Lifecycle: Enable'
            description: Enable the application.
          - equals_number: 600207
            title: 'Application Lifecycle: Disable'
            description: Disable the application.
          - equals_number: 600208
            title: 'Application Lifecycle: Update'
            description: Update the application.
          - equals_number: 600299
            title: 'Application Lifecycle: Other'
  OcsfDatastoreActivity:
    title: Datastore Activity
    description: Datastore events describe general activities (Read, Update, Query, Delete,
      etc.) which affect datastores or data within those datastores, e.g. (AWS RDS, AWS S3).
    class_uri: ocsf:OcsfDatastoreActivity
    is_a: OcsfApplicationEvent
    in_subset:
      - ocsf_category_application
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: datastore_activity
      ocsf_category: application
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_constraints: '{"at_least_one": ["database", "databucket", "table"]}'
    any_of:
      - slot_conditions:
          database:
            required: true
      - slot_conditions:
          databucket:
            required: true
      - slot_conditions:
          table:
            required: true
    slots:
      - database
      - databucket
      - dst_endpoint
      - http_request
      - http_response
      - query_info
      - src_endpoint
      - table
      - type
      - type_id
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Read
            description: The 'Read' activity involves accessing specific data record details.
          - equals_number: 2
            title: Update
            description: The 'Update' activity pertains to modifying specific data record
              details.
          - equals_number: 3
            title: Connect
            description: The 'Connect' activity involves establishing a connection to the
              datastore.
          - equals_number: 4
            title: Query
            description: The 'Query' activity involves retrieving a filtered subset of data
              based on specific criteria.
          - equals_number: 5
            title: Write
            description: The 'Write' activity involves writing specific data record details.
          - equals_number: 6
            title: Create
            description: The 'Create' activity involves generating new data record details.
          - equals_number: 7
            title: Delete
            description: The 'Delete' activity involves removing specific data record details.
          - equals_number: 8
            title: List
            description: The 'List' activity provides an overview of existing data records.
          - equals_number: 9
            title: Encrypt
            description: The 'Encrypt' activity involves securing data by encrypting a specific
              data record.
          - equals_number: 10
            title: Decrypt
            description: The 'Decrypt' activity involves converting encrypted data back to
              its original format.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      actor:
        required: true
        annotations:
          ocsf_group: primary
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Application
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Datastore
          Activity</code>.'
      class_uid:
        equals_number: 6005
      database:
        recommended: true
        annotations:
          ocsf_group: primary
      databucket:
        recommended: true
        annotations:
          ocsf_group: primary
      dst_endpoint:
        description: Details about the endpoint hosting the datastore application or service.
        recommended: true
        annotations:
          ocsf_group: primary
      http_request:
        description: Details about the underlying http request.
        recommended: true
        annotations:
          ocsf_group: primary
      http_response:
        description: Details about the underlying http response.
        recommended: true
        annotations:
          ocsf_group: primary
      query_info:
        recommended: true
        annotations:
          ocsf_group: primary
      src_endpoint:
        description: Details about the source of the activity.
        required: true
        annotations:
          ocsf_group: primary
      table:
        recommended: true
        annotations:
          ocsf_group: primary
      type:
        title: Datastore Type
        description: The datastore resource type (e.g. database, datastore, or table).
      type_id:
        title: Datastore Type ID
        description: The normalized datastore resource type identifier.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The datastore resource type is unknown.
          - equals_number: 1
            title: Database
          - equals_number: 2
            title: Databucket
          - equals_number: 3
            title: Table
          - equals_number: 99
            title: Other
            description: The datastore resource type is not mapped.
        recommended: true
      type_uid:
        any_of:
          - equals_number: 600500
            title: 'Datastore Activity: Unknown'
          - equals_number: 600501
            title: 'Datastore Activity: Read'
            description: The 'Read' activity involves accessing specific data record details.
          - equals_number: 600502
            title: 'Datastore Activity: Update'
            description: The 'Update' activity pertains to modifying specific data record
              details.
          - equals_number: 600503
            title: 'Datastore Activity: Connect'
            description: The 'Connect' activity involves establishing a connection to the
              datastore.
          - equals_number: 600504
            title: 'Datastore Activity: Query'
            description: The 'Query' activity involves retrieving a filtered subset of data
              based on specific criteria.
          - equals_number: 600505
            title: 'Datastore Activity: Write'
            description: The 'Write' activity involves writing specific data record details.
          - equals_number: 600506
            title: 'Datastore Activity: Create'
            description: The 'Create' activity involves generating new data record details.
          - equals_number: 600507
            title: 'Datastore Activity: Delete'
            description: The 'Delete' activity involves removing specific data record details.
          - equals_number: 600508
            title: 'Datastore Activity: List'
            description: The 'List' activity provides an overview of existing data records.
          - equals_number: 600509
            title: 'Datastore Activity: Encrypt'
            description: The 'Encrypt' activity involves securing data by encrypting a specific
              data record.
          - equals_number: 600510
            title: 'Datastore Activity: Decrypt'
            description: The 'Decrypt' activity involves converting encrypted data back to
              its original format.
          - equals_number: 600599
            title: 'Datastore Activity: Other'
  OcsfFileHosting:
    title: File Hosting Activity
    description: File Hosting Activity events report the actions taken by file management
      applications, including file sharing servers like Sharepoint and services such as Box,
      MS OneDrive, Google Drive, or network file share services.
    class_uri: ocsf:OcsfFileHosting
    is_a: OcsfApplicationEvent
    in_subset:
      - ocsf_category_application
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: file_hosting
      ocsf_category: application
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
    slots:
      - access_list
      - access_mask
      - access_result
      - connection_info
      - dst_endpoint
      - expiration_time
      - expiration_time_dt
      - file
      - file_result
      - http_request
      - http_response
      - share
      - share_type
      - share_type_id
      - src_endpoint
    slot_usage:
      access_list:
        annotations:
          ocsf_group: context
      access_mask:
        description: The sum of hexadecimal values of requested access rights.
        annotations:
          ocsf_group: context
      access_result:
        annotations:
          ocsf_group: context
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Upload
            description: Upload a file.
          - equals_number: 2
            title: Download
            description: Download a file.
          - equals_number: 3
            title: Update
            description: Update a file.
          - equals_number: 4
            title: Delete
            description: Delete a file.
          - equals_number: 5
            title: Rename
            description: Rename a file.
          - equals_number: 6
            title: Copy
            description: Copy a file.
          - equals_number: 7
            title: Move
            description: Move a file.
          - equals_number: 8
            title: Restore
            description: Restore a file.
          - equals_number: 9
            title: Preview
