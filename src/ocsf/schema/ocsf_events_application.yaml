        annotations:
          ocsf_group: primary
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Application
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>File Hosting
          Activity</code>.'
      class_uid:
        equals_number: 6006
      connection_info:
        annotations:
          ocsf_group: context
      dst_endpoint:
        description: The endpoint that received the activity on the target file.
