    class_uri: ocsf:OcsfWinRegistryValueQuery
    deprecated: Use the <code>evidence_info</code> class instead. Populate <code>query_evidence.reg_value</code>
      and set <code>query_type_id</code> to <code>Registry Value</code>.
    is_a: OcsfDiscoveryResultEvent
    in_subset:
