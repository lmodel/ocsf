          - equals_number: 1
            title: Query
            description: The discovered results are via a query request.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Discovery</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Registry
          Value Query</code>.'
      class_uid:
        equals_number: 205005
      reg_value:
        description: The registry value that pertains to the event.
        required: true
        annotations:
          ocsf_group: primary
          ocsf_extension: win
      type_uid:
        any_of:
          - equals_number: 20500500
            title: 'Registry Value Query: Unknown'
          - equals_number: 20500501
            title: 'Registry Value Query: Query'
            description: The discovered results are via a query request.
          - equals_number: 20500599
            title: 'Registry Value Query: Other'
  OcsfWinResourceActivity:
    title: Windows Resource Activity
    description: Windows Resource Activity events report when a process accesses a Windows
      managed resource object, successful or otherwise.
    class_uri: ocsf:OcsfWinResourceActivity
    is_a: OcsfSystemEvent
    in_subset:
      - ocsf_category_system
      - ocsf_extension_win
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: win/windows_resource_activity
      ocsf_category: system
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_associations: '{"actor.user": ["device"], "device": ["actor.user"]}'
      ocsf_extension: win
    slots:
      - win_resource
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Access
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>System
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Windows Resource
          Activity</code>.'
      class_uid:
        equals_number: 201003
      type_uid:
        any_of:
          - equals_number: 20100300
            title: 'Windows Resource Activity: Unknown'
          - equals_number: 20100301
            title: 'Windows Resource Activity: Access'
          - equals_number: 20100399
            title: 'Windows Resource Activity: Other'
      win_resource:
        required: true
        annotations:
          ocsf_group: primary
          ocsf_extension: win
  OcsfWinServiceActivity:
    title: Windows Service Activity
    description: Windows Service Activity events report when a process interacts with the
      Service Control Manager.
    class_uri: ocsf:OcsfWinServiceActivity
    is_a: OcsfSystemEvent
    in_subset:
      - ocsf_category_system
      - ocsf_extension_win
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: win/windows_service_activity
      ocsf_category: system
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_associations: '{"actor.user": ["device"], "device": ["actor.user"]}'
      ocsf_extension: win
    slots:
      - prev_win_service
      - win_service
    slot_usage:
      activity_id:
        description: The normalized identifier of the activity that triggered the event. Each
          event class defines its own set of activity values. Use 0 (Unknown) when the activity
          cannot be determined. Use 99 (Other) when the activity does not match any defined
          value, in which case activity_name must be populated with the source-specific label.<br>Refer
          to the <code>win_service</code> attribute for details, unless any other attribute
          is mentioned.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Create
            description: A service is created, for example by calling the CreateService API.
          - equals_number: 2
            title: Reconfigure
            description: A service is reconfigured, for example by calling the ChangeServiceConfig
              or ChangeServiceConfig2 API. Refer to <code>prev_win_service</code> and <code>win_service</code>
              attributes for details.
          - equals_number: 3
            title: Start
            description: A stopped service is started, for example by calling the StartService
              API.
          - equals_number: 4
            title: Stop
            description: A running or paused service is stopped, for example by calling the
              ControlService or ControlServiceEx API.
          - equals_number: 5
            title: Pause
            description: A running service is paused, for example by calling the ControlService
              or ControlServiceEx API.
          - equals_number: 6
            title: Continue
            description: A paused service is continued, for example by calling the ControlService
              or ControlServiceEx API.
          - equals_number: 7
            title: Delete
            description: A service is deleted, for example by calling the DeleteService API.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>System
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Windows Service
          Activity</code>.'
      class_uid:
        equals_number: 201004
      prev_win_service:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_extension: win
      type_uid:
        any_of:
          - equals_number: 20100400
            title: 'Windows Service Activity: Unknown'
          - equals_number: 20100401
            title: 'Windows Service Activity: Create'
            description: A service is created, for example by calling the CreateService API.
          - equals_number: 20100402
            title: 'Windows Service Activity: Reconfigure'
            description: A service is reconfigured, for example by calling the ChangeServiceConfig
              or ChangeServiceConfig2 API. Refer to <code>prev_win_service</code> and <code>win_service</code>
              attributes for details.
          - equals_number: 20100403
            title: 'Windows Service Activity: Start'
            description: A stopped service is started, for example by calling the StartService
              API.
          - equals_number: 20100404
            title: 'Windows Service Activity: Stop'
            description: A running or paused service is stopped, for example by calling the
              ControlService or ControlServiceEx API.
          - equals_number: 20100405
            title: 'Windows Service Activity: Pause'
            description: A running service is paused, for example by calling the ControlService
              or ControlServiceEx API.
          - equals_number: 20100406
            title: 'Windows Service Activity: Continue'
            description: A paused service is continued, for example by calling the ControlService
              or ControlServiceEx API.
          - equals_number: 20100407
            title: 'Windows Service Activity: Delete'
            description: A service is deleted, for example by calling the DeleteService API.
          - equals_number: 20100499
            title: 'Windows Service Activity: Other'
      win_service:
        description: The current Windows service. On failed or unknown status of <code>Reconfigure</code>
          action may be populated with the intended state.
        required: true
        annotations:
          ocsf_group: primary
          ocsf_extension: win
