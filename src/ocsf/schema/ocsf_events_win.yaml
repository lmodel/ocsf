---
id: https://w3id.org/lmodel/ocsf/ocsf_events_win
name: ocsf_events_win
title: OCSF Windows event classes
description: The event classes of OCSF's Windows extension. The extension's objects sit in
  ocsf_objects, because it patches base objects with attributes that range over them.
version: 1.9.0
source: https://github.com/ocsf/ocsf-schema/tree/1.9.0
license: Apache-2.0
see_also:
  - https://lmodel.github.io/ocsf
  - https://schema.ocsf.io/1.9.0/
prefixes:
  ocsf: https://w3id.org/lmodel/ocsf/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  attack: https://w3id.org/lmodel/attack/
  cve: https://w3id.org/lmodel/cve/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  stix: https://w3id.org/lmodel/stix/
default_prefix: ocsf
default_range: string
imports:
  - linkml:types
  - ocsf_core
  - ocsf_objects
  - ocsf_events_base
  - ocsf_events_discovery
  - ocsf_events_system
classes:
  OcsfWinPrefetchQuery:
    title: Prefetch Query
    description: Prefetch Query events report information about Windows prefetch files.
    class_uri: ocsf:OcsfWinPrefetchQuery
    deprecated: Use the <code>evidence_info</code> class instead. Populate <code>query_evidence.file</code>
      and set <code>query_type_id</code> to <code>Prefetch</code>.
    is_a: OcsfDiscoveryResultEvent
    in_subset:
      - ocsf_category_discovery
      - ocsf_extension_win
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: win/prefetch_query
      ocsf_category: discovery
      ocsf_profiles: cloud container data_classification datetime host linux/linux_users macos/macos_users
        osint record_integrity security_control
      ocsf_extension: win
      ocsf_deprecated_since: 1.5.0
      ocsf_superseded_by: evidence_info
    slots:
      - last_run_time
      - last_run_time_dt
      - name
      - run_count
    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Query
            description: The discovered results are via a query request.
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Discovery</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Prefetch
          Query</code>.'
      class_uid:
        equals_number: 205019
      last_run_time:
        description: The prefetch file last run time.
        recommended: true
        annotations:
          ocsf_group: occurrence
      last_run_time_dt:
        description: The prefetch file last run time.
        annotations:
          ocsf_group: occurrence
          ocsf_profiles: datetime
      name:
        description: The name of the prefetch file that is the target of the query.
        required: true
        annotations:
          ocsf_group: primary
      run_count:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_extension: win
      type_uid:
        any_of:
          - equals_number: 20501900
            title: 'Prefetch Query: Unknown'
          - equals_number: 20501901
            title: 'Prefetch Query: Query'
            description: The discovered results are via a query request.
          - equals_number: 20501999
            title: 'Prefetch Query: Other'
  OcsfWinRegistryKeyActivity:
    title: Registry Key Activity
    description: Registry Key Activity events report when a process performs an action on
      a Windows registry key.
    class_uri: ocsf:OcsfWinRegistryKeyActivity
    is_a: OcsfSystemEvent
    in_subset:
      - ocsf_category_system
      - ocsf_extension_win
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: win/registry_key_activity
      ocsf_category: system
      ocsf_profiles: ai_operation cloud container data_classification datetime host linux/linux_users
        macos/macos_users osint record_integrity security_control
      ocsf_associations: '{"actor.user": ["device"], "device": ["actor.user"]}'
      ocsf_extension: win
    slots:
      - access_mask
      - create_mask
      - open_mask
      - prev_reg_key
      - reg_key
    slot_usage:
      access_mask:
        recommended: true
        annotations:
          ocsf_group: primary
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Create
          - equals_number: 2
            title: Read
          - equals_number: 3
            title: Modify
          - equals_number: 4
            title: Delete
          - equals_number: 5
            title: Rename
          - equals_number: 6
            title: Set Security
          - equals_number: 7
            title: Restore
          - equals_number: 8
            title: Import
          - equals_number: 9
            title: Export
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      actor:
        description: The actor that performed the activity on the <code>reg_key</code> object.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>System
          Activity</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Registry
          Key Activity</code>.'
      class_uid:
        equals_number: 201001
      create_mask:
        recommended: true
        annotations:
          ocsf_group: primary
      open_mask:
        recommended: true
        annotations:
          ocsf_group: primary
      prev_reg_key:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_extension: win
      reg_key:
        required: true
        annotations:
          ocsf_group: primary
          ocsf_extension: win
      type_uid:
        any_of:
          - equals_number: 20100100
            title: 'Registry Key Activity: Unknown'
          - equals_number: 20100101
            title: 'Registry Key Activity: Create'
          - equals_number: 20100102
            title: 'Registry Key Activity: Read'
          - equals_number: 20100103
            title: 'Registry Key Activity: Modify'
          - equals_number: 20100104
            title: 'Registry Key Activity: Delete'
          - equals_number: 20100105
            title: 'Registry Key Activity: Rename'
          - equals_number: 20100106
            title: 'Registry Key Activity: Set Security'
          - equals_number: 20100107
            title: 'Registry Key Activity: Restore'
          - equals_number: 20100108
            title: 'Registry Key Activity: Import'
          - equals_number: 20100109
            title: 'Registry Key Activity: Export'
          - equals_number: 20100199
            title: 'Registry Key Activity: Other'
    related_mappings:
      - d3f:WindowsRegistryKeyEvent
