              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Discovery</code>.'
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Registry
          Key Query</code>.'
      class_uid:
        equals_number: 205004
      reg_key:
        description: The registry key that pertains to the event.
        required: true
        annotations:
          ocsf_group: primary
          ocsf_extension: win
      type_uid:
        any_of:
          - equals_number: 20500400
            title: 'Registry Key Query: Unknown'
          - equals_number: 20500401
            title: 'Registry Key Query: Query'
            description: The discovered results are via a query request.
          - equals_number: 20500499
            title: 'Registry Key Query: Other'
  OcsfWinRegistryValueActivity:
    title: Registry Value Activity
    description: Registry Value Activity events reports when a process performs an action
