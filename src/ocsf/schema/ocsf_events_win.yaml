      class_uid:
        equals_number: 201002
      reg_value:
        required: true
      type_uid:
        any_of:
          - equals_number: 20100200
            title: 'Registry Value Activity: Unknown'
          - equals_number: 20100201
            title: 'Registry Value Activity: Get'
          - equals_number: 20100202
            title: 'Registry Value Activity: Set'
          - equals_number: 20100203
            title: 'Registry Value Activity: Modify'
          - equals_number: 20100204
            title: 'Registry Value Activity: Delete'
          - equals_number: 20100299
            title: 'Registry Value Activity: Other'
    related_mappings:
