    slot_usage:
      activity_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Get
          - equals_number: 2
            title: Set
          - equals_number: 3
            title: Modify
          - equals_number: 4
            title: Delete
          - equals_number: 99
