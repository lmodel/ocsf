    is_a: OcsfService
    in_subset:
      - ocsf_extension_win
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: win/win_service
      ocsf_profiles: container data_classification
      ocsf_constraints: '{"at_least_one": ["cmd_line", "service_category_id", "service_dependencies",
        "service_error_control_id", "service_start_name", "service_start_type_id", "service_type_id"]}'
      ocsf_extension: win
    related_mappings:
      - d3f:ServiceApplication
    any_of:
      - slot_conditions:
          cmd_line:
            required: true
      - slot_conditions:
          service_category_id:
            required: true
      - slot_conditions:
          service_dependencies:
            required: true
      - slot_conditions:
          service_error_control_id:
            required: true
      - slot_conditions:
          service_start_name:
            required: true
      - slot_conditions:
          service_start_type_id:
            required: true
      - slot_conditions:
          service_type_id:
            required: true
    slots:
      - cmd_line
      - hosting_process
      - load_order_group
      - service_category
      - service_category_id
      - service_dependencies
      - service_dll_file
      - service_error_control
      - service_error_control_id
      - service_file
      - service_start_name
      - service_start_type
      - service_start_type_id
      - service_type
      - service_type_id
    slot_usage:
      cmd_line:
        description: The full command line used to launch the service.
        recommended: true
      load_order_group:
        recommended: true
      name:
        description: The unique name of the service.
        required: true
        recommended: false
      service_category_id:
        recommended: true
      service_dependencies:
        recommended: true
      service_error_control_id:
        recommended: true
      service_file:
        recommended: true
      service_start_name:
        recommended: true
      service_start_type_id:
        recommended: true
      service_type_id:
        recommended: true
