    annotations:
      ocsf_key: metric
    slots:
      - name
      - value
    slot_usage:
      name:
        description: The name of the metric.
        required: true
      value:
        description: The value of the metric.
        required: true
  OcsfMitigation:
    title: MITRE Mitigation
    description: The MITRE Mitigation object describes the ATT&CK® or ATLAS™ Mitigation ID
      and/or name that is associated to an attack.
    class_uri: ocsf:OcsfMitigation
    see_also:
      - https://attack.mitre.org
      - https://atlas.mitre.org/matrices/ATLAS
      - https://d3fend.mitre.org/mappings/attack-mitigations/
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: mitigation
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - countermeasures
      - src_url
    slot_usage:
      countermeasures:
        description: 'The D3FEND countermeasures that are associated with the attack technique.
          For example: ATT&CK Technique <code>T1003</code> is addressed by Mitigation <code>M1027</code>,
          and D3FEND Technique <code>D3-OTP</code>.'
      name:
        description: 'The Mitigation name that is associated with the attack technique. For
          example: <code>Password Policies</code>, or <code>Code Signing</code>.'
      src_url:
        description: 'The versioned permalink of the Mitigation. For example: <code>https://attack.mitre.org/versions/v14/mitigations/M1027</code>.'
      uid:
        description: 'The Mitigation ID that is associated with the attack technique. For
          example: <code>M1027</code>, or <code>AML.M0013</code>.'
    close_mappings:
      - attack:AttackMitigation
  OcsfModule:
    title: Module
    description: The Module object describes the attributes of a module.
    class_uri: ocsf:OcsfModule
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: module
      ocsf_profiles: container data_classification
      ocsf_constraints: '{"at_least_one": ["load_type_id", "function_name"]}'
    any_of:
      - slot_conditions:
          load_type_id:
            required: true
      - slot_conditions:
          function_name:
            required: true
    slots:
      - base_address
      - file
      - function_invocation
      - function_name
      - load_type
      - load_type_id
      - start_address
      - type
    slot_usage:
      base_address:
        recommended: true
      file:
        description: The module file object.
        recommended: true
      function_invocation:
        description: Details about the invocation of the function given in <code>function_name</code>.
      function_name:
        description: The invoked function in the module. For load and unload events, this
          is the entry-point function of the module. The system calls the entry-point function
          whenever a process or thread loads or unloads the module.
        recommended: true
      load_type_id:
        description: The normalized identifier for how the module was loaded in memory.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The load type is unknown.
          - equals_number: 1
            title: Standard
            description: A normal module loaded by the normal windows loading mechanism i.e.
              LoadLibrary.
          - equals_number: 2
            title: Non Standard
            description: A module loaded in a way avoidant of normal windows procedures. i.e.
              Bootstrapped Loading/Manual Dll Loading.
          - equals_number: 3
            title: ShellCode
            description: A raw module in process memory that is READWRITE_EXECUTE and had
              a thread started in its range.
          - equals_number: 4
            title: Mapped
            description: A memory mapped file, typically created with CreatefileMapping/MapViewOfFile.
          - equals_number: 5
            title: NonStandard Backed
            description: A module loaded in a non standard way. However, GetModuleFileName
              succeeds on this allocation.
          - equals_number: 99
            title: Other
            description: The load type is not mapped. See the <code>load_type</code> attribute,
              which contains a data source specific value.
        recommended: true
      start_address:
        recommended: true
      type:
        description: The module type.
        recommended: true
  OcsfNetworkConnectionInfo:
