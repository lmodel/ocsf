  OcsfProgrammaticCredential:
    title: Programmatic Credential
    description: The Programmatic Credential object describes service-specific credentials
      used for direct API access and system integration. These credentials are typically issued
      by individual services or platforms for accessing their APIs and resources, focusing
      on credential lifecycle management and usage tracking. Examples include API keys, service
      account keys, client certificates, and vendor-specific access tokens.
    class_uri: ocsf:OcsfProgrammaticCredential
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: programmatic_credential
      ocsf_profiles: datetime
    slots:
      - last_used_time
      - last_used_time_dt
      - type
      - uid
    slot_usage:
      last_used_time:
        description: The timestamp when this programmatic credential was last used for authentication
          or API access. This helps track credential usage patterns, identify dormant credentials
          that may pose security risks, and support credential lifecycle management. The timestamp
          should reflect the most recent successful authentication or API call using this
          credential.
      last_used_time_dt:
        description: The timestamp when this programmatic credential was last used for authentication
          or API access. This helps track credential usage patterns, identify dormant credentials
          that may pose security risks, and support credential lifecycle management. The timestamp
          should reflect the most recent successful authentication or API call using this
          credential.
        annotations:
          ocsf_profiles: datetime
      type:
        description: The type or category of programmatic credential, normalized to the caption
          of the type_id value. In the case of 'Other', it is defined by the event source.
          Examples include 'API Key', 'Service Account Key', 'Access Token', 'Client Certificate',
          'OAuth Token', 'Personal Access Token', etc.
        recommended: true
      uid:
        description: 'The unique identifier of the programmatic credential. This could be
          an API key ID, service account key ID, access token identifier, certificate serial
          number, or other unique identifier that distinguishes this credential from others.
          Examples: AWS Access Key ID, GCP Service Account Key ID, Azure Application ID, or
          OAuth2 token identifier.'
        required: true
  OcsfQueryEvidence:
