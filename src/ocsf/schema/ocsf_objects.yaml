  OcsfFingerprint:
    title: Fingerprint
    description: The Fingerprint object provides detailed information about a fingerprint,
      which is a compact representation of data used to identify a longer piece of information,
      such as a public key, file content, or application implementation. It contains the algorithm
      or scheme and value of the fingerprint, enabling efficient and reliable identification
      of the associated data.
    class_uri: ocsf:OcsfFingerprint
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:DigitalFingerprint/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: fingerprint
      ocsf_observable: '30'
    related_mappings:
      - d3f:DigitalFingerprint
    slots:
      - algorithm
      - algorithm_id
      - encoding
      - encoding_id
      - serialization
      - serialization_id
      - value
    slot_usage:
      algorithm:
        description: The algorithm or scheme used to create the fingerprint, normalized to
          the caption of <code>algorithm_id</code>. In the case of <code>Other</code>, it
          is defined by the event source.
      algorithm_id:
        description: The identifier of the normalized algorithm or scheme, which was used
          to create the fingerprint.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The algorithm is unknown.
          - equals_number: 1
            title: MD5
            description: MD5 message-digest algorithm producing a 128-bit (16-byte) hash value.
            see_also:
              - https://www.rfc-editor.org/rfc/rfc1321
          - equals_number: 2
            title: SHA-1
            description: Secure Hash Algorithm 1 producing a 160-bit (20-byte) hash value.
            see_also:
              - https://csrc.nist.gov/pubs/fips/180-4/upd1/final
          - equals_number: 3
            title: SHA-256
            description: Secure Hash Algorithm 2 producing a 256-bit (32-byte) hash value.
            see_also:
              - https://csrc.nist.gov/pubs/fips/180-4/upd1/final
          - equals_number: 4
            title: SHA-512
            description: Secure Hash Algorithm 2 producing a 512-bit (64-byte) hash value.
            see_also:
              - https://csrc.nist.gov/pubs/fips/180-4/upd1/final
          - equals_number: 5
            title: CTPH
            description: The ssdeep generated fuzzy checksum. Also known as Context Triggered
              Piecewise Hash (CTPH).
          - equals_number: 6
            title: TLSH
            description: The TLSH fuzzy hashing algorithm.
          - equals_number: 7
            title: quickXorHash
            description: Microsoft simple non-cryptographic hash algorithm that works by XORing
              the bytes in a circular-shifting fashion.
          - equals_number: 8
            title: SHA-224
            description: Secure Hash Algorithm 2 producing a 224-bit (28-byte) hash value.
            see_also:
              - https://csrc.nist.gov/pubs/fips/180-4/upd1/final
          - equals_number: 9
            title: SHA-384
            description: Secure Hash Algorithm 2 producing a 384-bit (48-byte) hash value.
            see_also:
              - https://csrc.nist.gov/pubs/fips/180-4/upd1/final
          - equals_number: 10
            title: SHA-512/224
            description: Secure Hash Algorithm 2 producing a 512-bit (64-byte) hash value
              truncated to a 224-bit (28-byte) hash value.
            see_also:
              - https://csrc.nist.gov/pubs/fips/180-4/upd1/final
          - equals_number: 11
            title: SHA-512/256
            description: Secure Hash Algorithm 2 producing a 512-bit (64-byte) hash value
              truncated to a 256-bit (32-byte) hash value.
            see_also:
              - https://csrc.nist.gov/pubs/fips/180-4/upd1/final
          - equals_number: 12
            title: SHA3-224
            description: Secure Hash Algorithm 3 producing a 224-bit (28-byte) hash value.
            see_also:
              - https://csrc.nist.gov/pubs/fips/202/final
          - equals_number: 13
            title: SHA3-256
            description: Secure Hash Algorithm 3 producing a 256-bit (32-byte) hash value.
            see_also:
              - https://csrc.nist.gov/pubs/fips/202/final
          - equals_number: 14
            title: SHA3-384
            description: Secure Hash Algorithm 3 producing a 384-bit (48-byte) hash value.
            see_also:
              - https://csrc.nist.gov/pubs/fips/202/final
          - equals_number: 15
            title: SHA3-512
            description: Secure Hash Algorithm 3 producing a 512-bit (64-byte) hash value.
            see_also:
              - https://csrc.nist.gov/pubs/fips/202/final
          - equals_number: 16
            title: xxHash H3 64-bit
            description: xxHash H3 producing a 64-bit hash value.
            see_also:
              - https://xxhash.com/doc/v0.8.3/group___x_x_h3__family.html
          - equals_number: 17
            title: xxHash H3 128-bit
            description: xxHash H3 producing a 128-bit hash value.
            see_also:
              - https://xxhash.com/doc/v0.8.3/group___x_x_h3__family.html
          - equals_number: 18
            title: Imphash
            description: Import hash (imphash) based on the import table of a Portable Executable
              (PE) file producing a 128-bit (16-byte) hash value.
            see_also:
              - https://cloud.google.com/blog/topics/threat-intelligence/tracking-malware-import-hashing/
          - equals_number: 19
            title: NPF
            description: Network Protocol Fingerprint (NPF) used to identify network protocols
              and applications.
            see_also:
              - https://github.com/cisco/mercury/blob/main/doc/npf.md
          - equals_number: 20
            title: HASSH
            description: HASSH is a network fingerprinting standard which can be used to identify
              specific SSH client and server implementations.
          - equals_number: 99
            title: Other
            description: The algorithm is not mapped. See the <code>algorithm</code> attribute,
              which contains a data source specific value.
        required: true
      encoding:
        description: The encoding of the <code>value</code> attribute, normalized to the caption
          of <code>encoding_id</code>. In the case of <code>Other</code>, it is defined by
          the event source.
      encoding_id:
        description: The normalized identifier of the encoding used to represent the fingerprint
          bytes as the string in <code>value</code>. A verifier must decode <code>value</code>
          using this encoding to recover the raw hash bytes.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The encoding of the fingerprint value is not known.
          - equals_number: 1
            title: Hex
            description: The fingerprint value is encoded as a lowercase or uppercase hexadecimal
              string.
          - equals_number: 2
            title: Base64
            description: The fingerprint value is encoded using standard Base64.
            see_also:
              - https://www.rfc-editor.org/rfc/rfc4648#section-4
          - equals_number: 3
            title: Base64URL
            description: The fingerprint value is encoded using URL- and filename-safe Base64.
            see_also:
              - https://www.rfc-editor.org/rfc/rfc4648#section-5
          - equals_number: 99
            title: Other
            description: The encoding of the fingerprint value is not mapped. See the <code>encoding</code>
              attribute, which contains a data source specific value.
        recommended: true
      serialization:
        description: The canonical serialization scheme used to produce the deterministic
          byte sequence that was fingerprinted, normalized to the caption of <code>serialization_id</code>.
          In the case of <code>Other</code>, it is defined by the event source.
      serialization_id:
        description: The identifier of the normalized canonical serialization scheme used
          to produce the deterministic byte sequence that was fingerprinted. A verifier must
          apply the same scheme to reproduce the fingerprinted input. Use <code>Flat</code>
          where the fingerprinted data is an opaque byte sequence, such as file content, to
          which no canonical serialization was applied. Distinct from <code>algorithm_id</code>,
          which identifies how the resulting bytes were hashed.
        any_of:
          - equals_number: 0
            title: Unknown
          - equals_number: 1
            title: Flat
            description: No canonical serialization was applied; the fingerprint is computed
              over the data's raw byte sequence, such as the content of a disk file or any
              other opaque byte stream.
          - equals_number: 2
            title: JCS
            description: JSON Canonicalization Scheme - deterministic JSON serialization of
              the structured data prior to hashing.
            see_also:
              - https://www.rfc-editor.org/rfc/rfc8785
          - equals_number: 3
            title: JWS
            description: JSON Web Signature - the JWS Signing Input, i.e. BASE64URL(protected
              header) '.' BASE64URL(payload).
            see_also:
              - https://www.rfc-editor.org/rfc/rfc7515
          - equals_number: 4
            title: COSE
            description: CBOR Object Signing and Encryption - the CBOR Sig_structure used
              as the binary input.
            see_also:
              - https://www.rfc-editor.org/rfc/rfc9052
          - equals_number: 5
            title: DSSE
            description: 'Dead Simple Signing Envelope - the PAE (Pre-Authentication Encoding)
              canonical input. Note: DSSE is a signing-envelope scheme, not a hash algorithm;
              the hash algorithm is carried in <code>algorithm_id</code>.'
            see_also:
              - https://github.com/secure-systems-lab/dsse
          - equals_number: 6
            title: Authenticode
            description: The Portable Executable (PE) Image Hash procedure that canonicalizes
              the PE structure into the byte sequence fed to the digest, excluding specified
              header fields and digesting sections in a defined order.
            see_also:
              - https://download.microsoft.com/download/9/c/5/9c5b2167-8017-4bae-9fde-d599bac8184a/Authenticode_PE.docx
          - equals_number: 7
            title: Code Signing
            description: The procedure that describes how hashes of code and other structures
              form the Code Directory message that is digested.
            see_also:
              - https://developer.apple.com/documentation/technotes/tn3126-inside-code-signing-hashes
          - equals_number: 8
            title: App Package
            description: The Windows Application Package signing procedure that describes
              how file hashes are stored in the manifest, and how that manifest is signed.
            see_also:
              - https://learn.microsoft.com/en-us/windows/msix/package/signing-package-overview
          - equals_number: 99
            title: Other
      value:
        description: The fingerprint value.<p><b>Note:</b> This uses type <code>file_hash_t</code>
          (&quot;Hash&quot;), which has been generalized for all fingerprints but retains
          the same name and caption for backwards compatibility.</p>
        range: ocsf_file_hash_t
        required: true
  OcsfRule:
    title: Rule
    description: The Rule object describes characteristics of a rule associated with a policy
      or an event.
    class_uri: ocsf:OcsfRule
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: rule
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - category
      - desc
      - type
      - version
    slot_usage:
      category:
        description: The rule category.
      desc:
        description: The description of the rule that generated the event.
      name:
        description: The name of the rule that generated the event.
      type:
        description: The rule type.
      uid:
        description: The unique identifier of the rule that generated the event.
      version:
        description: 'The rule version. For example: <code>1.1</code>.'
  OcsfFirewallRule:
    title: Firewall Rule
    description: The Firewall Rule object represents a specific rule within a firewall policy
      or event. It contains information about a rule's configuration, properties, and associated
      actions that define how network traffic is handled by the firewall.
    class_uri: ocsf:OcsfFirewallRule
    is_a: OcsfRule
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: firewall_rule
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - condition
      - duration
      - match_details
      - match_location
      - rate_limit
      - sensitivity
    slot_usage:
      condition:
        description: 'The rule trigger condition for the rule. For example: SQL_INJECTION.'
      duration:
        description: The rule response time duration, usually used for challenge completion
          time.
  OcsfFunctionInvocation:
    title: Function Invocation
    description: The Function Invocation object provides details regarding the invocation
      of a function.
    class_uri: ocsf:OcsfFunctionInvocation
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: function_invocation
      ocsf_constraints: '{"at_least_one": ["parameters", "return_value", "error"]}'
    any_of:
      - slot_conditions:
          parameters:
            required: true
      - slot_conditions:
          return_value:
            required: true
      - slot_conditions:
          error:
            required: true
    slots:
      - error
      - parameters
      - return_value
    slot_usage:
      error:
        description: The error indication returned from the function. This may differ from
          the return value (e.g. when <code>errno</code> is used).
  OcsfGpuInfo:
    title: GPU Information
    description: The GPU information object contains attributes describing graphical processing
      hardware.
    class_uri: ocsf:OcsfGpuInfo
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: gpu_info
    slots:
      - bus_type
      - bus_type_id
      - cores
      - model
      - vendor_name
      - vram_mode
      - vram_mode_id
      - vram_size
    slot_usage:
      model:
        description: 'The model name of the GPU. For example: <code>GeForce RTX A6000</code>,
          <code>Radeon PRO W7900</code>, or <code>Intel Data Center GPU Max 1550</code>.'
        recommended: true
      vendor_name:
        description: 'The name of the vendor of the GPU. For example: <code>NVIDIA</code>,
          <code>AMD</code>, or <code>Intel</code>.'
        recommended: true
      vram_mode:
        recommended: true
      vram_mode_id:
        recommended: true
      vram_size:
        recommended: true
  OcsfGraph:
    title: Graph
    description: A graph data structure representation with nodes and edges.
    class_uri: ocsf:OcsfGraph
    see_also:
      - https://github.com/jsongraph/json-graph-specification/
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: graph
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - desc
      - edges
      - is_directed
      - nodes
      - query_language
      - query_language_id
      - type
    slot_usage:
      desc:
        description: The graph description - provides additional details about the graph's
          purpose and contents.
      edges:
        description: The edges/connections between nodes in the graph - contains the collection
          of <code>edge</code> objects defining relationships between nodes.
      is_directed:
        description: Indicates if the graph is directed (<code>true</code>) or undirected
          (<code>false</code>).
      name:
        description: The graph name - a human readable identifier for the graph.
      nodes:
        description: The nodes/vertices of the graph - contains the collection of <code>node</code>
          objects that make up the graph.
        required: true
      query_language:
        description: The graph query language, normalized to the caption of the <code>query_language_id</code>
          value.
      query_language_id:
        description: The normalized identifier of a graph query language that can be used
          to interact with the graph.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The Query Language is unknown.
          - equals_number: 1
            title: Cypher
            description: A declarative graph query language developed by Neo4j that allows
              for expressive and efficient querying of graph databases.
          - equals_number: 2
            title: GraphQL
            description: A query language for APIs that enables declarative data fetching
              and provides a complete description of the data in the API.
          - equals_number: 3
            title: Gremlin
            description: A graph traversal language and virtual machine developed by Apache
              TinkerPop that enables graph computing across different graph databases.
          - equals_number: 4
            title: GQL
            description: An ISO standard graph query language designed to provide a unified
              way to query graph databases.
          - equals_number: 5
            title: G-CORE
            description: A graph query language that combines features from existing languages
              while adding support for paths as first-class citizens.
          - equals_number: 6
            title: PGQL
            description: Property Graph Query Language developed by Oracle that provides SQL-like
              syntax for querying property graphs.
          - equals_number: 7
            title: SPARQL
            description: A semantic query language for databases that enables querying and
              manipulating data stored in RDF format.
          - equals_number: 99
            title: Other
            description: The Query Language is not mapped. See the <code>query_language</code>
              attribute, which contains a data source specific value.
        recommended: true
      type:
        description: The graph type. Typically useful to represent the specific type of graph
          that is used.
      uid:
        description: Unique identifier of the graph - a unique ID to reference this specific
          graph.
  OcsfGroup:
    title: Group
    description: The Group object represents a collection or association of entities, such
      as users, policies, or devices. It serves as a logical grouping mechanism to organize
      and manage entities with similar characteristics or permissions within a system or organization,
      including but not limited to purposes of access control.
    class_uri: ocsf:OcsfGroup
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:AccessControlGroup/
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: group
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    related_mappings:
      - d3f:AccessControlGroup
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - desc
      - domain
      - privileges
      - type
      - uid_alt
    slot_usage:
      desc:
        description: The group description.
      domain:
        description: 'The domain where the group is defined. For example: the LDAP or Active
          Directory domain.'
      name:
        description: The group name.
        annotations:
          ocsf_observable: '32'
      privileges:
        description: The group privileges.
      type:
        title: Group Type
        description: The type of the group.
      uid:
        description: The unique identifier of the group. For example, for Windows events this
          is the security identifier (SID) of the group. Another example, pool id or desktop
          id that the device belongs to.
        annotations:
          ocsf_observable: '33'
      uid_alt:
        description: The alternate unique identifier.
  OcsfHassh:
    title: HASSH
    description: The HASSH object contains SSH network fingerprinting values for specific
      client/server implementations. It provides a standardized way of identifying and categorizing
      SSH connections based on their unique characteristics and behavior.
    class_uri: ocsf:OcsfHassh
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: hassh
    slots:
      - algorithm
      - fingerprint
    slot_usage:
      algorithm:
        description: 'The concatenation of key exchange, encryption, authentication and compression
          algorithms (separated by '';''). NOTE: This is not the underlying algorithm for
          the hash implementation.'
        recommended: true
      fingerprint:
        description: The hash of the key exchange, encryption, authentication and compression
          algorithms.
        required: true
  OcsfHttpCookie:
    title: HTTP Cookie
    description: The HTTP Cookie object, also known as a web cookie or browser cookie, contains
      details and values pertaining to a small piece of data that a server sends to a user's
      web browser. This data is then stored by the browser and sent back to the server with
      subsequent requests, allowing the server to remember and track certain information about
      the user's browsing session or preferences.
    class_uri: ocsf:OcsfHttpCookie
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:SessionCookie/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: http_cookie
      ocsf_profiles: datetime
    related_mappings:
      - d3f:SessionCookie
    slots:
      - domain
      - expiration_time
      - expiration_time_dt
      - http_only
      - is_http_only
      - is_secure
      - name
      - path
      - samesite
      - secure
      - value
    slot_usage:
      domain:
        description: The domain name for the server from which the http_cookie is served.
      expiration_time:
        description: The expiration time of the HTTP cookie.
      expiration_time_dt:
        description: The expiration time of the HTTP cookie.
        annotations:
          ocsf_profiles: datetime
      name:
        description: The HTTP cookie name.
        required: true
      path:
        description: The path of the HTTP cookie.
      value:
        description: The HTTP cookie value.
        required: true
  OcsfHttpHeader:
    title: HTTP Header
    description: The HTTP Header object represents the headers sent in an HTTP request or
      response. HTTP headers are key-value pairs that convey additional information about
      the HTTP message, including details about the content, caching, authentication, encoding,
      and other aspects of the communication.
    class_uri: ocsf:OcsfHttpHeader
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: http_header
    slots:
      - name
      - value
    slot_usage:
      name:
        description: The name of the HTTP header.
        required: true
      value:
        description: The value of the HTTP header.
        required: true
  OcsfHttpRequest:
    title: HTTP Request
    description: The HTTP Request object represents the attributes of a request made to a
      web server. It encapsulates the details and metadata associated with an HTTP request,
      including the request method, headers, URL, query parameters, body content, and other
      relevant information.
    class_uri: ocsf:OcsfHttpRequest
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:OutboundInternetNetworkTraffic/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: http_request
    related_mappings:
      - d3f:OutboundInternetNetworkTraffic
      - d3f:OutboundInternetWebTraffic
    slots:
      - args
      - body_length
      - http_headers
      - http_method
      - length
      - referrer
      - uid
      - url
      - user_agent
      - version
      - x_forwarded_for
    slot_usage:
      body_length:
        title: Request Body Length
        description: The actual length of the HTTP request body, in number of bytes, independent
          of a potentially existing Content-Length header.
      http_headers:
        recommended: true
      http_method:
        range: OcsfHttpMethod
        see_also:
          - https://www.iana.org/assignments/http-methods/http-methods.xhtml
          - https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods
        recommended: true
      length:
        title: Request Length
        description: The length of the entire HTTP request, in number of bytes.
      uid:
        description: The unique identifier of the http request.
      url:
        description: The URL object that pertains to the request.
        recommended: true
      user_agent:
        recommended: true
      version:
        title: HTTP Version
        description: The Hypertext Transfer Protocol (HTTP) version.
        recommended: true
  OcsfHttpResponse:
    title: HTTP Response
    description: The HTTP Response object contains detailed information about the response
      sent from a web server to the requester. It encompasses attributes and metadata that
      describe the response status, headers, body content, and other relevant information.
    class_uri: ocsf:OcsfHttpResponse
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:InboundInternetNetworkTraffic/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: http_response
    related_mappings:
      - d3f:InboundInternetNetworkTraffic
      - d3f:InboundInternetWebTraffic
    slots:
      - body_length
      - code
      - content_type
      - http_headers
      - latency
      - length
      - message
      - status
    slot_usage:
      body_length:
        title: Response Body Length
        description: The actual length of the HTTP response body, in number of bytes, independent
          of a potentially existing Content-Length header.
      code:
        description: The Hypertext Transfer Protocol (HTTP) status code returned from the
          web server to the client. For example, 200.
        required: true
      http_headers:
        recommended: true
      length:
        description: The length of the entire HTTP response, in number of bytes.
      message:
        description: The HTTP status code and reason phrase returned from the server.
        deprecated: Redundant with the <code>code</code> and <code>status</code> attributes,
          which together convey the HTTP status code and its reason phrase. Use <code>code</code>
          for the numeric value and <code>status</code> for the human-readable label.
        annotations:
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: code status
      status:
        description: 'The response status. For example: A successful HTTP status of ''OK''
          which corresponds to a code of 200.'
  OcsfIamRole:
    title: IAM Role
    description: The IAM Role object describes permission characteristics (or privileges)
      associated with a user or group of users as security principals against one or more
      resources. In some cases only the name or ID of the role is known hence other attributes
      are optional. In some systems a user or group of users can have multiple roles, imparting
      the union of privileges to the principal. In some systems the role can serve as a temporary
      security principal without its own credentials on behalf of the actual security principal.
    class_uri: ocsf:OcsfIamRole
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: iam_role
      ocsf_profiles: cloud container data_classification
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - account
      - policies
      - privileges
      - programmatic_credentials
      - resources
      - session
      - uid_alt
    slot_usage:
      account:
        description: The account associated with the role. For example, can be a cross-account
          role, different from the user or group account, granting access within this account.
      name:
        description: The role name. For example, <code>Power Users</code>.
        annotations:
          ocsf_observable: '49'
      policies:
        description: IAM policies associated with the role.
      privileges:
        description: List of privileges assigned to a role.
      programmatic_credentials:
        description: Programmatic credential (API keys, access tokens, certificates, etc)
          associated with the role.
      resources:
        description: Resources that the role applies to.
      session:
        description: The session where the role is active. Some roles may be temporary and
          expire when the session expires.
      uid:
        description: The unique role identifier. For example, the Windows role SID, or AWS
          role ARN.
        annotations:
          ocsf_observable: '50'
      uid_alt:
        description: The alternate user identifier. For example, the Active Directory role
          GUID or the associated LDAP group DN.
  OcsfIdentityActivityMetrics:
    title: Identity Activity Metrics
    description: The Identity Activity Metrics object captures usage patterns, authentication
      activity, credential usage and other metrics for identities across cloud and on-premises
      environments. Example identities include AWS IAM Users, Roles, Azure AD Principals,
      GCP Service Accounts, on-premises Active Directory accounts.
    class_uri: ocsf:OcsfIdentityActivityMetrics
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: identity_activity_metrics
      ocsf_profiles: datetime
    slots:
      - first_seen_time
      - first_seen_time_dt
      - last_authentication_time
      - last_authentication_time_dt
      - last_seen_time
      - last_seen_time_dt
      - password_last_used_time
      - password_last_used_time_dt
      - programmatic_credentials
    slot_usage:
      first_seen_time:
        description: The timestamp when this identity was first observed or created in the
          system. This helps establish the identity's age and lifecycle stage for risk assessment.
      first_seen_time_dt:
        description: The timestamp when this identity was first observed or created in the
          system. This helps establish the identity's age and lifecycle stage for risk assessment.
        annotations:
          ocsf_profiles: datetime
      last_authentication_time:
        description: The timestamp when this identity last successfully authenticated to any
          system or service. This differs from <code>last_seen_time</code> as it specifically
          tracks authentication events rather than all activities.
      last_authentication_time_dt:
        description: The timestamp when this identity last successfully authenticated to any
          system or service. This differs from <code>last_seen_time</code> as it specifically
          tracks authentication events rather than all activities.
        annotations:
          ocsf_profiles: datetime
      last_seen_time:
        description: The timestamp of the most recent activity performed by this identity,
          including authentication, resource access, or API calls. This is the most comprehensive
          indicator of identity usage recency.
        recommended: true
      last_seen_time_dt:
        description: The timestamp of the most recent activity performed by this identity,
          including authentication, resource access, or API calls. This is the most comprehensive
          indicator of identity usage recency.
        annotations:
          ocsf_profiles: datetime
      password_last_used_time:
        description: The timestamp when password-based authentication was last used by this
          identity. This helps distinguish between password and other authentication methods
          (MFA, SSO, certificates) and identify password-specific usage patterns.
      password_last_used_time_dt:
        description: The timestamp when password-based authentication was last used by this
          identity. This helps distinguish between password and other authentication methods
          (MFA, SSO, certificates) and identify password-specific usage patterns.
        annotations:
          ocsf_profiles: datetime
      programmatic_credentials:
        description: Details about the programmatic credentials associated with this identity,
          such as API keys, service account keys, access tokens, and client certificates used
          for automated access.
  OcsfIdp:
    title: Identity Provider
    description: The Identity Provider object contains detailed information about a provider
      responsible for creating, maintaining, and managing identity information while offering
      authentication services to applications. An Identity Provider (IdP) serves as a trusted
      authority that verifies the identity of users and issues authentication tokens or assertions
      to enable secure access to applications or services.
    class_uri: ocsf:OcsfIdp
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: idp
      ocsf_profiles: container
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - auth_factors
      - domain
      - fingerprint
      - has_mfa
      - issuer
      - protocol_name
      - scim
      - sso
      - state
      - state_id
      - tenant_uid
      - url_string
    slot_usage:
      auth_factors:
        description: The Authentication Factors object describes the different types of Multi-Factor
          Authentication (MFA) methods and/or devices supported by the Identity Provider.
      domain:
        description: The primary domain associated with the Identity Provider.
      fingerprint:
        title: Certificate Fingerprint
        description: The fingerprint of the X.509 certificate used by the Identity Provider.
      has_mfa:
        title: MFA Enforced
        description: The Identity Provider enforces Multi Factor Authentication (MFA).
      issuer:
        description: The unique identifier (often a URL) used by the Identity Provider as
          its issuer.
      name:
        description: The name of the Identity Provider.
      protocol_name:
        title: Supported Protocol
        description: The supported protocol of the Identity Provider. E.g., <code>SAML</code>,
          <code>OIDC</code>, or <code>OAuth2</code>.
      state:
        description: The configuration state of the Identity Provider, normalized to the caption
          of the <code>state_id</code> value. In the case of <code>Other</code>, it is defined
          by the event source.
      state_id:
        description: The normalized state ID of the Identity Provider to reflect its configuration
          or activation status.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The configuration state of the Identity Provider is unknown.
          - equals_number: 1
            title: Active
            description: The Identity Provider is in an Active state, or otherwise enabled.
          - equals_number: 2
            title: Suspended
            description: The Identity Provider is in a Suspended state.
          - equals_number: 3
            title: Deprecated
            description: The Identity Provider is in a Deprecated state, or is otherwise disabled.
          - equals_number: 4
            title: Deleted
            description: The Identity Provider is in a Deleted state.
          - equals_number: 99
            title: Other
            description: The configuration state of the Identity Provider is not mapped. See
              the <code>state</code> attribute, which contains a data source specific value.
      tenant_uid:
        description: The tenant ID associated with the Identity Provider.
      uid:
        description: The unique identifier of the Identity Provider.
      url_string:
        title: Configuration URL
        description: The URL for accessing the configuration or metadata of the Identity Provider.
  OcsfImage:
    title: Image
    description: The Image object provides a description of a specific Virtual Machine (VM)
      or Container image.
    class_uri: ocsf:OcsfImage
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:ContainerImage/
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: image
    related_mappings:
      - d3f:ContainerImage
    slots:
      - labels
      - path
      - tag
      - tags
    slot_usage:
      labels:
        description: The list of labels associated to the image.
      name:
        description: 'The image name. For example: <code>elixir</code>.'
      path:
        description: The full path to the image file.
        range: ocsf_file_path_t
      tags:
        description: The list of tags; <code>{key:value}</code> pairs associated to the image.
      uid:
        description: 'The unique image ID. For example: <code>77af4d6b9913</code>.'
        required: true
        recommended: false
  OcsfJa4Fingerprint:
    title: JA4+ Fingerprint
    description: The JA4+ fingerprint object provides detailed fingerprint information about
      various aspects of network traffic which is both machine and human readable.
    class_uri: ocsf:OcsfJa4Fingerprint
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: ja4_fingerprint
    slots:
      - section_a
      - section_b
      - section_c
      - section_d
      - type
      - type_id
      - value
    slot_usage:
      type:
        description: The JA4+ fingerprint type as defined by FoxIO, normalized to the caption
          of 'type_id'. In the case of 'Other', it is defined by the event source.
        see_also:
          - https://blog.foxio.io/ja4+-network-fingerprinting
      type_id:
        description: The identifier of the JA4+ fingerprint type.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: JA4
            description: TLS Client Fingerprint.
          - equals_number: 2
            title: JA4Server
            description: TLS Server Response/Session Fingerprint.
          - equals_number: 3
            title: JA4HTTP
            description: HTTP Client Fingerprint.
          - equals_number: 4
            title: JA4Latency
            description: Latency Measurement/Light Distance Fingerprint.
          - equals_number: 5
            title: JA4X509
            description: X509 TLS Certificate Fingerprint.
          - equals_number: 6
            title: JA4SSH
            description: SSH Traffic Fingerprint.
          - equals_number: 7
            title: JA4TCP
            description: Passive TCP Client Fingerprint.
          - equals_number: 8
            title: JA4TCPServer
            description: Passive TCP Server Fingerprint.
          - equals_number: 9
            title: JA4TCPScan
            description: Active TCP Server Fingerprint.
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        required: true
      value:
        description: The JA4+ fingerprint value.
        required: true
  OcsfJob:
    title: Job
    description: The Job object provides information about a scheduled job or task, including
      its name, command line, and state. It encompasses attributes that describe the properties
      and status of the scheduled job.
    class_uri: ocsf:OcsfJob
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:ScheduledJob/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: job
      ocsf_profiles: container data_classification datetime
      ocsf_constraints: '{"at_least_one": ["name", "type_id"]}'
    related_mappings:
      - d3f:ScheduledJob
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          type_id:
            required: true
    slots:
      - cmd_line
      - created_time
      - created_time_dt
      - desc
      - file
      - job_actions
      - job_triggers
      - last_run_time
      - last_run_time_dt
      - name
      - next_run_time
      - next_run_time_dt
      - run_state
      - run_state_id
      - type
      - type_id
      - uid
      - user
    slot_usage:
      cmd_line:
        description: The job command line.
        deprecated: Use the <code>job_action.cmd_line</code> attribute instead.
        recommended: true
        annotations:
          ocsf_observable: '13'
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: job_action.cmd_line
      created_time:
        description: The time when the job was created.
        recommended: true
      created_time_dt:
        description: The time when the job was created.
        annotations:
          ocsf_profiles: datetime
      desc:
        description: The description of the job.
        recommended: true
      file:
        description: The file that pertains to the job.
      job_actions:
        description: An array of actions that will be performed by the job when certain conditions
          are met.
      last_run_time:
        description: The time when the job was last run.
        deprecated: Use the <code>job_trigger.last_run_time</code> attribute instead.
        recommended: true
        annotations:
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: job_trigger.last_run_time
      last_run_time_dt:
        description: The time when the job was last run.
        deprecated: Use the <code>job_trigger.last_run_time</code> attribute instead.
        annotations:
          ocsf_profiles: datetime
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: job_trigger.last_run_time
      name:
        description: The name of the job.
        recommended: true
      next_run_time:
        description: The time when the job will next be run.
        deprecated: Use the <code>job_trigger.next_run_time</code> attribute instead.
        annotations:
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: job_trigger.next_run_time
      next_run_time_dt:
        description: The time when the job will next be run.
        deprecated: Use the <code>job_trigger.next_run_time</code> attribute instead.
        annotations:
          ocsf_profiles: datetime
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: job_trigger.next_run_time
      run_state:
        description: The run state of the job.
      run_state_id:
        description: The run state ID of the job.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The run state is unknown.
          - equals_number: 1
            title: Ready
          - equals_number: 2
            title: Queued
          - equals_number: 3
            title: Running
          - equals_number: 4
            title: Stopped
          - equals_number: 5
            title: Disabled
          - equals_number: 99
            title: Other
            description: The run state is not mapped. See the <code>run_state</code> attribute,
              which contains a data source specific value.
        recommended: true
      type:
        description: The job type, normalized to the caption of the <code>type_id</code> value.
          In the case of 'Other', it is defined by the event source.
      type_id:
        description: The job type, i.e. the mechanism that executes the job.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The job orchestration mechanism is unknown.
          - equals_number: 1
            title: Task Scheduler
            description: The job is executed by the Task Scheduler on Windows.
          - equals_number: 2
            title: Cron
            description: The job is executed by <code>cron</code> on Linux, macOS, or another
              a Unix-like OS.
          - equals_number: 3
            title: Systemd
            description: The job is executed by <code>systemd</code> on Linux.
          - equals_number: 4
            title: Launchd
            description: The job is executed by <code>launchd</code> on macOS.
          - equals_number: 99
            title: Other
            description: The job orchestration mechanism is not mapped. See the <code>type</code>
              attribute, which contains a data source specific value.
        recommended: true
      uid:
        description: The unique job identifier.
      user:
        description: The user that created the job.
  OcsfJobAction:
    title: Job Action
    description: The action that will be performed by the job when certain conditions are
      met.
    class_uri: ocsf:OcsfJobAction
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: job_action
      ocsf_profiles: container data_classification
    slots:
      - cmd_line
      - com_class_uuid
      - file
      - properties
      - type
      - type_id
      - working_directory
    slot_usage:
      cmd_line:
        description: When <code>type_id</code> is <code>Execute (2)</code>, this describes
          the command line that is executed.<br/><br/>When <code>type_id</code> is <code>COM
          Handler (1)</code>, this <em>may</em> describe the DLL path stored in the COM component's
          <code>InprocServer32</code> key or the command line stored in the COM component's
          <code>LocalServer32</code> key.
      com_class_uuid:
        description: When <code>type_id</code> is <code>COM Handler (1)</code>, this describes
          the COM Class Identifier (CLSID).
      file:
        description: When known, describes the image file that is executed when <code>type_id</code>
          is <code>COM Handler</code> or <code>Execute</code>. Note that this attribute is
          intended to supplement the <code>com_class_uid</code> or <code>cmd_line</code> attributes,
          and is not an alternative to them.
      properties:
        description: The list of properties associated with the performed action.<br>Can be
          populated with additional attributes of a program execution process, COM object
          attributes, fields of a message box or an email.
        recommended: true
      type:
        description: The job action type, normalized to the caption of the <code>type_id</code>
          value. In the case of 'Other', it is defined by the event source.
        recommended: true
      type_id:
        description: The job action type.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The performed action is unknown.
          - equals_number: 1
            title: COM Handler
            description: The action fires a COM handler. When this type is used, <code>com_class_uuid</code>
              and <code>file</code> attributes may be populated.
          - equals_number: 2
            title: Execute
            description: The action executes a command-line operation. When this type is used,
              <code>cmd_line</code> and <code>file</code> attributes may be populated.
          - equals_number: 3
            title: E-mail
            description: The action sends an email.
          - equals_number: 4
            title: Show Message
            description: The action shows a message box with specified message and title.
          - equals_number: 99
            title: Other
            description: The performed action is not mapped. See the <code>type</code> attribute,
              which contains a data source specific value.
        required: true
      working_directory:
        description: When <code>type_id</code> is <code>Execute (2)</code>, this describes
          the working directory of a program that is run by the job.
  OcsfJobTrigger:
    title: Job Trigger
    description: The condition or event that, when met, will initiate the job to perform specified
      actions.
    class_uri: ocsf:OcsfJobTrigger
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: job_trigger
      ocsf_profiles: datetime
    slots:
      - event_codes
      - last_run_time
      - last_run_time_dt
      - log_sources
      - next_run_time
      - next_run_time_dt
      - properties
      - type
      - type_id
      - user
    slot_usage:
      event_codes:
        description: Event identifiers that pertain to the job trigger. Should be populated
          when the <code>Event (3)</code> type is specified.
      last_run_time:
        description: The time when the job was last run.
        recommended: true
      last_run_time_dt:
        description: The time when the job was last run.
        annotations:
          ocsf_profiles: datetime
      log_sources:
        description: A collection of log systems or components that pertain to the job trigger.
          Should be populated when the <code>Event (3)</code> type is specified.
      next_run_time:
        description: The time when the job will next be run.
      next_run_time_dt:
        description: The time when the job will next be run.
        annotations:
          ocsf_profiles: datetime
      properties:
        description: The list of properties associated with the trigger.<br>Can be used to
          describe time boundaries of the job, amount of repetitions or when the job should
          be activated or expired.
        recommended: true
      type:
        description: The job trigger type, normalized to the caption of the <code>type_id</code>
          value. In the case of 'Other', it is defined by the event source.
        recommended: true
      type_id:
        description: The job trigger type, i.e. the condition that must be met for the job
          to perform its action.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The trigger is unknown.
          - equals_number: 1
            title: Boot
            description: The job is triggered on a system boot.
          - equals_number: 2
            title: Schedule
            description: The job is triggered on a specific schedule. Properties should be
              populated with respective time bounds.
          - equals_number: 3
            title: Event
            description: The job is triggered when the specific event occurs. The <code>properties</code>
              attribute should be populated with respective event sources and identifiers.
          - equals_number: 99
            title: Other
            description: The job trigger is unmapped. See the <code>type</code> attribute,
              which contains a data source specific value.
        required: true
      user:
        description: The user that pertains to the job trigger. Can be populated when the
          <code>Event (3)</code> type that bounds to specific user is used.
  OcsfKbArticle:
    title: KB Article
    description: The KB Article object contains metadata that describes the patch or update.
    class_uri: ocsf:OcsfKbArticle
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: kb_article
      ocsf_profiles: data_classification datetime
      ocsf_constraints: '{"at_least_one": ["uid", "src_url"]}'
    any_of:
      - slot_conditions:
          uid:
            required: true
      - slot_conditions:
          src_url:
            required: true
    slots:
      - avg_timespan
      - bulletin
      - classification
      - created_time
      - created_time_dt
      - install_state
      - install_state_id
      - is_superseded
      - os
      - product
      - severity
      - size
      - src_url
      - title
      - uid
    slot_usage:
      avg_timespan:
        description: The average time to patch.
      bulletin:
        description: The kb article bulletin identifier.
      classification:
        description: The vendors classification of the kb article.
      created_time:
        description: The date the kb article was released by the vendor.
      created_time_dt:
        description: The date the kb article was released by the vendor.
        annotations:
          ocsf_profiles: datetime
      install_state:
        description: The install state of the kb article.
        recommended: true
      install_state_id:
        description: The normalized install state ID of the kb article.
        recommended: true
      is_superseded:
        description: The kb article has been replaced by another.
      os:
        description: The operating system the kb article applies.
        recommended: true
      product:
        description: The product details the kb article applies.
      severity:
        description: The severity of the kb article.
        recommended: true
      size:
        description: The size in bytes for the kb article.
      src_url:
        description: The kb article link from the source vendor.
      title:
        description: The title of the kb article.
        recommended: true
      uid:
        description: The unique identifier for the kb article.
        recommended: true
  OcsfKernel:
    title: Kernel Resource
    description: The Kernel Resource object provides information about a specific kernel resource,
      including its name and type. It describes essential attributes associated with a resource
      managed by the kernel of an operating system.
    class_uri: ocsf:OcsfKernel
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:Kernel/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: kernel
    related_mappings:
      - d3f:Kernel
    slots:
      - is_system
      - name
      - path
      - system_call
      - type
      - type_id
    slot_usage:
      name:
        description: The name of the kernel resource.
        required: true
      path:
        description: The full path of the kernel resource.
        range: ocsf_file_path_t
      type:
        description: The type of the kernel resource.
      type_id:
        description: The type of the kernel resource.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: Shared Mutex
          - equals_number: 2
            title: System Call
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        required: true
  OcsfKernelDriver:
    title: Kernel Extension
    description: The Kernel Extension object describes a kernel driver that has been loaded
      or unloaded into the operating system (OS) kernel.
    class_uri: ocsf:OcsfKernelDriver
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:KernelModule/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: kernel_driver
      ocsf_profiles: container data_classification
    related_mappings:
      - d3f:KernelModule
    slots:
      - file
    slot_usage:
      file:
        description: The driver/extension file object.
        required: true
        annotations:
          ocsf_group: primary
  OcsfKeyValueObject:
    title: Key:Value object
    description: A generic object allowing to define a <code>{key:value}</code> pair.
    class_uri: ocsf:OcsfKeyValueObject
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: key_value_object
      ocsf_constraints: '{"at_least_one": ["value", "values"]}'
    any_of:
      - slot_conditions:
          value:
            required: true
      - slot_conditions:
          values:
            required: true
    slots:
      - name
      - value
      - values
    slot_usage:
      name:
        description: The name of the key.
        required: true
      value:
        description: The value associated to the key.
        recommended: true
      values:
        description: Optional, the values associated to the key. You can populate this attribute,
          when you have multiple values for the same key.
        recommended: true
  OcsfKeyboardInfo:
    title: Keyboard Information
    description: The Keyboard Information object contains details and attributes related to
      a computer or device keyboard. It encompasses information that describes the characteristics,
      capabilities, and configuration of the keyboard.
    class_uri: ocsf:OcsfKeyboardInfo
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: keyboard_info
    slots:
      - function_keys
      - ime
      - keyboard_layout
      - keyboard_subtype
      - keyboard_type
  OcsfKillChainPhase:
    title: Kill Chain Phase
    description: The Kill Chain Phase object represents a single phase of a cyber attack,
      including the initial reconnaissance and planning stages up to the final objective of
      the attacker. It provides a detailed description of each phase and its associated activities
      within the broader context of a cyber attack.
    class_uri: ocsf:OcsfKillChainPhase
    see_also:
      - https://www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: kill_chain_phase
    slots:
      - phase
      - phase_id
    slot_usage:
      phase:
        recommended: true
      phase_id:
        required: true
  OcsfLdapPerson:
    title: LDAP Person
    description: The additional LDAP attributes that describe a person.
    class_uri: ocsf:OcsfLdapPerson
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: ldap_person
      ocsf_profiles: datetime
    slots:
      - cost_center
      - created_time
      - created_time_dt
      - deleted_time
      - deleted_time_dt
      - department
      - display_name
      - email_addrs
      - employee_uid
      - given_name
      - hire_time
      - hire_time_dt
      - job_title
      - labels
      - last_login_time
      - last_login_time_dt
      - ldap_cn
      - ldap_dn
      - leave_time
      - leave_time_dt
      - location
      - manager
      - modified_time
      - modified_time_dt
      - office_location
      - phone_number
      - surname
      - tags
    slot_usage:
      created_time:
        description: The timestamp when the user was created.
      created_time_dt:
        description: The timestamp when the user was created.
        annotations:
          ocsf_profiles: datetime
      deleted_time_dt:
        annotations:
          ocsf_profiles: datetime
      department:
        description: The name of the department in which the user works.
      display_name:
        description: The display name of the LDAP person. According to RFC 2798, this is the
          preferred name of a person to be used when displaying entries.
        see_also:
          - https://www.rfc-editor.org/rfc/rfc2798.html#section-2.3
          - https://learn.microsoft.com/en-us/windows/win32/adschema/a-displayname
      hire_time_dt:
        annotations:
          ocsf_profiles: datetime
      labels:
        description: 'The labels associated with the user. For example in AD this could be
          the <code>userType</code>, <code>employeeType</code>. For example: <code>Member,
          Employee</code>.'
      last_login_time_dt:
        annotations:
          ocsf_profiles: datetime
      leave_time_dt:
        annotations:
          ocsf_profiles: datetime
      location:
        description: The geographical location associated with a user. This is typically the
          user's usual work location.
      modified_time:
        description: The timestamp when the user entry was last modified.
      modified_time_dt:
        description: The timestamp when the user entry was last modified.
        annotations:
          ocsf_profiles: datetime
      phone_number:
        title: Telephone Number
        description: The telephone number of the user. Corresponds to the LDAP <code>Telephone-Number</code>
          CN.
      tags:
        description: The list of tags; <code>{key:value}</code> pairs associated to the user.
  OcsfLoadBalancer:
    title: Load Balancer
    description: The load balancer object describes the load balancer entity and contains
      additional information regarding the distribution of traffic across a network.
    class_uri: ocsf:OcsfLoadBalancer
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: load_balancer
      ocsf_profiles: container
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - classification
      - code
      - dst_endpoint
      - endpoint_connections
      - error_message
      - ip
      - message
      - metrics
      - status_detail
    slot_usage:
      classification:
        description: The request classification as defined by the load balancer.
      code:
        description: The numeric response status code detailing the connection from the load
          balancer to the destination target.
        recommended: true
      dst_endpoint:
        description: The destination to which the load balancer is distributing traffic.
        recommended: true
      endpoint_connections:
        description: An object detailing the load balancer connection attempts and responses.
        recommended: true
      error_message:
        description: The load balancer error message.
      ip:
        description: 'The IP address of the load balancer node that handled the client request.
          Note: the load balancer may have other IP addresses, and this is not an IP address
          of the target/distribution endpoint - see <code>dst_endpoint</code>.'
      message:
        description: The load balancer message.
      metrics:
        description: General purpose metrics associated with the load balancer.
      name:
        description: The name of the load balancer.
      status_detail:
        description: The status detail contains additional status information about the load
          balancer distribution event.
      uid:
        description: The unique identifier for the load balancer.
  OcsfLocation:
    title: Geo Location
    description: The Geo Location object describes a geographical location, usually associated
      with an IP address.
    class_uri: ocsf:OcsfLocation
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: location
      ocsf_constraints: '{"at_least_one": ["city", "country", "postal_code", "region"]}'
      ocsf_observable: '26'
    any_of:
      - slot_conditions:
          city:
            required: true
      - slot_conditions:
          country:
            required: true
      - slot_conditions:
          postal_code:
            required: true
      - slot_conditions:
          region:
            required: true
    slots:
      - aerial_height
      - city
      - continent
      - coordinates
      - country
      - desc
      - geodetic_altitude
      - geodetic_vertical_accuracy
      - geohash
      - horizontal_accuracy
      - is_on_premises
      - isp
      - lat
      - long
      - postal_code
      - pressure_altitude
      - provider
      - region
    slot_usage:
      city:
        recommended: true
      continent:
        recommended: true
      country:
        recommended: true
      desc:
        description: The description of the geographical location.
      isp:
        deprecated: Use the <code>network_endpoint.isp</code> or <code>whois.isp</code> attribute
          according to your use-case.
        annotations:
          ocsf_deprecated_since: 1.5.0
          ocsf_superseded_by: network_endpoint.isp whois.isp
      provider:
        description: The provider of the geographical location data.
      region:
        description: The alphanumeric code that identifies the principal subdivision (e.g.
          province or state) of the country. For example, 'CH-VD' for the Canton of Vaud,
          Switzerland
        see_also:
          - https://www.iso.org/iso-3166-country-codes.html
          - https://www.iso.org/obp/ui/#iso:code:3166:US
    related_mappings:
      - d3f:PhysicalLocation
  OcsfLogger:
    title: Logger
    description: The Logger object represents the device and product where events are stored
      with times for receipt and transmission.  This may be at the source device where the
      event occurred, a remote scanning device, intermediate hops, or the ultimate destination.
    class_uri: ocsf:OcsfLogger
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: logger
      ocsf_profiles: container data_classification datetime
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - device
      - event_uid
      - is_truncated
      - log_format
      - log_level
      - log_name
      - log_provider
      - log_version
      - logged_time
      - logged_time_dt
      - product
      - transmit_time
      - transmit_time_dt
      - untruncated_size
      - version
    slot_usage:
      device:
        description: The device where the events are logged.
        recommended: true
      event_uid:
        description: The unique identifier of the event assigned by the logger.
      is_truncated:
        description: Indicates whether the OCSF event data has been truncated due to size
          limitations. When <code>true</code>, some event data may have been omitted to fit
          within system constraints.
      log_format:
        description: The format of data in the log. For example JSON, syslog or CSV.
      log_level:
        description: The level at which an event was logged. This can be log provider specific.
          For example the audit level.
      log_name:
        description: The log name for the logging provider log, or the file name of the system
          log. This may be an intermediate store-and-forward log or a vendor destination log.
          For example /archive/server1/var/log/messages.0 or /var/log/.
        recommended: true
      log_provider:
        description: The logging provider or logging service that logged the event. This may
          be an intermediate application store-and-forward log or a vendor destination log.
        recommended: true
      log_version:
        description: The event log schema version of the original event. For example the syslog
          version or the Cisco Log Schema version
      logged_time:
        description: The time when this logger received and logged the event. For the last
          logger in the pipeline, this value should match <code>metadata.logged_time</code>.
        recommended: true
      logged_time_dt:
        description: The time when this logger received and logged the event. For the last
          logger in the pipeline, this value should match <code>metadata.logged_time</code>.
        annotations:
          ocsf_profiles: datetime
      name:
        description: The name of the logging product instance.
      product:
        description: The product logging the event.  This may be the event source product,
          a management server product, a scanning product, a SIEM, etc.
        recommended: true
      transmit_time:
        description: The time when the event was transmitted from the logging device to it's
          next destination.
        recommended: true
      transmit_time_dt:
        description: The time when the event was transmitted from the logging device to it's
          next destination.
        annotations:
          ocsf_profiles: datetime
      uid:
        description: The unique identifier of the logging product instance.
      untruncated_size:
        description: The original size of the OCSF event data in kilobytes before any truncation
          occurred. This field is typically populated when <code>is_truncated</code> is <code>true</code>
          to indicate the full size of the original event.
      version:
        description: The version of the logging provider.
  OcsfLongString:
    title: Long String
    description: This object is a used to capture strings which may be truncated by a security
      product due to their length.
    class_uri: ocsf:OcsfLongString
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: long_string
    slots:
      - is_truncated
      - untruncated_size
      - value
    slot_usage:
      is_truncated:
        description: Indicates that <code>value</code> has been truncated. May be omitted
          if truncation has not occurred.
      untruncated_size:
        description: The size in bytes of the string represented by <code>value</code> before
          truncation. Should be omitted if truncation has not occurred.
      value:
        description: The string value, truncated if <code>is_truncated</code> is <code>true</code>.
        required: true
  OcsfMalware:
    title: Malware
    description: The Malware object describes the classification of known malicious software,
      which is intentionally designed to cause damage to a computer, server, client, or computer
      network.
    class_uri: ocsf:OcsfMalware
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: malware
      ocsf_profiles: container data_classification
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - classification_ids
      - classifications
      - cves
      - files
      - num_infected
      - path
      - provider
      - severity
      - severity_id
    slot_usage:
      classification_ids:
        description: The list of normalized identifiers of the malware classifications.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The classification is unknown.
          - equals_number: 1
            title: Adware
          - equals_number: 2
            title: Backdoor
          - equals_number: 3
            title: Bot
          - equals_number: 4
            title: Bootkit
          - equals_number: 5
            title: DDOS
          - equals_number: 6
            title: Downloader
          - equals_number: 7
            title: Dropper
          - equals_number: 8
            title: Exploit-Kit
          - equals_number: 9
            title: Keylogger
          - equals_number: 10
            title: Ransomware
          - equals_number: 11
            title: Remote-Access-Trojan
          - equals_number: 13
            title: Resource-Exploitation
          - equals_number: 14
            title: Rogue-Security-Software
          - equals_number: 15
            title: Rootkit
          - equals_number: 16
            title: Screen-Capture
          - equals_number: 17
            title: Spyware
          - equals_number: 18
            title: Trojan
          - equals_number: 19
            title: Virus
          - equals_number: 20
            title: Webshell
          - equals_number: 21
            title: Wiper
          - equals_number: 22
            title: Worm
          - equals_number: 99
            title: Other
            description: The classification is not mapped. See the <code>classifications</code>
              attribute, which contains a data source specific value.
        see_also:
          - https://docs.oasis-open.org/cti/stix/v2.1/os/stix-v2.1-os.html#_oxlc4df65spl
        required: true
      classifications:
        description: The list of malware classifications, normalized to the captions of the
          <code>classification_ids</code> values. In the case of 'Other', they are defined
          by the event source.
      cves:
        description: The list of Common Vulnerabilities and Exposures (CVE) identifiers associated
          with the malware.
      files:
        description: The list of file objects representing files that were identified as infected
          by the malware.
      name:
        description: The malware name, as reported by the detection engine.
      num_infected:
        description: The number of files that were identified to be infected by the malware.
      path:
        description: The filesystem path of the malware that was observed.
        range: ocsf_file_path_t
        deprecated: Use the <code>files[*].path</code> attribute instead.
        recommended: true
        annotations:
          ocsf_deprecated_since: 1.5.0
          ocsf_superseded_by: files[*].path
      provider:
        description: The name or identifier of the security solution or service that provided
          the malware detection information.
        recommended: true
      severity:
        description: The severity of the malware, normalized to the captions of the <code>severity_id</code>
          values. In the case of 'Other', they are defined by the event source.
      severity_id:
        description: The normalized identifier of the malware severity.
        recommended: true
      uid:
        description: A unique identifier for the specific malware instance, as assigned by
          the detection engine (e.g., virus signature ID or IPS rule ID).
  OcsfScan:
    title: Scan
    description: The Scan object describes characteristics of a proactive scan.
    class_uri: ocsf:OcsfScan
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: scan
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - type
      - type_id
    slot_usage:
      name:
        description: 'The administrator-supplied or application-generated name of the scan.
          For example: "Home office weekly user database scan", "Scan folders for viruses",
          "Full system virus scan"'
      type:
        description: The type of scan.
      type_id:
        description: The type id of the scan.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: Manual
            description: The scan was manually initiated by the user or administrator.
          - equals_number: 2
            title: Scheduled
            description: The scan was started based on scheduler.
          - equals_number: 3
            title: Updated Content
            description: The scan was triggered by a content update.
          - equals_number: 4
            title: Quarantined Items
            description: The scan was triggered by newly quarantined items.
          - equals_number: 5
            title: Attached Media
            description: The scan was triggered by the attachment of removable media.
          - equals_number: 6
            title: User Logon
            description: The scan was started due to a user logon.
          - equals_number: 7
            title: ELAM
            description: The scan was triggered by an Early Launch Anti-Malware (ELAM) detection.
          - equals_number: 99
            title: Other
            description: The scan type id is not mapped. See the <code>type</code> attribute,
              which contains a data source specific value.
        required: true
      uid:
        title: Scan UID
        description: The application-defined unique identifier assigned to an instance of
          a scan.
  OcsfMalwareScanInfo:
    title: Malware Scan Info
