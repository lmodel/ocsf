      - criticality_id
      - device
      - group
      - hostname
      - ip
      - is_backed_up
      - modified_time_dt
      - namespace
      - owner
      - provider
      - region
      - resource_relationship
      - role
      - role_id
      - user
      - version
      - zone
    slot_usage:
      cloud_partition:
        description: The logical grouping or isolated segment within a cloud provider's infrastructure
          where the resource is located. Examples include AWS partitions (aws, aws-cn, aws-us-gov),
          Azure cloud environments (AzureCloud, AzureUSGovernment, AzureChinaCloud), or similar
          logical divisions in other cloud providers.
        annotations:
          ocsf_profiles: cloud
      created_time_dt:
        description: The time when the resource was created.
        annotations:
          ocsf_profiles: datetime
      criticality:
        description: 'Criticality or relative importance of this resource, normalized to the
          caption of <code>criticality_id</code>. In the case of Other, the value is defined
          by the event source.<p>Note: For versions prior to 1.9, <code>criticality_id</code>
          was not available and this is a source specific value.<p>'
      criticality_id:
        description: The normalized identifier for the criticality or relative importance
          of this resource. Select the value that best reflects the operational and security
          impact if the resource were compromised or made unavailable. See the <code>criticality</code>
          sibling attribute for the corresponding human-readable label.
      device:
        description: The device details when the resource type is a device — for example,
          a cloud compute instance, a laptop, or a network appliance. Provides structured
          device attributes (OS, type, hardware, agent) that the resource's scalar fields
          cannot represent — beyond what the <code>hostname</code> and <code>ip</code> attributes
          capture. The <code>device.name</code> and <code>device.uid</code> should match the
          <code>name</code> and <code>uid</code> of this objects; the <code>device.hostname</code>
          value should match the <code>hostname</code> attribute of this object. The top-level
          <code>hostname</code> and <code>ip</code> remain the primary identifiers for the
          device resource.
      group:
        description: The name of the related resource group.
      hostname:
        description: The fully qualified name of the resource. If the resource is a device,
          this should match <code>device.hostname</code>.
        recommended: true
      ip:
        description: The IP address of the resource, in either IPv4 or IPv6 format. If the
          resource is a device, this should match <code>device.ip</code>.
        recommended: true
      modified_time_dt:
        description: The time when the resource was last modified.
        annotations:
          ocsf_profiles: datetime
      name:
        annotations:
          ocsf_observable: '38'
      namespace:
        description: The namespace is useful when similar entities exist that you need to
          keep separate.
      owner:
        description: The details of the entity that owns the resource. Usually not the same
          as <code>user</code> that may not own the resource. For example the owner of the
          directory server but not a user in the directory. This object includes properties
          such as the owner's name, unique identifier, type, domain, and other relevant attributes
          that help identify the resource owner within the environment.
        recommended: true
      provider:
        title: Cloud Provider
        description: The cloud service provider that hosts or manages the resource. This field
          is typically used when the resource is managed by a different provider than the
          one generating the event or finding. Examples include AWS, Azure, GCP (Google Cloud
          Platform), Oracle Cloud, IBM Cloud, Alibaba Cloud, or other public, private, or
          hybrid cloud providers.
        annotations:
          ocsf_profiles: cloud
      region:
        description: The cloud region where the resource is hosted, as defined by the cloud
          provider. This represents the physical or logical geographic area containing the
          infrastructure supporting the resource. Examples include AWS regions (us-east-1,
          eu-west-1), Azure regions (East US, West Europe), GCP regions (us-central1, europe-west1),
          or Oracle Cloud regions (us-ashburn-1, uk-london-1).
        annotations:
          ocsf_profiles: cloud
      resource_relationship:
        description: A graph representation showing how this resource relates to and interacts
          with other entities in the environment. This can include parent/child relationships,
          dependencies, or other connections.
      role:
        description: The role of the resource in the context of the event or finding, normalized
          to the caption of the role_id value. In the case of 'Other', it is defined by the
          event source.
      role_id:
        description: The normalized identifier of the resource's role in the context of the
          event or finding.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The role is unknown.
          - equals_number: 1
            title: Target
            description: The resource is the primary target or subject of the event/finding.
          - equals_number: 2
            title: Actor
            description: The resource is acting as the initiator or performer in the context
              of the event/finding.
          - equals_number: 3
            title: Affected
            description: The resource was impacted or affected by the event/finding.
          - equals_number: 4
            title: Related
            description: The resource is related to or associated with the event/finding.
          - equals_number: 99
            title: Other
            description: The role is not mapped. See the role attribute, which contains a
              data source specific value.
        recommended: true
      uid:
        range: ocsf_resource_uid_t
      uid_alt:
        range: ocsf_resource_uid_t
      user:
        description: The user represented by this resource — for example, a cloud IAM user,
          a local account, or an application identity. Provides structured user attributes
          (email, groups, privileges) that this object's scalar fields such as <code>name</code>
          cannot represent. Distinct from <code>owner</code>, which identifies the entity
          responsible for managing the resource. The <code>user.name</code> value should match
          the <code>name</code> attribute of this object, <code>user.uid</code> should match
          the <code>uid</code> of this object.
      version:
        description: The version of the resource. For example <code>1.2.3</code>.
      zone:
        title: Cloud Availability Zone
        description: The availability zone within a cloud region where the resource is located.
          Examples include AWS availability zones (us-east-1a, us-east-1b), Azure availability
          zones (1, 2, 3 within a region), GCP zones (us-central1-a, us-central1-b), or Oracle
          Cloud availability domains (AD-1, AD-2, AD-3).
        annotations:
          ocsf_profiles: cloud
  OcsfResponse:
    title: Response Elements
    description: The Response Elements object describes characteristics of an API response.
    class_uri: ocsf:OcsfResponse
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: response
    slots:
      - code
      - containers
      - data
      - error
      - error_message
      - flags
      - message
    slot_usage:
      code:
        recommended: true
      data:
        description: The additional data that is associated with the api response.
      error:
        recommended: true
      error_message:
        recommended: true
      flags:
        description: The communication flags that are associated with the api response.
      message:
        description: The response message provided by the service or API.
        recommended: true
  OcsfRpcInterface:
    title: RPC Interface
    description: The RPC Interface represents the remote procedure call interface used in
      the DCE/RPC session.
    class_uri: ocsf:OcsfRpcInterface
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: rpc_interface
    slots:
      - ack_reason
      - ack_result
      - uuid
      - version
    slot_usage:
      ack_reason:
        recommended: true
      ack_result:
        recommended: true
      uuid:
        description: The unique identifier of the particular remote procedure or service.
        required: true
      version:
        description: The version of the DCE/RPC protocol being used in the session.
        required: true
  OcsfSan:
    title: Subject Alternative Name
    description: The Subject Alternative name (SAN) object describes a SAN secured by a digital
      certificate
    class_uri: ocsf:OcsfSan
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: san
    slots:
      - name
      - type
    slot_usage:
      name:
        description: Name of SAN (e.g. The actual IP Address or domain.)
        required: true
      type:
        description: Type descriptor of SAN (e.g. IP Address/domain/etc.)
        required: true
  OcsfSbom:
    title: Software Bill of Materials
    description: The Software Bill of Materials object describes characteristics of a generated
      SBOM.
    class_uri: ocsf:OcsfSbom
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: sbom
      ocsf_profiles: data_classification datetime
    slots:
      - created_time
      - created_time_dt
      - package
      - product
      - software_components
      - type
      - type_id
      - uid
      - version
    slot_usage:
      created_time:
        description: The time when the SBOM was created.
        recommended: true
      created_time_dt:
        description: The time when the SBOM was created.
        annotations:
          ocsf_profiles: datetime
      package:
        description: The software package or library that is being discovered or inventoried
          by an SBOM.
        required: true
      product:
        description: Details about the upstream product that generated the SBOM e.g. <code>cdxgen</code>
          or <code>Syft</code>.
        recommended: true
      software_components:
        required: true
      type:
        description: The type of SBOM, normalized to the caption of the <code>type_id</code>
          value. In the case of 'Other', it is defined by the source.
      type_id:
        description: The type of SBOM.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: SPDX
            description: System Package Data Exchange (SPDX®) is an open standard capable
              of representing systems with software components in as SBOMs (Software Bill
              of Materials) and other AI, data and security references supporting a range
              of risk management use cases. The SPDX specification is a freely available international
              open standard (ISO/IEC 5692:2021).
          - equals_number: 2
            title: CycloneDX
            description: CycloneDX is an International Standard for Bill of Materials (ECMA-424).
          - equals_number: 3
            title: SWID
            description: The International Organization for Standardization (ISO) and the
              International Electrotechnical Commission (IEC) publishes, ISO/IEC 19770-2,
              a standard for software identification (SWID) tags that defines a structured
              metadata format for describing a software product. A SWID tag document is composed
              of a structured set of data elements that identify the software product
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        see_also:
          - https://spdx.dev/
          - https://www.iso.org/standard/81870.html
          - https://cyclonedx.org/
          - https://ecma-international.org/publications-and-standards/standards/ecma-424/
          - https://nvd.nist.gov/products/swid
          - https://www.iso.org/standard/65666.html
        recommended: true
      uid:
        title: SBOM ID
        description: A unique identifier for the SBOM or the SBOM generation by a source tool,
          such as the SPDX <code>metadata.component.bom-ref</code>.
      version:
        description: The specification (spec) version of the particular SBOM, e.g., <code>1.6</code>.
  OcsfScim:
    title: SCIM
    description: The System for Cross-domain Identity Management (SCIM) Configuration object
      provides a structured set of attributes related to SCIM protocols used for identity
      provisioning and management across cloud-based platforms. It standardizes user and group
      provisioning details, enabling identity synchronization and lifecycle management with
      compatible Identity Providers (IdPs) and applications. SCIM is defined in RFC 7634.
    class_uri: ocsf:OcsfScim
    see_also:
      - https://datatracker.ietf.org/doc/html/rfc7643
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: scim
      ocsf_profiles: datetime
    slots:
      - auth_protocol
      - auth_protocol_id
      - created_time
      - created_time_dt
      - error_message
      - is_group_provisioning_enabled
      - is_user_provisioning_enabled
      - last_run_time
      - last_run_time_dt
      - modified_time
      - modified_time_dt
      - name
      - protocol_name
      - rate_limit
      - scim_group_schema
      - scim_user_schema
      - state
      - state_id
      - uid
      - uid_alt
      - url_string
      - vendor_name
      - version
    slot_usage:
      auth_protocol:
        description: The authorization protocol as defined by the caption of <code>auth_protocol_id</code>.
          In the case of <code>Other</code>, it is defined by the event source.
      auth_protocol_id:
        description: The normalized identifier of the authorization protocol used by the SCIM
          resource.
      created_time:
        description: When the SCIM resource was added to the service provider.
      created_time_dt:
        description: When the SCIM resource was added to the service provider.
        annotations:
          ocsf_profiles: datetime
      error_message:
        title: Last Error Message
        description: Message or code associated with the last encountered error.
      is_group_provisioning_enabled:
        title: SCIM Group Provisioning Enabled
        description: Indicates whether the SCIM resource is configured to provision groups,
          automatically or otherwise.
      is_user_provisioning_enabled:
        title: SCIM User Provisioning Enabled
        description: Indicates whether the SCIM resource is configured to provision users,
          automatically or otherwise.
      last_run_time:
        title: Last Sync Time
        description: Timestamp of the most recent successful synchronization.
      last_run_time_dt:
        title: Last Sync Time
        description: Timestamp of the most recent successful synchronization.
        annotations:
          ocsf_profiles: datetime
      modified_time:
        description: The most recent time when the SCIM resource was updated at the service
          provider.
      modified_time_dt:
        description: The most recent time when the SCIM resource was updated at the service
          provider.
        annotations:
          ocsf_profiles: datetime
      name:
        description: The name of the SCIM resource.
        recommended: true
      protocol_name:
        title: Supported Protocol
        description: The supported protocol for the SCIM resource. E.g., <code>SAML</code>,
          <code>OIDC</code>, or <code>OAuth2</code>.
      rate_limit:
        description: Maximum number of requests allowed by the SCIM resource within a specified
          time frame to avoid throttling.
      scim_group_schema:
        recommended: true
      scim_user_schema:
        recommended: true
      state:
        description: The provisioning state of the SCIM resource, normalized to the caption
          of the <code>state_id</code> value. In the case of <code>Other</code>, it is defined
          by the event source.
      state_id:
        description: The normalized state ID of the SCIM resource to reflect its activation
          status.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The provisioning state of the SCIM resource is unknown.
          - equals_number: 1
            title: Pending
            description: The SCIM resource is Pending activation or creation.
          - equals_number: 2
            title: Active
            description: The SCIM resource is in an Active state, or otherwise enabled.
          - equals_number: 3
            title: Failed
            description: The SCIM resource is in a Failed state.
          - equals_number: 4
            title: Deleted
            description: The SCIM resource is in a Deleted state, or otherwise disabled.
          - equals_number: 99
            title: Other
            description: The provisioning state of the SCIM resource is not mapped. See the
              <code>state</code> attribute, which contains a data source specific value.
      uid:
        description: A unique identifier for a SCIM resource as defined by the service provider.
        recommended: true
      uid_alt:
        title: External ID
        description: A String that is an identifier for the resource as defined by the provisioning
          client. The <code>externalId</code> may simplify identification of a resource between
          the provisioning client and the service provider by allowing the client to use a
          filter to locate the resource with an identifier from the provisioning domain, obviating
          the need to store a local mapping between the provisioning domain's identifier of
          the resource and the identifier used by the service provider.
      url_string:
        title: SCIM Endpoint URL
        description: The primary URL for SCIM API requests.
      vendor_name:
        title: Service Provider
        description: Name of the vendor or service provider implementing SCIM. E.g., <code>Okta</code>,
          <code>Auth0</code>, <code>Microsoft</code>.
      version:
        title: SCIM Version
        description: SCIM protocol version supported e.g., <code>SCIM 2.0</code>.
        recommended: true
  OcsfScript:
    title: Script
    description: The Script object describes a script or command that can be executed by a
      shell, script engine, or interpreter. Examples include Bash, JavsScript, PowerShell,
      Python, VBScript, etc. Note that the term <em>script</em> here denotes not only a script
      contained within a file but also a script or command typed interactively by a user,
      supplied on the command line, or provided by some other file-less mechanism.
    class_uri: ocsf:OcsfScript
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:ExecutableScript/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: script
      ocsf_profiles: container data_classification
    related_mappings:
      - d3f:ExecutableScript
    slots:
      - file
      - hashes
      - name
      - parent_uid
      - script_content
      - type
      - type_id
      - uid
    slot_usage:
      file:
        description: Present if this script is associated with a file. Not present in the
          case of a file-less script.
      hashes:
        description: An array of the script's cryptographic hashes. Note that these hashes
          are calculated on the script in its original encoding, and not on the normalized
          UTF-8 encoding found in the <code>script_content</code> attribute.
        recommended: true
      name:
        description: Unique identifier for the script or macro, independent of the containing
          file, used for tracking, auditing, and security analysis.
      parent_uid:
        description: This attribute relates a sub-script to a parent script having the matching
          <code>uid</code> attribute. In the case of PowerShell, sub-script execution can
          be identified by matching the activity correlation ID of the raw ETW events provided
          by the OS.
      script_content:
        required: true
      type:
        description: The script type, normalized to the caption of the <code>type_id</code>
          value. In the case of 'Other', it is defined by the event source.
      type_id:
        description: The normalized script type ID.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The script type is unknown.
          - equals_number: 1
            title: Windows Command Prompt
          - equals_number: 2
            title: PowerShell
          - equals_number: 3
            title: Python
          - equals_number: 4
            title: JavaScript
          - equals_number: 5
            title: VBScript
          - equals_number: 6
            title: Unix Shell
          - equals_number: 7
            title: VBA
          - equals_number: 99
            title: Other
            description: The script type is not mapped. See the <code>type</code> attribute
              which contains an event source specific value.
        required: true
      uid:
        description: Some script engines assign a unique ID to each individual execution of
          a given script. This attribute captures that unique ID. In the case of PowerShell,
          the unique ID corresponds to the <code>ScriptBlockId</code> in the raw ETW events
          provided by the OS.
  OcsfSecurityState:
    title: Security State
    description: The Security State object describes the security related state of a managed
      entity.
    class_uri: ocsf:OcsfSecurityState
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: security_state
    slots:
      - state
      - state_id
    slot_usage:
      state:
        title: Security State
        description: The security state, normalized to the caption of the state_id value.
          In the case of 'Other', it is defined by the source.
      state_id:
        title: Security State ID
        description: The security state of the managed entity.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The security state is unknown.
          - equals_number: 1
            title: Missing or outdated content
            description: The content is missing or outdated.
          - equals_number: 2
            title: Policy mismatch
            description: Not in compliance with the expected security policy.
          - equals_number: 3
            title: In network quarantine
            description: Isolated from the network.
          - equals_number: 4
            title: Protection off
            description: Not protected by a security solution.
          - equals_number: 5
            title: Protection malfunction
            description: The security solution is not functioning properly.
          - equals_number: 6
            title: Protection not licensed
            description: The security solution does not have a valid license.
          - equals_number: 7
            title: Unremediated threat
            description: A detected threat has not been remediated.
          - equals_number: 8
            title: Suspicious reputation
            description: Reputation of the entity is suspicious.
          - equals_number: 9
            title: Reboot pending
            description: A reboot is required for one or more pending actions.
          - equals_number: 10
            title: Content is locked
            description: The content is locked to a specific version.
          - equals_number: 11
            title: Not installed
            description: The entity is not installed.
          - equals_number: 12
            title: Writable system partition
            description: The system partition is writeable.
          - equals_number: 13
            title: SafetyNet failure
            description: The device has failed the SafetyNet check.
          - equals_number: 14
            title: Failed boot verify
            description: The device has failed the boot verification process.
          - equals_number: 15
            title: Modified execution environment
            description: The execution environment has been modified.
          - equals_number: 16
            title: SELinux disabled
            description: The SELinux security feature has been disabled.
          - equals_number: 17
            title: Elevated privilege shell
            description: An elevated privilege shell has been detected.
          - equals_number: 18
            title: iOS file system altered
            description: The file system has been altered on an iOS device.
          - equals_number: 19
            title: Open remote access
            description: Remote access is enabled.
          - equals_number: 20
            title: OTA updates disabled
            description: Mobile OTA (Over The Air) updates have been disabled.
          - equals_number: 21
            title: Rooted
            description: The device has been modified to allow root access.
          - equals_number: 22
            title: Android partition modified
            description: The Android partition has been modified.
          - equals_number: 23
            title: Compliance failure
            description: The entity is not compliant with the associated security policy.
          - equals_number: 99
            title: Other
            description: The security state is not mapped. See the <code>state</code> attribute,
              which contains data source specific values.
        recommended: true
  OcsfSensorInfo:
    title: Sensor Information
    description: The Sensor Information object describes a control point sensor that emits
      data, or originates detections. It can be part of an endpoint or agent running on an
      OS, a SaaS application, a network device, a Cyber Threat Intelligence (CTI) system,
      or other detection and enforcement technologies.
    class_uri: ocsf:OcsfSensorInfo
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: sensor_info
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - sensor_layer
      - sensor_layer_id
    slot_usage:
      sensor_layer:
        description: The technology or sensor layer that emitted the data, normalized to the
          caption of <code>sensor_layer_id</code>. When <code>sensor_layer_id</code> is <code>99</code>
          (Other), this attribute must contain the source-specific label.
      sensor_layer_id:
        description: The normalized identifier of the sensor layer that emitted the data.
          For example, use this to classify the detection surface (e.g., IPS sensor, endpoint
          agent, email gateway). When the type is not listed, use <code>99</code> (Other)
          and populate <code>sensor_layer</code> with the source-specific label.
        required: true
  OcsfService:
    title: Service
    description: The Service object describes characteristics of a service, <code> e.g. AWS
      EC2. </code>
    class_uri: ocsf:OcsfService
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:ServiceApplication/
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: service
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    related_mappings:
      - d3f:ServiceApplication
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - labels
      - tags
      - version
    slot_usage:
      labels:
        description: The list of labels associated with the service.
      name:
        description: The name of the service.
      tags:
        description: The list of tags; <code>{key:value}</code> pairs associated to the service.
      uid:
        description: The unique identifier of the service.
      version:
        description: The version of the service.
        recommended: true
  OcsfServicePrivilegeAnalysis:
    title: Service Privilege Analysis
    description: The Service Privilege Analysis object describes privilege analysis results
      for a single cloud service or resource namespace. It provides metrics on privilege usage,
      counts by type, and mappings to potential attack techniques.
    class_uri: ocsf:OcsfServicePrivilegeAnalysis
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: service_privilege_analysis
      ocsf_profiles: datetime
    slots:
      - all_privileges_unused
      - analyzed_privileges_count
      - execute_count
      - last_used_time
      - last_used_time_dt
      - name
      - privilege_attack_info_list
      - read_count
      - unused_privileges_count
      - write_count
    slot_usage:
      all_privileges_unused:
        description: Indicates whether all privileges within this service are unused.
      analyzed_privileges_count:
        description: The total count of privileges analyzed within this service.
      execute_count:
        title: Execute Privilege Count
        description: The count of execute-type privileges within this service.
      last_used_time:
        description: The most recent time any privilege in this service was used.
      last_used_time_dt:
