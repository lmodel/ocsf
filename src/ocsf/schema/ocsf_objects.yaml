      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          hostname:
            required: true
      - slot_conditions:
          svc_name:
            required: true
      - slot_conditions:
          instance_uid:
            required: true
      - slot_conditions:
          interface_uid:
            required: true
      - slot_conditions:
          interface_name:
            required: true
      - slot_conditions:
          domain:
            required: true
    slots:
      - autonomous_system
      - fingerprints
      - intermediate_ips
      - isp
      - isp_org
      - network_scope
      - network_scope_id
      - port
      - proxy_endpoint
      - svc_name
    slot_usage:
      fingerprints:
        description: Fingerprints that identify the specific application implementation on
          this endpoint, such as Cisco NPF or HASSH.
