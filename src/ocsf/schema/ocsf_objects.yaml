      ocsf_constraints: '{"at_least_one": ["cmd_line", "name", "path", "pid", "uid", "cpid"]}'
    any_of:
      - slot_conditions:
          cmd_line:
            required: true
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          path:
            required: true
      - slot_conditions:
          pid:
            required: true
      - slot_conditions:
          uid:
            required: true
      - slot_conditions:
          cpid:
            required: true
    slots:
      - cmd_line
      - cpid
      - created_time
      - created_time_dt
      - path
      - pid
    slot_usage:
      cmd_line:
        recommended: true
      cpid:
        recommended: true
      created_time:
        description: The time when the process was created/started.
        recommended: true
      created_time_dt:
        description: The time when the process was created/started.
        annotations:
          ocsf_profiles: datetime
      name:
        description: 'The friendly name of the process, for example: <code>Notepad++</code>.'
        range: ocsf_process_name_t
      path:
