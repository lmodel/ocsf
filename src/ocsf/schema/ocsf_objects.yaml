      created_time_dt:
        description: The time when the file was created.
        annotations:
          ocsf_profiles: datetime
      creator:
        description: The user that created the file.
      desc:
        description: 'The description of the file, as returned by file system. For example:
          the description as returned by the Unix file command or the Windows file type.'
      encryption_details:
        description: The encryption details of the file. Should be populated if the file is
          encrypted.
      ext:
        title: File Extension
        description: 'The extension of the file, excluding the leading dot. For example: <code>exe</code>
          from <code>svchost.exe</code>, or <code>gz</code> from <code>export.tar.gz</code>.'
        recommended: true
      hashes:
        recommended: true
      internal_name:
        description: The name of the file as identified within the file itself. This contrasts
          with the name by which the file is known on disk. Where available, the internal
          name is widely used by security practitioners and detection content because the
          on-disk file name is not reliable. On the Windows OS, most PE files contain a <code>VERSIONINFO</code>
          resource from which the internal name can be obtained. On macOS, binaries can optionally
          embed a copy of the application's <code>Info.plist</code> file which in turn contains
          the name of the executable.
        see_also:
          - https://learn.microsoft.com/en-us/windows/win32/menurc/versioninfo-resource
          - https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Introduction/Introduction.html
      is_deleted:
        description: Indicates if the file was deleted from the filesystem.
      is_encrypted:
        description: Indicates if the file is encrypted.
      is_public:
        description: Indicates if the file is publicly accessible. For example in an object's
          public access in AWS S3
        annotations:
          ocsf_profiles: cloud
      is_readonly:
        description: Indicates that the file cannot be modified.
      mime_type:
        description: The Multipurpose Internet Mail Extensions (MIME) type of the file, if
          applicable.
      modified_time:
        description: The time when the file was last modified.
      modified_time_dt:
        description: The time when the file was last modified.
        annotations:
          ocsf_profiles: datetime
      modifier:
        description: The user that last modified the file.
      name:
        description: 'The name of the file. For example: <code>svchost.exe</code>'
        range: ocsf_file_name_t
        required: true
        recommended: false
      path:
        description: 'The full path to the file. For example: <code>c:\windows\system32\svchost.exe</code>.'
        range: ocsf_file_path_t
        recommended: true
      product:
        description: The product that created or installed the file.
      signature:
        deprecated: Use the <code>signatures</code> attribute.
        annotations:
          ocsf_deprecated_since: 1.8.0
          ocsf_superseded_by: signatures
      storage_class:
        description: 'The storage class of the file. For example in AWS S3: <code>STANDARD,
          STANDARD_IA, GLACIER</code>.'
        annotations:
          ocsf_profiles: cloud
      tags:
        description: The list of tags; <code>{key:value}</code> pairs associated to the file.
      type:
        description: The file type.
      type_id:
        description: The file type ID. Note the distinction between a <code>Regular File</code>
          and an <code>Executable File</code>. If the distinction is not known, or not indicated
          by the log, use <code>Regular File</code>. In this case, it should not be assumed
          that a Regular File is not executable.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: Regular File
          - equals_number: 2
            title: Folder
          - equals_number: 3
            title: Character Device
          - equals_number: 4
            title: Block Device
          - equals_number: 5
            title: Local Socket
          - equals_number: 6
            title: Named Pipe
          - equals_number: 7
            title: Symbolic Link
          - equals_number: 8
            title: Executable File
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        required: true
      uid:
        description: The unique identifier of the file as defined by the storage system, such
          the file system file ID.
        recommended: false
      uri:
        title: File URI
        description: The file URI, such as those reporting by static analysis tools. E.g.,
          <code>file:///C:/dev/sarif/sarif-tutorials/samples/Introduction/simple-example.js</code>
      url:
        description: The URL of the file, when applicable.
      version:
        description: 'The file version. For example: <code>8.0.7601.17514</code>.'
      volume:
        description: The volume on the storage device where the file is located.
      xattributes:
        description: 'An unordered collection of zero or more name/value pairs where each
          pair represents a file or folder extended attribute.<p>For example: Windows alternate
          data stream attributes (ADS stream name, ADS size, etc.), user-defined or application-defined
          attributes, ACL, owner, primary group, etc. Examples from DCS: </p><ul><li><strong>ads_name</strong></li><li><strong>ads_size</strong></li><li><strong>dacl</strong></li><li><strong>owner</strong></li><li><strong>primary_group</strong></li><li><strong>link_name</strong>
          - name of the link associated to the file.</li><li><strong>hard_link_count</strong>
          - the number of links that are associated to the file.</li></ul>'
  OcsfFinding:
