  OcsfCisControl:
    title: CIS Control
    description: The CIS Control (aka Critical Security Control) object describes a prioritized
      set of actions to protect your organization and data from cyber-attack vectors. The
      CIS Controls are defined by the Center for Internet Security.
    class_uri: ocsf:OcsfCisControl
    see_also:
      - https://www.cisecurity.org/controls
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: cis_control
    slots:
      - desc
      - name
      - version
    slot_usage:
      desc:
        description: 'The CIS Control description. For example: <i>Uninstall or disable unnecessary
          services on enterprise assets and software, such as an unused file sharing service,
          web application module, or service function.</i>'
      name:
        description: 'The CIS Control name. For example: <i>4.8 Uninstall or Disable Unnecessary
          Services on Enterprise Assets and Software.</i>'
        required: true
      version:
        description: 'The CIS Control version. For example: <i>v8</i>.'
        recommended: true
  OcsfCisCsc:
    title: CIS CSC
