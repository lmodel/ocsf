    annotations:
      ocsf_key: network_connection_info
    related_mappings:
      - d3f:NetworkSession
    slots:
      - boundary
      - boundary_id
      - community_uid
      - direction
      - direction_id
      - flag_history
      - protocol_name
      - protocol_num
      - protocol_ver
      - protocol_ver_id
      - session
      - tcp_flags
      - uid
    slot_usage:
      boundary_id:
        recommended: true
      direction_id:
        required: true
      protocol_name:
        description: 'The IP protocol name in lowercase, as defined by the Internet Assigned
          Numbers Authority (IANA). For example: <code>tcp</code> or <code>udp</code>.'
        see_also:
          - https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml
        recommended: true
      protocol_num:
        recommended: true
      protocol_ver:
        title: IP Version
        description: The Internet Protocol version.
      protocol_ver_id:
        title: IP Version ID
        description: The Internet Protocol version identifier.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The protocol version is unknown.
          - equals_number: 4
            title: Internet Protocol version 4 (IPv4)
          - equals_number: 6
            title: Internet Protocol version 6 (IPv6)
          - equals_number: 99
            title: Other
            description: The protocol version is not mapped. See the <code>protocol_ver</code>
              attribute, which contains a data source specific value.
        recommended: true
      uid:
        title: Connection UID
        description: The unique identifier of the connection.
        recommended: true
  OcsfNetworkEndpoint:
