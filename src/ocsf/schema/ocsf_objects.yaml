      - data
      - type
      - type_id
    slot_usage:
      data:
        description: The data contains information specific to the particular extension type.
        recommended: true
      type:
        description: 'The TLS extension type. For example: <code>Server Name</code>.'
      type_id:
        description: The TLS extension type identifier.
        any_of:
          - equals_number: 0
            title: server_name
            description: The Server Name Indication extension.
          - equals_number: 1
            title: maximum_fragment_length
            description: The Maximum Fragment Length Negotiation extension.
          - equals_number: 5
            title: status_request
            description: The Certificate Status Request extension.
          - equals_number: 10
            title: supported_groups
            description: The Supported Groups extension.
          - equals_number: 13
            title: signature_algorithms
            description: The Signature Algorithms extension.
          - equals_number: 14
            title: use_srtp
            description: The Use SRTP data protection extension.
          - equals_number: 15
            title: heartbeat
            description: The Heartbeat extension.
          - equals_number: 16
            title: application_layer_protocol_negotiation
            description: The Application-Layer Protocol Negotiation extension.
          - equals_number: 18
            title: signed_certificate_timestamp
            description: The Signed Certificate Timestamp extension.
          - equals_number: 19
            title: client_certificate_type
            description: The Client Certificate Type extension.
          - equals_number: 20
            title: server_certificate_type
            description: The Server Certificate Type extension.
          - equals_number: 21
            title: padding
            description: The Padding extension.
          - equals_number: 41
            title: pre_shared_key
            description: The Pre Shared Key extension.
          - equals_number: 42
            title: early_data
            description: The Early Data extension.
          - equals_number: 43
            title: supported_versions
            description: The Supported Versions extension.
          - equals_number: 44
            title: cookie
            description: The Cookie extension.
          - equals_number: 45
            title: psk_key_exchange_modes
            description: The Pre-Shared Key Exchange Modes extension.
          - equals_number: 47
            title: certificate_authorities
            description: The Certificate Authorities extension.
          - equals_number: 48
            title: oid_filters
            description: The OID Filters extension.
          - equals_number: 49
            title: post_handshake_auth
            description: The Post-Handshake Client Authentication extension.
          - equals_number: 50
            title: signature_algorithms_cert
            description: The Signature Algorithms extension.
          - equals_number: 51
            title: key_share
            description: The Key Share extension.
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        see_also:
          - https://datatracker.ietf.org/doc/html/rfc8446#page-35
        required: true
  OcsfTrace:
    title: Trace
    description: The trace object contains information about a distributed trace,  which is
      crucial for observability. Traces are made up of one or more spans, which are individual
      units of work in application activity. Traces track the journey of a request as it moves
      through various services in a system, capturing key details like timing, status, and
      dependencies at each step. Traces provide insights into system performance, helping
      to identify latency, bottlenecks, and issues in complex, distributed environments.
    class_uri: ocsf:OcsfTrace
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: trace
      ocsf_profiles: datetime
    slots:
      - duration
      - end_time
      - end_time_dt
      - flags
      - service
      - span
      - start_time
      - start_time_dt
      - uid
    slot_usage:
      duration:
        description: The total time, in milliseconds, that the trace covers, calculated as
          the difference between start_time and end_time. This duration helps assess the overall
          performance of a request as it travels across various services, and is essential
          for identifying latency and potential bottlenecks within the distributed system.
          The trace duration may differ from individual span durations due to the propagation
          and processing times of the trace as it spans multiple components.
      end_time:
        description: The end timestamp of the trace, essential for identifying latency and
          performance bottlenecks. Like the start time, this timestamp is normalized across
          the trace system to ensure consistency, even when events are recorded across distributed
          services with unsynchronized clocks. Normalized time allows for accurate trace duration
          calculations and helps observability tools track overall performance across services,
          regardless of the individual system time settings.
      end_time_dt:
        description: The end timestamp of the trace, essential for identifying latency and
          performance bottlenecks. Like the start time, this timestamp is normalized across
          the trace system to ensure consistency, even when events are recorded across distributed
          services with unsynchronized clocks. Normalized time allows for accurate trace duration
          calculations and helps observability tools track overall performance across services,
          regardless of the individual system time settings.
        annotations:
          ocsf_profiles: datetime
      flags:
        description: The flags associated with the trace, used to indicate specific properties
          or behaviors, such as whether the trace is sampled or if it has special handling.
          Flags help control how traces are processed, logged, and analyzed, providing valuable
          context for tracing and observability tools in identifying trace characteristics
          or specific tracking requirements.
      service:
        description: Identifies the service or component generating the trace, helping to
          track and correlate the flow of requests through various parts of a distributed
          system. This information is essential for understanding the role and performance
          of specific services within the broader context of system operations and for diagnosing
          issues across different components.
      span:
        description: Represents a single unit of work or operation within a distributed trace.
          A span typically tracks the execution of a request across a service, capturing important
          details such as the operation, timestamps, and status. Spans help break down the
          overall trace into smaller, manageable parts, enabling detailed analysis of the
          performance and behavior of specific operations within the system. They are crucial
          for understanding latency, dependencies, and bottlenecks in complex distributed
          systems.
      start_time:
        description: The start timestamp of the trace, essential for identifying latency and
          performance bottlenecks. Like the end time, this timestamp is normalized across
          the trace system to ensure consistency, even when events are recorded across distributed
          services with unsynchronized clocks. Normalized time enables accurate trace duration
          calculations and helps observability tools track performance across services, regardless
          of the individual system time settings.
      start_time_dt:
        description: The start timestamp of the trace, essential for identifying latency and
          performance bottlenecks. Like the end time, this timestamp is normalized across
          the trace system to ensure consistency, even when events are recorded across distributed
          services with unsynchronized clocks. Normalized time enables accurate trace duration
          calculations and helps observability tools track performance across services, regardless
          of the individual system time settings.
        annotations:
          ocsf_profiles: datetime
      uid:
        description: The unique identifier of the trace used in distributed systems and microservices
          architecture to track and correlate requests across various components of an application.
        required: true
  OcsfTrait:
    title: Trait
    description: Describes a characteristic or feature of an entity that was observed. For
      example, this object can be used to represent specific characteristics derived from
      events or findings that can be surfaced as distinguishing traits of the entity in question.
    class_uri: ocsf:OcsfTrait
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: trait
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - category
      - type
      - values
    slot_usage:
      category:
        description: The high-level grouping or classification this trait belongs to.
      name:
        description: The name of the trait.
      type:
        description: The type of the trait. For example, this can be used to indicate if the
          trait acts as a contributing factor (increases risk/severity) or a mitigating factor
          (decreases risk/severity), in the context of the related finding.
      uid:
        description: The unique identifier of the trait.
      values:
        description: The values of the trait.
  OcsfTransformationInfo:
    title: Transformation Info
    description: The transformation_info object represents the mapping or transformation used.
    class_uri: ocsf:OcsfTransformationInfo
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: transformation_info
      ocsf_profiles: data_classification datetime
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - lang
      - product
      - time
      - time_dt
      - url_string
    slot_usage:
      lang:
        description: The transformation language used to transform the data.
      name:
        description: The name of the transformation or mapping.
      product:
        description: The product or instance used to make the transformation
      time:
        description: Time of the transformation.
        recommended: true
      time_dt:
        description: Time of the transformation.
        annotations:
          ocsf_profiles: datetime
      uid:
        description: The unique identifier of the mapping or transformation.
        recommended: false
      url_string:
        description: The Uniform Resource Locator String where the mapping or transformation
          exists.
        recommended: true
  OcsfTsig:
    title: TSIG
    description: The TSIG (Transaction Signature) object represents a TSIG resource record
      as defined in RFC 2845. TSIG uses a shared secret key and one-way hash function to authenticate
      DNS messages. Per RFC 2845, at most one TSIG record is permitted per DNS message.
    class_uri: ocsf:OcsfTsig
    see_also:
      - https://www.rfc-editor.org/rfc/rfc2845
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: tsig
      ocsf_constraints: '{"at_least_one": ["algorithm", "key_name", "error_id"]}'
    any_of:
      - slot_conditions:
          algorithm:
            required: true
      - slot_conditions:
          key_name:
            required: true
      - slot_conditions:
          error_id:
            required: true
    slots:
      - algorithm
      - error
      - error_id
      - key_name
    slot_usage:
      algorithm:
        description: 'The HMAC algorithm used to compute the MAC. For example: <code>hmac-sha256</code>.'
        recommended: true
      error:
        title: TSIG Error
        description: The TSIG error, normalized to the caption of the <code>error_id</code>
          value. In the case of 'Other', it is defined by the event source.
      error_id:
        title: TSIG Error ID
        description: The normalized TSIG-specific error code as defined in RFC 2845 and RFC
          6895. This is independent of the DNS message header RCODE.
        any_of:
          - equals_number: 0
            title: NoError
            description: No error.
          - equals_number: 16
            title: BADSIG
            description: TSIG signature failure.
          - equals_number: 17
            title: BADKEY
            description: Key not recognized.
          - equals_number: 18
            title: BADTIME
            description: Signature out of time window.
          - equals_number: 99
            title: Other
            description: The TSIG error code is not listed. See the <code>error</code> attribute,
              which contains a data source specific value.
        recommended: true
      key_name:
        description: 'The name of the shared secret key used to sign the DNS message. For
          example: <code>my-tsig-key.example.com.</code>'
        recommended: true
  OcsfUnmannedAerialSystem:
    title: Unmanned Aerial System
    description: 'The Unmanned Aerial System object describes the characteristics, Position
      Location Information (PLI), and other metadata of Unmanned Aerial Systems (UAS) and
      other unmanned and drone systems used in Remote ID. Remote ID is defined in the Standard
      Specification for Remote ID and Tracking (ASTM Designation: F3411-22a).'
    class_uri: ocsf:OcsfUnmannedAerialSystem
    see_also:
      - https://store.astm.org/f3411-22a.html
    is_a: OcsfAircraft
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: unmanned_aerial_system
      ocsf_constraints: '{"at_least_one": ["name", "serial_number", "uid", "uid_alt"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          serial_number:
            required: true
      - slot_conditions:
          uid:
            required: true
      - slot_conditions:
          uid_alt:
            required: true
    slots:
      - hw_info
      - type
      - type_id
      - uuid
    slot_usage:
      hw_info:
        title: UAS Hardware Information
      location:
        title: UAS Position Location Information
      name:
        description: The name of the unmanned system as reported by tracking or sensing hardware.
        recommended: false
      serial_number:
        description: The serial number of the unmanned system. This is expressed in <code>CTA-2063-A</code>
          format.
        recommended: true
      type:
        description: The type of the UAS. For example, Helicopter, Gyroplane, Rocket, etc.
      type_id:
        description: The UAS type identifier.
        any_of:
          - equals_number: 0
            title: Unknown/Undeclared
            description: The UAS type is empty or not declared.
          - equals_number: 1
            title: Airplane
          - equals_number: 2
            title: Helicopter
            description: Can also be a Multi-rotor Unmanned Aircraft (e.g., Quad-copter).
          - equals_number: 3
            title: Gyroplane
          - equals_number: 4
            title: Hybrid Lift
            description: Fixed wing aircraft that can take off vertically.
          - equals_number: 5
            title: Ornithopter
          - equals_number: 6
            title: Glider
          - equals_number: 7
            title: Kite
          - equals_number: 8
            title: Free Balloon
          - equals_number: 9
            title: Captive Balloon
          - equals_number: 10
            title: Airship
            description: E.g., a blimp.
          - equals_number: 11
            title: Free Fall/Parachute
            description: Parachutes, or objects without any power or propulsion mechanism.
          - equals_number: 12
            title: Rocket
          - equals_number: 13
            title: Tethered Powered Aircraft
          - equals_number: 14
            title: Ground Obstacle
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        recommended: true
      uid:
        title: UAS ID
        description: The primary identification identifier for an unmanned system. This can
          be a Serial Number (in <code>CTA-2063-A</code> format, the Registration ID (provided
          by the <code>CAA</code>, a UTM, or a unique Session ID.
      uid_alt:
        title: UAS Alternate ID
        description: A secondary identification identifier for an unmanned system. This can
          be a Serial Number (in <code>CTA-2063-A</code> format, the Registration ID (provided
          by the <code>CAA</code>, a UTM, or a unique Session ID.
        recommended: true
      uuid:
        title: UTM UUID
        description: The Unmanned Aircraft System Traffic Management (UTM) provided universal
          unique ID (UUID) traceable to a non-obfuscated ID where this UTM UUID acts as a
          'session id' to protect exposure of operationally sensitive information.
        recommended: true
  OcsfUnmannedSystemOperatingArea:
    title: Unmanned System Operating Area
    description: The Unmanned System Operating Area object describes details about a precise
      area of operations for a UAS flight or mission.
    class_uri: ocsf:OcsfUnmannedSystemOperatingArea
    is_a: OcsfLocation
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: unmanned_system_operating_area
      ocsf_profiles: datetime
      ocsf_constraints: '{"at_least_one": ["city", "country", "postal_code", "region"]}'
      ocsf_observable: '26'
    any_of:
      - slot_conditions:
          city:
            required: true
      - slot_conditions:
          country:
            required: true
      - slot_conditions:
          postal_code:
            required: true
      - slot_conditions:
          region:
            required: true
    slots:
      - altitude_ceiling
      - altitude_floor
      - count
      - end_time
      - end_time_dt
      - locations
      - radius
      - start_time
      - start_time_dt
      - type
      - type_id
    slot_usage:
      count:
        description: Indicates the number of UAS in the operating area.
        recommended: true
      end_time:
        description: The date and time at which a group or an Intent-Based Network Participant
          operation ends. (This field is only applicable to Network Remote ID.)
      end_time_dt:
        description: The date and time at which a group or an Intent-Based Network Participant
          operation ends. (This field is only applicable to Network Remote ID.)
        annotations:
          ocsf_profiles: datetime
      locations:
        title: Operating Polygon
        description: A list of Position Location Information (PLI) (latitude/longitude pairs)
          defining the area where a group or Intent-Based Network Participant operation is
          taking place. (This field is only applicable to Network Remote ID.)
        recommended: true
      radius:
        title: Operating Area Radius
      start_time:
        description: The date and time at which a group or an Intent-Based Network Participant
          operation starts. (This field is only applicable to Network Remote ID.)
      start_time_dt:
        description: The date and time at which a group or an Intent-Based Network Participant
          operation starts. (This field is only applicable to Network Remote ID.)
        annotations:
          ocsf_profiles: datetime
      type:
        description: The type of operating area. For example, <code>Takeoff Location</code>,
          <code>Fixed Location</code>, <code>Dynamic Location</code>.
      type_id:
        description: The operating area type identifier.
        any_of:
          - equals_number: 0
            title: Unknown/Undeclared
            description: The UA type is empty or not declared.
          - equals_number: 1
            title: Takeoff Location
          - equals_number: 2
            title: Fixed Location
          - equals_number: 3
            title: Dynamic Location
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        recommended: true
  OcsfUrl:
    title: Uniform Resource Locator
    description: The Uniform Resource Locator (URL) object describes the characteristics of
      a URL.
    class_uri: ocsf:OcsfUrl
    see_also:
      - https://datatracker.ietf.org/doc/html/rfc1738
      - https://d3fend.mitre.org/dao/artifact/d3f:URL/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: url
      ocsf_constraints: '{"at_least_one": ["url_string", "path"]}'
      ocsf_observable: '23'
    related_mappings:
      - d3f:URL
    any_of:
      - slot_conditions:
          url_string:
            required: true
      - slot_conditions:
          path:
            required: true
    slots:
      - categories
      - category_ids
      - domain
      - hostname
      - path
      - port
      - query_string
      - resource_type
      - scheme
      - subdomain
      - url_string
    slot_usage:
      category_ids:
        recommended: true
      domain:
        description: 'The domain portion of the URL. For example: <code>example.com</code>
          in <code>https://sub.example.com</code>.'
      hostname:
        description: 'The URL host as extracted from the URL. For example: <code>www.example.com</code>
          from <code>www.example.com/download/trouble</code>.'
        recommended: true
      path:
        description: 'The URL path as extracted from the URL. For example: <code>/download/trouble</code>
          from <code>www.example.com/download/trouble</code>.'
        recommended: true
      port:
        description: 'The URL port. For example: <code>80</code>.'
        recommended: true
      query_string:
        recommended: true
      resource_type:
        description: The context in which a resource was retrieved in a web request.
      scheme:
        recommended: true
      url_string:
        description: 'The URL string. See RFC 1738. For example: <code>http://www.example.com/download/trouble.exe</code>.
          Note: The URL path should not populate the URL string.'
        recommended: true
  OcsfUser:
    title: User
    description: The User object describes the characteristics of a user/person or a security
      principal.
    class_uri: ocsf:OcsfUser
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:UserAccount/
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: user
      ocsf_constraints: '{"at_least_one": ["account", "name", "uid"]}'
      ocsf_observable: '21'
    related_mappings:
      - d3f:UserAccount
    any_of:
      - slot_conditions:
          account:
            required: true
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - account
      - credential_uid
      - display_name
      - domain
      - email_addr
      - forward_addr
      - full_name
      - groups
      - has_mfa
      - ldap_person
      - org
      - phone_number
      - programmatic_credentials
      - risk_level
      - risk_level_id
      - risk_score
      - type
      - type_id
      - uid_alt
    slot_usage:
      account:
        description: The user's account or the account associated with the user.
      credential_uid:
        deprecated: Use <code>programmatic_credentials</code> instead.
        annotations:
          ocsf_observable: '19'
          ocsf_deprecated_since: 1.6.0
          ocsf_superseded_by: programmatic_credentials
      display_name:
        description: The display name of the user, as reported by the product.
      domain:
        description: 'The domain where the user is defined. For example: the LDAP or Active
          Directory domain.'
      full_name:
        description: The full name of the user, as reported by the product.
      groups:
        description: The administrative groups to which the user belongs.
      has_mfa:
        recommended: true
      name:
        description: The username. For example, <code>janedoe1</code>.
        range: ocsf_username_t
      org:
        description: Organization and org unit related to the user.
      phone_number:
        title: Telephone Number
        description: The telephone number of the user.
      programmatic_credentials:
        description: Details about the programmatic credential (API keys, access tokens, certificates,
          etc) associated to the user.
      type:
        description: The type of the user. For example, System, AWS IAM User, etc.
      type_id:
        description: The account type identifier.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: User
            description: Regular user account.
          - equals_number: 2
            title: Admin
            description: Admin/root user account.
          - equals_number: 3
            title: System
            description: System account. For example, Windows computer accounts with a trailing
              dollar sign ($).
          - equals_number: 4
            title: Service
            description: Service account. For example, Windows service account.
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        recommended: true
      uid:
        description: The unique user identifier. For example, the Windows user SID, ActiveDirectory
          DN or AWS user ARN.
        annotations:
          ocsf_observable: '31'
      uid_alt:
        description: The alternate user identifier. For example, the Active Directory user
          GUID or AWS user Principal ID.
  OcsfVendorAttributes:
    title: Vendor Attributes
    description: The Vendor Attributes object can be used to represent values of attributes
      populated by the Vendor/Finding Provider. It can help distinguish between the vendor-provided
      values and consumer-updated values, of key attributes like <code>severity_id</code>.<br>The
      original finding producer should not populate this object. It should be populated by
      consuming systems that support data mutability.
    class_uri: ocsf:OcsfVendorAttributes
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: vendor_attributes
    slots:
      - severity
      - severity_id
    slot_usage:
      severity:
        description: The finding severity, as reported by the Vendor (Finding Provider). The
          value should be normalized to the caption of the <code>severity_id</code> value.
          In the case of 'Other', it is defined by the source.
      severity_id:
        description: The finding severity ID, as reported by the Vendor (Finding Provider).
  OcsfVulnerability:
    title: Vulnerability Details
    description: The vulnerability is an unintended characteristic of a computing component
      or system configuration that multiplies the risk of an adverse event or a loss occurring
      either due to accidental exposure, deliberate attack, or conflict with new system components.
    class_uri: ocsf:OcsfVulnerability
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: vulnerability
      ocsf_profiles: container data_classification datetime
      ocsf_constraints: '{"just_one": ["advisory", "cve", "cwe"]}'
    exactly_one_of:
      - slot_conditions:
          advisory:
            required: true
      - slot_conditions:
          cve:
            required: true
      - slot_conditions:
          cwe:
            required: true
    slots:
      - advisory
      - affected_code
      - affected_packages
      - category
      - cve
      - cwe
      - dependency_chain
      - desc
      - exploit_last_seen_time
      - exploit_last_seen_time_dt
      - exploit_ref_url
      - exploit_requirement
      - exploit_type
      - first_seen_time
      - first_seen_time_dt
      - fix_available
      - fix_coverage
      - fix_coverage_id
      - is_exploit_available
      - is_fix_available
      - kb_article_list
      - kb_articles
      - last_seen_time
      - last_seen_time_dt
      - packages
      - references
      - related_vulnerabilities
      - remediation
      - severity
      - title
      - vendor_name
    slot_usage:
      category:
        description: The category of a vulnerability or weakness, as reported by the source
          tool, such as <code>Container Security</code> or <code>Open Source Security</code>.
      cve:
        description: Describes the Common Vulnerabilities and Exposures (CVE) details related
          to the vulnerability.
        recommended: true
      cwe:
        description: Describes the Common Weakness Enumeration (CWE) details related to the
          vulnerability.
        recommended: true
      desc:
        description: The description of the vulnerability.
      exploit_last_seen_time_dt:
        annotations:
          ocsf_profiles: datetime
      first_seen_time:
        description: The time when the vulnerability was first observed.
      first_seen_time_dt:
        description: The time when the vulnerability was first observed.
        annotations:
          ocsf_profiles: datetime
      fix_coverage:
        description: The fix coverage, normalized to the caption of the <code>fix_coverage_id</code>
          value.
      fix_coverage_id:
        description: The normalized identifier for fix coverage, applicable to this vulnerability.
          Typically useful, when there are multiple affected packages but only a subset have
          available fixes.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The fix coverage is unknown.
          - equals_number: 1
            title: Complete
            description: All affected packages and components have available fixes or patches
              to remediate the vulnerability.
          - equals_number: 2
            title: Partial
            description: Only some of the affected packages and components have available
              fixes or patches, while others remain vulnerable.
          - equals_number: 3
            title: None
            description: No fixes or patches are currently available for any of the affected
              packages and components.
          - equals_number: 99
            title: Other
            description: The fix coverage is not mapped. See the <code>fix_coverage</code>
              attribute, which contains a data source specific value.
      kb_article_list:
        deprecated: Use <code>advisory</code> attribute instead.
        annotations:
          ocsf_deprecated_since: 1.4.0
          ocsf_superseded_by: advisory
      last_seen_time:
        description: The time when the vulnerability was most recently observed.
      last_seen_time_dt:
        description: The time when the vulnerability was most recently observed.
        annotations:
          ocsf_profiles: datetime
      references:
        description: A list of reference URLs with additional information about the vulnerability.
        recommended: true
      remediation:
        description: The remediation recommendations on how to mitigate the identified vulnerability.
      severity:
        description: The vendor assigned severity of the vulnerability.
      title:
        description: A title or a brief phrase summarizing the discovered vulnerability.
      vendor_name:
        description: The name of the vendor that identified the vulnerability.
    related_mappings:
      - stix:StixVulnerability
