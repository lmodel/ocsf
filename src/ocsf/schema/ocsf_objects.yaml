      a malware scanning job.
    class_uri: ocsf:OcsfMalwareScanInfo
    is_a: OcsfScan
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: malware_scan_info
      ocsf_profiles: datetime
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - end_time
      - end_time_dt
      - num_files
      - num_infected
      - num_volumes
      - size
      - start_time
      - start_time_dt
      - unique_malware_count
    slot_usage:
      end_time:
        description: The timestamp indicating when the scan job completed execution.
      end_time_dt:
        description: The timestamp indicating when the scan job completed execution.
        annotations:
          ocsf_profiles: datetime
      num_files:
        description: The total number of files analyzed during the scan.
      num_infected:
        description: The total number of files identified as infected with malware during
          the scan.
      num_volumes:
