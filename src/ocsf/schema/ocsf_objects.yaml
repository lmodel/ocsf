  OcsfSpan:
    title: Span
    description: Represents a single unit of work or operation within a distributed trace.
      A span typically tracks the execution of a request across a service, capturing important
      details such as the operation, timestamps, and status. Spans help break down the overall
      trace into smaller, manageable parts, enabling detailed analysis of the performance
      and behavior of specific operations within the system. They are crucial for understanding
      latency, dependencies, and bottlenecks in complex distributed systems.
    class_uri: ocsf:OcsfSpan
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: span
      ocsf_profiles: datetime
    slots:
      - duration
      - end_time
      - end_time_dt
      - message
      - operation
      - parent_uid
      - service
      - start_time
      - start_time_dt
      - status_code
      - uid
    slot_usage:
      duration:
        description: The total time, in milliseconds, that the span represents, calculated
          as the difference between start_time and end_time. It reflects the operation's performance
          and latency, independent of event timestamps, and accounts for normalized times
          used by observability tools to ensure consistency across distributed systems.
      end_time:
        description: The end timestamp of the span, essential for identifying latency and
          performance bottlenecks. Like the start time, this timestamp is normalized across
          the observability system to ensure consistency, even when events are recorded across
          distributed services with unsynchronized clocks. Normalized time allows for accurate
          duration calculations and helps observability tools track performance across services,
          regardless of the individual system time settings.
        required: true
      end_time_dt:
        description: The end timestamp of the span, essential for identifying latency and
          performance bottlenecks. Like the start time, this timestamp is normalized across
          the observability system to ensure consistency, even when events are recorded across
          distributed services with unsynchronized clocks. Normalized time allows for accurate
          duration calculations and helps observability tools track performance across services,
          regardless of the individual system time settings.
        annotations:
          ocsf_profiles: datetime
      message:
        description: The message in a span (often referred to as a span event) serves as a
          way to record significant moments or occurrences during the span's lifecycle. This
          content typically manifests as log entries, annotations, or semi-structured events
          as a string, providing additional granularity and context about what happens at
          specific points during the execution of an operation.
      operation:
        description: Describes an action performed in a span, such as API requests, database
          queries, or computations.
      parent_uid:
        description: The ID of the parent span for this span object, establishing its relationship
          in the trace hierarchy.
      service:
        description: Identifies the service or component that generates the span, helping
          trace its path through the distributed system.
      start_time:
        description: The start timestamp of the span, essential for identifying latency and
          performance bottlenecks. This timestamp is normalized across the observability system,
          ensuring consistency even when events occur across distributed services with potentially
          unsynchronized clocks. By using normalized time, observability tools can provide
          accurate, uniform measurements of operation performance and latency, regardless
          of where or when the events actually occur.
        required: true
      start_time_dt:
        description: The start timestamp of the span, essential for identifying latency and
          performance bottlenecks. This timestamp is normalized across the observability system,
          ensuring consistency even when events occur across distributed services with potentially
          unsynchronized clocks. By using normalized time, observability tools can provide
          accurate, uniform measurements of operation performance and latency, regardless
          of where or when the events actually occur.
        annotations:
          ocsf_profiles: datetime
      status_code:
        description: Indicates the outcome of the operation in the span, such as success,
          failure, or error. Issues in a span typically refer to problems such as failed operations,
          timeouts, service unavailability, or errors in processing that can negatively impact
          the performance or reliability of the system. Tracking the `status_code` helps pinpoint
          these issues, enabling quicker identification and resolution of system inefficiencies
          or faults.
      uid:
        description: The unique identifier for the span, used in distributed systems and microservices
          architectures to track and correlate requests across different components of an
          application. It enables tracing the flow of a request through various services.
        required: true
  OcsfSso:
    title: SSO
    description: The Single Sign-On (SSO) object provides a structure for normalizing SSO
      attributes, configuration, and/or settings from Identity Providers.
    class_uri: ocsf:OcsfSso
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: sso
      ocsf_profiles: datetime
    slots:
      - auth_protocol
      - auth_protocol_id
      - certificate
      - created_time
      - created_time_dt
      - duration_mins
      - idle_timeout
      - login_endpoint
      - logout_endpoint
      - metadata_endpoint
      - modified_time
      - modified_time_dt
      - name
      - protocol_name
      - scopes
      - uid
      - vendor_name
    slot_usage:
      auth_protocol:
        description: The authorization protocol as defined by the caption of <code>auth_protocol_id</code>.
          In the case of <code>Other</code>, it is defined by the event source.
      auth_protocol_id:
        description: The normalized identifier of the authentication protocol used by the
          SSO resource.
      certificate:
        title: SAML Certificate
        description: Digital Signature associated with the SSO resource, e.g., SAML X.509
          certificate details.
        recommended: true
      created_time:
        description: When the SSO resource was created.
      created_time_dt:
        description: When the SSO resource was created.
        annotations:
          ocsf_profiles: datetime
      duration_mins:
        title: SSO Session Duration
        description: The duration (in minutes) for an SSO session, after which re-authentication
          is required.
      idle_timeout:
        description: Duration (in minutes) of allowed inactivity before Single Sign-On (SSO)
          session expiration.
      login_endpoint:
        title: SSO Login Endpoint
        description: URL for initiating an SSO login request.
      logout_endpoint:
        title: SSO Logout Endpoint
        description: URL for initiating an SSO logout request, allowing sessions to be terminated
          across applications.
      metadata_endpoint:
        title: SSO Metadata Endpoint
        description: URL where metadata about the SSO configuration is available (e.g., for
          SAML configurations).
      modified_time:
        description: The most recent time when the SSO resource was updated.
      modified_time_dt:
        description: The most recent time when the SSO resource was updated.
        annotations:
          ocsf_profiles: datetime
      name:
        description: The name of the SSO resource.
        recommended: true
      protocol_name:
        title: Supported Protocol
        description: The supported protocol for the SSO resource. E.g., <code>SAML</code>
          or <code>OIDC</code>.
      uid:
        description: A unique identifier for a SSO resource.
        recommended: true
      vendor_name:
        title: Service Provider
        description: Name of the vendor or service provider implementing SSO. E.g., <code>Okta</code>,
          <code>Auth0</code>, <code>Microsoft</code>.
  OcsfStartupItem:
    title: Startup Item
    description: The startup item object describes an application component that has associated
      startup criteria and configurations.
    class_uri: ocsf:OcsfStartupItem
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: startup_item
      ocsf_profiles: container data_classification linux/linux_users macos/macos_users
      ocsf_constraints: '{"just_one": ["driver", "job", "process", "win_service"]}'
    exactly_one_of:
      - slot_conditions:
          driver:
            required: true
      - slot_conditions:
          job:
            required: true
      - slot_conditions:
          process:
            required: true
      - slot_conditions:
          win_service:
            required: true
    slots:
      - driver
      - job
      - name
      - process
      - run_mode_ids
      - run_modes
      - run_state
      - run_state_id
      - start_type
      - start_type_id
      - type
      - type_id
      - win_service
    slot_usage:
      driver:
        description: The startup item kernel driver resource.
      job:
        description: The startup item job resource.
      name:
        description: The unique name of the startup item.
        required: true
      process:
        description: The startup item process resource.
      run_mode_ids:
        description: The list of normalized identifiers that describe the startup items' properties
          when it is running.  Use this field to capture extended information about the process,
          which may depend on the type of startup item.  E.g., A Windows service that interacts
          with the desktop.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The run mode is unknown.
          - equals_number: 1
            title: Interactive
            description: The startup item interacts with the desktop.
          - equals_number: 2
            title: Own Process
            description: The startup item runs in its own process.
          - equals_number: 3
            title: Shared Process
            description: The startup item runs in a shared process.
          - equals_number: 99
            title: Other
            description: The run mode is not mapped. See the <code>run_modes</code> attribute,
              which contains data source specific values.
      run_modes:
        description: The list of run_modes, normalized to the captions of the run_mode_id
          values.  In the case of 'Other', they are defined by the event source.
      run_state:
        description: The run state of the startup item.
      run_state_id:
        description: The run state ID of the startup item.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The run state is unknown.
          - equals_number: 1
            title: Stopped
            description: The service is not running.
          - equals_number: 2
            title: Start Pending
            description: The service is starting.
          - equals_number: 3
            title: Stop Pending
            description: The service is stopping.
          - equals_number: 4
            title: Running
            description: The service is running.
          - equals_number: 5
            title: Continue Pending
            description: The service is pending continue.
          - equals_number: 6
            title: Pause Pending
            description: The service is pending pause.
          - equals_number: 7
            title: Paused
            description: The service is paused.
          - equals_number: 8
            title: Restart Pending
            description: The service is pending restart.
          - equals_number: 99
            title: Other
            description: The run state is not mapped. See the <code>run_state</code> attribute,
              which contains a data source specific value.
        recommended: true
      start_type:
        description: The start type of the startup item.
      start_type_id:
        description: The start type ID of the startup item.
        required: true
      type:
        description: The startup item type.
      type_id:
        description: The startup item type identifier.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: Kernel Mode Driver
            description: Kernel mode driver.
          - equals_number: 2
            title: User Mode Driver
            description: User mode driver.
          - equals_number: 3
            title: Service
            description: A background process typically managed by the operating system, e.g.,
              a service process on Windows or a systemd-managed daemon on Linux.
          - equals_number: 4
            title: User Mode Application
            description: An application that runs in the user space.
          - equals_number: 5
            title: Autoload
            description: The macOS Autoload Application.
          - equals_number: 6
            title: System Extension
            description: System extensions on macOS enables 3rd parties to extend the capabilities
              of macOS.
          - equals_number: 7
            title: Kernel Extension
            description: Kernel extensions on macOS includes Apple provided pre-installs and
              3rd party installs which enables support for specific hardware or software features
              not natively supported by macOS.
          - equals_number: 8
            title: Scheduled Job, Task
            description: A job or task that runs on a configured schedule.
          - equals_number: 99
            title: Other
            description: The startup item type is not mapped. See the <code>type</code> attribute,
              which contains data source specific values.
        recommended: true
      win_service:
        description: The startup item Windows service resource.
  OcsfSubTechnique:
