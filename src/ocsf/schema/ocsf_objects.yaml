            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
      uid:
        description: Unique identifier of the ticket.
        recommended: true
  OcsfTimespan:
    title: Time Span
    description: The Time Span object represents different time period durations. If a timespan
      is fractional, i.e. crosses one period, e.g. a week and 3 days, more than one may be
      populated since each member is of integral type. In that case <code>type_id</code> if
      present should be set to <code>Other.</code><P>A timespan may also be defined by its
      time interval boundaries, <code>start_time</code> and <code>end_time</code>.
    class_uri: ocsf:OcsfTimespan
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: timespan
      ocsf_profiles: datetime
      ocsf_constraints: '{"at_least_one": ["duration", "duration_days", "duration_hours",
        "duration_mins", "duration_months", "duration_secs", "duration_weeks", "duration_years",
        "end_time", "start_time"]}'
    any_of:
      - slot_conditions:
          duration:
            required: true
      - slot_conditions:
          duration_days:
            required: true
      - slot_conditions:
          duration_hours:
            required: true
      - slot_conditions:
          duration_mins:
            required: true
      - slot_conditions:
          duration_months:
            required: true
      - slot_conditions:
          duration_secs:
            required: true
      - slot_conditions:
          duration_weeks:
            required: true
      - slot_conditions:
          duration_years:
            required: true
      - slot_conditions:
          end_time:
            required: true
      - slot_conditions:
          start_time:
            required: true
    slots:
      - duration
      - duration_days
      - duration_hours
      - duration_mins
      - duration_months
      - duration_secs
      - duration_weeks
      - duration_years
      - end_time
      - end_time_dt
      - start_time
      - start_time_dt
      - type
      - type_id
    slot_usage:
      duration:
        description: The duration of the time span in milliseconds.
        recommended: true
      duration_days:
        description: The duration of the time span in days.
        recommended: true
      duration_hours:
        description: The duration of the time span in hours.
        recommended: true
      duration_mins:
        description: The duration of the time span in minutes.
        recommended: true
      duration_months:
        description: The duration of the time span in months.
        recommended: true
      duration_secs:
        description: The duration of the time span in seconds.
        recommended: true
      duration_weeks:
        description: The duration of the time span in weeks.
        recommended: true
      duration_years:
        description: The duration of the time span in years.
        recommended: true
      end_time:
        description: The end time or conclusion of the timespan's interval.
        recommended: true
      end_time_dt:
        description: The end time or conclusion of the timespan's interval.
        annotations:
          ocsf_profiles: datetime
      start_time:
        description: The start time or beginning of the timespan's interval.
        recommended: true
      start_time_dt:
        description: The start time or beginning of the timespan's interval.
        annotations:
          ocsf_profiles: datetime
      type:
        title: Time Span Type
        description: The type of time span duration the object represents.
      type_id:
        title: Time Span Type ID
        description: The normalized identifier for the time span duration type.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: Milliseconds
          - equals_number: 2
            title: Seconds
          - equals_number: 3
            title: Minutes
          - equals_number: 4
            title: Hours
          - equals_number: 5
            title: Days
          - equals_number: 6
            title: Weeks
          - equals_number: 7
            title: Months
          - equals_number: 8
            title: Years
          - equals_number: 9
            title: Time Interval
            description: The <code>start_time</code> and <code>end_time</code> should be set.
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        recommended: true
  OcsfTls:
    title: Transport Layer Security (TLS)
    description: The Transport Layer Security (TLS) object describes the negotiated TLS protocol
      used for secure communications over an establish network connection.
    class_uri: ocsf:OcsfTls
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: tls
    slots:
      - alert
      - certificate
      - certificate_chain
      - cipher
      - client_ciphers
      - extension_list
      - handshake_dur
      - ja3_hash
      - ja3s_hash
      - key_length
      - sans
      - server_ciphers
      - sni
      - tls_extension_list
      - version
    slot_usage:
      certificate:
        recommended: true
      certificate_chain:
        recommended: true
      cipher:
        recommended: true
      client_ciphers:
        recommended: true
      ja3_hash:
        recommended: true
      ja3s_hash:
        recommended: true
      sans:
        deprecated: Use <code>tls.certificate.sans</code> attribute instead.
        annotations:
          ocsf_deprecated_since: 1.4.0
          ocsf_superseded_by: tls.certificate.sans
      sni:
        recommended: true
      version:
        description: The TLS protocol version.
        required: true
  OcsfTlsExtension:
    title: TLS Extension
    description: The TLS Extension object describes additional attributes that extend the
      base Transport Layer Security (TLS) object.
    class_uri: ocsf:OcsfTlsExtension
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
