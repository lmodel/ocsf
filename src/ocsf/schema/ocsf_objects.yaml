  OcsfEvidences:
    title: Evidence Artifacts
    description: A collection of evidence artifacts associated to the activity/activities
      that triggered a security detection.
    class_uri: ocsf:OcsfEvidences
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: evidences
      ocsf_profiles: cloud container data_classification linux/linux_users macos/macos_users
      ocsf_constraints: '{"at_least_one": ["actor", "api", "connection_info", "data", "database",
        "databucket", "device", "dst_endpoint", "email", "file", "process", "query", "src_endpoint",
        "url", "user", "job", "script", "reg_key", "reg_value", "win_service"]}'
    any_of:
      - slot_conditions:
          actor:
            required: true
      - slot_conditions:
          api:
            required: true
      - slot_conditions:
          connection_info:
            required: true
      - slot_conditions:
          data:
            required: true
      - slot_conditions:
          database:
            required: true
      - slot_conditions:
          databucket:
            required: true
      - slot_conditions:
          device:
            required: true
      - slot_conditions:
          dst_endpoint:
            required: true
      - slot_conditions:
          email:
            required: true
      - slot_conditions:
          file:
            required: true
      - slot_conditions:
          process:
            required: true
      - slot_conditions:
          query:
            required: true
      - slot_conditions:
          src_endpoint:
            required: true
      - slot_conditions:
          url:
            required: true
      - slot_conditions:
          user:
            required: true
      - slot_conditions:
          job:
            required: true
      - slot_conditions:
          script:
            required: true
      - slot_conditions:
          reg_key:
            required: true
      - slot_conditions:
          reg_value:
            required: true
      - slot_conditions:
          win_service:
            required: true
    slots:
      - actor
      - ai_agent
      - api
      - connection_info
      - container
      - data
      - database
      - databucket
      - device
      - dst_endpoint
      - email
      - file
      - http_request
      - http_response
      - ja4_fingerprint_list
      - job
      - process
      - query
      - reg_key
      - reg_value
      - resources
      - script
      - src_endpoint
      - tls
      - url
      - user
      - verdict
      - verdict_id
      - win_service
    slot_usage:
      actor:
        description: Describes details about the user/role/process that was the source of
          the activity that triggered the detection.
        recommended: true
      ai_agent:
        description: Describes details about an AI agent associated with the activity that
          triggered the detection, whether the agent performed the activity, was its target,
          or was otherwise involved. Use a separate <code>evidences</code> entry per agent
          when a finding involves more than one, such as an agent spawning a sub-agent in
          violation of usage policy.
        recommended: true
      api:
        description: Describes details about the API call associated to the activity that
          triggered the detection.
        recommended: true
      connection_info:
        description: Describes details about the network connection associated to the activity
          that triggered the detection.
        recommended: true
      container:
        description: Describes details about the container associated to the activity that
          triggered the detection.
        recommended: true
      data:
        description: Additional evidence data that is not accounted for in the specific evidence
          attributes.<code> Use only when absolutely necessary.</code>
      database:
        description: Describes details about the database associated to the activity that
          triggered the detection.
        recommended: true
      databucket:
        description: Describes details about the databucket associated to the activity that
          triggered the detection.
        recommended: true
      device:
        description: An addressable device, computer system or host associated to the activity
          that triggered the detection.
        recommended: true
      dst_endpoint:
        description: Describes details about the destination of the network activity that
          triggered the detection.
        recommended: true
      email:
        description: The email object associated to the activity that triggered the detection.
        recommended: true
      file:
        description: Describes details about the file associated to the activity that triggered
          the detection.
        recommended: true
      http_request:
        description: Describes details about the http request associated to the activity that
          triggered the detection.
        recommended: true
      http_response:
        description: Describes details about the http response associated to the activity
          that triggered the detection.
        recommended: true
      ja4_fingerprint_list:
        description: Describes details about the JA4+ fingerprints that triggered the detection.
        recommended: true
      job:
        description: Describes details about the scheduled job that was associated with the
          activity that triggered the detection.
        recommended: true
      name:
        description: The naming convention or type identifier of the evidence associated with
          the security detection. For example, the <code>@odata.type</code> from Microsoft
          Graph Alerts V2 or <code>display_name</code> from CrowdStrike Falcon Incident Behaviors.
        recommended: false
      process:
        description: Describes details about the process associated to the activity that triggered
          the detection.
        recommended: true
      query:
        description: Describes details about the DNS query associated to the activity that
          triggered the detection.
        recommended: true
      reg_key:
        description: Describes details about the registry key that triggered the detection.
        recommended: true
      reg_value:
        description: Describes details about the registry value that triggered the detection.
        recommended: true
      resources:
        title: Cloud Resources
        description: Describes details about the cloud resources directly related to activity
          that triggered the detection. For resources impacted by the detection, use <code>Affected
          Resources</code> at the top-level of the finding.
        recommended: true
      script:
        description: Describes details about the script that was associated with the activity
          that triggered the detection.
        recommended: true
      src_endpoint:
        description: Describes details about the source of the network activity that triggered
          the detection.
        recommended: true
      tls:
        description: Describes details about the Transport Layer Security (TLS) activity that
          triggered the detection.
        recommended: true
      uid:
        description: The unique identifier of the evidence associated with the security detection.
          For example, the <code>activity_id</code> from CrowdStrike Falcon Alerts or <code>behavior_id</code>
          from CrowdStrike Falcon Incident Behaviors.
        recommended: false
      url:
        description: The URL object that pertains to the event or object associated to the
          activity that triggered the detection.
        recommended: true
      user:
        description: Describes details about the user that was the target or somehow else
          associated with the activity that triggered the detection.
        recommended: true
      verdict:
        description: The normalized verdict of the evidence associated with the security detection.
      verdict_id:
        description: The normalized verdict (or status) ID of the evidence associated with
          the security detection. For example, Microsoft Graph Security Alerts contain a <code>verdict</code>
          enumeration for each type of <code>evidence</code> associated with the Alert. This
          is typically set by an automated investigation process or an analyst/investigator
          assigned to the finding.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: False Positive
            description: The verdict for the evidence has been identified as a False Positive.
          - equals_number: 2
            title: True Positive
            description: The verdict for the evidence has been identified as a True Positive.
          - equals_number: 3
            title: Disregard
            description: The verdict for the evidence is that is should be Disregarded.
          - equals_number: 4
            title: Suspicious
            description: The verdict for the evidence is that the behavior has been identified
              as Suspicious.
          - equals_number: 5
            title: Benign
            description: The verdict for the evidence is that the behavior has been identified
              as Benign.
          - equals_number: 6
            title: Test
            description: The evidence is part of a Test, or other sanctioned behavior(s).
          - equals_number: 7
            title: Insufficient Data
            description: There is insufficient data to render a verdict on the evidence.
          - equals_number: 8
            title: Security Risk
            description: The verdict for the evidence is that the behavior has been identified
              as a Security Risk.
          - equals_number: 9
            title: Managed Externally
            description: The verdict for the evidence is Managed Externally, such as in a
              case management tool.
          - equals_number: 10
            title: Duplicate
            description: This evidence duplicates existing evidence related to this finding.
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
      win_service:
        description: Describes details about the Windows service that triggered the detection.
        recommended: true
  OcsfExtension:
