---
id: https://w3id.org/lmodel/ocsf/ocsf_objects
name: ocsf_objects
title: OCSF objects, profiles and object-valued attributes
description: 'OCSF''s objects, its profiles as mixins, and the dictionary attributes whose
  value is an object. They sit in one module because they refer to each other: an object''s
  attribute ranges over an object, an object takes a profile, and a profile''s attribute ranges
  over an object. The extensions'' objects sit here too, since an extension patches a base
  object with attributes that range over its own.'
version: 1.9.0
source: https://github.com/ocsf/ocsf-schema/tree/1.9.0
license: Apache-2.0
see_also:
  - https://lmodel.github.io/ocsf
  - https://schema.ocsf.io/1.9.0/
prefixes:
  ocsf: https://w3id.org/lmodel/ocsf/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  attack: https://w3id.org/lmodel/attack/
  cve: https://w3id.org/lmodel/cve/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  stix: https://w3id.org/lmodel/stix/
default_prefix: ocsf
default_range: string
imports:
  - linkml:types
  - ocsf_core
slots:
  access_analysis_result:
    title: Access Analysis Result
    description: Describes access relationships and pathways between identities, resources,
      focusing on who can access what and through which mechanisms. This evaluates access
      levels (read/write/admin), access types (direct, cross-account, public, federated),
      and the conditions under which access is granted. Use this for resource-centric security
      assessments such as external access discovery, public exposure analysis, etc.
    slot_uri: ocsf:access_analysis_result
    range: OcsfAccessAnalysisResult
    inlined: true
  accessor:
    title: Accessor
    description: The name of the user who last accessed the object.
    slot_uri: ocsf:accessor
    range: OcsfUser
    inlined: true
  accessors:
    title: Accessors
    description: A list of users who have access to an entity. See specific usage.
    slot_uri: ocsf:accessors
    range: OcsfUser
    multivalued: true
    inlined_as_list: true
  account:
    title: Account
    description: The account object describes details about the account that was the source
      or target of the activity. See specific usage.
    slot_uri: ocsf:account
    range: OcsfAccount
    inlined: true
  actor:
    title: Actor
    description: The actor object describes details about the user/role/process that was the
      source of the activity. Note that this is not the threat actor of a campaign but may
      be part of a campaign.
    slot_uri: ocsf:actor
    range: OcsfActor
    inlined: true
  additional_restrictions:
    title: Additional Restrictions
    description: The supplementary restrictions that may apply to an entity, by the virtue
      of a policy. See specific usage.
    slot_uri: ocsf:additional_restrictions
    range: OcsfAdditionalRestriction
    multivalued: true
    inlined_as_list: true
  advisory:
    title: Security Advisory
    description: Detail about the security advisory, that is used to publicly disclose cybersecurity
      vulnerabilities by a vendor.
    slot_uri: ocsf:advisory
    range: OcsfAdvisory
    inlined: true
  affected_code:
    title: Affected Code
    description: List of Affected Code objects that describe details about code blocks identified
      as vulnerable.
    slot_uri: ocsf:affected_code
    range: OcsfAffectedCode
    multivalued: true
    inlined_as_list: true
  affected_packages:
    title: Affected Software Packages
    description: List of software packages identified as affected by a vulnerability/vulnerabilities.
    slot_uri: ocsf:affected_packages
    range: OcsfAffectedPackage
    multivalued: true
    inlined_as_list: true
  agent:
    title: Agent
    description: An Agent (also known as a Sensor) is typically installed on an Operating
      System (OS) and serves as a specialized software component that can be designed to monitor,
      detect, collect, archive, or take action. These activities and possible actions are
      defined by the upstream system controlling the Agent and its intended purpose. For instance,
      an Agent can include Endpoint Detection & Response (EDR) agents, backup/disaster recovery
      sensors, Application Performance Monitoring or profiling sensors, and similar software.
    slot_uri: ocsf:agent
    range: OcsfAgent
    inlined: true
  agent_list:
    title: Agent List
    description: A list of <code>agent</code> objects associated with a device, endpoint,
      or resource.
    slot_uri: ocsf:agent_list
    range: OcsfAgent
    multivalued: true
    inlined_as_list: true
  ai_agent:
    title: AI Agent
    description: An autonomous AI agent that performs tasks under delegated authority. Distinguished
      from the OCSF <code>agent</code> object, which describes security sensors such as EDR
      and DLP tools.
    slot_uri: ocsf:ai_agent
    range: OcsfAiAgent
    inlined: true
  ai_model:
    title: AI Model
    description: The AI Model object describes the characteristics of an AI/ML model. Examples
      include language models like GPT-4, embedding models like text-embedding-ada-002, and
      computer vision models like CLIP.
    slot_uri: ocsf:ai_model
    range: OcsfAiModel
    inlined: true
  aircraft:
    title: Aircraft
    description: The Aircraft object represents any aircraft or otherwise airborne asset such
      as an unmanned system, airplane, balloon, spacecraft, or otherwise. The Aircraft object
      is intended to normalized data captured or otherwise logged from active radar, passive
      radar, multi-spectral systems, or the Automatic Dependant Broadcast - Surveillance (ADS-B),
      and/or Mode S systems.
    slot_uri: ocsf:aircraft
    range: OcsfAircraft
    inlined: true
  analysis_targets:
    title: Analysis Targets
    description: The specific dimensions, components, or aspects of the system that are the
      targets of the analysis. See specific usage.
    slot_uri: ocsf:analysis_targets
    range: OcsfAnalysisTarget
    multivalued: true
    inlined_as_list: true
  analytic:
    title: Analytic
    description: The analytic technique used to analyze and derive insights from the data
      or information that led to the finding or conclusion.
    slot_uri: ocsf:analytic
    range: OcsfAnalytic
    inlined: true
  ancestry:
    title: Ancestry
    description: An array of Process Entities describing the extended parentage of this process
      object. Direct parent information should be expressed through the <code>parent_process</code>
      attribute. The first array element is the direct parent of this process object. Subsequent
      list elements go up the process parentage hierarchy. That is, the array is sorted from
      newest to oldest process. It is recommended to only populate this field for the top-level
      process object.
    slot_uri: ocsf:ancestry
    range: OcsfProcessEntity
    multivalued: true
    inlined_as_list: true
    see_also:
      - https://github.com/ocsf/ocsf-docs/blob/main/articles/representing-process-parentage.md
  anomalies:
    title: Anomalies
    description: A list of detected anomalies or deviations from expected behavior patterns.
      See specific usage.
    slot_uri: ocsf:anomalies
    range: OcsfAnomaly
    multivalued: true
    inlined_as_list: true
  anomaly_analyses:
    title: Anomaly Analyses
    description: A list of anomaly analysis results that examine and characterize patterns
      of activity or usage over time to identify normal vs abnormal activities. See specific
      usage.
    slot_uri: ocsf:anomaly_analyses
    range: OcsfAnomalyAnalysis
    multivalued: true
    inlined_as_list: true
  answers:
    title: DNS Answer
    description: The Domain Name System (DNS) answers.
    slot_uri: ocsf:answers
    range: OcsfDnsAnswer
    multivalued: true
    inlined_as_list: true
  api:
    title: API Details
    description: Describes details about a typical API (Application Programming Interface)
      call.
    slot_uri: ocsf:api
    range: OcsfApi
    inlined: true
  app:
    title: Application
    description: The application that reported the event.
    slot_uri: ocsf:app
    deprecated: Use the <code>application</code> attribute instead.
    range: OcsfProduct
    inlined: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.9.0
      ocsf_superseded_by: application
  application:
    title: Application
    description: An Application describes the details for an inventoried application as reported
      by an Application Security tool or other Developer-centric tooling. Applications can
      be defined as Kubernetes resources, Containerized resources, or application hosting-specific
      cloud sources such as AWS Elastic BeanStalk, AWS Lightsail, or Azure Logic Apps.
    slot_uri: ocsf:application
    range: OcsfApplication
    inlined: true
  applications:
    title: Applications
    description: A list of application objects. See specific usage.
    slot_uri: ocsf:applications
    range: OcsfApplication
    multivalued: true
    inlined_as_list: true
  assessment:
    title: Assessment
    description: The Assessment object describes a point-in-time assessment, check, or evaluation
      of a specific configuration or signal against an asset, entity, person, or otherwise.
      For example, this can encapsulate <code>os_signals</code> from CrowdStrike Falcon Zero
      Trust Assessments, or account for <code>Datastore</code> configurations from Cyera.
    slot_uri: ocsf:assessment
    range: OcsfAssessment
    inlined: true
  assessments:
    title: Assessments
    description: A list of <code>assessment</code> objects. See specific usage.
    slot_uri: ocsf:assessments
    range: OcsfAssessment
    multivalued: true
    inlined_as_list: true
  assignee:
    title: Assignee
    description: The details of the user assigned to an Incident.
    slot_uri: ocsf:assignee
    range: OcsfUser
    inlined: true
  assignee_group:
    title: Assignee Group
    description: The details of the group assigned to an Incident.
    slot_uri: ocsf:assignee_group
    range: OcsfGroup
    inlined: true
  attack:
    title: MITRE ATT&CK® Details
    description: The MITRE ATT&CK® object describing the tactic, technique, and sub-technique.
    slot_uri: ocsf:attack
    range: OcsfAttack
    inlined: true
  attack_graph:
    title: Attack Graph
    description: An Attack Graph describes possible routes an attacker could take through
      an environment. It describes relationships between resources and their findings, such
      as malware detections, vulnerabilities, misconfigurations, and other security actions.
    slot_uri: ocsf:attack_graph
    range: OcsfGraph
    inlined: true
    see_also:
      - https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-attack-path
      - https://www.sentinelone.com/cybersecurity-101/cybersecurity/attack-path-analysis/
  attacks:
    title: MITRE ATT&CK® and ATLAS™ Details
    description: An array of MITRE ATT&CK® objects describing identified tactics, techniques
      & sub-techniques. The objects are compatible with MITRE ATLAS™ tactics, techniques &
      sub-techniques.
    slot_uri: ocsf:attacks
    range: OcsfAttack
    multivalued: true
    inlined_as_list: true
    see_also:
      - https://attack.mitre.org
      - https://atlas.mitre.org/matrices/ATLAS
  attestation_list:
    title: Attestation List
    description: One or more cryptographic <code>attestation</code> objects over an event,
      each providing integrity, authenticity, and non-repudiation. Independent attesters over
      the same event — for example a producer at write time and a downstream processor at
      ingest — each contribute a separate attestation, distinct from co-signers on a single
      attestation, which share its <code>signatures</code> array. Carried on the <code>record_integrity</code>
      profile; the object itself is domain-agnostic.
    slot_uri: ocsf:attestation_list
    range: OcsfAttestation
    multivalued: true
    inlined_as_list: true
  auth_factors:
    title: Authentication Factors
    description: Describes a category of methods used for identity verification. See specific
      usage.
    slot_uri: ocsf:auth_factors
    range: OcsfAuthFactor
    multivalued: true
    inlined_as_list: true
  authentication_token:
    title: Authentication Token
    description: The authentication token, ticket, or assertion. See specific usage.
    slot_uri: ocsf:authentication_token
    range: OcsfAuthenticationToken
    inlined: true
  authority:
    title: DNS Authority Section
    description: The DNS Authority section resource records. Contains NS records pointing
      to authoritative name servers, or a SOA record for negative responses (NXDOMAIN).
    slot_uri: ocsf:authority
    range: OcsfDnsResourceRecord
    multivalued: true
    inlined_as_list: true
  authorizations:
    title: Authorization Information
    description: Provides details about an authorization, such as authorization outcome, and
      any associated policies related to the activity/event.
    slot_uri: ocsf:authorizations
    range: OcsfAuthorization
    multivalued: true
    inlined_as_list: true
  autonomous_system:
    title: Autonomous System
    description: The Autonomous System details associated with an IP address.
    slot_uri: ocsf:autonomous_system
    range: OcsfAutonomousSystem
    inlined: true
  avg_timespan:
    title: Average Timespan
    description: The average time span of an activity.
    slot_uri: ocsf:avg_timespan
    range: OcsfTimespan
    inlined: true
  baselines:
    title: Baselines
    description: A list of baseline measurements or normal behavior patterns used as reference
      points for comparison and anomaly detection. See specific usage.
    slot_uri: ocsf:baselines
    range: OcsfBaseline
    multivalued: true
    inlined_as_list: true
  campaign:
    title: Campaign
    description: The campaign object describes details about the campaign that was the source
      of the activity.
    slot_uri: ocsf:campaign
    range: OcsfCampaign
    inlined: true
  certificate:
    title: Certificate
    description: The certificate object containing information about the digital certificate.
    slot_uri: ocsf:certificate
    range: OcsfCertificate
    inlined: true
  charter:
    title: Charter
    description: A document defining the role, scope, and operating bounds of an entity. See
      specific usage.
    slot_uri: ocsf:charter
    range: OcsfFile
    inlined: true
  checks:
    title: Compliance Checks
    description: A list of specific, individual compliance verification checks derived from
      standard or non-standard benchmark rules or requirements.
    slot_uri: ocsf:checks
    range: OcsfCheck
    multivalued: true
    inlined_as_list: true
  cis_benchmark:
    title: CIS Benchmark
    description: The CIS Benchmark describes best practices for securely configuring IT systems,
      software, networks, and cloud infrastructure as defined by the Center for Internet Security.
    slot_uri: ocsf:cis_benchmark
    deprecated: Use the <code>compliance.checks</code> attribute instead.
    range: OcsfCisBenchmark
    inlined: true
    see_also:
      - https://www.cisecurity.org/cis-benchmarks/
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.5.0
      ocsf_superseded_by: compliance.checks
  cis_benchmark_result:
    title: CIS Benchmark Result
    description: The CIS Benchmark Result object captures results generated from benchmark
      evaluations as defined by the Center for Internet Security.
    slot_uri: ocsf:cis_benchmark_result
    deprecated: Use the <code>compliance.checks</code> attribute instead.
    range: OcsfCisBenchmarkResult
    inlined: true
    see_also:
      - https://www.cisecurity.org/cis-benchmarks/
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.5.0
      ocsf_superseded_by: compliance.checks
  cis_controls:
    title: CIS Controls
    description: The CIS Critical Security Controls is a prioritized set of actions to protect
      your organization and data from cyber-attack vectors.
    slot_uri: ocsf:cis_controls
    range: OcsfCisControl
    multivalued: true
    inlined_as_list: true
  cis_csc:
    title: CIS CSC
    description: The CIS Critical Security Controls is a list of top 20 actions and practices
      an organization’s security team can take on such that cyber attacks or malware, are
      minimized and prevented.
    slot_uri: ocsf:cis_csc
    deprecated: Use the <code>cis_control</code> object instead.
    range: OcsfCisCsc
    multivalued: true
    inlined_as_list: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.5.0
      ocsf_superseded_by: cis_control
  classifier_details:
    title: Classifier Details
    description: Describes details about the classifier used for data classification.
    slot_uri: ocsf:classifier_details
    range: OcsfClassifierDetails
    inlined: true
  client_hassh:
    title: Client HASSH
    description: The Client HASSH fingerprinting object.
    slot_uri: ocsf:client_hassh
    range: OcsfHassh
    inlined: true
  clipboard:
    title: Clipboard
    description: The clipboard that pertains to the event. See specific usage.
    slot_uri: ocsf:clipboard
    range: OcsfClipboard
    inlined: true
  cloud:
    title: Cloud
    description: Describes details about the Cloud environment where the event or finding
      was created.
    slot_uri: ocsf:cloud
    range: OcsfCloud
    inlined: true
  compliance:
    title: Compliance
    description: The compliance object provides context to compliance findings (e.g., a check
      against a specific regulatory or best practice framework such as CIS, NIST etc.) and
      contains compliance related details.
    slot_uri: ocsf:compliance
    range: OcsfCompliance
    inlined: true
  compliance_references:
    title: Compliance Standard References
    description: A list of reference KB articles that provide information to help organizations
      understand, interpret, and implement compliance standards. They provide guidance, best
      practices, and examples.
    slot_uri: ocsf:compliance_references
    deprecated: Use the <code>compliance.checks</code> attribute instead.
    range: OcsfKbArticle
    multivalued: true
    inlined_as_list: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.5.0
      ocsf_superseded_by: compliance.checks
  compliance_standards:
    title: 'Compliance Standards: Details'
    description: A list of established guidelines or criteria that define specific requirements
      an organization must follow.
    slot_uri: ocsf:compliance_standards
    deprecated: Use the <code>compliance.checks</code> attribute instead.
    range: OcsfKbArticle
    multivalued: true
    inlined_as_list: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.5.0
      ocsf_superseded_by: compliance.checks
  condition_keys:
    title: Condition Keys
    description: The list of condition keys and their values that were evaluated as part of
      a rule or policy. Condition keys are used to define circumstances under which the rule/policy
      is in effect. See specific usage.
    slot_uri: ocsf:condition_keys
    range: OcsfKeyValueObject
    multivalued: true
    inlined_as_list: true
  connection_info:
    title: Connection Info
    description: The network connection information.
    slot_uri: ocsf:connection_info
    range: OcsfNetworkConnectionInfo
    inlined: true
  container:
    title: Container
    description: The information describing an instance of a container. A container is a prepackaged,
      portable system image that runs isolated on an existing system using a container runtime
      like containerd.
    slot_uri: ocsf:container
    range: OcsfContainer
    inlined: true
  containers:
    title: Containers
    description: When working with containerized applications, the set of containers which
      write to the standard the output of a particular logging driver. For example, this may
      be the set of containers involved in handling api requests and responses for a containerized
      application.
    slot_uri: ocsf:containers
    range: OcsfContainer
    multivalued: true
    inlined_as_list: true
  contents:
    title: Clipboard Contents
    description: The data items written to, or read from, the clipboard.
    slot_uri: ocsf:contents
    range: OcsfClipboardItem
    multivalued: true
    inlined_as_list: true
  control_parameters:
    title: Control Parameters
    description: The list of control parameters evaluated in a Compliance check.
    slot_uri: ocsf:control_parameters
    range: OcsfKeyValueObject
    multivalued: true
    inlined_as_list: true
  countermeasures:
    title: Countermeasures
    description: The MITRE D3FEND™ Matrix Countermeasures associated with a remediation.
    slot_uri: ocsf:countermeasures
    range: OcsfD3fend
    multivalued: true
    inlined_as_list: true
  cpu_info_list:
    title: CPU Information
    description: An array of objects, each describing a physical CPU package installed in
      the device.
    slot_uri: ocsf:cpu_info_list
    range: OcsfCpuInfo
    multivalued: true
    inlined_as_list: true
  creator:
    title: Creator
    description: The user that created the object associated with event. See specific usage.
    slot_uri: ocsf:creator
    range: OcsfUser
    inlined: true
  cumulative_traffic:
    title: Cumulative Traffic
    description: The cumulative network traffic. See specific usage.
    slot_uri: ocsf:cumulative_traffic
    range: OcsfNetworkTraffic
    inlined: true
  cve:
    title: CVE
    description: The Common Vulnerabilities and Exposures identifier for a vulnerability.
    slot_uri: ocsf:cve
    range: OcsfCve
    inlined: true
    see_also:
      - https://cve.mitre.org/
  cves:
    title: CVE List
    description: List of Common Vulnerabilities and Exposures identifiers.
    slot_uri: ocsf:cves
    range: OcsfCve
    multivalued: true
    inlined_as_list: true
    see_also:
      - https://cve.mitre.org/
    related_mappings:
      - cve:cveId
  cvss:
    title: CVSS Score
    description: The CVSS object details Common Vulnerability Scoring System scores from the
      advisory that are related to the vulnerability.
    slot_uri: ocsf:cvss
    range: OcsfCvss
    multivalued: true
    inlined_as_list: true
    see_also:
      - https://www.first.org/cvss/
  cwe:
    title: CWE
    description: The CWE object represents a weakness in a software system that can be exploited
      by a threat actor to perform an attack. The CWE object is based on the Common Weakness
      Enumeration (CWE) catalog.
    slot_uri: ocsf:cwe
    range: OcsfCwe
    inlined: true
    see_also:
      - https://cwe.mitre.org/
  d3f_tactic:
    title: MITRE D3FEND™ Tactic
    description: The D3FEND Tactic object describes the defensive tactic name associated with
      a countermeasure.
    slot_uri: ocsf:d3f_tactic
    range: OcsfD3fTactic
    inlined: true
    see_also:
      - https://d3fend.mitre.org
  d3f_technique:
    title: MITRE D3FEND™ Technique
    description: The D3FEND Technique object describes the defensive technique ID and/or name
      associated with a countermeasure.
    slot_uri: ocsf:d3f_technique
    range: OcsfD3fTechnique
    inlined: true
    see_also:
      - https://d3fend.mitre.org
  data_classification:
    title: Data Classification
    description: The Data Classification object includes information about data classification
      levels and data category types.
    slot_uri: ocsf:data_classification
    range: OcsfDataClassification
    inlined: true
  data_classifications:
    title: Data Classification
    description: A list of Data Classification objects, that include information about data
      classification levels and data category types, identified by a classifier.
    slot_uri: ocsf:data_classifications
    range: OcsfDataClassification
    multivalued: true
    inlined_as_list: true
  data_security:
    title: Data Security
    description: The Data Security object describes the characteristics, techniques and content
      of a Data Loss Prevention (DLP), Data Loss Detection (DLD), Data Classification, or
      similar tools' finding, alert, or detection mechanism(s).
    slot_uri: ocsf:data_security
    range: OcsfDataSecurity
    inlined: true
  database:
    title: Database
    description: The database object is used for databases which are typically datastore services
      that contain an organized collection of structured and unstructured data or a types
      of data.
    slot_uri: ocsf:database
    range: OcsfDatabase
    inlined: true
  databucket:
    title: Databucket
    description: The data bucket object is a basic container that holds data, typically organized
      through the use of data partitions.
    slot_uri: ocsf:databucket
    range: OcsfDatabucket
    inlined: true
  dce_rpc:
    title: Distributed Computing Environment/Remote Procedure Call (DCE/RPC)
    description: The DCE/RPC object describes the remote procedure call system for distributed
      computing environments.
    slot_uri: ocsf:dce_rpc
    range: OcsfDceRpc
    inlined: true
  delegation:
    title: Delegation
    description: A durable authorization context issued by a principal to a delegate (e.g.,
      an application, automated process, service account, or AI agent), representing delegated
      authority to act on the principal's behalf. Independent of any single event, trace,
      or session, enabling correlation of actions performed under the same delegated authority.
    slot_uri: ocsf:delegation
    range: OcsfDelegation
    inlined: true
  desktop_display:
    title: Desktop Display
    description: The desktop display affiliated with the event
    slot_uri: ocsf:desktop_display
    range: OcsfDisplay
    inlined: true
  device:
    title: Device
    description: An addressable device, computer system or host.
    slot_uri: ocsf:device
    range: OcsfDevice
    inlined: true
  devices:
    title: Devices
    description: The object describes details related to the list of devices.
    slot_uri: ocsf:devices
    range: OcsfDevice
    multivalued: true
    inlined_as_list: true
  digest:
    title: Message Digest
    description: The message digest attribute contains the fixed length message hash representation
      and the corresponding hashing algorithm information.
    slot_uri: ocsf:digest
    range: OcsfFingerprint
    inlined: true
  discovery_details:
