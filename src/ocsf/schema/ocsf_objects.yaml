      - credential_uid
      - expiration_reason
      - expiration_time
      - expiration_time_dt
      - is_mfa
      - is_remote
      - is_vpn
      - issuer
      - terminal
      - uid
      - uid_alt
      - uuid
    slot_usage:
      count:
        description: The number of identical sessions spawned from the same source IP, destination
          IP, application, and content/threat type seen over a period of time.
      created_time:
