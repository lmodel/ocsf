      uid:
        description: A unique identifier for this process assigned by the producer (tool).  Facilitates
          correlation of a process event with other events for that process.
        annotations:
          ocsf_observable: '39'
  OcsfProcess:
    title: Process
    description: The Process object describes a running instance of a launched program.
    class_uri: ocsf:OcsfProcess
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:Process/
    is_a: OcsfProcessEntity
    mixins:
      - OcsfContainerProfile
      - OcsfLinuxUsersProfile
      - OcsfMacosUsersProfile
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: process
      ocsf_profiles: container data_classification datetime linux/linux_users macos/macos_users
      ocsf_constraints: '{"at_least_one": ["pid", "uid", "cpid"]}'
      ocsf_observable: '25'
    related_mappings:
      - d3f:Process
    any_of:
      - slot_conditions:
          pid:
            required: true
      - slot_conditions:
          uid:
            required: true
      - slot_conditions:
          cpid:
            required: true
    slots:
      - ai_agent
      - ancestry
      - environment_variables
      - file
      - hosted_ai_agent_list
      - hosted_services
      - integrity
      - integrity_id
      - lineage
      - loaded_modules
      - parent_process
      - ptid
      - sandbox
      - session
      - terminated_time
      - terminated_time_dt
      - tid
      - user
      - working_directory
      - xattributes
    slot_usage:
      ai_agent:
        description: The autonomous AI agent that this process is running or hosting, if applicable.
          Populate when the process serves as the runtime environment for an AI agent (e.g.,
          a Python process executing a LangChain agent or hosting an MCP server). When a process
          hosts multiple agents and the activity cannot be attributed to one specifically,
          use <code>hosted_ai_agent_list</code> instead.
        annotations:
          ocsf_profiles: ai_operation
      egid:
        annotations:
          ocsf_profiles: linux/linux_users macos/macos_users
      environment_variables:
        description: Environment variables associated with the process.
      euid:
        annotations:
          ocsf_profiles: linux/linux_users macos/macos_users
      file:
        description: The process file object.
        recommended: true
      hosted_ai_agent_list:
        description: The list of autonomous AI agents hosted by this process. Use when a single
          process hosts multiple agents (e.g., an IDE running several coding agents within
          the same host process) and the producer cannot attribute a specific activity to
          a single agent. When attribution is available, populate the singular <code>ai_agent</code>
          attribute instead.
        annotations:
          ocsf_profiles: ai_operation
      lineage:
        deprecated: Use the <code>ancestry</code> attribute.
        annotations:
          ocsf_deprecated_since: 1.4.0
          ocsf_superseded_by: ancestry
      parent_process:
        recommended: true
      session:
        description: The user session under which this process is running.
      terminated_time:
        description: The time when the process was terminated.
      terminated_time_dt:
        description: The time when the process was terminated.
        annotations:
          ocsf_profiles: datetime
      user:
        description: The user under which this process is running.
        recommended: true
      xattributes:
        description: 'An unordered collection of zero or more name/value pairs that represent
          a process extended attribute.<p>For example: process security context attributes,
          process resource limits, container-specific attributes, or platform-specific process
          metadata not covered by standard OCSF attributes.</p>'
  OcsfProduct:
    title: Product
    description: The Product object describes characteristics of a software product.
    class_uri: ocsf:OcsfProduct
    is_a: OcsfEntity
    mixins:
