  OcsfClassifierDetails:
    title: Classifier Details
    description: The Classifier Details object describes details about the classifier used
      for data classification.
    class_uri: ocsf:OcsfClassifierDetails
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: classifier_details
    slots:
      - name
      - type
      - uid
    slot_usage:
      name:
        description: The name of the classifier.
        recommended: true
      type:
        description: The type of the classifier.
        required: true
      uid:
        description: The unique identifier of the classifier.
        recommended: true
  OcsfClipboard:
    title: Clipboard
    description: The Clipboard object represents an endpoint clipboard and its contents.
    class_uri: ocsf:OcsfClipboard
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: clipboard
    slots:
      - contents
      - name
    slot_usage:
      contents:
        recommended: true
      name:
        description: 'The name of the clipboard on systems with named clipboards. For example:
          <code>General</code> or <code>Drag</code>.'
  OcsfClipboardItem:
    title: Clipboard Item
    description: A piece of data on the system clipboard.
    class_uri: ocsf:OcsfClipboardItem
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: clipboard_item
    slots:
      - binary_data
      - clipboard_native_type
      - mime_type
      - string_data
    slot_usage:
      binary_data:
        description: The item's data in binary form, used when the clipboard content cannot
          be represented as text or when preserving the exact binary representation is required.
      mime_type:
        description: 'The Multipurpose Internet Mail Extensions (MIME) type of the item''s
          data. For example: <code>text/plain</code>.'
        required: true
  OcsfCloud:
    title: Cloud
    description: The Cloud object describes the cloud computing environment where an event
      or finding originated. It provides comprehensive context about the cloud infrastructure,
      including the cloud service provider, account or subscription details, organizational
      structure, geographic regions, availability zones, and logical partitions.
    class_uri: ocsf:OcsfCloud
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: cloud
    slots:
      - account
      - cloud_partition
      - org
      - project_uid
      - provider
      - region
      - zone
    slot_usage:
      account:
        description: The Account object containing details about the cloud account, subscription,
          or billing unit where the event or finding was created. This object includes properties
          such as the account name, unique identifier, type, labels, and tags.<br/><br/><strong>Examples:</strong><ul><li><strong>AWS:</strong>
          Account object with <code>name</code>, <code>uid</code> (Account ID), <code>type</code>,
          and other account properties</li><li><strong>Azure:</strong> Subscription object
          with <code>name</code>, <code>uid</code> (Subscription ID), <code>type</code>, and
          subscription metadata</li><li><strong>GCP:</strong> Project object with <code>name</code>,
          <code>uid</code> (Project ID), <code>type</code>, and project attributes</li><li><strong>Oracle
          Cloud:</strong> Compartment object with <code>name</code>, <code>uid</code> (Tenancy
          OCID), <code>type</code>, and compartment details</li></ul>
      cloud_partition:
        description: The logical grouping or isolated segment within a cloud provider's infrastructure
          where the event or finding was created, often used for compliance, governance, or
          regional separation.<br/><br/><strong>Examples:</strong><ul><li><strong>AWS:</strong>
          Partition where the event occurred (<code>aws</code>, <code>aws-cn</code>, <code>aws-us-gov</code>)</li><li><strong>Azure:</strong>
          Cloud environment where the event occurred (<code>AzureCloud</code>, <code>AzureUSGovernment</code>,
          <code>AzureChinaCloud</code>)</li></ul>
      org:
        description: The Organization object containing details about the organizational unit
          or management structure that governs the account, subscription, or project where
          the event or finding was created. This object includes properties such as the organization
          name, unique identifier, type, and other organizational metadata.<br/><br/><strong>Examples:</strong><ul><li><strong>AWS:</strong>
          Organization object with <code>name</code>, <code>uid</code> (Organization ID),
          <code>type</code>, and other organizational properties</li><li><strong>Azure:</strong>
          Management Group object with <code>name</code>, <code>uid</code> (Management Group
          ID), <code>type</code>, and management group metadata</li><li><strong>GCP:</strong>
          Organization object with <code>name</code>, <code>uid</code> (Organization ID),
          <code>type</code>, and organizational attributes</li><li><strong>Oracle Cloud:</strong>
          Tenancy object with <code>name</code>, <code>uid</code> (Tenancy OCID), <code>type</code>,
          and tenancy details</li></ul>
      provider:
        title: Cloud Provider
        description: The unique name of the Cloud services provider where the event or finding
          was created. Examples include AWS, Azure, GCP (Google Cloud Platform), Oracle Cloud,
          IBM Cloud, Alibaba Cloud, or other public, private, or hybrid cloud providers.
        required: true
      region:
        description: The cloud region where the event or finding was created, as defined by
          the cloud provider.<br/><br/><strong>Examples:</strong><ul><li><strong>AWS:</strong>
          Region where the event occurred (<code>us-east-1</code>, <code>eu-west-1</code>)</li><li><strong>Azure:</strong>
          Region where the event occurred (<code>East US</code>, <code>West Europe</code>)</li><li><strong>GCP:</strong>
          Region where the event occurred (<code>us-central1</code>, <code>europe-west1</code>)</li><li><strong>Oracle
          Cloud:</strong> Region where the event occurred (<code>us-ashburn-1</code>, <code>uk-london-1</code>)</li></ul>
        recommended: true
      zone:
        title: Cloud Availability Zone
        description: The availability zone in the cloud region where the event or finding
          was created, as defined by the cloud provider.<br/><br/><strong>Examples:</strong><ul><li><strong>AWS:</strong>
          Availability zone where the event occurred (<code>us-east-1a</code>, <code>us-east-1b</code>)</li><li><strong>Azure:</strong>
          Availability zone where the event occurred (<code>1</code>, <code>2</code>, <code>3</code>
          within a region)</li><li><strong>GCP:</strong> Availability zone where the event
          occurred (<code>us-central1-a</code>, <code>us-central1-b</code>)</li><li><strong>Oracle
          Cloud:</strong> Availability zone where the event occurred (<code>AD-1</code>, <code>AD-2</code>,
          <code>AD-3</code>)</li></ul>
  OcsfCompliance:
    title: Compliance
    description: The Compliance object contains information about Industry and Regulatory
      Framework standards, controls and requirements or details about custom assessments utilized
      in a compliance evaluation. Standards define broad security frameworks, controls represent
      specific security requirements within those frameworks, and checks are the testable
      verification points used to determine if controls are properly implemented.
    class_uri: ocsf:OcsfCompliance
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: compliance
      ocsf_profiles: cloud container data_classification
    slots:
      - assessments
      - category
      - checks
      - compliance_references
      - compliance_standards
      - control
      - control_parameters
      - desc
      - requirements
      - standards
      - status
      - status_code
      - status_detail
      - status_details
      - status_id
    slot_usage:
      assessments:
        description: A list of assessments associated with the compliance requirements evaluation.
      category:
        description: The category a control framework pertains to, as reported by the source
          tool, such as <code>Asset Management</code> or <code>Risk Assessment</code>.
      checks:
        description: 'A list of compliance checks associated with specific industry standards
          or frameworks. Each check represents an individual rule or requirement that has
          been evaluated against a target device. Checks typically include details such as
          the check name (e.g., CIS: ''Ensure mounting of cramfs filesystems is disabled''
          or DISA STIG descriptive titles), unique identifiers (such as CIS identifier ''1.1.1.1''
          or DISA STIG identifier ''V-230234''), descriptions (detailed explanations of security
          requirements or vulnerability discussions), and version information.'
        see_also:
          - https://www.cisecurity.org/cis-benchmarks/
          - https://public.cyber.mil/stigs/
      compliance_references:
        deprecated: Use the <code>checks</code> attribute instead.
        annotations:
          ocsf_deprecated_since: 1.5.0
          ocsf_superseded_by: checks
      compliance_standards:
        deprecated: Use the <code>checks</code> attribute instead.
        annotations:
          ocsf_deprecated_since: 1.5.0
          ocsf_superseded_by: checks
      control:
        description: A Control is a prescriptive, actionable set of specifications that strengthens
          device posture. The control specifies required security measures, while the specific
          implementation values are defined in control_parameters. E.g., CIS AWS Foundations
          Benchmark 1.2.0 - Control 2.1 - Ensure CloudTrail is enabled in all regions
        see_also:
          - https://www.cisecurity.org/benchmark/amazon_web_services
          - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html
        recommended: true
      control_parameters:
        description: 'The list of control parameters evaluated in a Compliance check. E.g.,
          parameters for CloudTrail configuration might include <code>multiRegionTrailEnabled:
          true</code>, <code>logFileValidationEnabled: true</code>, and <code>requiredRegions:
          [us-east-1, us-west-2]</code>'
        see_also:
          - https://docs.aws.amazon.com/awscloudtrail/latest/APIReference/API_CreateTrail.html
          - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/receive-cloudtrail-log-files-from-multiple-regions.html
          - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
      desc:
        description: The description or criteria of a control.
      requirements:
        description: The specific compliance requirements being evaluated. E.g., <code>PCI
          DSS Requirement 8.2.3 - Passwords must meet minimum complexity requirements</code>
          or <code>HIPAA Security Rule 164.312(a)(2)(iv) - Implement encryption and decryption
          mechanisms</code>
        see_also:
          - https://www.pcisecuritystandards.org/document_library
          - https://www.hhs.gov/hipaa/for-professionals/security/laws-regulations/index.html
      standards:
        description: The regulatory or industry standards being evaluated for compliance.
        see_also:
          - https://www.pcisecuritystandards.org/document_library
          - https://www.hhs.gov/hipaa/for-professionals/security/laws-regulations/index.html
          - https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
          - https://www.iso.org/standard/54534.html
        recommended: true
      status:
        description: The resultant status of the compliance check normalized to the caption
          of the <code>status_id</code> value. In the case of 'Other', it is defined by the
          event source.
        recommended: true
      status_code:
        description: The resultant status code of the compliance check.
      status_detail:
        description: The contextual description of the <code>status, status_code</code> values.
        deprecated: Use the <code>status_details</code> attribute instead.
        annotations:
          ocsf_deprecated_since: 1.4.0
          ocsf_superseded_by: status_details
      status_details:
        description: A list of contextual descriptions of the <code>status, status_code</code>
          values.
      status_id:
        description: The normalized status identifier of the compliance check.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The status is unknown.
          - equals_number: 1
            title: Pass
            description: The compliance check passed for all the evaluated resources.
          - equals_number: 2
            title: Warning
            description: The compliance check did not yield a result due to missing information.
          - equals_number: 3
            title: Fail
            description: The compliance check failed for at least one of the evaluated resources.
          - equals_number: 99
            title: Other
            description: The status is not mapped. See the <code>status</code> attribute,
              which contains a data source specific value.
        recommended: true
  OcsfContainer:
    title: Container
    description: The Container object describes an instance of a specific container. A container
      is a prepackaged, portable system image that runs isolated on an existing system using
      a container runtime like containerd.
    class_uri: ocsf:OcsfContainer
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:ContainerProcess/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: container
      ocsf_constraints: '{"at_least_one": ["uid", "name"]}'
      ocsf_observable: '27'
    related_mappings:
      - d3f:ContainerProcess
    any_of:
      - slot_conditions:
          uid:
            required: true
      - slot_conditions:
          name:
            required: true
    slots:
      - hash
      - image
      - labels
      - name
      - network_driver
      - orchestrator
      - pod_uuid
      - runtime
      - size
      - tag
      - tags
      - uid
    slot_usage:
      hash:
        description: 'Commit hash of image created for docker or the SHA256 hash of the container.
          For example: <code>13550340a8681c84c861aac2e5b440161c2b33a3e4f302ac680ca5b686de48de</code>.'
        recommended: true
      image:
        description: The container image used as a template to run the container.
        recommended: true
      labels:
        description: The list of labels associated to the container.
      name:
        description: The container name.
        recommended: true
      size:
        description: The size of the container image.
        recommended: true
      tag:
        description: The tag used by the container. It can indicate version, format, OS.
      tags:
        description: The list of tags; <code>{key:value}</code> pairs associated to the container.
      uid:
        description: 'The full container unique identifier for this instantiation of the container.
          For example: <code>ac2ea168264a08f9aaca0dfc82ff3551418dfd22d02b713142a6843caa2f61bf</code>.'
        recommended: true
  OcsfCpuInfo:
    title: CPU Information
    description: The CPU information object contains attributes describing a physical CPU
      package installed in the device.
    class_uri: ocsf:OcsfCpuInfo
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: cpu_info
    slots:
      - cores
      - cpu_architecture
      - cpu_architecture_id
      - cpu_bits
      - model
      - speed_mhz
      - vendor_name
    slot_usage:
      cpu_bits:
        description: The number of bits used by the CPU for memory addressing.
      model:
        description: 'The model name of the CPU. For example: <code>Intel Xeon Gold 6348</code>,
          <code>AMD EPYC 7763</code>, or <code>Apple M3 Max</code>.'
        recommended: true
      vendor_name:
        description: 'The name of the vendor of the CPU. For example: <code>Intel</code>,
          <code>AMD</code>, or <code>Apple</code>.'
        recommended: true
  OcsfCve:
    title: CVE
    description: The Common Vulnerabilities and Exposures (CVE) object represents publicly
      disclosed cybersecurity vulnerabilities defined in CVE Program catalog (CVE). There
      is one CVE Record for each vulnerability in the catalog.
    class_uri: ocsf:OcsfCve
    see_also:
      - https://cve.org/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: cve
      ocsf_profiles: data_classification datetime
    slots:
      - created_time
      - created_time_dt
      - cvss
      - cwe
      - cwe_uid
      - cwe_url
      - desc
      - epss
      - modified_time
      - modified_time_dt
      - product
      - references
      - related_cwes
      - title
      - type
      - uid
    slot_usage:
      created_time:
        description: The Record Creation Date identifies when the CVE ID was issued to a CVE
          Numbering Authority (CNA) or the CVE Record was published on the CVE List. Note
          that the Record Creation Date does not necessarily indicate when this vulnerability
          was discovered, shared with the affected vendor, publicly disclosed, or updated
          in CVE.
        recommended: true
      created_time_dt:
        description: The Record Creation Date identifies when the CVE ID was issued to a CVE
          Numbering Authority (CNA) or the CVE Record was published on the CVE List. Note
          that the Record Creation Date does not necessarily indicate when this vulnerability
          was discovered, shared with the affected vendor, publicly disclosed, or updated
          in CVE.
        annotations:
          ocsf_profiles: datetime
      cvss:
        recommended: true
      cwe:
        deprecated: Use <code>related_cwes</code> attribute instead.
        annotations:
          ocsf_deprecated_since: 1.4.0
          ocsf_superseded_by: related_cwes
      desc:
        description: A brief description of the CVE Record.
      modified_time:
        description: The Record Modified Date identifies when the CVE record was last updated.
      modified_time_dt:
        description: The Record Modified Date identifies when the CVE record was last updated.
        annotations:
          ocsf_profiles: datetime
      product:
        description: The product where the vulnerability was discovered.
      references:
        description: A list of reference URLs with additional information about the CVE Record.
        recommended: true
      related_cwes:
        description: Describes the Common Weakness Enumeration details related to the CVE
          Record.
      title:
        description: A title or a brief phrase summarizing the CVE record.
        recommended: true
      type:
        title: Vulnerability Type
        description: '<p>The vulnerability type as classified in the CVE catalog.</p>Most
          frequently used vulnerability types are: <code>DoS</code>, <code>Code Execution</code>,
          <code>Overflow</code>, <code>Memory Corruption</code>, <code>Sql Injection</code>,
          <code>XSS</code>, <code>Directory Traversal</code>, <code>Http Response Splitting</code>,
          <code>Bypass something</code>, <code>Gain Information</code>, <code>Gain Privileges</code>,
          <code>CSRF</code>, <code>File Inclusion</code>. For more information see Vulnerabilities
          By Type distributions.'
        see_also:
          - https://www.cvedetails.com/vulnerabilities-by-types.php
        recommended: true
      uid:
        title: CVE ID
        description: 'The Common Vulnerabilities and Exposures unique number assigned to a
          specific computer vulnerability. A CVE Identifier begins with 4 digits representing
          the year followed by a sequence of digits that acts as a unique identifier. For
          example: <code>CVE-2021-12345</code>.'
        required: true
        annotations:
          ocsf_observable: '18'
        exact_mappings:
          - cve:cveId
    close_mappings:
      - cve:CveRecord
      - nist_nvd:NvdCve
    related_mappings:
      - kev_catalog:KevVulnerability
      - stix:StixVulnerability
  OcsfCvss:
    title: CVSS Score
    description: The Common Vulnerability Scoring System (CVSS) object provides a way to capture
      the principal characteristics of a vulnerability and produce a numerical score reflecting
      its severity.
    class_uri: ocsf:OcsfCvss
    see_also:
      - https://www.first.org/cvss/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: cvss
    slots:
      - base_score
      - depth
      - metrics
      - overall_score
      - severity
      - src_url
      - vector_string
      - vendor_name
      - version
    slot_usage:
      base_score:
        description: 'The CVSS base score. For example: <code>9.1</code>.'
        required: true
      depth:
        recommended: true
      metrics:
        description: 'The Common Vulnerability Scoring System metrics. This attribute contains
          information on the CVE''s impact. If the CVE has been analyzed, this attribute will
          contain any CVSSv2 or CVSSv3 information associated with the vulnerability. For
          example: <code>{ {"Access Vector", "Network"}, {"Access Complexity", "Low"}, ...}</code>.'
      overall_score:
        description: 'The CVSS overall score, impacted by base, temporal, and environmental
          metrics. For example: <code>9.1</code>.'
        recommended: true
      severity:
        description: <p>The Common Vulnerability Scoring System (CVSS) Qualitative Severity
          Rating. A textual representation of the numeric score.</p><strong>CVSS v2.0</strong><ul><li>Low
          (0.0 – 3.9)</li><li>Medium (4.0 – 6.9)</li><li>High (7.0 – 10.0)</li></ul></p><strong>CVSS
          v3.0</strong><ul><li>None (0.0)</li><li>Low (0.1 - 3.9)</li><li>Medium (4.0 - 6.9)</li><li>High
          (7.0 - 8.9)</li><li>Critical (9.0 - 10.0)</li></ul>
      src_url:
        description: 'The source URL for the CVSS score. For example: <code>https://nvd.nist.gov/vuln/detail/CVE-2021-44228</code>'
      vendor_name:
        description: 'The vendor that provided the CVSS score. For example: <code>NVD, REDHAT</code>
          etc.'
        recommended: true
      version:
        description: 'The CVSS version. For example: <code>3.1</code>.'
        required: true
    narrow_mappings:
      - cve:CvssV20
      - cve:CvssV30
      - cve:CvssV31
      - cve:CvssV40
  OcsfCwe:
    title: CWE
    description: The CWE object represents a weakness in a software system that can be exploited
      by a threat actor to perform an attack. The CWE object is based on the Common Weakness
      Enumeration (CWE) catalog.
    class_uri: ocsf:OcsfCwe
    see_also:
      - https://cwe.mitre.org/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: cwe
    slots:
      - caption
      - src_url
      - uid
    slot_usage:
      caption:
        description: The caption assigned to the Common Weakness Enumeration unique identifier.
      src_url:
        description: URL pointing to the CWE Specification. For more information see <a target='_blank'
          href='https://cwe.mitre.org/'>CWE.</a>
      uid:
        title: CWE ID
        description: 'The Common Weakness Enumeration unique number assigned to a specific
          weakness. A CWE Identifier begins "CWE" followed by a sequence of digits that acts
          as a unique identifier. For example: <code>CWE-123</code>.'
        required: true
        annotations:
          ocsf_observable: '17'
        close_mappings:
          - cve:cweId
        related_mappings:
          - cwe:CWE_ID
    close_mappings:
      - cwe:CweWeakness
    related_mappings:
      - nist_nvd:NvdWeakness
  OcsfD3fTactic:
    title: Defensive Tactic
    description: The Defensive Tactic object describes the tactic ID and/or name that is associated
      to an attack.
    class_uri: ocsf:OcsfD3fTactic
    see_also:
      - https://d3fend.mitre.org
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: d3f_tactic
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - src_url
    slot_usage:
      name:
        description: 'The tactic name that is associated with the defensive technique. For
          example: <code>Isolate</code>.'
      src_url:
        description: 'The versioned permalink of the defensive tactic. For example: <code>https://d3fend.mitre.org/tactic/d3f:Isolate/</code>'
        see_also:
          - https://d3fend.mitre.org/tactic/d3f:Isolate/
        annotations:
          ocsf_source_note: https://d3fend.mitre.org/tactic/d3f:Isolate/
      uid:
        description: The unique identifier of the defensive tactic.
    close_mappings:
      - d3f:DefensiveTactic
  OcsfD3fTechnique:
    title: Defensive Technique
    description: The Defensive Technique object describes the leaf defensive technique ID
      and/or name associated to a countermeasure.
    class_uri: ocsf:OcsfD3fTechnique
    see_also:
      - https://d3fend.mitre.org
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: d3f_technique
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - src_url
    slot_usage:
      name:
        description: 'The name of the defensive technique. For example: <code>IO Port Restriction</code>.'
      src_url:
        description: 'The versioned permalink of the defensive technique. For example: <code>https://d3fend.mitre.org/technique/d3f:IOPortRestriction/</code>'
        see_also:
          - https://d3fend.mitre.org/technique/d3f:IOPortRestriction/
        annotations:
          ocsf_source_note: https://d3fend.mitre.org/technique/d3f:IOPortRestriction/
      uid:
        description: 'The unique identifier of the defensive technique. For example: <code>D3-IOPR</code>.'
    close_mappings:
      - d3f:DefensiveTechnique
  OcsfD3fend:
    title: Defensive Countermeasure
    description: The Defensive Countermeasure object describes the tactic & technique associated
      with a countermeasure.
    class_uri: ocsf:OcsfD3fend
    see_also:
      - https://d3fend.mitre.org
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: d3fend
