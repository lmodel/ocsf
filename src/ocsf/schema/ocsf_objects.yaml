    description: The updated entity. See specific usage.
    slot_uri: ocsf:updated_entity
    range: OcsfManagedEntity
    inlined: true
  updated_group:
    title: Updated Group
    description: The updated group. See specific usage.
    slot_uri: ocsf:updated_group
    range: OcsfGroup
    inlined: true
  updated_job:
    title: Updated Job
    description: The updated job. See specific usage.
    slot_uri: ocsf:updated_job
    range: OcsfJob
    inlined: true
  updated_resources:
    title: Updated Resources
    description: The updated resources. See specific usage.
    slot_uri: ocsf:updated_resources
    range: OcsfResourceDetails
    multivalued: true
    inlined_as_list: true
  updated_role:
    title: Updated Role
    description: The updated role. See specific usage.
    slot_uri: ocsf:updated_role
    range: OcsfIamRole
    inlined: true
  updated_user:
    title: Updated User
    description: The updated user. See specific usage.
    slot_uri: ocsf:updated_user
    range: OcsfUser
    inlined: true
  updated_web_resources:
    title: Updated Web Resources
    description: The updated web resources. See specific usage.
    slot_uri: ocsf:updated_web_resources
    range: OcsfWebResource
    multivalued: true
    inlined_as_list: true
  url:
    title: URL
    description: The URL object that pertains to the event or object. See specific usage.
    slot_uri: ocsf:url
    range: OcsfUrl
    inlined: true
  urls:
    title: URLs
    description: The URLs that pertain to the event or object.
    slot_uri: ocsf:urls
    range: OcsfUrl
    multivalued: true
    inlined_as_list: true
  user:
    title: User
    description: The user that pertains to the event or object.
    slot_uri: ocsf:user
    range: OcsfUser
    inlined: true
  user_result:
    title: User Result
    description: The result of the user account change. It should contain the new values of
      the changed attributes.
    slot_uri: ocsf:user_result
    deprecated: Use the <code>updated_user</code> attribute instead.
    range: OcsfUser
    inlined: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.9.0
      ocsf_superseded_by: updated_user
  users:
    title: Users
    description: The users that pertain to the event or object.
    slot_uri: ocsf:users
    range: OcsfUser
    multivalued: true
    inlined_as_list: true
  vendor_attributes:
    title: Vendor Attributes
    description: The Vendor Attributes object can be used to represent values of attributes
      populated by the Vendor/Finding Provider. It can help distinguish between the vendor-provided
      values and consumer-updated values, of key attributes like <code>severity_id</code>.<br>The
      original finding producer should not populate this object. It should be populated by
      consuming systems that support data mutability.
    slot_uri: ocsf:vendor_attributes
    range: OcsfVendorAttributes
    inlined: true
  vulnerabilities:
    title: Vulnerabilities
    description: This object describes vulnerabilities reported in a security finding.
    slot_uri: ocsf:vulnerabilities
    range: OcsfVulnerability
    multivalued: true
    inlined_as_list: true
  vulnerability:
    title: Vulnerability
    description: The vulnerability object describes details related to the observed vulnerability
    slot_uri: ocsf:vulnerability
    range: OcsfVulnerability
    inlined: true
  web_resources:
    title: Web Resources
    description: Describes details about web resources that were affected by an activity/event.
    slot_uri: ocsf:web_resources
    range: OcsfWebResource
    multivalued: true
    inlined_as_list: true
  web_resources_result:
    title: Web Resources Result
    description: The results of the activity on web resources. It should contain the new values
      of the changed attributes of the web resources.
    slot_uri: ocsf:web_resources_result
    deprecated: Use the <code>updated_web_resources</code> attribute instead.
    range: OcsfWebResource
    multivalued: true
    inlined_as_list: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.9.0
      ocsf_superseded_by: updated_web_resources
  whois:
    title: WHOIS
    description: The resources of a WHOIS record for a given domain. This can include domain
      names, IP address blocks, autonomous system information, and/or contact and registration
      information for a domain.
    slot_uri: ocsf:whois
    range: OcsfWhois
    inlined: true
  win_resource:
    title: Windows Resource
    description: The Windows resource object that was accessed, such as a mutant or timer.
    slot_uri: ocsf:win_resource
    range: OcsfWinResource
    inlined: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_extension: win
  win_service:
    title: Windows Service
    description: The Windows service. See specific usage.
    slot_uri: ocsf:win_service
    range: OcsfWinService
    inlined: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_extension: win
  xattributes:
    title: Extended Attributes
    description: Attributes not present in the schema that extend the class or object. See
      specific usage.
    slot_uri: ocsf:xattributes
    range: OcsfObject
    inlined: true
classes:
  OcsfObjectBase:
    title: Object
    description: The abstract parent of the objects that extend OCSF's object, which adds
      no attribute of its own. OCSF's object itself is OcsfObject, which stays open.
    class_uri: ocsf:OcsfObjectBase
    abstract: true
    annotations:
      ocsf_key: object
    instantiates:
      - ocsf:OcsfFacts
  OcsfAiOperationProfile:
    title: AI Operation
    description: AI-specific attributes for model operations, retrieval systems, and agent
      activities. e.g. model_name, total_token_counts etc.
    class_uri: ocsf:OcsfAiOperationProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: ai_operation
    slots:
      - ai_agent
      - ai_model
      - delegation
      - message_context
    slot_usage:
      ai_agent:
        description: The autonomous AI agent that performed this operation. Carries model
          identity via <code>ai_agent.ai_model</code>. Populate when the action was performed
          by an agent rather than a direct model call.
        annotations:
          ocsf_group: context
          ocsf_profiles: ai_operation
      ai_model:
        description: The AI model involved in this operation. Use for direct model invocations
          where no autonomous agent is involved. For agent-mediated operations, model identity
          is carried within <code>ai_agent.ai_model</code> instead.
        recommended: true
        annotations:
          ocsf_group: context
          ocsf_profiles: ai_operation
      delegation:
        description: The delegation under whose authority this AI operation was performed.
          Links the event to a durable authorization context independent of traces and sessions,
          enabling correlation of all events executed under the same delegated authority.
        annotations:
          ocsf_group: context
          ocsf_profiles: ai_operation
      message_context:
        annotations:
          ocsf_group: context
          ocsf_profiles: ai_operation
  OcsfCloudProfile:
    title: Cloud
    description: The attributes that describe information specific to Cloud services/applications.
    class_uri: ocsf:OcsfCloudProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: cloud
    slots:
      - api
      - cloud
    slot_usage:
      api:
        annotations:
          ocsf_group: context
          ocsf_profiles: cloud
      cloud:
        annotations:
          ocsf_group: primary
          ocsf_profiles: cloud
          ocsf_requirement: required
  OcsfContainerProfile:
    title: Container
    description: The container context for a process.
    class_uri: ocsf:OcsfContainerProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: container
    slots:
      - container
      - namespace_pid
    slot_usage:
      container:
        recommended: true
        annotations:
          ocsf_group: context
          ocsf_profiles: container
      namespace_pid:
        recommended: true
        annotations:
          ocsf_group: context
          ocsf_profiles: container
  OcsfDataClassificationProfile:
    title: Data Classification
    description: The Data Classification profile adds attributes to specific resource objects,
      allowing users to describe information about classifiers & data classification results.
    class_uri: ocsf:OcsfDataClassificationProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: data_classification
    slots:
      - data_classification
      - data_classifications
    slot_usage:
      data_classification:
        deprecated: Use the attribute <code>data_classifications</code> instead
        recommended: true
        annotations:
          ocsf_group: context
          ocsf_profiles: data_classification
          ocsf_deprecated_since: 1.4.0
          ocsf_superseded_by: data_classifications
      data_classifications:
        recommended: true
        annotations:
          ocsf_group: context
          ocsf_profiles: data_classification
  OcsfDatetimeProfile:
    title: Date/Time
    description: When applied, this profile adds a sibling attribute of data type <code>datetime_t</code>
      (RFC-3339 string) wherever a <code>timestamp_t</code> attribute appears in the event
      class. This provides human-readable date/time representations alongside the epoch-millisecond
      timestamps. For example, <code>time</code> (<code>timestamp_t</code>) would gain a <code>time_dt</code>
      (<code>datetime_t</code>) sibling such as <code>"1985-04-12T23:20:50.52Z"</code>.
    class_uri: ocsf:OcsfDatetimeProfile
    mixin: true
    see_also:
      - https://www.rfc-editor.org/rfc/rfc3339.html
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: datetime
  OcsfHostProfile:
    title: Host
    description: Adds host and actor context to event classes. Apply this profile when the
      event originates from or is observed on a specific host or device, and when the initiating
      user, process, or service is known. All event classes include this profile by default
      through the base event.
    class_uri: ocsf:OcsfHostProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: host
    slots:
      - actor
      - device
    slot_usage:
      actor:
        description: The user, process, or service that initiated the activity on the host.
          For system-level events this is typically a process; for IAM events it is typically
          a user or role.
        annotations:
          ocsf_profiles: host
      device:
        description: The host or device where the activity was observed. Populate with details
          such as hostname, IP address, OS, and hardware identifiers when available from the
          source.
        recommended: true
        annotations:
          ocsf_profiles: host
  OcsfIncidentProfile:
    title: Incident
    description: The attributes that add incident handling semantics to a Finding.
    class_uri: ocsf:OcsfIncidentProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: incident
    slots:
      - assignee
      - assignee_group
      - confidence
      - confidence_id
      - impact
      - impact_id
      - impact_score
      - is_suspected_breach
      - priority
      - priority_id
      - src_url
      - ticket
      - tickets
      - verdict
      - verdict_id
    slot_usage:
      assignee:
        annotations:
          ocsf_group: context
          ocsf_profiles: incident
      assignee_group:
        annotations:
          ocsf_group: context
          ocsf_profiles: incident
      confidence:
        annotations:
          ocsf_group: context
          ocsf_profiles: incident
      confidence_id:
        recommended: true
        annotations:
          ocsf_group: context
          ocsf_profiles: incident
          ocsf_sibling: confidence
      impact:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_profiles: incident
      impact_id:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_profiles: incident
          ocsf_sibling: impact
          ocsf_source_note: impact value; impact level
      impact_score:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_profiles: incident
      is_suspected_breach:
        annotations:
          ocsf_group: context
          ocsf_profiles: incident
      priority:
        annotations:
          ocsf_group: context
          ocsf_profiles: incident
      priority_id:
        recommended: true
        annotations:
          ocsf_group: context
          ocsf_profiles: incident
          ocsf_sibling: priority
      src_url:
        description: A Url link used to access the original incident.
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_profiles: incident
      ticket:
        deprecated: Use <code>tickets</code> instead.
        annotations:
          ocsf_group: context
          ocsf_profiles: incident
          ocsf_deprecated_since: 1.5.0
          ocsf_superseded_by: tickets
      tickets:
        annotations:
          ocsf_group: context
          ocsf_profiles: incident
      verdict:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_profiles: incident
      verdict_id:
        recommended: true
        annotations:
          ocsf_group: primary
          ocsf_profiles: incident
          ocsf_sibling: verdict
  OcsfLinuxUsersProfile:
    title: Linux Users
    description: The attributes that Linux uses to identify user information.
    class_uri: ocsf:OcsfLinuxUsersProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: linux/linux_users
    in_subset:
      - ocsf_extension_linux
    slots:
      - auid
      - egid
      - euid
      - group
    slot_usage:
      auid:
        annotations:
          ocsf_profiles: linux/linux_users
      egid:
        annotations:
          ocsf_profiles: linux/linux_users
      euid:
        annotations:
          ocsf_profiles: linux/linux_users
      group:
        description: The group under which this process is running.
        recommended: true
        annotations:
          ocsf_profiles: linux/linux_users
  OcsfLoadBalancerProfile:
    title: Load Balancer
    description: The attributes that describe information specific to load balancers.
    class_uri: ocsf:OcsfLoadBalancerProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: load_balancer
    slots:
      - load_balancer
    slot_usage:
      load_balancer:
        recommended: true
        annotations:
          ocsf_profiles: load_balancer
  OcsfMacosUsersProfile:
    title: macOS Users
    description: The attributes that macOS uses to identify user information.
    class_uri: ocsf:OcsfMacosUsersProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: macos/macos_users
    in_subset:
      - ocsf_extension_macos
    slots:
      - egid
      - euid
    slot_usage:
      egid:
        annotations:
          ocsf_profiles: macos/macos_users
      euid:
        annotations:
          ocsf_profiles: macos/macos_users
  OcsfNetworkProxyProfile:
    title: Network Proxy
    description: The attributes that identify network proxy attributes.
    class_uri: ocsf:OcsfNetworkProxyProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: network_proxy
    slots:
      - proxy_connection_info
      - proxy_endpoint
      - proxy_http_request
      - proxy_http_response
      - proxy_tls
      - proxy_traffic
    slot_usage:
      proxy_connection_info:
        recommended: true
        annotations:
          ocsf_profiles: network_proxy
      proxy_endpoint:
        annotations:
          ocsf_profiles: network_proxy
      proxy_http_request:
        annotations:
          ocsf_profiles: network_proxy
      proxy_http_response:
        annotations:
          ocsf_profiles: network_proxy
      proxy_tls:
        recommended: true
        annotations:
          ocsf_profiles: network_proxy
      proxy_traffic:
        recommended: true
        annotations:
          ocsf_profiles: network_proxy
  OcsfOsintProfile:
    title: OSINT
    description: The OSINT (Open Source Intelligence) profile contains one or more indicators
      and associated analysis and details, such as registrar (WHOIS) information and commentary
      about a hostname, or information about a digital certificate and its usage within a
      campaign. This information can be used to further enrich a detection or finding by providing
      decisioning support to other analysts and engineers within the profile itself.
    class_uri: ocsf:OcsfOsintProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: osint
    slots:
      - osint
    slot_usage:
      osint:
        annotations:
          ocsf_group: primary
          ocsf_profiles: osint
          ocsf_requirement: required
  OcsfRecordIntegrityProfile:
    title: Record Integrity
    description: The Record Integrity profile adds one or more cryptographic attestations
      over the event itself, providing integrity, authenticity, and non-repudiation independent
      of any domain-specific content. It is domain-agnostic and may be applied to any event
      class. Each attestation is computed over a canonical serialization of the event; independent
      attesters over the same event each contribute a separate entry in <code>attestation_list</code>,
      while multiple signers of a single attestation, such as a producer plus a co-signature,
      notary, or witness, are carried in that attestation's <code>signatures</code> array,
      and a sequence of events may form a tamper-evident hash chain.
    class_uri: ocsf:OcsfRecordIntegrityProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: record_integrity
    slots:
      - attestation_list
    slot_usage:
      attestation_list:
        annotations:
          ocsf_group: context
          ocsf_profiles: record_integrity
  OcsfSecurityControlProfile:
    title: Security Control
    description: The attributes including disposition that represent the outcome of a security
      control including but not limited to access control, malware or policy violation, network
      proxy, intrusion detection, firewall, or data control.  The profile is intended to augment
      activities or findings with an outcome when a security control has observed or intervened.
      If the control detected a security violation, and the <code>disposition_id</code> or
      <code>action_id</code> is an alertable outcome or action, the <code>is_alert</code>
      flag may be set to <code>true</code>.
    class_uri: ocsf:OcsfSecurityControlProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: security_control
    slots:
      - action
      - action_id
      - attacks
      - authorizations
      - confidence
      - confidence_id
      - confidence_score
      - disposition
      - disposition_id
      - firewall_rule
      - is_alert
      - malware
      - malware_scan_info
      - policy
      - risk_details
      - risk_level
      - risk_level_id
      - risk_score
    slot_usage:
      action:
        description: The normalized caption of <code>action_id</code>.
        annotations:
          ocsf_profiles: security_control
      action_id:
        description: The action taken by a control or other policy-based system leading to
          an outcome or disposition. An unknown action may still correspond to a known disposition.
          Refer to <code>disposition_id</code> for the outcome of the action.
        recommended: true
        annotations:
          ocsf_profiles: security_control
          ocsf_sibling: action
      attacks:
        annotations:
          ocsf_profiles: security_control
      authorizations:
        annotations:
          ocsf_profiles: security_control
      confidence:
        annotations:
          ocsf_group: context
          ocsf_profiles: security_control
      confidence_id:
        description: The normalized confidence refers to the accuracy of the security control
          or alert. An analytic with a low confidence means that the alerts may be noisy or
          may not be malicious in nature.
        recommended: true
        annotations:
          ocsf_group: context
          ocsf_profiles: security_control
          ocsf_sibling: confidence
      confidence_score:
        description: The confidence score as reported by the event source. If <code>confidence_id</code>
          is 99 'Other', it should be the same as <code>confidence</code> if both are populated.
        annotations:
          ocsf_group: context
          ocsf_profiles: security_control
      disposition:
        annotations:
          ocsf_profiles: security_control
      disposition_id:
        recommended: true
        annotations:
          ocsf_profiles: security_control
          ocsf_sibling: disposition
      firewall_rule:
        description: The firewall rule that pertains to the control that triggered the event,
          if applicable.
        annotations:
          ocsf_profiles: security_control
      is_alert:
        description: Indicates that the event is considered to be an alertable signal. Should
          be set to <code>true</code> if <code>disposition_id = Alert</code> among other dispositions,
          and/or <code>risk_level_id</code> or <code>severity_id</code> of the event is elevated.
          Not all control events will be alertable, for example if <code>disposition_id =
          Exonerated</code> or <code>disposition_id = Allowed</code>.
        recommended: true
        annotations:
          ocsf_profiles: security_control
      malware:
        annotations:
          ocsf_profiles: security_control
      malware_scan_info:
        annotations:
          ocsf_profiles: security_control
      policy:
        description: The policy that pertains to the control that triggered the event, if
          applicable. For example the name of an anti-malware policy or an access control
          policy.
        annotations:
          ocsf_profiles: security_control
      risk_details:
        annotations:
          ocsf_group: context
          ocsf_profiles: security_control
      risk_level:
        annotations:
          ocsf_group: context
          ocsf_profiles: security_control
      risk_level_id:
        annotations:
          ocsf_group: context
          ocsf_profiles: security_control
          ocsf_sibling: risk_level
          ocsf_suppress_checks: enum_convention
      risk_score:
        annotations:
          ocsf_group: context
          ocsf_profiles: security_control
  OcsfTraceProfile:
    title: Trace
    description: The Trace Profile extends the OCSF framework to capture and standardize observability
      events, specifically targeting trace-level data. This profile enables integration and
      normalization of distributed tracing information, allowing OCSF events to retain essential
      trace context such as trace IDs, span relationships, and service dependencies.
    class_uri: ocsf:OcsfTraceProfile
    mixin: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: trace
    slots:
      - trace
    slot_usage:
      trace:
        description: The trace object contains information about distributed traces which
          are critical to observability and describe how requests move through a system, capturing
          each step's timing and status.
        recommended: true
        annotations:
          ocsf_profiles: trace
  OcsfEntity:
    title: Entity
    description: The Entity object is an unordered collection of attributes, with a name and
      unique identifier. It serves as a base object that defines a set of attributes and default
      constraints available in all objects that extend it.
    class_uri: ocsf:OcsfEntity
    abstract: true
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: _entity
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    slots:
      - name
      - uid
      - uid_numeric
    slot_usage:
      name:
        description: The name of the entity.
        recommended: true
      uid:
        description: The unique identifier of the entity.
        recommended: true
      uid_numeric:
        description: The <code>uid</code> attribute in numeric form where applicable.<br><strong>Note:</strong>
          Producers may populate <code>uid_numeric</code> only in addition to <code>uid</code>
          and not as an alternative to it.
  OcsfResource:
    title: Resource
    description: The Resource object contains attributes that provide information about a
      particular resource. It serves as a base object, offering attributes that help identify
      and classify the resource effectively.
    class_uri: ocsf:OcsfResource
    abstract: true
    is_a: OcsfEntity
    mixins:
      - OcsfDataClassificationProfile
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: _resource
      ocsf_profiles: data_classification
    slots:
      - created_time
      - data
      - labels
      - modified_time
      - tags
      - type
      - uid_alt
    slot_usage:
      created_time:
        description: The time when the resource was created.
      data:
        description: Additional data describing the resource.
      labels:
        description: The list of labels associated to the resource.
      modified_time:
        description: The time when the resource was last modified.
      name:
        description: The name of the resource.
      tags:
        description: The list of tags; <code>{key:value}</code> pairs associated to the resource.
      type:
        description: The resource type as defined by the event source.
      uid:
        description: The unique identifier of the resource.
      uid_alt:
        description: The alternative unique identifier of the resource.
  OcsfAccessAnalysisResult:
    title: Access Analysis Result
    description: The Access Analysis Result object describes access relationships and pathways
      between identities, resources, focusing on who can access what and through which mechanisms.
      This evaluates access levels (read/write/admin), access types (direct, cross-account,
      public, federated), and the conditions under which access is granted. Use this for resource-centric
      security assessments such as external access discovery, public exposure analysis, etc.
    class_uri: ocsf:OcsfAccessAnalysisResult
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: access_analysis_result
    slots:
      - access_level
      - access_type
      - accessors
      - additional_restrictions
      - condition_keys
      - granted_privileges
    slot_usage:
      access_level:
        description: The generalized access level or permission scope granted to the identity
          through the analyzed policy configuration. Common examples include Read, Write,
          List, Delete, Admin, or custom permission levels.
        recommended: true
      access_type:
        description: The type or category of access being granted to the identity. This describes
          the nature of the access relationship, such as cross-account access, public access,
          federated access, or third-party integration access. Examples include 'Cross-Account',
          'Public', 'Federated', 'Service-to-Service', etc.
      accessors:
        description: The identities that are granted access through the analyzed policy configuration.
          This identifies the specific entity that can exercise the permissions and helps
          assess the access relationship and potential security implications. Examples include
          user accounts, service principals, roles, account identifiers, or system identities.
        required: true
      additional_restrictions:
        description: Details about supplementary restrictions and guardrails that may limit
          the granted access, applied through additional policy types such as Resource Control
          Policies (RCPs) and Service Control Policies (SCPs) in AWS, or other policy constraints.
      condition_keys:
        description: 'The condition keys and their values that constrain when and how the
          granted access can be exercised. These conditions define the circumstances under
          which the access relationship is valid and the privileges can be used. Examples:
          IP address restrictions like ''aws:SourceIp:192.0.2.0/24'', time-based constraints
          like ''aws:RequestedRegion:us-east-1'', MFA requirements like ''aws:MultiFactorAuthPresent:true'',
          or custom conditions based on resource tags and request context.'
      granted_privileges:
        description: 'The specific privileges, actions, or permissions that are granted through
          the analyzed access relationship. This includes the actual operations that the accessor
          can perform on the target resource. Examples: AWS actions like ''sts:AssumeRole'',
          ''s3:GetObject'', ''ec2:DescribeInstances''; Azure actions like ''Microsoft.Storage/storageAccounts/read'';
          or GCP permissions like ''storage.objects.get''.'
  OcsfAccount:
    title: Account
    description: The Account object contains details about the account that initiated or performed
      a specific activity within a system or application. Additionally, the Account object
      refers to logical Cloud and Software-as-a-Service (SaaS) based containers such as AWS
      Accounts, Azure Subscriptions, Oracle Cloud Compartments, Google Cloud Projects, and
      otherwise.
    class_uri: ocsf:OcsfAccount
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:UserAccount/
      - https://d3fend.mitre.org/dao/artifact/d3f:CloudUserAccount/
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: account
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    related_mappings:
      - d3f:CloudUserAccount
      - d3f:UserAccount
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - is_disabled
      - is_locked
      - is_on_premises_sync_enabled
      - labels
      - tags
      - type
      - type_id
    slot_usage:
      is_disabled:
        description: Indicates if the account is disabled.
      is_locked:
        description: Indicates if the account is locked. For example, due to the amount of
          failed logins.
      labels:
        description: The list of labels associated to the account.
      name:
        description: The name of the account (e.g. <code> GCP Project name </code>, <code>
          Linux Account name </code> or <code> AWS Account name</code>).
        annotations:
          ocsf_observable: '34'
      tags:
        description: The list of tags; <code>{key:value}</code> pairs associated to the account.
      type:
        description: The account type, normalized to the caption of 'account_type_id'. In
          the case of 'Other', it is defined by the event source.
      type_id:
        description: The normalized account type identifier.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The account type is unknown.
          - equals_number: 1
            title: LDAP Account
          - equals_number: 2
            title: Windows Account
          - equals_number: 3
            title: AWS IAM User
            deprecated: Utilize <code>user.type_id</code> to represent this information.
            annotations:
              ocsf_deprecated_since: 1.6.0
              ocsf_superseded_by: user.type_id
          - equals_number: 4
            title: AWS IAM Role
            deprecated: Utilize <code>user.type_id</code> to represent this information.
            annotations:
              ocsf_deprecated_since: 1.6.0
              ocsf_superseded_by: user.type_id
          - equals_number: 5
            title: GCP Account
          - equals_number: 6
            title: Azure AD Account
            description: 'Note: The new product name for Azure AD is Microsoft Entra ID.'
          - equals_number: 7
            title: Mac OS Account
          - equals_number: 8
            title: Apple Account
          - equals_number: 9
            title: Linux Account
          - equals_number: 10
            title: AWS Account
          - equals_number: 11
            title: GCP Project
          - equals_number: 12
            title: OCI Compartment
          - equals_number: 13
            title: Azure Subscription
          - equals_number: 14
            title: Salesforce Account
          - equals_number: 15
            title: Google Workspace
          - equals_number: 16
            title: Servicenow Instance
          - equals_number: 17
            title: M365 Tenant
          - equals_number: 18
            title: Email Account
          - equals_number: 19
            title: ActiveDirectory Account
          - equals_number: 99
            title: Other
            description: The account type is not mapped.
        recommended: true
      uid:
        description: The unique identifier of the account (e.g. <code> AWS Account ID </code>,
          <code> OCID </code>, <code> GCP Project ID </code>, <code> Azure Subscription ID
          </code>, <code> Google Workspace Customer ID </code>, or <code> M365 Tenant UID</code>).
        annotations:
          ocsf_observable: '35'
  OcsfActor:
    title: Actor
    description: The Actor object contains details about the user, role, application, service,
      or process that initiated or performed a specific activity. Note that Actor is not the
      threat actor of a campaign but may be part of a campaign. When the initiator of the
      activity is an autonomous AI agent, apply the <code>ai_operation</code> profile and
      populate <code>ai_operation.ai_agent</code> rather than describing the agent here.
    class_uri: ocsf:OcsfActor
    see_also:
      - https://next.d3fend.mitre.org/agent/d3f:Agent/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: actor
      ocsf_profiles: cloud container data_classification linux/linux_users macos/macos_users
      ocsf_constraints: '{"at_least_one": ["process", "user", "iam_role", "invoked_by", "session",
        "application", "app_name", "app_uid"]}'
    related_mappings:
      - d3f:Agent
    any_of:
      - slot_conditions:
          process:
            required: true
      - slot_conditions:
          user:
            required: true
      - slot_conditions:
          iam_role:
            required: true
      - slot_conditions:
          invoked_by:
            required: true
      - slot_conditions:
          session:
            required: true
      - slot_conditions:
          application:
            required: true
      - slot_conditions:
          app_name:
            required: true
      - slot_conditions:
          app_uid:
            required: true
    slots:
      - app_name
      - app_uid
      - application
      - authorizations
      - iam_role
      - idp
      - invoked_by
      - process
      - session
      - user
    slot_usage:
      app_name:
        description: The client application or service that initiated the activity. This can
          be in conjunction with the <code>user</code> if present.  Note that <code>app_name</code>
          is distinct from the <code>process</code> if present.
        deprecated: Use the <code>application.name</code> attribute instead.
        annotations:
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: application.name
      app_uid:
        description: The unique identifier of the client application or service that initiated
          the activity. This can be in conjunction with the <code>user</code> if present.
          Note that <code>app_name</code> is distinct from the <code>process.pid</code> or
          <code>process.uid</code> if present.
        deprecated: Use the <code>application.uid</code> attribute instead.
        annotations:
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: application.uid
      application:
        description: The client application or service that initiated the activity. This can
          be in conjunction with the <code>user</code> if present. Note that <code>application</code>
          is distinct from the <code>process</code> if present.
        recommended: true
      iam_role:
        description: The actor's role, or as an alternative to <code>user</code> or <code>process</code>
          when the role is serving as a security principal for the operation that initiated
          the activity.
      invoked_by:
        deprecated: Use the <code>application</code> attribute instead.
        annotations:
          ocsf_deprecated_since: 1.2.0
          ocsf_superseded_by: application
      process:
        description: The process that initiated the activity.
        recommended: true
      session:
        description: The user session from which the activity was initiated.
      user:
        description: The user that initiated the activity or the user context from which the
          activity was initiated.
        recommended: true
  OcsfAdditionalRestriction:
    title: Additional Restriction
    description: The Additional Restriction object describes supplementary access controls
      and guardrails that constrain or limit granted permissions beyond the primary policy.
      These restrictions are typically applied through hierarchical policy frameworks, organizational
      controls, or conditional access mechanisms. Examples include AWS Service Control Policies
      (SCPs), Resource Control Policies (RCPs), Azure Management Group policies, GCP Organization
      policies, conditional access policies, IP restrictions, time-based constraints, and
      MFA requirements.
    class_uri: ocsf:OcsfAdditionalRestriction
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: additional_restriction
    slots:
      - policy
      - status
      - status_id
    slot_usage:
      policy:
        description: Detailed information about the policy document that defines this restriction,
          including policy metadata, type, scope, and the specific rules or conditions that
          implement the access control.
        required: true
      status:
        description: The current status of the policy restriction, normalized to the caption
          of the <code>status_id</code> enum value.
      status_id:
        description: The normalized status identifier indicating the applicability of this
          policy restriction.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The status is unknown.
          - equals_number: 1
            title: Applicable
            description: This restriction is currently applicable and being enforced.
          - equals_number: 2
            title: Inapplicable
            description: This restriction is not applicable.
          - equals_number: 3
            title: Evaluation Error
            description: This restriction could not be properly evaluated due to an error.
          - equals_number: 99
            title: Other
            description: The status is not mapped. See the <code>status</code> attribute,
              which contains a data source specific value.
        recommended: true
  OcsfAdvisory:
    title: Advisory
    description: The Advisory object represents publicly disclosed cybersecurity vulnerabilities
      defined in a Security advisory. e.g. <code> Microsoft KB Article</code>, <code>Apple
      Security Advisory</code>, or a <code>GitHub Security Advisory (GHSA)</code>
    class_uri: ocsf:OcsfAdvisory
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: advisory
      ocsf_profiles: data_classification datetime
    slots:
      - avg_timespan
      - bulletin
      - classification
      - created_time
      - created_time_dt
      - desc
      - install_state
      - install_state_id
      - is_superseded
      - modified_time
      - modified_time_dt
      - os
      - product
      - references
      - related_cves
      - related_cwes
      - size
      - src_url
      - title
      - uid
    slot_usage:
      avg_timespan:
        description: The average time to patch.
      bulletin:
        description: The Advisory bulletin identifier.
      classification:
        description: The vendors classification of the Advisory.
      created_time:
        description: The time when the Advisory record was created.
        recommended: true
      created_time_dt:
        description: The time when the Advisory record was created.
        annotations:
          ocsf_profiles: datetime
      desc:
        description: A brief description of the Advisory Record.
      install_state:
        description: The install state of the Advisory.
        recommended: true
      install_state_id:
        description: The normalized install state ID of the Advisory.
        recommended: true
      is_superseded:
        description: The Advisory has been replaced by another.
      modified_time:
        description: The time when the Advisory record was last updated.
      modified_time_dt:
        description: The time when the Advisory record was last updated.
        annotations:
          ocsf_profiles: datetime
      os:
        description: The operating system the Advisory applies to.
        recommended: true
      product:
        description: The product where the vulnerability was discovered.
      references:
        description: A list of reference URLs with additional information about the vulnerabilities
          disclosed in the Advisory.
        recommended: true
      related_cves:
        description: A list of Common Vulnerabilities and Exposures (CVE) identifiers related
          to the vulnerabilities disclosed in the Advisory.
        see_also:
          - https://cve.org/
      related_cwes:
        description: A list of Common Weakness Enumeration (CWE) identifiers related to the
          vulnerabilities disclosed in the Advisory.
      size:
        description: The size in bytes for the Advisory. Usually populated for a KB Article
          patch.
      src_url:
        description: The Advisory link from the source vendor.
      title:
        description: A title or a brief phrase summarizing the Advisory.
        recommended: true
      uid:
        title: Advisory ID
        description: The unique identifier assigned to the advisory or disclosed vulnerability,
          e.g, <code>GHSA-5mrr-rgp6-x4gr</code>.
        required: true
        annotations:
          ocsf_observable: '44'
  OcsfAffectedCode:
    title: Affected Code
    description: The Affected Code object describes details about a code block identified
      as vulnerable.
    class_uri: ocsf:OcsfAffectedCode
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: affected_code
      ocsf_profiles: container data_classification
    slots:
      - end_column
      - end_line
      - file
      - owner
      - remediation
      - rule
      - start_column
      - start_line
    slot_usage:
      end_column:
        description: The column number of the last part of the assessed code identified as
          vulnerable.
        recommended: true
      end_line:
        recommended: true
      file:
        description: Details about the file that contains the affected code block.
        required: true
      owner:
        description: Details about the user that owns the affected file.
      rule:
        title: Related Rule
        description: Details about the specific rule, e.g., those defined as part of a larger
          <code>policy</code>, that triggered the finding.
        recommended: true
      start_column:
        description: The column number of the first part of the assessed code identified as
          vulnerable.
        recommended: true
      start_line:
        recommended: true
  OcsfPackage:
    title: Software Package
    description: The Software Package object describes details about a software package.
    class_uri: ocsf:OcsfPackage
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:SoftwarePackage/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: package
    related_mappings:
      - d3f:SoftwarePackage
    slots:
      - architecture
      - cpe_name
      - epoch
      - hash
      - license
      - license_url
      - name
      - package_manager
      - package_manager_url
      - purl
      - release
      - src_url
      - type
      - type_id
      - uid
      - vendor_name
      - version
    slot_usage:
      architecture:
        recommended: true
      hash:
        description: Cryptographic hash to identify the binary instance of a software component.
          This can include any component such file, package, or library.
      license:
        description: The software license applied to this package.
      name:
        description: The software package name.
        required: true
      src_url:
        description: The link to the specific library or package such as within <code>GitHub</code>,
          this is different from the link to the package manager where the library or package
          is hosted.
      type:
        description: The type of software package, normalized to the caption of the <code>type_id</code>
          value. In the case of 'Other', it is defined by the source.
      type_id:
        description: The type of software package.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: Application
            description: An application software package.
          - equals_number: 2
            title: Operating System
            description: An operating system software package.
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        recommended: true
      uid:
        title: Package UID
        description: A unique identifier for the package or library reported by the source
          tool. E.g., the <code>libId</code> within the <code>sbom</code> field of an OX Security
          Issue or the SPDX <code>components.*.bom-ref</code>.
      vendor_name:
        description: The name of the vendor who published the software package.
      version:
        description: The software package version.
        required: true
  OcsfAffectedPackage:
    title: Affected Software Package
    description: The Affected Package object describes details about a software package identified
      as affected by a vulnerability/vulnerabilities.
    class_uri: ocsf:OcsfAffectedPackage
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:SoftwarePackage/
    is_a: OcsfPackage
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: affected_package
      ocsf_profiles: data_classification
    related_mappings:
      - d3f:SoftwarePackage
    slots:
      - fixed_in_version
      - path
      - remediation
    slot_usage:
      path:
        description: The installation path of the affected package.
        range: ocsf_file_path_t
  OcsfAgent:
    title: Agent
    description: An Agent (also known as a Sensor) is typically installed on an Operating
      System (OS) and serves as a specialized software component that can be designed to monitor,
      detect, collect, archive, or take action. These activities and possible actions are
      defined by the upstream system controlling the Agent and its intended purpose. For instance,
      an Agent can include Endpoint Detection & Response (EDR) agents, backup/disaster recovery
      sensors, Application Performance Monitoring or profiling sensors, and similar software.
    class_uri: ocsf:OcsfAgent
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:Sensor/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: agent
      ocsf_constraints: '{"at_least_one": ["uid", "name"]}'
    related_mappings:
      - d3f:Sensor
    any_of:
      - slot_conditions:
          uid:
            required: true
      - slot_conditions:
          name:
            required: true
    slots:
      - name
      - policies
      - type
      - type_id
      - uid
      - uid_alt
      - vendor_name
      - version
    slot_usage:
      name:
        title: Agent Name
        description: 'The name of the agent or sensor. For example: <code>AWS SSM Agent</code>.'
        recommended: true
      policies:
        title: Agent Policies
        description: Describes the various policies that may be applied or enforced by an
          agent or sensor. E.g., Conditional Access, prevention, auto-update, tamper protection,
          destination configuration, etc.
      type:
        title: Agent Type
        description: The normalized caption of the type_id value for the agent or sensor.
          In the case of 'Other' or 'Unknown', it is defined by the event source.
      type_id:
        description: The normalized representation of an agent or sensor. E.g., EDR, vulnerability
          management, APM, backup & recovery, etc.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: Endpoint Detection and Response
            description: Any EDR sensor or agent. Or any tool that provides similar threat
              detection, anti-malware, anti-ransomware, or similar capabilities. E.g., Crowdstrike
              Falcon, Microsoft Defender for Endpoint, Wazuh.
          - equals_number: 2
            title: Data Loss Prevention
            description: Any DLP sensor or agent. Or any tool that provides similar data classification,
              data loss detection, and/or data loss prevention capabilities. E.g., Forcepoint
              DLP, Microsoft Purview, Symantec DLP.
          - equals_number: 3
            title: Backup & Recovery
            description: Any agent or sensor that provides backups, archival, or recovery
              capabilities. E.g., Azure Backup, AWS Backint Agent.
          - equals_number: 4
            title: Performance Monitoring & Observability
            description: Any agent or sensor that provides Application Performance Monitoring
              (APM), active tracing, profiling, or other observability use cases and optionally
              forwards the logs. E.g., New Relic Agent, Datadog Agent, Azure Monitor Agent.
          - equals_number: 5
            title: Vulnerability Management
            description: Any agent or sensor that provides vulnerability management or scanning
              capabilities. E.g., Qualys VMDR, Microsoft Defender for Endpoint, Crowdstrike
              Spotlight, Amazon Inspector Agent.
          - equals_number: 6
            title: Log Forwarding
            description: Any agent or sensor that forwards logs to a 3rd party storage system
              such as a data lake or SIEM. E.g., Splunk Universal Forwarder, Tenzir, FluentBit,
              Amazon CloudWatch Agent, Amazon Kinesis Agent.
          - equals_number: 7
            title: Mobile Device Management
            description: Any agent or sensor responsible for providing Mobile Device Management
              (MDM) or Mobile Enterprise Management (MEM) capabilities. E.g., JumpCloud Agent,
              Esper Agent, Jamf Pro binary.
          - equals_number: 8
            title: Configuration Management
            description: Any agent or sensor that provides configuration management of a device,
              such as scanning for software, license management, or applying configurations.
              E.g., AWS Systems Manager Agent, Flexera, ServiceNow MID Server.
          - equals_number: 9
            title: Remote Access
            description: Any agent or sensor that provides remote access capabilities to a
              device. E.g., BeyondTrust, Amazon Systems Manager Agent, Verkada Agent.
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        recommended: true
      uid:
        title: Agent ID
        description: The UID of the agent or sensor, sometimes known as a Sensor ID or <code>aid</code>.
        recommended: true
      uid_alt:
        title: Alternate Agent ID
        description: An alternative or contextual identifier for the agent or sensor, such
          as a configuration, organization, or license UID.
      vendor_name:
        description: 'The company or author who created the agent or sensor. For example:
          <code>Crowdstrike</code>.'
      version:
        title: Agent Version
        description: The semantic version of the agent or sensor, e.g., <code>7.101.50.0</code>.
  OcsfAiAgent:
    title: AI Agent
    description: An autonomous AI agent that performs tasks under delegated authority. Distinguished
      from the OCSF agent object (which describes security sensors such as EDR and DLP tools)
      and from human principals. An AI agent has a stable logical identity across runs and
      a restart-sensitive instance identity. The agent owns its model; the ai_model attribute
      captures which model was backing the agent at the time of action.
    class_uri: ocsf:OcsfAiAgent
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: ai_agent
      ocsf_profiles: container data_classification
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - ai_model
      - charter
      - instance_uid
      - type
      - type_id
      - version
    slot_usage:
      ai_model:
        description: The AI model backing this agent at the time of the recorded event. An
          agent's model may change across instances or versions; this captures the model in
          use for the specific logged activity or delegation.
        recommended: true
      charter:
        title: Agent Charter
        description: A document that defines an AI agent's durable role, responsibilities,
          constraints, and operating boundaries. When available, populate <code>hashes</code>
          on the file for content integrity and <code>signatures</code> for provenance. Integrity
          of the event that reports this agent is provided separately by the <code>record_integrity</code>
          profile.
      instance_uid:
        title: AI Agent Instance ID
        description: 'Identifier for a specific running instance or session of the agent,
          distinct from the stable logical <code>uid</code>. An instance is a single materialization
          of the agent: a conversation, session, or run. It may persist across restarts (a
          session that is suspended and later resumed keeps the same <code>instance_uid</code>)
          and may span multiple cooperating runtime components, so several events can share
          one <code>instance_uid</code>. Enables attribution of actions to a particular instance
          of the agent rather than to the agent generally.'
        recommended: true
      name:
        description: 'Human-readable name for the agent. For example: <code>Q4 Analysis Agent</code>
          or <code>Model Tester Agent</code>.'
      type:
        title: Agent Type
        description: The agent framework, normalized to the caption of the <code>type_id</code>
          value.
      type_id:
        title: Agent Type ID
        description: The normalized identifier for the agent framework. Different agent frameworks
          have different identity, tool-call, and delegation semantics, so recording the framework
          enables cross-framework normalization. Communication protocols (e.g., MCP, A2A)
          are a property of individual operations rather than the agent itself, and are surfaced
          on the relevant operation rather than here.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The agent framework is unknown.
          - equals_number: 1
            title: Native
            description: A first-party or proprietary agent built without a third-party agent
              framework. For example, a custom orchestrator or an LLM provider's own agent
              SDK.
          - equals_number: 2
            title: LangChain
            description: An agent built with the LangChain framework.
          - equals_number: 3
            title: AutoGen
            description: An agent built with the AutoGen framework for multi-agent conversation
              and orchestration.
          - equals_number: 4
            title: CrewAI
            description: An agent built with the CrewAI framework for role-based multi-agent
              collaboration.
          - equals_number: 99
            title: Other
            description: The agent framework is not listed. Use the <code>type</code> attribute
              to describe it.
        recommended: true
      uid:
        title: AI Agent ID
        description: 'The stable logical identifier for the agent, assigned by the agent''s
          authoritative source (e.g., its control plane, registry, or issuing identity provider).
          Persists across restarts and instances. Producers populate this from whatever identity
          they observe: for a runtime that owns the agent, this is its issued ID; for a gateway
          or proxy, it is typically derived from the agent''s credential. Multiple producers
          logging the same agent should converge on the same <code>uid</code> when they share
          an authoritative source.'
      version:
        title: AI Agent Version
        description: 'The version of the agent: the agent''s own code or configuration revision
          (e.g., <code>1.4.2</code>), distinct from the version of the model backing it (carried
          on <code>ai_model.version</code>). Enables correlation of behavioral changes with
          charter or configuration revisions across agent versions.'
        recommended: true
  OcsfAiModel:
    title: AI Model
    description: The AI Model object describes the characteristics of an AI/ML model. Examples
      include language models like GPT-4, embedding models like text-embedding-ada-002, and
      computer vision models like CLIP.
    class_uri: ocsf:OcsfAiModel
    see_also:
      - https://huggingface.co/docs/hub/models
      - https://platform.openai.com/docs/models
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: ai_model
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - ai_provider
      - version
    slot_usage:
      ai_provider:
        description: 'AI service provider or organization name. For example: <code>OpenAI</code>,
          <code>Anthropic</code>, <code>Google</code>, or <code>Internal</code>.'
        required: true
      name:
        description: 'Human-readable model name. For example: <code>gpt-4o</code>, <code>claude-3-sonnet</code>,
          or <code>text-embedding-ada-002</code>.'
        required: true
        recommended: false
      uid:
        description: The unique identifier of the AI model.
      version:
        description: 'Model version identifier. For example: <code>2024-05-13</code>, <code>v2.1.0</code>,
          or <code>beta</code>.'
        recommended: true
  OcsfAircraft:
    title: Aircraft
    description: The Aircraft object represents any aircraft or otherwise airborne asset such
      as an unmanned system, airplane, balloon, spacecraft, or otherwise. The Aircraft object
      is intended to normalized data captured or otherwise logged from active radar, passive
      radar, multi-spectral systems, or the Automatic Dependant Broadcast - Surveillance (ADS-B),
      and/or Mode S systems.
    class_uri: ocsf:OcsfAircraft
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: aircraft
      ocsf_constraints: '{"at_least_one": ["name", "serial_number", "uid", "uid_alt"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          serial_number:
            required: true
      - slot_conditions:
          uid:
            required: true
      - slot_conditions:
          uid_alt:
            required: true
    slots:
      - location
      - model
      - serial_number
      - speed
      - speed_accuracy
      - track_direction
      - uid_alt
      - vertical_speed
    slot_usage:
      location:
        recommended: true
      model:
        description: The model name of the aircraft or unmanned system.
      name:
        description: The name of the aircraft, such as the such as the flight name or callsign.
      serial_number:
        description: The serial number of the aircraft.
      uid:
        description: The primary identification identifier for an aircraft, such as the 24-bit
          International Civil Aviation Organization (ICAO) identifier of the aircraft, as
          6 hex digits.
      uid_alt:
        description: A secondary identification identifier for an aircraft, such as the 4-digit
          squawk (octal representation).
  OcsfAnalysisTarget:
    title: Analysis Target
    description: The analysis target defines the scope of monitored activities, specifying
      what entity, system or process is analyzed for activity patterns.
    class_uri: ocsf:OcsfAnalysisTarget
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: analysis_target
    slots:
      - name
      - type
    slot_usage:
      name:
        description: The specific name or identifier of the analysis target, such as the username
          of a User Account, the name of a Kubernetes Cluster, the identifier of a Network
          Namespace, or the name of an Application Component.
        required: true
      type:
        description: The category of the analysis target, such as User Account, Kubernetes
          Cluster, Network Namespace, or Application Component.
  OcsfAnalytic:
    title: Analytic
    description: The Analytic object contains details about the analytic technique used to
      analyze and derive insights from the data or information that led to the creation of
      a finding or conclusion.
    class_uri: ocsf:OcsfAnalytic
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: analytic
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - algorithm
      - category
      - desc
      - related_analytics
      - sensor_info_list
      - state
      - state_id
      - type
      - type_id
      - version
    slot_usage:
      algorithm:
        description: The algorithm used by the underlying analytic to generate the finding.
      category:
        description: The analytic category.
      desc:
        description: The description of the analytic that generated the finding.
      name:
        description: The name of the analytic that generated the finding.
      related_analytics:
        description: Other analytics related to this analytic.
        deprecated: Related Analytics has been decoupled from this object, instead use <code>finding_info.related_analytics</code>.
        annotations:
          ocsf_deprecated_since: 1.0.0
          ocsf_superseded_by: finding_info.related_analytics
      sensor_info_list:
        description: An array of <code>sensor_info</code> objects, each describing a sensor
          control point analyzed or correlated by the analytic. Each element typically represents
          a source of <code>related_events</code> that contributed to the finding. An individual
          sensor control point may also directly originate the finding, though more commonly
          it emits alerts that a downstream consumer treats as findings.
      state:
        description: The Analytic state.
      state_id:
        description: The Analytic state identifier.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The state is unknown.
          - equals_number: 1
            title: Active
            description: The Analytic is active.
          - equals_number: 2
            title: Suppressed
            description: The Analytic is suppressed. For example, a user/customer has suppressed
              a particular detection signature in a security product.
          - equals_number: 3
            title: Experimental
            description: The Analytic is still under development and considered experimental.
          - equals_number: 99
            title: Other
            description: The state is not mapped. See the <code>state</code> attribute, which
              contains a data source specific value.
      type:
        description: The analytic type.
      type_id:
        description: The analytic type ID.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: Rule
            description: A Rule in security analytics refers to predefined criteria or conditions
              set to monitor, alert, or enforce policies, playing a crucial role in access
              control, threat detection, and regulatory compliance across security systems.
          - equals_number: 2
            title: Behavioral
            description: Behavioral analytics focus on monitoring and analyzing user or system
              actions to identify deviations from established patterns, aiding in the detection
              of insider threats, fraud, and advanced persistent threats (APTs).
          - equals_number: 3
            title: Statistical
            description: Statistical analytics pertains to analyzing data patterns and anomalies
              using statistical models to predict, detect, and respond to potential threats,
              enhancing overall security posture through informed decision-making.
          - equals_number: 4
            title: Learning (ML/DL)
            description: Learning (ML/DL) encompasses techniques that can "learn" from known
              data to create analytics that generalize to new data. There may be a statistical
              component to these techniques, but it is not a requirement.
          - equals_number: 5
            title: Fingerprinting
            description: Fingerprinting is the technique of collecting detailed system data,
              including software versions and configurations, to enhance threat detection,
              data loss prevention (DLP), and endpoint detection and response (EDR) capabilities.
          - equals_number: 6
            title: Tagging
            description: Tagging refers to the practice of assigning labels or identifiers
              to data, users, assets, or activities to monitor, control access, and facilitate
              incident response across various security domains such as DLP and EDR.
          - equals_number: 7
            title: Keyword Match
            description: Keyword Match involves scanning content for specific terms to identify
              sensitive information, potential threats, or policy violations, aiding in DLP
              and compliance monitoring.
          - equals_number: 8
            title: Regular Expressions
            description: Regular Expressions are used to define complex search patterns for
              identifying, validating, and extracting specific data sets or threats within
              digital content, enhancing DLP, EDR, and threat detection mechanisms.
          - equals_number: 9
            title: Exact Data Match
            description: Exact Data Match is a precise comparison technique used to detect
              the unauthorized use or exposure of specific, sensitive information, crucial
              for enforcing DLP policies and protecting against data breaches.
          - equals_number: 10
            title: Partial Data Match
            description: Partial Data Match involves identifying instances where segments
              of sensitive information or patterns match, facilitating nuanced DLP and threat
              detection without requiring complete data conformity.
          - equals_number: 11
            title: Indexed Data Match
            description: Indexed Data Match refers to comparing content against a pre-compiled
              index of sensitive information to efficiently detect and prevent unauthorized
              access or breaches, streamlining DLP and compliance efforts.
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        required: true
      uid:
        description: The unique identifier of the analytic that generated the finding.
      version:
        description: 'The analytic version. For example: <code>1.1</code>.'
  OcsfAnomaly:
    title: Anomaly
    description: Describes an anomaly or deviation detected in a system. Anomalies are unexpected
      activity patterns that could indicate potential issues needing attention.
    class_uri: ocsf:OcsfAnomaly
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: anomaly
    slots:
      - observation_parameter
      - observation_type
      - observations
      - observed_pattern
    slot_usage:
      observation_parameter:
        description: 'The specific parameter, metric or property where the anomaly was observed.
          Examples include: CPU usage percentage, API response time in milliseconds, HTTP
          error rate, memory utilization, network latency, transaction volume, etc. This helps
          identify the exact aspect of the system exhibiting anomalous behavior.'
        required: true
      observation_type:
        description: 'The type of analysis methodology used to detect the anomaly. This indicates
          how the anomaly was identified through different analytical approaches. Common types
          include: Frequency Analysis, Time Pattern Analysis, Volume Analysis, Sequence Analysis,
          Distribution Analysis, etc.'
        recommended: true
      observations:
        description: Details about the observed anomaly or observations that were flagged
          as anomalous compared to expected baseline behavior.
        required: true
      observed_pattern:
        description: The specific pattern identified within the observation type. For Frequency
          Analysis, this could be 'FREQUENT', 'INFREQUENT', 'RARE', or 'UNSEEN'. For Time
          Pattern Analysis, this could be 'BUSINESS_HOURS', 'OFF_HOURS', or 'UNUSUAL_TIME'.
          For Volume Analysis, this could be 'NORMAL_VOLUME', 'HIGH_VOLUME', or 'SURGE'. The
          pattern values are specific to each observation type and indicate how the observed
          behavior relates to the baseline.
        recommended: true
  OcsfAnomalyAnalysis:
    title: Anomaly Analysis
    description: Describes the analysis of activity patterns and anomalies of target entities
      to identify potential security threats, performance issues, or other deviations from
      established baselines. This includes monitoring and analyzing user interactions, API
      usage, resource utilization, access patterns and other measured indicators.
    class_uri: ocsf:OcsfAnomalyAnalysis
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: anomaly_analysis
    slots:
      - analysis_targets
      - anomalies
      - baselines
    slot_usage:
      analysis_targets:
        description: The analysis targets define the scope of monitored activities, specifying
          what entities, systems or processes are analyzed for activity patterns.
        required: true
      anomalies:
        description: List of detected activities that significantly deviate from the established
          baselines. This can include unusual access patterns, unexpected user-agents, abnormal
          API usage, suspicious traffic spikes, unauthorized access attempts, and other activities
          that may indicate potential security threats or system issues.
        required: true
      baselines:
        description: List of established patterns representing normal activity that serve
          as reference points for anomaly detection. This includes typical user interaction
          patterns like common user-agents, expected API access frequencies and patterns,
          standard resource utilization levels, and regular traffic flows. These baselines
          help establish what constitutes 'normal' activity in the system.
        recommended: true
  OcsfApi:
    title: API
    description: The API, or Application Programming Interface, object represents  information
      pertaining to an API request and response.
    class_uri: ocsf:OcsfApi
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: api
    slots:
      - group
      - operation
      - request
      - response
      - service
      - token
      - version
    slot_usage:
      group:
        description: The information pertaining to the API group.
      operation:
        required: true
      request:
        description: Details pertaining to the API request.
        recommended: true
      response:
        description: Details pertaining to the API response.
        recommended: true
      service:
        description: The information pertaining to the API service.
      token:
        description: 'The API or client token used to authenticate or authorize the API request.
          This attribute contains the base <code>token</code> object that represents: (1)
          IdP-issued client tokens (type_id: 6) such as Okta API tokens or Microsoft Entra
          ID Application Registration client secrets, or (2) generic API tokens/keys (type_id:
          7) used for SaaS application authentication. Use this attribute when the API request
          was authenticated using a token that should be tracked as part of the API activity
          event. Note: Protocol-specific authentication tokens (Kerberos, OIDC, SAML) should
          be represented using <code>authentication_token</code> in authentication events,
          not in API activity events.'
      version:
        description: The version of the API service.
  OcsfApplication:
    title: Application
    description: An Application describes the details for an inventoried application as reported
      by an Application Security tool or other Developer-centric tooling. Applications can
      be defined as Kubernetes resources, Containerized resources, or application hosting-specific
      cloud sources such as AWS Elastic BeanStalk, AWS Lightsail, or Azure Logic Apps.
    class_uri: ocsf:OcsfApplication
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:Application/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: application
      ocsf_profiles: data_classification
      ocsf_constraints: '{"at_least_one": ["uid", "name"]}'
    related_mappings:
      - d3f:Application
    any_of:
      - slot_conditions:
          uid:
            required: true
      - slot_conditions:
          name:
            required: true
    slots:
      - criticality
      - data
      - desc
      - group
      - hostname
      - labels
      - name
      - owner
      - product
      - region
      - resource_relationship
      - risk_level
      - risk_level_id
      - risk_score
      - sbom
      - tags
      - type
      - uid
      - uid_alt
      - url
      - version
    slot_usage:
      criticality:
        title: Business Criticality
        description: The criticality of the application as defined by the event source.
      data:
        description: Additional data describing the application.
      desc:
        title: Application Description
        description: A description or commentary for an application, usually retrieved from
          an upstream system.
      group:
        description: The name of the related application or associated resource group.
      hostname:
        description: The fully qualified name of the application.
      labels:
        description: The list of labels associated to the application.
      name:
        title: Application Name
        description: The name of the application.
        recommended: true
      owner:
        description: The identity of the service or user account that owns the application.
        recommended: true
      product:
        description: The software product that this application is an instance of, carrying
          product identity such as <code>vendor_name</code>, <code>cpe_name</code>, and canonical
          <code>version</code>.
      region:
        description: The cloud region of the resource.
        annotations:
          ocsf_profiles: cloud
      resource_relationship:
        title: Application Relationship
        description: A graph representation showing how this application relates to and interacts
          with other entities in the environment. This can include parent/child relationships,
          dependencies, or other connections.
      sbom:
        title: Related SBOM
        description: The Software Bill of Materials (SBOM) associated with the application
      tags:
        description: The list of tags; <code>{key:value}</code> pairs associated to the application.
      type:
        title: Application Type
        description: The type of application as defined by the event source, e.g., <code>GitHub</code>,
          <code>Azure Logic App</code>, or <code>Amazon Elastic BeanStalk</code>.
      uid:
        title: Application ID
        description: The unique identifier for the application.
        recommended: true
      uid_alt:
        title: Application Alternative ID
        description: An alternative or contextual identifier for the application, such as
          a configuration, organization, or license UID.
      url:
        description: The URL of the application.
      version:
        title: Application Version
        description: The semantic version of the application, e.g., <code>1.7.4</code>.
  OcsfAssessment:
    title: Assessment
    description: The Assessment object describes a point-in-time assessment, check, or evaluation
      of a specific configuration or signal against an asset, entity, person, or otherwise.
      For example, this can encapsulate <code>os_signals</code> from CrowdStrike Falcon Zero
      Trust Assessments, or account for <code>Datastore</code> configurations from Cyera,
      or capture details of Microsoft Intune configuration policies.
    class_uri: ocsf:OcsfAssessment
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: assessment
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - category
      - desc
      - meets_criteria
      - policy
    slot_usage:
      category:
        description: 'The category that the assessment is part of. For example: <code>Prevention</code>
          or <code>Windows 10</code>.'
      desc:
        description: The description of the assessment criteria, or a description of the specific
          configuration or signal the assessment is targeting.
        recommended: true
      meets_criteria:
        description: Determines whether the assessment against the specific configuration
          or signal meets the assessments criteria. For example, if the assessment checks
          if a <code>Datastore</code> is encrypted or not, having encryption would be evaluated
          as <code>true</code>.
        required: true
      name:
        description: 'The name of the configuration or signal being assessed. For example:
          <code>Kernel Mode Code Integrity (KMCI)</code> or <code>publicAccessibilityState</code>.'
      policy:
        title: Assessment Policy
        description: The details of any policy associated with an assessment.
      uid:
        description: 'The unique identifier of the configuration or signal being assessed.
          For example: the <code>signal_id</code>.'
        recommended: false
  OcsfAttack:
    title: Attack Tactics & Techniques
    description: The Attack object describes the tactic, technique, sub-technique & mitigation
      associated to an attack.
    class_uri: ocsf:OcsfAttack
    see_also:
      - https://attack.mitre.org
      - https://atlas.mitre.org/matrices/ATLAS
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: attack
      ocsf_constraints: '{"at_least_one": ["tactic", "technique", "sub_technique"]}'
    any_of:
      - slot_conditions:
          tactic:
            required: true
      - slot_conditions:
          technique:
            required: true
      - slot_conditions:
          sub_technique:
            required: true
    slots:
      - mitigation
      - sub_technique
      - tactic
      - tactics
      - technique
      - version
    slot_usage:
      sub_technique:
        recommended: true
      tactic:
        recommended: true
      technique:
        recommended: true
      version:
        description: The ATT&CK® or ATLAS™ Matrix version.
        recommended: true
  OcsfAttestation:
    title: Attestation
    description: 'A cryptographic attestation that an event has not been altered since it
      was produced and was produced by the holder of a verifiable identity, providing integrity,
      authenticity, and non-repudiation. The attestation is computed over a canonical serialization
      of the event: the entire event, including the attestation''s own <code>authority_uid</code>,
      <code>chain_uid</code>, and <code>prev_event</code> attributes, and excluding only the
      attestation''s <code>fingerprint</code> and <code>signatures</code>. Because <code>prev_event</code>
      is inside the serialized content, deleting or altering an event in a chain breaks the
      fingerprint and signatures of the event that references it. An attestation may carry
      more than one signature (for example, a co-signature, notary, or witness over the same
      event). The verifiable identity is a technical credential, such as a key or certificate,
      and is not an attribution of any person, organization, or state.'
    class_uri: ocsf:OcsfAttestation
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: attestation
      ocsf_constraints: '{"at_least_one": ["fingerprint", "signatures"]}'
    any_of:
      - slot_conditions:
          fingerprint:
            required: true
      - slot_conditions:
          signatures:
            required: true
    slots:
      - authority_uid
      - chain_uid
      - fingerprint
      - prev_event
      - signatures
      - uid
    slot_usage:
      authority_uid:
        description: 'Unique identifier of the authority that produced this attestation. When
          the attestation has a signature, <code>authority_uid</code> ties the signing credential
          to a known party: because signing credentials rotate and expire, a verifier uses
          this identifier to confirm that the credential belongs to the expected authority,
          rather than to a different holder of some otherwise-valid credential. Where multiple
          <code>signatures</code> are present, it identifies the authority that produced the
          attestation; the identity of each co-signer is carried within its own <code>digital_signature</code>
          object. Included in the canonical serialization.'
        recommended: true
      chain_uid:
        description: Identifier of the append-only chain, such as a forensic or audit log,
          that this event belongs to. It groups a sequence of attestations so that an independent
          verifier can locate and validate them in order; it identifies the chain itself and
          is not a reference to any event outside of this one. Stable for the lifetime of
          the chain. For example, every attestation produced during a single agent session
          shares one <code>chain_uid</code>, so querying events whose <code>attestation.chain_uid</code>
          matches retrieves the full chain, including its newest entry, while each event links
          to its predecessor through <code>prev_event</code>.
        recommended: true
      fingerprint:
        description: The fingerprint of this event's canonical serialization. If <code>signatures</code>
          are present, each signature is computed over this fingerprint. Without signatures,
          the fingerprint alone still detects accidental alteration or corruption of the event.
          The next event in a chain references this value through its own <code>prev_event.fingerprint</code>.
        recommended: true
      prev_event:
        description: Reference to the previous event in a tamper-evident chain, carrying that
          event's fingerprint together with locator attributes for retrieval. Absent on the
          first, or genesis, event of a chain.
        recommended: true
      signatures:
        description: One or more digital signatures, each computed over this event's <code>fingerprint</code>
          and thereby over the event's canonical serialization, each bound to a verifiable
          identity. The first entry is typically the producer; additional entries carry co-signatures
          such as a notary or witness over the same event. The signing algorithm, certificate
          or public-key material, and signing time are carried within each <code>digital_signature</code>
          object.
        recommended: true
      uid:
        title: Attestation ID
        description: Unique identifier of this attestation. It distinguishes an individual
          attestation, such as a single entry within a tamper-evident chain, from the chain
          as a whole. See <code>chain_uid</code> for the identifier of the chain itself.
  OcsfAuthFactor:
    title: Authentication Factor
    description: An Authentication Factor object describes a category of methods used for
      identity verification in an authentication attempt.
    class_uri: ocsf:OcsfAuthFactor
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: auth_factor
      ocsf_profiles: container
    slots:
      - device
      - email_addr
      - factor_type
      - factor_type_id
      - is_hotp
      - is_totp
      - phone_number
      - provider
      - security_questions
    slot_usage:
      device:
        description: Device used to complete an authentication request.
        recommended: true
        annotations:
          ocsf_group: primary
      email_addr:
        description: The email address used in an email-based authentication factor.
        annotations:
          ocsf_group: context
      factor_type:
        recommended: true
        annotations:
          ocsf_group: primary
      factor_type_id:
        required: true
        annotations:
          ocsf_group: primary
          ocsf_sibling: factor_type
      is_hotp:
        recommended: true
        annotations:
          ocsf_group: context
      is_totp:
        recommended: true
        annotations:
          ocsf_group: context
      phone_number:
        description: The phone number used for a telephony-based authentication request.
        annotations:
          ocsf_group: context
      provider:
        description: The name of provider for an authentication factor.
        recommended: true
        annotations:
          ocsf_group: context
      security_questions:
        annotations:
          ocsf_group: context
  OcsfToken:
    title: Token
    description: 'The Token object is the base object for representing tokens, API keys, and
      authentication credentials used across different contexts. This object provides common
      attributes for all token types, including protocol-specific authentication tokens (Kerberos,
      OIDC, SAML) and API/client tokens used for service authentication. When to use this
      object: Use the base <code>token</code> object directly in API activity events to represent
      API tokens, client tokens, or API keys used to authenticate API requests. Examples include:
      Okta API tokens, Microsoft Entra ID Application Registration client secrets, Stripe
      API keys, AWS API keys. When NOT to use this object: Do NOT use the base <code>token</code>
      object for protocol-specific authentication tokens in authentication events - use <code>authentication_token</code>
      instead (which extends this object). Do NOT use <code>token</code> for tracking credential
      lifecycle and usage patterns - use <code>programmatic_credential</code> instead.'
    class_uri: ocsf:OcsfToken
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: token
      ocsf_profiles: datetime
    slots:
      - created_time
      - created_time_dt
      - expiration_time
      - expiration_time_dt
      - is_renewable
      - modified_time
      - modified_time_dt
      - name
      - tenant_uid
      - type
      - type_id
      - uid
      - zone
    slot_usage:
      created_time:
        description: The time that the token was created.
        recommended: true
      created_time_dt:
        description: The time that the token was created.
        annotations:
          ocsf_profiles: datetime
      expiration_time:
        description: The expiration time of the token.
      expiration_time_dt:
        description: The expiration time of the token.
        annotations:
          ocsf_profiles: datetime
      is_renewable:
        description: Indicates whether the token is renewable.
      modified_time:
        description: The last time the token was updated.
      modified_time_dt:
        description: The last time the token was updated.
        annotations:
          ocsf_profiles: datetime
      name:
        description: The human-friendly name of a token or key, if available, such as the
          <code>name</code> from the Okta API Token API.
      tenant_uid:
        description: The unique identifier of the tenant or organization that owns the token
          or key, or the tenant context in which the token is authorized for use. This is
          particularly relevant in multi-tenant Identity Provider scenarios where tokens are
          scoped to specific tenants.
      type:
        description: The type of the token, normalized to the caption of the <code>type_id</code>
          value. This indicates whether the token is a Client Token, API Token, or one of
          the protocol-specific token types.
        recommended: true
      type_id:
        description: 'The normalized token type identifier. Valid values: 0 (Unknown), 1 (Ticket
          Granting Ticket - Kerberos), 2 (Service Ticket - Kerberos), 3 (Identity Token -
          OIDC), 4 (Refresh Token - OIDC), 5 (SAML Assertion), 6 (Client Token - IdP-issued),
          7 (API Token - generic API keys), 99 (Other).'
        any_of:
          - equals_number: 0
            title: Unknown
            description: The token type is unknown.
          - equals_number: 1
            title: Ticket Granting Ticket
            description: Ticket Granting Ticket (TGT) for Kerberos.
          - equals_number: 2
            title: Service Ticket
            description: Service Ticket (ST) for Kerberos.
          - equals_number: 3
            title: Identity Token
            description: Identity (ID) Token for OIDC.
          - equals_number: 4
            title: Refresh Token
            description: Refresh Token for OIDC.
          - equals_number: 5
            title: SAML Assertion
            description: Authentication Assertion for SAML.
          - equals_number: 6
            title: Client Token
            description: 'Client Token issued by an Identity Provider (IdP) for application
              authentication. Use this value for IdP-issued tokens used for service-to-service
              authentication. Examples: Microsoft Entra ID Application Registration client
              secrets, Okta API tokens, Auth0 Machine-to-Machine tokens. Key characteristic:
              These tokens are issued by Identity Providers, not by individual services.'
          - equals_number: 7
            title: API Token
            description: 'A generic API token or API key used for authenticating API requests.
              Use this value for service-specific API authentication tokens that are NOT issued
              by Identity Providers. Examples: REST API keys, GraphQL API keys, Stripe API
              keys, Twilio API keys, AWS API keys. Key characteristic: These tokens are issued
              by individual services/platforms, not by Identity Providers.'
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        recommended: true
      uid:
        description: The unique ID of a token or key, if available, such as the <code>Secret
          ID</code> of Entra ID Application Registration Client Secrets.
      zone:
        description: The network zone or geographic region that the token or key is authorized
          to be used from. This may represent network-based access restrictions, geographic
          limitations, or other zone-based authorization policies. Examples include Okta's
          network zone restrictions or cloud provider region restrictions.
  OcsfAuthenticationToken:
    title: Authentication Token
    description: 'The Authentication Token object extends the base <code>token</code> object
      and represents standardized authentication tokens, tickets, or assertions that conform
      to established authentication protocols such as Kerberos, OIDC, and SAML. This object
      inherits all attributes from <code>token</code> and adds protocol-specific attributes
      (e.g., <code>kerberos_flags</code>, <code>encryption_details</code>) for authentication
      events. Use this object in authentication events to represent protocol-specific tokens:
      Kerberos Ticket Granting Tickets (TGT) and Service Tickets (ST), OIDC Identity Tokens
      and Refresh Tokens, and SAML Assertions. These tokens are issued by authentication servers
      and identity providers and carry protocol-specific metadata, lifecycle information,
      and security attributes defined by their respective specifications. When to use this
      object: Use <code>authentication_token</code> when representing protocol-specific authentication
      tokens (type_id values 1-5: Kerberos TGT/ST, OIDC ID/Refresh tokens, SAML assertions)
      in authentication events. When NOT to use this object: Do NOT use <code>authentication_token</code>
      for API tokens or client tokens (type_id values 6-7) used in API activity events - use
      the base <code>token</code> object instead. Do NOT use <code>authentication_token</code>
      for generic API keys - use the base <code>token</code> object instead.'
    class_uri: ocsf:OcsfAuthenticationToken
    is_a: OcsfToken
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: authentication_token
      ocsf_profiles: datetime
    slots:
      - encryption_details
      - kerberos_flags
    slot_usage:
      created_time:
        description: The time that the authentication token was created or issued. This corresponds
          to the token issuance time, such as the <code>iat</code> (issued at) claim in OIDC
          tokens, the issue instant in SAML assertions, or the ticket start time in Kerberos
          tickets.
      created_time_dt:
        description: The time that the authentication token was created or issued. This corresponds
          to the token issuance time, such as the <code>iat</code> (issued at) claim in OIDC
          tokens, the issue instant in SAML assertions, or the ticket start time in Kerberos
          tickets.
      encryption_details:
        description: The encryption details of the authentication token.
        recommended: true
      expiration_time:
        description: The expiration time of the authentication token.
      expiration_time_dt:
        description: The expiration time of the authentication token.
      is_renewable:
        description: Indicates whether the authentication token is renewable.
      kerberos_flags:
        recommended: true
      type:
        description: The type of the authentication token.
      type_id:
        description: The normalized authentication token type identifier. This attribute restricts
          the base <code>token.type_id</code> enum to only protocol-specific authentication
          token types (values 0, 1-5, 99). API tokens and client tokens (values 6-7) are not
          valid for <code>authentication_token</code> - use the base <code>token</code> object
          for those types.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The Authentication token type is unknown.
          - equals_number: 1
            title: Ticket Granting Ticket
            description: Ticket Granting Ticket (TGT) for Kerberos.
          - equals_number: 2
            title: Service Ticket
            description: Service Ticket (ST) for Kerberos.
          - equals_number: 3
            title: Identity Token
            description: Identity (ID) Token for OIDC.
          - equals_number: 4
            title: Refresh Token
            description: Refresh Token for OIDC.
          - equals_number: 5
            title: SAML Assertion
            description: Authentication Assertion for SAML.
          - equals_number: 6
            title: Client Token
            description: 'Client Token issued by an Identity Provider (IdP) for application
              authentication. Use this value for IdP-issued tokens used for service-to-service
              authentication. Examples: Microsoft Entra ID Application Registration client
              secrets, Okta API tokens, Auth0 Machine-to-Machine tokens. Key characteristic:
              These tokens are issued by Identity Providers, not by individual services.'
          - equals_number: 7
            title: API Token
            description: 'A generic API token or API key used for authenticating API requests.
              Use this value for service-specific API authentication tokens that are NOT issued
              by Identity Providers. Examples: REST API keys, GraphQL API keys, Stripe API
              keys, Twilio API keys, AWS API keys. Key characteristic: These tokens are issued
              by individual services/platforms, not by Identity Providers.'
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
  OcsfAuthorization:
    title: Authorization Result
    description: The Authorization Result object provides details about the authorization
      outcome and associated policies related to activity.
    class_uri: ocsf:OcsfAuthorization
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: authorization
    slots:
      - decision
      - policy
    slot_usage:
      decision:
        description: Authorization Result/outcome, e.g. allowed, denied.
        recommended: true
      policy:
        description: Details about the Identity/Access management policies that are applicable.
  OcsfAutonomousSystem:
    title: Autonomous System
    description: An autonomous system (AS) is a collection of connected Internet Protocol
      (IP) routing prefixes under the control of one or more network operators on behalf of
      a single administrative entity or domain that presents a common, clearly defined routing
      policy to the internet.
    class_uri: ocsf:OcsfAutonomousSystem
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: autonomous_system
      ocsf_constraints: '{"at_least_one": ["number", "name"]}'
    any_of:
      - slot_conditions:
          number:
            required: true
      - slot_conditions:
          name:
            required: true
    slots:
      - name
      - number
    slot_usage:
      name:
        description: Organization name for the Autonomous System.
        recommended: true
        annotations:
          ocsf_group: context
      number:
        description: Unique number that the AS is identified by.
        recommended: true
        annotations:
          ocsf_group: context
  OcsfBaseline:
    title: Baseline
    description: Describes the baseline or expected behavior of a system, service, or component
      based on historical observations and measurements. It establishes reference points for
      comparison to detect anomalies, trends, and deviations from typical patterns.
    class_uri: ocsf:OcsfBaseline
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: baseline
    slots:
      - observation_parameter
      - observation_type
      - observations
      - observed_pattern
    slot_usage:
      observation_parameter:
        description: 'The specific parameter or property being monitored. Examples include:
          CPU usage percentage, API response time in milliseconds, HTTP error rate, memory
          utilization, network latency, transaction volume, etc.'
        required: true
      observation_type:
        description: 'The type of analysis being performed to establish baseline behavior.
          Common types include: Frequency Analysis, Time Pattern Analysis, Volume Analysis,
          Sequence Analysis, Distribution Analysis, etc.'
        recommended: true
      observations:
        description: Collection of actual measured values, data points and observations recorded
          for this baseline.
        required: true
      observed_pattern:
        description: The specific pattern identified within the observation type. For Frequency
          Analysis, this could be 'FREQUENT', 'INFREQUENT', 'RARE', or 'UNSEEN'. For Time
          Pattern Analysis, this could be 'BUSINESS_HOURS', 'OFF_HOURS', or 'UNUSUAL_TIME'.
          For Volume Analysis, this could be 'NORMAL_VOLUME', 'HIGH_VOLUME', or 'SURGE'. The
          pattern values are specific to each observation type and indicate the baseline behavior.
        recommended: true
  OcsfCampaign:
    title: Campaign
    description: Campaign represent organized efforts by threat actors to achieve malicious
      objectives over a period, often characterized by shared tactics, techniques, and procedures
      (TTPs).
    class_uri: ocsf:OcsfCampaign
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: campaign
    slots:
      - name
    slot_usage:
      name:
        description: The name of a specific campaign associated with a cyber threat.
        required: true
  OcsfCertificate:
    title: Digital Certificate
    description: The Digital Certificate, also known as a Public Key Certificate, object contains
      information about the ownership and usage of a public key. It serves as a means to establish
      trust in the authenticity and integrity of the public key and the associated entity.
    class_uri: ocsf:OcsfCertificate
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:Certificate/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: certificate
      ocsf_profiles: datetime
    related_mappings:
      - d3f:Certificate
    slots:
      - created_time
      - created_time_dt
      - expiration_time
      - expiration_time_dt
      - fingerprints
      - is_self_signed
      - issuer
      - sans
      - serial_number
      - subject
      - uid
      - version
    slot_usage:
      created_time:
        description: The time when the certificate was created.
        recommended: true
      created_time_dt:
        description: The time when the certificate was created.
        annotations:
          ocsf_profiles: datetime
      expiration_time:
        description: The expiration time of the certificate.
        recommended: true
      expiration_time_dt:
        description: The expiration time of the certificate.
        annotations:
          ocsf_profiles: datetime
      fingerprints:
        description: The fingerprint list of the certificate.
        recommended: true
      is_self_signed:
        recommended: true
      issuer:
        title: Issuer Distinguished Name
        description: The certificate issuer distinguished name.
        required: true
      serial_number:
        title: Certificate Serial Number
        description: The serial number of the certificate used to create the digital signature.
        required: true
      subject:
        title: Subject Distinguished Name
        description: The certificate subject distinguished name.
        recommended: true
      uid:
        description: The unique identifier of the certificate.
      version:
        description: The certificate version.
        recommended: true
  OcsfCheck:
    title: Check
    description: The check object defines a specific, testable compliance verification point
      that evaluates a target device against a standard, framework, or custom requirement.
      While checks are typically associated with formal standards (like CIS, NIST, or ISO),
      they can also represent custom or organizational requirements. When mapped to controls,
      checks can evaluate specific control_parameters to determine compliance status, but
      neither the control mapping nor control_parameters are required for a valid check.
    class_uri: ocsf:OcsfCheck
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: check
      ocsf_profiles: cloud container data_classification
    slots:
      - desc
      - name
      - resource
      - severity
      - severity_id
      - standards
      - status
      - status_id
      - uid
      - version
    slot_usage:
      desc:
        description: 'The detailed description of the compliance check, explaining the security
          requirement, vulnerability, or configuration being assessed. For example, CIS: <code>The
          cramfs filesystem type is a compressed read-only Linux filesystem. Removing support
          for unneeded filesystem types reduces the local attack surface.</code> or DISA STIG:
          <code>Unauthorized access to the information system by foreign entities may result
          in loss or compromise of data.</code>'
        see_also:
          - https://www.cisecurity.org/cis-benchmarks
          - https://public.cyber.mil/stigs/downloads
      name:
        description: 'The name or title of the compliance check. For example, CIS: <code>Ensure
          mounting of cramfs filesystems is disabled</code> or DISA STIG: <code>The Ubuntu
          operating system must implement DoD-approved encryption to protect the confidentiality
          of remote access sessions</code>.'
        see_also:
          - https://www.cisecurity.org/cis-benchmarks
          - https://public.cyber.mil/stigs/downloads
        recommended: true
      resource:
        description: Describes details about the resource that this check evaluated.
      severity:
        description: 'The severity level as defined in the source document. For example CIS
          Benchmarks, valid values are: <code>Level 1</code> (security-forward, essential
          settings), <code>Level 2</code> (security-focused environment, more restrictive),
          or <code>Scored/Not Scored</code> (whether compliance can be automatically checked).
          For DISA STIG, valid values are: <code>CAT I</code> (maps to severity_id 5/Critical),
          <code>CAT II</code> (maps to severity_id 4/High), or <code>CAT III</code> (maps
          to severity_id 3/Medium).'
        see_also:
          - https://www.cisecurity.org/cis-benchmarks
          - https://public.cyber.mil/stigs
      severity_id:
        description: 'The normalized severity identifier that maps severity levels to standard
          severity levels. For example CIS Benchmark: <code>Level 2</code> maps to <code>4</code>
          (High), <code>Level 1</code> maps to <code>3</code> (Medium). For DISA STIG: <code>CAT
          I</code> maps to <code>5</code> (Critical), <code>CAT II</code> maps to <code>4</code>
          (High), and <code>CAT III</code> maps to <code>3</code> (Medium).'
        any_of:
          - equals_number: 0
            title: Unknown
            description: The severity is unknown.
          - equals_number: 1
            title: Informational
            description: Informational message. No action required.
          - equals_number: 2
            title: Low
            description: The user decides if action is needed.
          - equals_number: 3
            title: Medium
            description: Maps to CIS Benchmark <code>Level 1</code> - Essential security settings
              recommended for all systems, or DISA STIG <code>CAT III</code> - Action is required
              but the situation is not serious at this time.
          - equals_number: 4
            title: High
            description: Maps to CIS Benchmark <code>Level 2</code> - More restrictive and
              security-focused settings for sensitive environments, or DISA STIG <code>CAT
              II</code> - Action is required immediately.
          - equals_number: 5
            title: Critical
            description: Maps to DISA STIG <code>CAT I</code> - Action is required immediately
              and the scope is broad.
          - equals_number: 6
            title: Fatal
            description: An error occurred but it is too late to take remedial action.
          - equals_number: 99
            title: Other
            description: The severity is not mapped. See the <code>severity</code> attribute,
              which contains a data source specific value.
      standards:
        description: The regulatory or industry standard this check is associated with. E.g.,
          <code>PCI DSS 3.2.1</code>, <code>HIPAA Security Rule</code>, <code>NIST SP 800-53
          Rev. 5</code>, or <code>ISO/IEC 27001:2013</code>.
        see_also:
          - https://www.pcisecuritystandards.org/document_library
          - https://www.hhs.gov/hipaa/for-professionals/security/laws-regulations/index.html
          - https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
          - https://www.iso.org/standard/54534.html
        recommended: true
      status:
        description: 'The resultant status of the compliance check normalized to the caption
          of the <code>status_id</code> value. For example, CIS Benchmark: <code>Pass</code>
          when all requirements are met, <code>Fail</code> when requirements are not met,
          or DISA STIG: <code>NotAFinding</code> (maps to status_id 1/Pass), <code>Open</code>
          (maps to status_id 3/Fail).'
        see_also:
          - https://www.cisecurity.org/cis-benchmarks
          - https://public.cyber.mil/stigs/srg-stig-tools/
        recommended: true
      status_id:
        description: The normalized status identifier of the compliance check.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The status is unknown.
          - equals_number: 1
            title: Pass
            description: The compliance check passed for all the evaluated resources.
          - equals_number: 2
            title: Warning
            description: The compliance check did not yield a result due to missing information.
          - equals_number: 3
            title: Fail
            description: The compliance check failed for at least one of the evaluated resources.
          - equals_number: 99
            title: Other
            description: The event status is not mapped. See the <code>status</code> attribute,
              which contains a data source specific value.
        recommended: true
      uid:
        description: The unique identifier of the compliance check within its standard or
          framework. For example, CIS Benchmark identifier <code>1.1.1.1</code>, DISA STIG
          identifier <code>V-230234</code>, or NIST control identifier <code>AC-17(2)</code>.
        see_also:
          - https://www.cisecurity.org/cis-benchmarks
          - https://public.cyber.mil/stigs/downloads
          - https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
        recommended: true
      version:
        description: 'The check version. For example, CIS Benchmark: <code>1.1.0</code> for
          Amazon Linux 2 or DISA STIG: <code>V2R1</code> for Windows 10.'
        see_also:
          - https://www.cisecurity.org/cis-benchmarks
          - https://public.cyber.mil/stigs/downloads
  OcsfCisBenchmark:
    title: CIS Benchmark
    description: The CIS Benchmark object describes best practices for securely configuring
      IT systems, software, networks, and cloud infrastructure as defined by the Center for
      Internet Security. See also Getting to Know the CIS Benchmarks.
