  OcsfRelatedEvent:
    title: Related Event/Finding
    description: The Related Event object describes an event or another finding related to
      a finding. It may or may not be an OCSF event.
    class_uri: ocsf:OcsfRelatedEvent
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: related_event
      ocsf_profiles: data_classification datetime
    slots:
      - attacks
      - count
      - created_time
      - created_time_dt
      - desc
      - first_seen_time
      - first_seen_time_dt
      - kill_chain
      - last_seen_time
      - last_seen_time_dt
      - modified_time
      - modified_time_dt
      - observables
      - product
      - product_uid
      - severity
      - severity_id
      - status
      - tags
      - title
      - traits
      - type
      - type_name
      - type_uid
      - uid
    slot_usage:
      count:
        description: The number of times that activity in the same logical group occurred,
          as reported by the related Finding.
      created_time:
        description: <p>The time when the related event/finding was created.</p> If the related
          event/finding is in OCSF and is a Finding, then this value should be equal to <code>finding_info.created_time</code>
          in the corresponding Finding. If the related event/finding is in OCSF and is not
          a Finding, then this value should be equal to <code>time</code> in the corresponding
          event.
      created_time_dt:
        description: <p>The time when the related event/finding was created.</p> If the related
          event/finding is in OCSF and is a Finding, then this value should be equal to <code>finding_info.created_time</code>
          in the corresponding Finding. If the related event/finding is in OCSF and is not
          a Finding, then this value should be equal to <code>time</code> in the corresponding
          event.
        annotations:
          ocsf_profiles: datetime
      desc:
        description: A description of the related event/finding.
      first_seen_time:
        description: The time when the finding was first observed. e.g. The time when a vulnerability
          was first observed.<br>It can differ from the <code>created_time</code> timestamp,
          which reflects the time this finding was created.
      first_seen_time_dt:
        description: The time when the finding was first observed. e.g. The time when a vulnerability
          was first observed.<br>It can differ from the <code>created_time</code> timestamp,
          which reflects the time this finding was created.
        annotations:
          ocsf_profiles: datetime
      last_seen_time:
        description: The time when the finding was most recently observed. e.g. The time when
          a vulnerability was most recently observed.<br>It can differ from the <code>modified_time</code>
          timestamp, which reflects the time this finding was last modified.
      last_seen_time_dt:
        description: The time when the finding was most recently observed. e.g. The time when
          a vulnerability was most recently observed.<br>It can differ from the <code>modified_time</code>
          timestamp, which reflects the time this finding was last modified.
        annotations:
          ocsf_profiles: datetime
      modified_time:
        description: The time when the related event/finding was last modified.
      modified_time_dt:
        description: The time when the related event/finding was last modified.
        annotations:
          ocsf_profiles: datetime
      product:
        description: Details about the product that reported the related event/finding.
      product_uid:
        description: The unique identifier of the product that reported the related event.
      severity_id:
        recommended: true
      status:
        description: The related event status. Should correspond to the label of the status_id
          (or 'Other' status value for status_id = 99) of the related event.
      tags:
        description: The list of tags; <code>{key:value}</code> pairs associated with the
          related event/finding.
      title:
        description: A title or a brief phrase summarizing the related event/finding.
      traits:
        description: The list of key traits or characteristics extracted from the related
          event/finding that influenced or contributed to the overall finding's outcome.
      type:
        description: <p>The type of the related event/finding.</p>Populate if the related
          event/finding is <code>NOT</code> in OCSF. If it is in OCSF, then utilize <code>type_name,
          type_uid</code> instead.
      type_name:
        description: 'The type of the related OCSF event, as defined by <code>type_uid</code>.<p>For
          example: <code>Process Activity: Launch.</code></p>Populate if the related event/finding
          is in OCSF.'
      type_uid:
        description: 'The unique identifier of the related OCSF event type. <p>For example:
          <code>100701.</code></p>Populate if the related event/finding is in OCSF.'
        recommended: true
      uid:
        description: <p>The unique identifier of the related event/finding.</p> If the related
          event/finding is in OCSF, then this value must be equal to <code>metadata.uid</code>
          in the corresponding event.
        required: true
