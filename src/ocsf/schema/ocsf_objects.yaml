      proxy_endpoint:
        description: The network proxy information pertaining to a specific endpoint. This
          can be used to describe information pertaining to network address translation (NAT).
      svc_name:
        recommended: true
      type:
        description: 'The network endpoint type. For example: <code>unknown</code>, <code>server</code>,
          <code>desktop</code>, <code>laptop</code>, <code>tablet</code>, <code>mobile</code>,
          <code>virtual</code>, <code>browser</code>, or <code>other</code>.'
      type_id:
        description: The network endpoint type ID.
      uid:
        annotations:
          ocsf_observable: '48'
  OcsfNetworkInterface:
    title: Network Interface
    description: The Network Interface object describes the type and associated attributes
      of a physical or virtual network interface.
    class_uri: ocsf:OcsfNetworkInterface
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:NetworkInterfaceCard/
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: network_interface
      ocsf_constraints: '{"at_least_one": ["ip", "mac", "name", "hostname", "uid"]}'
    related_mappings:
      - d3f:NetworkInterfaceCard
    any_of:
      - slot_conditions:
          ip:
            required: true
      - slot_conditions:
          mac:
            required: true
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          hostname:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - hostname
      - ip
      - mac
      - namespace
      - open_ports
      - subnet_prefix
      - type
      - type_id
    slot_usage:
      hostname:
        description: The hostname associated with the network interface.
        recommended: true
      ip:
        description: The IP address associated with the network interface.
        recommended: true
      mac:
        description: The MAC address of the network interface.
        recommended: true
      name:
        description: The name of the network interface.
      type:
        description: The type of network interface.
      type_id:
        description: The network interface type identifier.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: Wired
          - equals_number: 2
            title: Wireless
          - equals_number: 3
            title: Mobile
          - equals_number: 4
            title: Tunnel
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        recommended: true
      uid:
        description: The unique identifier for the network interface.
        recommended: false
  OcsfNetworkProxy:
    title: Network Proxy Endpoint
    description: The network proxy endpoint object describes a proxy server, which acts as
      an intermediary between a client requesting a resource and the server providing that
      resource.
    class_uri: ocsf:OcsfNetworkProxy
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:ProxyServer/
    is_a: OcsfNetworkEndpoint
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: network_proxy
      ocsf_profiles: container
      ocsf_constraints: '{"at_least_one": ["ip", "uid", "name", "hostname", "svc_name", "instance_uid",
        "interface_uid", "interface_name", "domain"]}'
      ocsf_observable: '20'
    related_mappings:
      - d3f:ProxyServer
    any_of:
      - slot_conditions:
          ip:
            required: true
      - slot_conditions:
          uid:
            required: true
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          hostname:
            required: true
      - slot_conditions:
          svc_name:
            required: true
      - slot_conditions:
          instance_uid:
            required: true
      - slot_conditions:
          interface_uid:
            required: true
      - slot_conditions:
          interface_name:
            required: true
      - slot_conditions:
          domain:
            required: true
  OcsfNetworkTraffic:
    title: Network Traffic
    description: The Network Traffic object describes characteristics of network traffic over
      a time period. The metrics represent network data transferred between source and destination
      during an observation window.
    class_uri: ocsf:OcsfNetworkTraffic
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:NetworkTraffic/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: network_traffic
      ocsf_profiles: datetime
    related_mappings:
      - d3f:NetworkTraffic
    slots:
      - bytes
      - bytes_in
      - bytes_missed
      - bytes_out
      - chunks
      - chunks_in
      - chunks_out
      - end_time
      - end_time_dt
      - packets
      - packets_in
      - packets_out
      - start_time
      - start_time_dt
      - timespan
    slot_usage:
      bytes:
        description: The total number of bytes transferred in both directions (sum of bytes_in
          and bytes_out).
        recommended: true
      bytes_in:
        description: The number of bytes sent from the destination to the source (inbound
          direction).
      bytes_missed:
        description: The number of bytes that were missed during observation, typically due
          to packet loss or sampling limitations.
      bytes_out:
        description: The number of bytes sent from the source to the destination (outbound
          direction).
      chunks:
        description: The total number of chunks transferred in both directions (sum of chunks_in
          and chunks_out).
      chunks_in:
        description: The number of chunks sent from the destination to the source (inbound
          direction).
      chunks_out:
        description: The number of chunks sent from the source to the destination (outbound
          direction).
      end_time:
        description: The end time of the observation or reporting period.
      end_time_dt:
        description: The end time of the observation or reporting period.
        annotations:
          ocsf_profiles: datetime
      packets:
        description: The total number of packets transferred in both directions (sum of packets_in
          and packets_out).
        recommended: true
      packets_in:
        description: The number of packets sent from the destination to the source (inbound
          direction).
      packets_out:
        description: The number of packets sent from the source to the destination (outbound
          direction).
      start_time:
        description: The start time of the observation or reporting period.
      start_time_dt:
        description: The start time of the observation or reporting period.
        annotations:
          ocsf_profiles: datetime
      timespan:
        description: The time span object representing the duration of the observation or
          reporting period.
  OcsfNode:
    title: Node
    description: Represents a node or a vertex in a graph structure.
    class_uri: ocsf:OcsfNode
    see_also:
      - https://github.com/jsongraph/json-graph-specification/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: node
    slots:
      - data
      - desc
      - name
      - type
      - uid
    slot_usage:
      data:
        description: Additional data about the node stored as key-value pairs. Can include
          custom properties specific to the node.
      desc:
        description: A human-readable description of the node's purpose or meaning in the
          graph.
      name:
        description: A human-readable name or label for the node. Should be descriptive and
          unique within the graph context.
        recommended: true
      type:
        description: Categorizes the node into a specific class or type. Useful for grouping
          and filtering nodes.
      uid:
        description: A unique string or numeric identifier that distinguishes this node from
          all others in the graph. Must be unique across all nodes.
        required: true
  OcsfNote:
    title: Note
    description: Represents a note or a comment in the system. Notes can be used to provide
      additional context, explanations, or observations related to an event, object, or any
      other entity in the system. They can be created and modified by users to capture important
      information that may not be directly represented in the structured data.
    class_uri: ocsf:OcsfNote
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: note
      ocsf_profiles: datetime
    slots:
      - comment
      - created_time
      - created_time_dt
      - modified_time
      - modified_time_dt
      - owner
      - title
      - uid
    slot_usage:
      comment:
        description: A user provided comment.
        required: true
      created_time:
        description: The time when the note was created.
        recommended: true
      created_time_dt:
        description: The time when the note was created.
        annotations:
          ocsf_profiles: datetime
      modified_time:
        description: The time when the note was last modified.
        recommended: true
      modified_time_dt:
        description: The time when the note was last modified.
        annotations:
          ocsf_profiles: datetime
      owner:
        description: The user who created or last modified the note. Typically the same user
          that created the note can modify the note.
        recommended: true
      title:
        description: A short description of the comment, if applicable.
      uid:
        description: The unique identifier of the note, if applicable.
  OcsfObservable:
    title: Observable
    description: The observable object is a pivot element that contains related information
      found in many places in the event.
    class_uri: ocsf:OcsfObservable
    see_also:
      - https://github.com/ocsf/ocsf-docs/blob/main/articles/defining-and-using-observables.md
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: observable
    slots:
      - event_uid
      - name
      - reputation
      - type
      - type_id
      - type_uid
      - value
    slot_usage:
      event_uid:
        description: The unique identifier (<code>metadata.uid</code>) of the source OCSF
          event from which this observable was extracted. This field enables linking observables
          back to their originating event data when observables are stored in a separate location
          or system.
      name:
        description: 'The full name of the observable attribute. The <code>name</code> is
          a pointer/reference to an attribute within the OCSF event data. For example: <code>file.name</code>.
          Array attributes may be represented in one of three ways. For example: <code>resources.uid</code>,
          <code>resources[].uid</code>, <code>resources[0].uid</code>.'
        recommended: true
      type:
        description: The observable value type name.
      type_id:
        description: The observable value type identifier.
        any_of:
          - equals_number: 0
            title: Unknown
            description: Unknown observable data type.
          - equals_number: 1
            title: Hostname
            description: Observable by Dictionary Type.<br>Unique name assigned to a device
              connected to a computer network. It may be a fully qualified domain name (FQDN).
              For example:<br><code>r2-d2.example.com.</code>,<br><code>mx.example.com</code>
          - equals_number: 2
            title: IP Address
            description: Observable by Dictionary Type.<br>Internet Protocol address (IP address),
              in either IPv4 or IPv6 format. For example:<br><code>192.168.200.24</code>,
              <br> <code>2001:0db8:85a3:0000:0000:8a2e:0370:7334</code>.
          - equals_number: 3
            title: MAC Address
            description: Observable by Dictionary Type.<br>Media Access Control (MAC) address.
              For example:<br><code>18:36:F3:98:4F:9A</code>.
          - equals_number: 4
            title: User Name
            description: Observable by Dictionary Type.<br>User name. For example:<br><code>john_doe</code>.
          - equals_number: 5
            title: Email Address
            description: Observable by Dictionary Type.<br>Email address. For example:<br><code>john_doe@example.com</code>.
          - equals_number: 6
            title: URL String
            description: Observable by Dictionary Type.<br>Uniform Resource Locator (URL)
              string. For example:<br><code>http://www.example.com/download/trouble.exe</code>.
          - equals_number: 7
            title: File Name
            description: Observable by Dictionary Type.<br>File name. For example:<br><code>text-file.txt</code>.
          - equals_number: 8
            title: Hash
            description: Observable by Dictionary Type.<br>Fingerprint. A value, in any format,
              that maps an arbitrarily large data item to a much shorter string that uniquely
              identifies the original data. Examples include cryptographic hashing of a file,
              code signing, and Network Protocol Fingerprinting (NPF).<p><b>Note about name.</b>
              The type name <code>file_hast_t</code> and the caption &quot;Hash&quot; are
              used for legacy reasons. This type has been generalized from a file hash to
              a general fingerprint. The existing type name and caption were retained for
              backwards compatibility.
          - equals_number: 9
            title: Process Name
            description: Observable by Dictionary Type.<br>Process name. For example:<br><code>Notepad</code>.
          - equals_number: 10
            title: Resource UID
            description: Observable by Dictionary Type.<br>Resource unique identifier. For
              example, S3 Bucket name or EC2 Instance ID.
          - equals_number: 11
            title: Port
            description: Observable by Dictionary Type.<br>The TCP/UDP port number. For example:<br><code>80</code>,<br><code>22</code>.
          - equals_number: 12
            title: Subnet
            description: Observable by Dictionary Type.<br>The subnet represented in a CIDR
              notation, using the format network_address/prefix_length. The network_address
              can be in either IPv4 or IPv6 format. The prefix length indicates the number
              of bits used for the network portion, and the remaining bits are available for
              host addresses within that subnet. For example:<br><code>192.168.1.0/24</code>,<br><code>2001:0db8:85a3:0000::/64</code>
          - equals_number: 13
            title: Command Line
            description: 'Observable by Dictionary Attribute.<br>The full command line used
              to launch an application, service, process, or job. For example: <code>ssh user@10.0.0.10</code>.
              If the command line is unavailable or missing, the empty string <code>''''</code>
              is to be used.'
          - equals_number: 14
            title: Country
            description: 'Observable by Dictionary Attribute.<br>The ISO 3166-1 Alpha-2 country
              code.<p><b>Note:</b> The two letter country code should be capitalized. For
              example: <code>US</code> or <code>CA</code>.</p>'
          - equals_number: 15
            title: Process ID
            description: Observable by Dictionary Attribute.<br>The process identifier, as
              reported by the operating system. Process ID (PID) is a number used by the operating
              system to uniquely identify an active process.
          - equals_number: 16
            title: HTTP User-Agent
            description: Observable by Dictionary Attribute.<br>The request header that identifies
              the operating system and web browser.
          - equals_number: 17
            title: 'CWE Object: uid'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "uid" for the CWE Object.
          - equals_number: 18
            title: 'CVE Object: uid'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "uid" for the CVE Object.
          - equals_number: 19
            title: User Credential ID
            description: Observable by Dictionary Attribute.<br>The unique identifier of the
              user's credential. For example, AWS Access Key ID.
          - equals_number: 20
            title: Endpoint
            description: Observable by Object.<br>The Endpoint object describes a physical
              or virtual device that connects to and exchanges information with a computer
              network. Some examples of endpoints are mobile devices, desktop computers, virtual
              machines, embedded devices, and servers. Internet-of-Things devices—like cameras,
              lighting, refrigerators, security systems, smart speakers, and thermostats—are
              also endpoints.
          - equals_number: 21
            title: User
            description: Observable by Object.<br>The User object describes the characteristics
              of a user/person or a security principal.
          - equals_number: 22
            title: Email
            description: Observable by Object.<br>The Email object describes the email metadata
              such as sender, recipients, and direction, and can include embedded URLs and
              files.
          - equals_number: 23
            title: Uniform Resource Locator
            description: Observable by Object.<br>The Uniform Resource Locator (URL) object
              describes the characteristics of a URL.
          - equals_number: 24
            title: File
            description: Observable by Object.<br>The File object represents the metadata
              associated with a file stored in a computer system. It encompasses information
              about the file itself, including its attributes, properties, and organizational
              details.
          - equals_number: 25
            title: Process
            description: Observable by Object.<br>The Process object describes a running instance
              of a launched program.
          - equals_number: 26
            title: Geo Location
            description: Observable by Object.<br>The Geo Location object describes a geographical
              location, usually associated with an IP address.
          - equals_number: 27
            title: Container
            description: Observable by Object.<br>The Container object describes an instance
              of a specific container. A container is a prepackaged, portable system image
              that runs isolated on an existing system using a container runtime like containerd.
          - equals_number: 28
            title: Registry Key
            description: Observable by Object.<br>The registry key object describes a Windows
              registry key.
          - equals_number: 29
            title: Registry Value
            description: Observable by Object.<br>The registry value object describes a Windows
              registry value.
          - equals_number: 30
            title: Fingerprint
            description: Observable by Object.<br>The Fingerprint object provides detailed
              information about a fingerprint, which is a compact representation of data used
              to identify a longer piece of information, such as a public key, file content,
              or application implementation. It contains the algorithm or scheme and value
              of the fingerprint, enabling efficient and reliable identification of the associated
              data.
          - equals_number: 31
            title: 'User Object: uid'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "uid" for the User Object.
          - equals_number: 32
            title: 'Group Object: name'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "name" for the Group Object.
          - equals_number: 33
            title: 'Group Object: uid'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "uid" for the Group Object.
          - equals_number: 34
            title: 'Account Object: name'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "name" for the Account Object.
          - equals_number: 35
            title: 'Account Object: uid'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "uid" for the Account Object.
          - equals_number: 36
            title: Script Content
            description: Observable by Dictionary Attribute.<br>The script content, normalized
              to UTF-8 encoding irrespective of its original encoding. When emitting this
              attribute, it may be appropriate to truncate large scripts. When consuming this
              attribute, large scripts should be anticipated.
          - equals_number: 37
            title: Serial Number
            description: Observable by Dictionary Attribute.<br>The serial number that pertains
              to the object. See specific usage.
          - equals_number: 38
            title: 'Resource Details Object: name'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "name" for the Resource Details Object.
          - equals_number: 39
            title: 'Process Entity Object: uid'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "uid" for the Process Entity Object.
          - equals_number: 40
            title: 'Email Object: subject'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "subject" for the Email Object.
          - equals_number: 41
            title: 'Email Object: uid'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "uid" for the Email Object.
          - equals_number: 42
            title: Message UID
            description: Observable by Dictionary Attribute.<br>The email header Message-ID
              value, as defined by RFC 5322.
          - equals_number: 43
            title: 'Registry Value Object: name'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "name" for the Registry Value Object.
          - equals_number: 44
            title: 'Advisory Object: uid'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "uid" for the Advisory Object.
          - equals_number: 45
            title: File Path
            description: 'Observable by Dictionary Type.<br>The full path to the file. For
              example: For example:<br><code>c:\windows\system32\svchost.exe</code>.'
          - equals_number: 46
            title: Registry Key Path
            description: Observable by Dictionary Type.<br>Full path of registry key.
          - equals_number: 47
            title: 'Device Object: uid'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "uid" for the Device Object.
          - equals_number: 48
            title: 'Network Endpoint Object: uid'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "uid" for the Network Endpoint Object.
          - equals_number: 49
            title: 'IAM Role Object: name'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "name" for the IAM Role Object.
          - equals_number: 50
            title: 'IAM Role Object: uid'
            description: Observable by Object-Specific Attribute.<br>Object-specific attribute
              "uid" for the IAM Role Object.
          - equals_number: 99
            title: Other
            description: The observable data type is not mapped. See the <code>type</code>
              attribute, which may contain data source specific value.
        required: true
      type_uid:
        description: 'The OCSF event type UID (<code>type_uid</code>) of the source event
          that this observable was extracted from. This field enables filtering and categorizing
          observables by their originating event type. For example: <code>300101</code> for
          Network Activity (class_uid 3001) with activity_id 1.'
      value:
        description: The value associated with the observable attribute. The meaning of the
          value depends on the observable type.<br/>If the <code>name</code> refers to a scalar
          attribute, then the <code>value</code> is the value of the attribute.<br/>If the
          <code>name</code> refers to an object attribute, then the <code>value</code> is
          not populated.
  OcsfObservation:
    title: Observation
    description: A record of an observed value or event that captures the timing and frequency
      of its occurrence. Used to track when values/events were first detected, last detected,
      and their total occurrence count.
    class_uri: ocsf:OcsfObservation
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: observation
    slots:
      - count
      - timespan
      - value
    slot_usage:
      count:
        description: Integer representing the total number of times this specific value/event
          was observed across all occurrences. Helps establish prevalence and patterns.
        recommended: true
      timespan:
        description: The time window when the value or event was first observed. It is used
          to analyze activity patterns, detect trends, or correlate events within a specific
          timeframe.
        recommended: true
      value:
        description: The specific value, event, indicator or data point that was observed
          and recorded. This is the core piece of information being tracked.
        required: true
  OcsfOccurrenceDetails:
    title: Occurrence Details
    description: Details about where in the target entity, specified information was discovered.
      Only the attributes, relevant to the target entity type should be populated.
    class_uri: ocsf:OcsfOccurrenceDetails
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: occurrence_details
      ocsf_constraints: '{"at_least_one": ["cell_name", "column_name", "column_number", "end_line",
        "json_path", "page_number", "record_index_in_array", "row_number", "start_line"]}'
    any_of:
      - slot_conditions:
          cell_name:
            required: true
      - slot_conditions:
          column_name:
            required: true
      - slot_conditions:
          column_number:
            required: true
      - slot_conditions:
          end_line:
            required: true
      - slot_conditions:
          json_path:
            required: true
      - slot_conditions:
          page_number:
            required: true
      - slot_conditions:
          record_index_in_array:
            required: true
      - slot_conditions:
          row_number:
            required: true
      - slot_conditions:
          start_line:
            required: true
    slots:
      - cell_name
      - column_name
      - column_number
      - end_line
      - json_path
      - page_number
      - record_index_in_array
      - row_number
      - start_line
    slot_usage:
      cell_name:
        description: The cell name/reference in a spreadsheet. e.g <code>A2</code>
      column_name:
        description: The column name in a spreadsheet, where the information was discovered.
      column_number:
        description: The column number in a spreadsheet or a plain text document, where the
          information was discovered.
      end_line:
        description: The line number of the last line of the file, where the information was
          discovered.
      json_path:
        description: The JSON path of the attribute in a json record, where the information
          was discovered
      page_number:
        description: The page number in a document, where the information was discovered.
      record_index_in_array:
        description: The index of the record in the array of records, where the information
          was discovered. e.g. the index of a record in an array of JSON records in a file.
      row_number:
        description: The row number in a spreadsheet, where the information was discovered.
      start_line:
        description: The line number of the first line of the file, where the information
          was discovered.
  OcsfOrganization:
    title: Organization
    description: The Organization object describes characteristics of an organization or company
      and its division if any. Additionally, it also describes cloud and Software-as-a-Service
      (SaaS) logical hierarchies such as AWS Organizations, Google Cloud Organizations, Oracle
      Cloud Tenancies, and similar constructs.
    class_uri: ocsf:OcsfOrganization
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: organization
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - ou_name
      - ou_uid
    slot_usage:
      name:
        description: The name of the organization, Oracle Cloud Tenancy, Google Cloud Organization,
          or AWS Organization. For example, <code> Widget, Inc. </code> or the <code> AWS
          Organization name </code>.
      ou_name:
        description: The name of an organizational unit, Google Cloud Folder, or AWS Org Unit.
          For example, the <code> GCP Project Name </code>, or <code> Dev_Prod_OU </code>.
        recommended: true
      ou_uid:
        description: The unique identifier of an organizational unit, Google Cloud Folder,
          or AWS Org Unit. For example, an  <code> Oracle Cloud Tenancy ID </code>, <code>
          AWS OU ID </code>, or <code> GCP Folder ID </code>.
      uid:
        description: The unique identifier of the organization, Oracle Cloud Tenancy, Google
          Cloud Organization, or AWS Organization. For example, an <code> AWS Org ID </code>
          or <code> Oracle Cloud Domain ID </code>.
  OcsfOs:
    title: Operating System (OS)
    description: The Operating System (OS) object describes characteristics of an OS, such
      as Linux or Windows.
    class_uri: ocsf:OcsfOs
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:OperatingSystem/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: os
    related_mappings:
      - d3f:OperatingSystem
    slots:
      - build
      - country
      - cpe_name
      - cpu_bits
      - edition
      - kernel_release
      - lang
      - name
      - sp_name
      - sp_ver
      - type
      - type_id
      - version
    slot_usage:
      country:
        description: 'The operating system country code, as defined by the ISO 3166-1 standard
          (Alpha-2 code).<p><b>Note:</b> The two letter country code should be capitalized.
          For example: <code>US</code> or <code>CA</code>.</p>'
      name:
        description: The operating system name.
        required: true
      type:
        description: The type of the operating system.
      type_id:
        description: The type identifier of the operating system.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
          - equals_number: 100
            title: Windows
          - equals_number: 101
            title: Windows Mobile
          - equals_number: 200
            title: Linux
          - equals_number: 201
            title: Android
          - equals_number: 300
            title: macOS
          - equals_number: 301
            title: iOS
          - equals_number: 302
            title: iPadOS
          - equals_number: 400
            title: Solaris
          - equals_number: 401
            title: AIX
          - equals_number: 402
            title: HP-UX
        required: true
      version:
        description: 'The version of the OS running on the device that originated the event.
          For example: "Windows 10", "OS X 10.7", or "iOS 9".'
  OcsfOsint:
    title: OSINT
    description: The OSINT (Open Source Intelligence) object contains details related to an
      indicator such as the indicator itself, related indicators, geolocation, registrar information,
      subdomains, analyst commentary, and other contextual information. This information can
      be used to further enrich a detection or finding by providing decisioning support to
      other analysts and engineers.
    class_uri: ocsf:OcsfOsint
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: osint
      ocsf_profiles: container data_classification datetime
    slots:
      - answers
      - attacks
      - autonomous_system
      - campaign
      - category
      - comment
      - confidence
      - confidence_id
      - created_time
      - created_time_dt
      - creator
      - desc
      - detection_pattern
      - detection_pattern_type
      - detection_pattern_type_id
      - email
      - email_auth
      - expiration_time
      - expiration_time_dt
      - external_uid
      - file
      - intrusion_sets
      - kill_chain
      - labels
      - location
      - malware
      - modified_time
      - modified_time_dt
      - name
      - references
      - related_analytics
      - reputation
      - risk_score
      - script
      - severity
      - severity_id
      - signatures
      - src_url
      - subdomains
      - subnet
      - threat_actor
      - tlp
      - type
      - type_id
      - uid
      - uploaded_time
      - uploaded_time_dt
      - value
      - vendor_name
      - vulnerabilities
      - whois
    slot_usage:
      answers:
        title: Related DNS Answers
        description: Any pertinent DNS answers information related to an indicator or OSINT
          analysis.
      attacks:
        description: MITRE ATT&CK Tactics, Techniques, and/or Procedures (TTPs) pertinent
          to an indicator or OSINT analysis.
      autonomous_system:
        description: Any pertinent autonomous system information related to an indicator or
          OSINT analysis.
      category:
        description: Categorizes the threat indicator based on its functional or operational
          role.
      comment:
        title: Analyst Comments
        description: Analyst commentary or source commentary about an indicator or OSINT analysis.
      confidence:
        description: The confidence of an indicator or analysis, normalized to the caption
          of the confidence_id value. In the case of 'Other', it is defined by the event source
          or analyst.
      confidence_id:
        description: The normalized identifier of the confidence level, reflecting the accuracy
          or pertinence of the OSINT indicator or analysis. A low confidence indicates that
          the collected information lacked sufficient detail or accuracy to fully qualify
          the indicator as malicious. When the value is <code>99</code> (Other), the <code>confidence</code>
          attribute must contain the source-specific label.
        recommended: true
      created_time:
        description: The timestamp when the indicator was initially created or identified.
      created_time_dt:
        description: The timestamp when the indicator was initially created or identified.
        annotations:
          ocsf_profiles: datetime
      creator:
        description: The identifier of the user, system, or organization that contributed
          the indicator.
      desc:
        description: A detailed explanation of the indicator, including its context, purpose,
          and relevance.
      detection_pattern:
        description: The specific detection pattern or signature associated with the indicator.
      email:
        title: Related Email
        description: Any email information pertinent to an indicator or OSINT analysis.
      email_auth:
        title: Related Email Authentication
        description: Any email authentication information pertinent to an indicator or OSINT
          analysis.
      expiration_time:
        description: The expiration date of the indicator, after which it is no longer considered
          reliable.
      expiration_time_dt:
        description: The expiration date of the indicator, after which it is no longer considered
          reliable.
        annotations:
          ocsf_profiles: datetime
      file:
        title: Related File
        description: Any pertinent file information related to an indicator or OSINT analysis.
      kill_chain:
        description: Lockheed Martin Kill Chain Phases pertinent to an indicator or OSINT
          analysis.
      labels:
        description: Tags or keywords associated with the indicator to enhance searchability.
      location:
        description: Any pertinent geolocation information related to an indicator or OSINT
          analysis.
      modified_time:
        description: The timestamp of the last modification or update to the indicator.
      modified_time_dt:
        description: The timestamp of the last modification or update to the indicator.
        annotations:
          ocsf_profiles: datetime
      name:
        description: 'The <code>name</code> is a pointer/reference to an attribute within
          the OCSF event data. For example: file.name.'
      references:
        description: Provides a reference to an external source of information related to
          the CTI being represented. This may include a URL, a document, or some other type
          of reference that provides additional context or information about the CTI.
      related_analytics:
        description: Any analytics related to an indicator or OSINT analysis.
      reputation:
        description: Related reputational analysis from third-party engines and analysts for
          a given indicator or OSINT analysis.
      risk_score:
        description: A numerical representation of the threat indicator’s risk level.
      script:
        title: Related Script Data
        description: Any pertinent script information related to an indicator or OSINT analysis.
      severity:
        description: Represents the severity level of the threat indicator, typically reflecting
          its potential impact or damage.
      severity_id:
        description: The normalized severity level of the threat indicator, typically reflecting
          its potential impact or damage.
      signatures:
        title: Related Digital Signatures
        description: Any digital signatures or hashes related to an indicator or OSINT analysis.
      src_url:
        description: The source URL of an indicator or OSINT analysis, e.g., a URL back to
          a TIP, report, or otherwise.
      subdomains:
        title: Related Subdomains
        description: Any pertinent subdomain information - such as those generated by a Domain
          Generation Algorithm - related to an indicator or OSINT analysis.
      subnet:
        title: Related Subnet
        description: A CIDR or network block related to an indicator or OSINT analysis.
      tlp:
        range: OcsfTlp
        recommended: true
      type:
        description: The OSINT indicator type.
      type_id:
        title: Indicator Type ID
        description: The OSINT indicator type ID.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The indicator type is ambiguous or there is not a related indicator
              for the OSINT object.
          - equals_number: 1
            title: IP Address
            description: An IPv4 or IPv6 address.
          - equals_number: 2
            title: Domain
            description: A full-qualified domain name (FQDN), subdomain, or partial domain.
          - equals_number: 3
            title: Hostname
            description: A hostname or computer name.
          - equals_number: 4
            title: Hash
            description: Any type of hash e.g., MD5, SHA1, SHA2, BLAKE, BLAKE2, SSDEEP, VHASH,
              etc. generated from a file, malware sample, request header, or otherwise used
              to identify a pertinent artifact.
          - equals_number: 5
            title: URL
            description: A Uniform Resource Locator (URL) or Uniform Resource Indicator (URI).
          - equals_number: 6
            title: User Agent
            description: A User Agent typically seen in HTTP request headers.
          - equals_number: 7
            title: Digital Certificate
            description: The serial number, fingerprint, or full content of an X.509 digital
              certificate.
          - equals_number: 8
            title: Email
            description: The contents of an email or any related information to an email object.
          - equals_number: 9
            title: Email Address
            description: An email address.
          - equals_number: 10
            title: Vulnerability
            description: A CVE ID, CWE ID, or other identifier for a weakness, exploit, bug,
              or misconfiguration.
          - equals_number: 11
            title: File
            description: A file or metadata about a file.
          - equals_number: 12
            title: Registry Key
            description: A Windows Registry Key.
          - equals_number: 13
            title: Registry Value
            description: A Windows Registry Value.
          - equals_number: 14
            title: Command Line
            description: A partial or full Command Line used to invoke scripts or other remote
              commands.
          - equals_number: 99
            title: Other
            description: The indicator type is not directly listed.
        required: true
      uid:
        description: The unique identifier for the OSINT object.
      uploaded_time:
        description: The timestamp indicating when the associated indicator or intelligence
          was added to the system or repository.
      uploaded_time_dt:
        description: The timestamp indicating when the associated indicator or intelligence
          was added to the system or repository.
        annotations:
          ocsf_profiles: datetime
      value:
        title: Indicator
        description: The actual indicator value in scope, e.g., a SHA-256 hash hexdigest or
          a domain name.
        required: true
      vendor_name:
        description: The vendor name of a tool which generates intelligence or provides indicators.
      vulnerabilities:
        title: Related Vulnerabilities
        description: Any vulnerabilities related to an indicator or OSINT analysis.
      whois:
        description: Any pertinent WHOIS information related to an indicator or OSINT analysis.
  OcsfPacket:
    title: Packet
    description: The Packet object represents a single captured network packet and its associated
      metadata. It describes where the packet came from, how it is stored or encoded, and
      how it can be located within a capture file or stream. This object does not interpret
      protocol content; it only represents the captured packet data and its positioning information.
    class_uri: ocsf:OcsfPacket
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:NetworkPacket/
      - https://d3fend.mitre.org/dao/artifact/d3f:PacketCaptureFile/
      - https://d3fend.mitre.org/dao/artifact/d3f:PacketLog/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: packet
    related_mappings:
      - d3f:NetworkPacket
      - d3f:PacketCaptureFile
      - d3f:PacketLog
    slots:
      - encoding
      - encoding_id
      - end_offset
      - format
      - format_id
      - sequence_number
      - source
      - source_id
      - start_offset
      - value
    slot_usage:
      encoding:
        description: The human-readable name of the encoding used to represent the packet
          data in the <code>value</code> field. This should match the caption associated with
          <code>encoding_id</code>. If <code>encoding_id</code> is 99 (Other), this field
          contains the original data source–specific encoding value.
      encoding_id:
        description: The normalized identifier of the encoding method used to represent the
          packet data as a string.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The encoding format of the packet data is not known.
          - equals_number: 1
            title: Base64
            description: The packet data is encoded using Base64.
          - equals_number: 2
            title: Hexadecimal
            description: The packet data is encoded as a hexadecimal string representation
              of the raw bytes.
          - equals_number: 3
            title: URL Encoded
            description: The packet data is encoded using percent-encoding (URL encoding).
          - equals_number: 99
            title: Other
            description: The encoding method is not mapped. Refer to the <code>encoding</code>
              field for the original source-specific value.
        recommended: true
      end_offset:
        description: The ending byte position of this packet within a capture file or stream.
      format:
        description: The human-readable name of the packet capture file format in which the
          packet is stored. This should match the caption associated with <code>format_id</code>.
          If <code>format_id</code> is 99 (Other), this field contains the original data source–specific
          format value.
      format_id:
        description: The normalized identifier of the packet capture format.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The packet format is unknown.
          - equals_number: 1
            title: PCAP
            description: Standard libpcap/tcpdump packet capture file format.
          - equals_number: 2
            title: PCAPNG
            description: Next-generation PCAP format that supports multiple interfaces and
              enhanced metadata.
          - equals_number: 3
            title: Snoop
            description: Solaris/Unix capture format.
          - equals_number: 4
            title: ERF
            description: Extensible Record Format used by Endace network monitoring hardware.
          - equals_number: 5
            title: NetMon
            description: Microsoft Network Monitor capture file format.
          - equals_number: 6
            title: 5Views
            description: Accellent 5Views packet capture format.
          - equals_number: 99
            title: Other
            description: The packet format is not mapped. Refer to the <code>format</code>
              field for the original source-specific value.
        recommended: true
      sequence_number:
        description: The relative order number of this packet within its capture context (such
          as a PCAP file, network session, or reconstructed stream). This represents chronological
          capture order, distinct from both protocol-level sequencing (such as TCP sequence
          numbers).
      source:
        description: The human-readable name describing how or where the packet was obtained.
          This should match the caption associated with <code>source_id</code>. If <code>source_id</code>
          is 99 (Other), this field contains the original data source–specific value.
      source_id:
        description: A normalized numeric identifier that specifies how the packet was obtained
          or generated.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The packet source is unknown.
          - equals_number: 1
            title: Wire
            description: The packet was captured directly from a network interface.
          - equals_number: 2
            title: Stream
            description: The packet was reconstructed or derived from a stream of packets.
          - equals_number: 3
            title: Decoder
            description: The packet was generated or extracted by a protocol decoder or analysis
              engine.
          - equals_number: 4
            title: TAP
            description: The packet was captured from a physical network Test Access Point
              (TAP) device used for passive monitoring.
          - equals_number: 5
            title: SPAN
            description: The packet was captured from a switch Switched Port Analyzer (SPAN)
              or mirror port.
          - equals_number: 6
            title: Endpoint
            description: The packet was captured by a host-based agent or endpoint detection
              and response (EDR) sensor.
          - equals_number: 7
            title: Virtual
            description: The packet was captured from a virtual network interface, virtual
              switch, or container network.
          - equals_number: 99
            title: Other
            description: The packet source is not mapped. Refer to the <code>source</code>
              field for the original source-specific value.
        recommended: true
      start_offset:
        description: The starting byte position of this packet within a capture file or stream.
      value:
        description: The actual packet data, represented as a string. The format of this string
          is determined by the specified <code>encoding_id</code> (e.g., Base64, Hexadecimal,
          or URL Encoded).
        required: true
  OcsfParameter:
    title: Parameter
    description: The Parameter object provides details regarding a parameter of a a function.
    class_uri: ocsf:OcsfParameter
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: parameter
      ocsf_constraints: '{"at_least_one": ["name", "pre_value", "post_value"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          pre_value:
            required: true
      - slot_conditions:
          post_value:
            required: true
    slots:
      - name
      - post_value
      - pre_value
    slot_usage:
      name:
        description: The parameter name.
      post_value:
        description: The parameter value after function execution.
      pre_value:
        description: The parameter value before function execution.
  OcsfPeripheralDevice:
    title: Peripheral Device
    description: The peripheral device object describes the properties of external, connectable,
      and detachable hardware.
    class_uri: ocsf:OcsfPeripheralDevice
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: peripheral_device
      ocsf_constraints: '{"at_least_one": ["name", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - class
      - model
      - serial_number
      - type
      - type_id
      - vendor_id_list
      - vendor_name
    slot_usage:
      class:
        description: The class of the peripheral device.
      model:
        description: The peripheral device model.
        recommended: true
      name:
        description: The name of the peripheral device.
        required: true
        recommended: false
      serial_number:
        description: The peripheral device serial number.
        recommended: true
      type:
        title: Peripheral Device Type
        description: The Peripheral Device type, normalized to the caption of the <code>type_id</code>
          value. In the case of 'Other', it is defined by the source.
      type_id:
        title: Peripheral Device Type ID
        description: The normalized peripheral device type ID.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The peripheral device type is unknown.
          - equals_number: 1
            title: External Storage
            description: The peripheral device is an external storage device.
          - equals_number: 2
            title: Keyboard
            description: The peripheral device is a keyboard.
          - equals_number: 3
            title: Mouse
            description: The peripheral device is a mouse.
          - equals_number: 4
            title: Printer
            description: The peripheral device is a printer.
          - equals_number: 5
            title: Monitor
            description: The peripheral device is a monitor.
          - equals_number: 6
            title: Microphone
            description: The peripheral device is a microphone.
          - equals_number: 7
            title: Webcam
            description: The peripheral device is a webcam.
          - equals_number: 99
            title: Other
            description: The peripheral device type is not mapped. See the <code>type</code>
              attribute which contains an event source specific value.
        recommended: true
      uid:
        description: The unique identifier of the peripheral device.
      vendor_id_list:
        description: The list of vendor IDs for the peripheral device.
        recommended: true
      vendor_name:
        description: The primary vendor name for the peripheral device.
        recommended: true
  OcsfPermissionAnalysisResult:
    title: Permission Analysis Result
    description: The Permission Analysis object describes analysis results of permissions,
      policies directly associated with an identity (user, role, or service account). This
      evaluates what permissions an identity has been granted through attached policies, which
      privileges are actively used versus unused, and identifies potential over-privileged
      access. Use this for identity-centric security assessments such as privilege audits,
      dormant permission discovery, and least-privilege compliance analysis.
    class_uri: ocsf:OcsfPermissionAnalysisResult
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: permission_analysis_result
    slots:
      - analyzed_privileges_count
      - condition_keys
      - granted_privileges
      - policy
      - service_privilege_analysis_list
      - total_potential_attacks_count
      - unused_privileges_count
      - unused_services_count
    slot_usage:
      analyzed_privileges_count:
        description: The total count of privileges that were analyzed across all services.
      condition_keys:
        description: 'The condition keys and their values that were evaluated during policy
          analysis, including contextual constraints that affect permission grants. These
          conditions define when and how permissions are applied. Examples: <code>aws:SourceIp:1.2.3.4</code>,
          <code>aws:RequestedRegion:us-east-1</code>.'
      granted_privileges:
        description: 'The specific privileges, actions, or permissions that are explicitly
          granted by the analyzed policy. Examples: AWS actions like <code>s3:GetObject</code>,
          <code>ec2:RunInstances</code>, <code>iam:CreateUser</code>; Azure actions like <code>Microsoft.Storage/storageAccounts/read</code>;
          or GCP permissions like <code>storage.objects.get</code>.'
      policy:
        description: Detailed information about the policy document that was analyzed, including
          policy metadata, version, type (identity-based, resource-based, etc.), and structural
          details. This provides context for understanding the scope and nature of the permission
          analysis.
        recommended: true
      service_privilege_analysis_list:
        description: The list of privilege analysis results grouped by cloud service or namespace.
      unused_privileges_count:
        description: The total count of privileges or actions defined in the policy that have
          not been utilized within the analysis timeframe. This metric helps identify over-privileged
          access and opportunities for privilege reduction to follow the principle of least
          privilege. High counts may indicate policy bloat or excessive permissions.
      unused_services_count:
        description: 'The total count of cloud services or resource types referenced in the
          policy that have not been accessed or utilized within the analysis timeframe. This
          helps identify unused service permissions that could be removed to reduce attack
          surface. Examples: AWS services like S3, SQS, IAM, Lambda; Azure services like Storage,
          Compute, KeyVault; or GCP services like Cloud Storage, Compute Engine, BigQuery.'
  OcsfPolicy:
    title: Policy
    description: The Policy object describes the policies that are applicable. <p>Policy attributes
      provide traceability to the operational state of the security product at the time that
      the event was captured, facilitating forensics, troubleshooting, and policy tuning/adjustments.</p>
    class_uri: ocsf:OcsfPolicy
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: policy
      ocsf_constraints: '{"at_least_one": ["name", "type", "uid"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          type:
            required: true
      - slot_conditions:
          uid:
            required: true
    slots:
      - data
      - desc
      - group
      - is_applied
      - type
      - version
    slot_usage:
      data:
        description: Additional data about the policy such as the underlying JSON policy itself
          or other details.
      desc:
        description: The description of the policy.
      group:
        description: The policy group.
      is_applied:
        description: A determination if the content of a policy was applied to a target or
          request, or not.
        recommended: true
      name:
        description: 'The policy name. For example: <code>AdministratorAccess Policy</code>.'
      type:
        description: 'The policy type. For example: <code>Identity Policy, Resource Policy,
          Service Control Policy, etc.</code>.'
      uid:
        description: A unique identifier of the policy instance.
      version:
        description: The policy version number.
        recommended: true
  OcsfPortInfo:
    title: Port Information
    description: The Port Information object describes a port and its associated protocol
      details.
    class_uri: ocsf:OcsfPortInfo
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: port_info
    slots:
      - port
      - protocol_name
      - protocol_num
    slot_usage:
      port:
        description: 'The port number. For example: <code>80</code>, <code>443</code>, <code>22</code>.'
        required: true
      protocol_name:
        description: 'The IP protocol name in lowercase, as defined by the Internet Assigned
          Numbers Authority (IANA). For example: <code>tcp</code> or <code>udp</code>.'
        see_also:
          - https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml
        recommended: true
  OcsfPrevEvent:
    title: Previous Event
    description: The Previous Event object references the previous event in a chain of events.
      Refer to specific usage.
    class_uri: ocsf:OcsfPrevEvent
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: prev_event
    slots:
      - fingerprint
      - type_uid
      - uid
    slot_usage:
      fingerprint:
        description: The fingerprint of the previous event, binding this reference to the
          previous event's content so that altering or substituting the previous event breaks
          the link. Refer to specific usage.
      type_uid:
        description: The event type identifier of the previous event, as carried in that event's
          <code>type_uid</code>. It directs a consumer to the event class, and therefore the
          table or store, where the previous event resides.
        recommended: true
      uid:
        description: The unique identifier of the previous event, as carried in that event's
          <code>metadata.uid</code>.
        required: true
  OcsfPrivilegeAttackInfo:
    title: Privilege Attack Info
    description: The Privilege Attack Info object groups privileges by the potential attack
      they could enable. It maps specific privileges to MITRE ATT&CK techniques, helping identify
      security risks associated with granted permissions.
    class_uri: ocsf:OcsfPrivilegeAttackInfo
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: privilege_attack_info
    slots:
      - attack
      - privilege_info_list
    slot_usage:
      attack:
        description: The MITRE ATT&CK technique that these privileges could enable.
        required: true
      privilege_info_list:
        description: The list of privilege information objects, where each element describes
          a specific privilege that could enable the associated attack technique.
        required: true
  OcsfPrivilegeInfo:
    title: Privilege Info
    description: The Privilege Info object describes information about a specific privilege,
      action, or permission. It captures the privilege name, type, usage status, and when
      it was last used.
    class_uri: ocsf:OcsfPrivilegeInfo
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: privilege_info
      ocsf_profiles: datetime
    slots:
      - is_unused
      - last_used_time
      - last_used_time_dt
      - name
      - type
      - type_id
    slot_usage:
      is_unused:
        description: Indicates whether the privilege is unused within the analysis timeframe.
      last_used_time:
        description: The most recent time this privilege was used.
      last_used_time_dt:
        description: The most recent time this privilege was used.
        annotations:
          ocsf_profiles: datetime
      name:
        description: 'The name of the privilege, action, or permission. Examples: <code>GetObject</code>,
          <code>CreateStoreImageTask</code> (AWS); <code>Microsoft.Storage/storageAccounts/read</code>
          (Azure); <code>storage.objects.get</code> (GCP).'
        required: true
      type:
        description: The type or category of the privilege, normalized to the caption of the
          <code>type_id</code> value. In the case of 'Other', it is defined by the event source.
      type_id:
        description: The normalized type of the privilege.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The privilege type is unknown.
          - equals_number: 1
            title: Read
            description: 'A read-type privilege that permits viewing or retrieving data. Examples:
              <code>s3:GetObject</code>, <code>Microsoft.Storage/storageAccounts/read</code>,
              <code>storage.objects.get</code>.'
          - equals_number: 2
            title: Write
            description: 'A write-type privilege that permits creating, modifying, or deleting
              data. Examples: <code>s3:PutObject</code>, <code>Microsoft.Storage/storageAccounts/write</code>,
              <code>storage.objects.create</code>.'
          - equals_number: 3
            title: Execute
            description: 'An execute-type privilege that permits running operations or invoking
              functions. Examples: <code>lambda:InvokeFunction</code>, <code>Microsoft.Compute/virtualMachines/start/action</code>.'
          - equals_number: 99
            title: Other
            description: The privilege type is not mapped. See the <code>type</code> attribute,
              which contains a data source specific value.
  OcsfProcessEntity:
