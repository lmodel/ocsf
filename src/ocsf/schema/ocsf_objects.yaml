      purl:
        description: The Package URL (PURL) to identify the software component. This is a
          URL that uniquely identifies the component, including the component's name, version,
          and type. The URL is used to locate and retrieve the component's metadata and content.
        recommended: true
      related_component:
        recommended: true
      relationship_id:
        recommended: true
      type:
        description: The type of software component, normalized to the caption of the <code>type_id</code>
          value. In the case of 'Other', it is defined by the source.
      type_id:
        description: The type of software component.
        any_of:
