        description: 'The network domain where the device resides. For example: <code>work.example.com</code>.'
      first_seen_time:
        description: The initial discovery time of the device.
      first_seen_time_dt:
        description: The initial discovery time of the device.
        annotations:
          ocsf_profiles: datetime
      groups:
        description: 'The group names to which the device belongs. For example: <code>["Windows
          Laptops", "Engineering"]</code>.'
      hostname:
        description: The device hostname.
      image:
        description: The image used as a template to run the virtual machine.
      ip:
        description: The device IP address, in either IPv4 or IPv6 format.
        recommended: false
      last_seen_time:
        description: The most recent discovery time of the device.
      last_seen_time_dt:
        description: The most recent discovery time of the device.
        annotations:
          ocsf_profiles: datetime
      location:
        description: The geographical location of the device.
      model:
        description: The model of the device. For example <code>ThinkPad X1 Carbon</code>.
      modified_time:
        description: The time when the device was last known to have been modified.
      modified_time_dt:
        description: The time when the device was last known to have been modified.
        annotations:
          ocsf_profiles: datetime
      name:
        description: The alternate device name, ordinarily as assigned by an administrator.
          <p><b>Note:</b> The <b>Name</b> could be any other string that helps to identify
          the device, such as a phone number; for example <code>310-555-1234</code>.</p>
        recommended: false
      org:
        description: Organization and org unit related to the device.
      peripheral_devices:
        description: The peripheral devices that are attached or connected to the device.
      region:
        description: The region where the virtual machine is located. For example, an AWS
          Region.
        recommended: true
      type:
        description: 'The device type. For example: <code>unknown</code>, <code>server</code>,
          <code>desktop</code>, <code>laptop</code>, <code>tablet</code>, <code>mobile</code>,
          <code>virtual</code>, <code>browser</code>, or <code>other</code>.'
        recommended: true
      type_id:
        description: The device type ID.
        required: true
        recommended: false
      uid:
        description: The unique identifier of the device. For example the Windows TargetSID
          or AWS EC2 ARN.
        annotations:
          ocsf_observable: '47'
      uid_alt:
        description: An alternate unique identifier of the device if any. For example the
          ActiveDirectory DN.
      vendor_name:
        description: The vendor for the device. For example <code>Dell</code> or <code>Lenovo</code>.
        recommended: true
  OcsfDeviceHwInfo:
    title: Device Hardware Info
    description: The Device Hardware Information object contains details and specifications
      of the physical components that make up a device. This information provides an overview
      of the hardware capabilities, configuration, and characteristics of the device.
    class_uri: ocsf:OcsfDeviceHwInfo
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: device_hw_info
    slots:
      - bios_date
      - bios_manufacturer
      - bios_ver
      - chassis
      - cores
      - cpu_architecture
      - cpu_architecture_id
      - cpu_bits
      - cpu_cores
      - cpu_count
      - cpu_info_list
      - cpu_speed
      - cpu_type
      - desktop_display
      - gpu_count
      - gpu_info_list
      - keyboard_info
      - ram_size
      - serial_number
      - uuid
      - vendor_name
    slot_usage:
      cores:
        description: The total number of processor cores across all installed CPUs on the
          system. For per-CPU core detail, use <code>cpu_info_list</code>.
      cpu_architecture:
        deprecated: Use <code>cpu_info_list[*].cpu_architecture</code> instead.
        annotations:
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: cpu_info_list[*].cpu_architecture
      cpu_architecture_id:
        deprecated: Use <code>cpu_info_list[*].cpu_architecture_id</code> instead.
        annotations:
          ocsf_sibling: cpu_architecture
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: cpu_info_list[*].cpu_architecture_id
      cpu_bits:
        deprecated: Use <code>cpu_info_list[*].cpu_bits</code> instead.
        annotations:
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: cpu_info_list[*].cpu_bits
      cpu_cores:
        deprecated: Use <code>cpu_info_list[*].cores</code> instead.
      cpu_count:
        description: The number of physical processors on a system. For per-CPU detail, use
          <code>cpu_info_list</code>.
      cpu_info_list:
        description: A list of <code>cpu_info</code> objects, each describing a physical CPU
          package installed in the device. Use with <code>cpu_count</code>.
      cpu_speed:
        deprecated: Use <code>cpu_info_list[*].speed_mhz</code> instead.
      cpu_type:
        deprecated: Use <code>cpu_info_list[*].model</code> and <code>cpu_info_list[*].vendor_name</code>
          instead.
      gpu_count:
        description: The number of graphics processors on a system. For per-GPU detail, use
          <code>gpu_info_list</code>.
      gpu_info_list:
        description: A list of GPU objects describing the hardware properties of each graphics
          processor installed on the device. Use with <code>gpu_count</code>.
      serial_number:
        description: The device manufacturer serial number.
      uuid:
        description: The device manufacturer assigned universally unique hardware identifier.
          For SMBIOS compatible devices such as those running Linux and Windows, it is the
          UUID member of the System Information structure in the SMBIOS information. For macOS
          devices, it is the Hardware UUID (also known as IOPlatformUUID in the I/O Registry).
        see_also:
          - https://www.dmtf.org/standards/smbios
          - https://linux.die.net/man/8/dmidecode
          - https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-computersystemproduct
          - https://theapplewiki.com/wiki/UDID#Mac
          - https://github.com/apple-oss-distributions/xnu/blob/8d741a5de7ff4191bf97d57b9f54c2f6d4a15585/iokit/IOKit/IOKitKeys.h#L264-L265
      vendor_name:
        description: The device manufacturer.
    related_mappings:
      - d3f:HardwareDevice
  OcsfDigitalSignature:
    title: Digital Signature
    description: The Digital Signature object contains information about the cryptographic
      mechanism used to verify the authenticity, integrity, and origin of the file or application.
    class_uri: ocsf:OcsfDigitalSignature
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: digital_signature
      ocsf_profiles: datetime
    slots:
      - algorithm
      - algorithm_id
      - certificate
      - created_time
      - created_time_dt
      - developer_uid
      - digest
      - serialization
      - serialization_id
      - state
      - state_id
    slot_usage:
      algorithm:
        description: The digital signature algorithm used to create the signature, normalized
          to the caption of 'algorithm_id'. In the case of 'Other', it is defined by the event
          source.
      algorithm_id:
        description: The identifier of the normalized digital signature algorithm.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The algorithm is unknown.
          - equals_number: 1
            title: DSA
            description: Digital Signature Algorithm (DSA).
          - equals_number: 2
            title: RSA
            description: Rivest-Shamir-Adleman (RSA) Algorithm.
          - equals_number: 3
            title: ECDSA
            description: Elliptic Curve Digital Signature Algorithm.
          - equals_number: 4
            title: Authenticode
            description: Authenticode Digital Signature Algorithm.
            see_also:
              - https://download.microsoft.com/download/9/c/5/9c5b2167-8017-4bae-9fde-d599bac8184a/Authenticode_PE.docx
          - equals_number: 5
            title: Code Signing
            description: Code Signing Algorithm.
            see_also:
              - https://developer.apple.com/documentation/technotes/tn3126-inside-code-signing-hashes
          - equals_number: 6
            title: App Package
            description: Application Package Signing Algorithm.
            see_also:
              - https://learn.microsoft.com/en-us/windows/msix/package/signing-package-overview
          - equals_number: 99
            title: Other
            description: The algorithm is not mapped. See the <code>algorithm</code> attribute,
              which contains a data source specific value.
        required: true
      certificate:
        recommended: true
      created_time:
        description: The time when the digital signature was created.
      created_time_dt:
        description: The time when the digital signature was created.
        annotations:
          ocsf_profiles: datetime
      serialization:
        description: The canonical serialization or signing-envelope scheme used to produce
          the deterministic byte sequence that was signed, normalized to the caption of <code>serialization_id</code>.
          In the case of <code>Other</code>, it is defined by the event source.
      serialization_id:
        description: The identifier of the normalized canonical serialization or signing-envelope
          scheme used to produce the deterministic byte sequence that was signed. A verifier
          must apply the same scheme to reproduce the signing input. Use <code>Flat</code>
          where the signed data is an opaque byte sequence, such as file content, to which
          no canonical serialization was applied. Distinct from <code>algorithm_id</code>,
          which identifies how the resulting bytes were signed; some signing formats (e.g.
          <code>Authenticode</code>) define their own canonicalization and populate both fields.
        any_of:
          - equals_number: 0
            title: Unknown
          - equals_number: 1
            title: Flat
            description: No canonical serialization or signing envelope was applied; the signature
              is computed over the data's raw byte sequence, such as the content of a disk
              file or any other opaque byte stream.
          - equals_number: 2
            title: JCS
            description: JSON Canonicalization Scheme - deterministic JSON serialization of
              the structured data prior to signing.
            see_also:
              - https://www.rfc-editor.org/rfc/rfc8785
          - equals_number: 3
            title: JWS
            description: JSON Web Signature - the JWS Signing Input, i.e. BASE64URL(protected
              header) '.' BASE64URL(payload).
            see_also:
              - https://www.rfc-editor.org/rfc/rfc7515
          - equals_number: 4
            title: COSE
            description: CBOR Object Signing and Encryption - the CBOR Sig_structure used
              as the binary signing input.
            see_also:
              - https://www.rfc-editor.org/rfc/rfc9052
          - equals_number: 5
            title: DSSE
            description: 'Dead Simple Signing Envelope - the PAE (Pre-Authentication Encoding)
              canonical signing input. Note: DSSE is a signing-envelope scheme, not a hash
              algorithm; any payload hash is carried separately in the fingerprint object.'
            see_also:
              - https://github.com/secure-systems-lab/dsse
          - equals_number: 6
            title: Authenticode
            description: 'The Portable Executable (PE) Image Hash procedure that canonicalizes
              the PE structure into the byte sequence fed to the digest, excluding specified
              header fields and digesting sections in a defined order. Authenticode bundles
              canonicalization and signing format: when used, <code>algorithm_id</code> is
              also set to the <code>Authenticode</code> enum value.'
            see_also:
              - https://download.microsoft.com/download/9/c/5/9c5b2167-8017-4bae-9fde-d599bac8184a/Authenticode_PE.docx
          - equals_number: 7
            title: Code Signing
            description: The procedure that describes how hashes of code and other structures
              form the Code Directory message that is signed. When used, <code>algorithm_id</code>
              is also set to the <code>Code Signing</code> enum value.
            see_also:
              - https://developer.apple.com/documentation/technotes/tn3126-inside-code-signing-hashes
          - equals_number: 8
            title: App Package
            description: The Windows Application Package signing procedure that describes
              how file hashes are stored in the manifest, and how that manifest is signed.
            see_also:
              - https://learn.microsoft.com/en-us/windows/msix/package/signing-package-overview
          - equals_number: 99
            title: Other
        recommended: true
      state:
        description: The digital signature state defines the signature state, normalized to
          the caption of 'state_id'. In the case of 'Other', it is defined by the event source.
      state_id:
        description: The normalized identifier of the signature state.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The state is unknown.
          - equals_number: 1
            title: Valid
            description: The digital signature is valid.
          - equals_number: 2
            title: Expired
            description: The digital signature is invalid because its timestamp does not fall
              within the certificate's validity period.
          - equals_number: 3
            title: Revoked
            description: The digital signature is invalid due to certificate revocation.
          - equals_number: 4
            title: Suspended
            description: The digital signature is invalid due to certificate suspension.
          - equals_number: 5
            title: Pending
            description: The digital signature state is pending.
          - equals_number: 6
            title: Untrusted
            description: The digital signature is invalid because the certificate is rooted
              in an untrusted CA or is an untrusted self-signed certificate.
          - equals_number: 7
            title: Distrusted
            description: The digital signature is invalid because the certificate is explicitly
              distrusted. Note that whereas revocation is global, distrust reflects local
              IT/security policy.
          - equals_number: 8
            title: WrongUsage
            description: The digital signature is invalid because the certificate is not intended
              for code signing purposes.
          - equals_number: 9
            title: Bad
            description: The digital signature is cryptographically invalid, e.g. a mismatched
              digest. This indicates possible tampering.
          - equals_number: 10
            title: Broken
            description: The digital signature is malformed and could not be processed.
          - equals_number: 99
            title: Other
            description: The state is not mapped. See the <code>state</code> attribute, which
              contains a data source specific value.
  OcsfDiscoveryDetails:
    title: Discovery Details
    description: The Discovery Details object describes results of a discovery task/job. Each
      result may be due to the violation of a <code>rule</code> associated with a <code>policy</code>
      and have multiple <code>occurrences</code>.
    class_uri: ocsf:OcsfDiscoveryDetails
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: discovery_details
    slots:
      - count
      - occurrence_details
      - occurrences
      - rule
      - type
      - value
    slot_usage:
      count:
        description: The number of discovered entities of the specified type.
        recommended: true
      occurrence_details:
        description: Details about where in the target entity, specified information was discovered.
          Only the attributes, relevant to the target entity type should be populated.
        deprecated: Use <code>occurrences</code> instead.
        annotations:
          ocsf_deprecated_since: 1.4.0
          ocsf_superseded_by: occurrences
      occurrences:
        description: Details about where in the target entity, specified information was discovered.
          Only the attributes, relevant to the target entity type should be populated.
      rule:
        description: The rule associated with this discovery, usually part of the higher level
          <code>policy</code> from an enclosing class or object.
        recommended: true
      type:
        description: The specific type of information that was discovered. e.g.<code> name,
          phone_number, etc.</code>
        recommended: true
      value:
        description: Optionally, the specific value of discovered information.
  OcsfDisplay:
    title: Display
    description: The Display object contains information about the physical or virtual display
      connected to a computer system.
    class_uri: ocsf:OcsfDisplay
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: display
    slots:
      - color_depth
      - physical_height
      - physical_orientation
      - physical_width
      - scale_factor
  OcsfDnsResourceRecord:
    title: DNS Resource Record
    description: The DNS Resource Record object represents a single resource record as defined
      in RFC 1035. It is used in the Answer, Authority, and Additional sections of a DNS message.
    class_uri: ocsf:OcsfDnsResourceRecord
    see_also:
      - https://www.rfc-editor.org/rfc/rfc1035.txt
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: dns_resource_record
    slots:
      - class
      - hostname
      - rdata
      - ttl
      - type
    slot_usage:
      class:
        title: Resource Record Class
        description: 'The class of DNS data contained in this resource record. See RFC 1035.
          For example: <code>IN</code>.'
        recommended: true
      hostname:
        description: 'The owner name of the resource record. For example: <code>www.example.com</code>.'
        recommended: true
      rdata:
        required: true
      ttl:
        recommended: true
      type:
        title: Resource Record Type
        description: 'The type of data contained in this resource record. See RFC 1035. For
          example: <code>CNAME</code>.'
        see_also:
          - https://www.rfc-editor.org/rfc/rfc1035.txt
        recommended: true
  OcsfDnsAnswer:
    title: DNS Answer
    description: The DNS Answer object represents a specific response provided by the Domain
      Name System (DNS) when querying for information about a domain or performing a DNS operation.
      It encapsulates the relevant details and data returned by the DNS server in response
      to a query.
    class_uri: ocsf:OcsfDnsAnswer
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:InboundInternetDNSResponseTraffic/
      - https://www.rfc-editor.org/rfc/rfc1035.txt
    is_a: OcsfDnsResourceRecord
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: dns_answer
    related_mappings:
      - d3f:InboundInternetDNSResponseTraffic
    slots:
      - flag_ids
      - flags
      - packet_uid
    slot_usage:
      flag_ids:
        title: DNS Header Flags
        description: The list of DNS answer header flag IDs.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The flag is unknown.
          - equals_number: 1
            title: Authoritative Answer
          - equals_number: 2
            title: Truncated Response
          - equals_number: 3
            title: Recursion Desired
          - equals_number: 4
            title: Recursion Available
          - equals_number: 5
            title: Authentic Data
          - equals_number: 6
            title: Checking Disabled
          - equals_number: 99
            title: Other
            description: The flag is not mapped. See the <code>flags</code> attribute, which
              contains a data source specific value.
        deprecated: Use <code>dns_activity.flag_ids</code> instead.
        recommended: true
        annotations:
          ocsf_sibling: flags
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: dns_activity.flag_ids
      flags:
        title: DNS Header Flags
        description: The list of DNS answer header flags.
        deprecated: Use <code>dns_activity.flags</code> instead.
        annotations:
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: dns_activity.flags
      packet_uid:
        description: The DNS packet identifier assigned by the program that generated the
          query. The identifier is copied to the response.
        deprecated: Use <code>dns_activity.transaction_id</code> instead.
        recommended: true
        annotations:
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: dns_activity.transaction_id
  OcsfDnsQuery:
    title: DNS Query
    description: The DNS Query object represents a specific request made to the Domain Name
      System (DNS) to retrieve information about a domain or perform a DNS operation.
    class_uri: ocsf:OcsfDnsQuery
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:DNSLookup/
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: dns_query
    related_mappings:
      - d3f:DNSLookup
    slots:
      - class
      - hostname
      - opcode
      - opcode_id
      - packet_uid
      - type
    slot_usage:
      class:
        title: Resource Record Class
        description: 'The class of resource records being queried. See RFC 1035. For example:
          <code>IN</code>.'
        recommended: true
      hostname:
        description: 'The hostname or domain being queried. For example: <code>www.example.com</code>'
        required: true
      opcode:
        deprecated: Use <code>dns_activity.opcode</code> instead.
        annotations:
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: dns_activity.opcode
      opcode_id:
        deprecated: Use <code>dns_activity.opcode_id</code> instead.
        recommended: true
        annotations:
          ocsf_suppress_checks: enum_convention
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: dns_activity.opcode_id
      packet_uid:
        description: The DNS packet identifier assigned by the program that generated the
          query. The identifier is copied to the response.
        deprecated: Use <code>dns_activity.transaction_id</code> instead.
        recommended: true
        annotations:
          ocsf_deprecated_since: 1.9.0
          ocsf_superseded_by: dns_activity.transaction_id
      type:
        title: Resource Record Type
        description: 'The type of resource records being queried. See RFC 1035. For example:
          A, AAAA, CNAME, MX, and NS.'
        recommended: true
  OcsfDnsSection:
    title: DNS Section
    description: The DNS Section object represents a DNS message section that carries supplementary
      resource records alongside an optional TSIG record. It is used for both the client Additional
      section (<code>query_additional</code>) and the server Additional section (<code>response_additional</code>)
      of a DNS message. A DNS message has at most one TSIG record, which authenticates the
      entire message.
    class_uri: ocsf:OcsfDnsSection
    see_also:
      - https://www.rfc-editor.org/rfc/rfc1035.txt
      - https://www.rfc-editor.org/rfc/rfc2845
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: dns_section
    slots:
      - records
      - tsig
    slot_usage:
      records:
        title: Resource Records
        description: The resource records contained in this DNS section.
        required: true
      tsig:
        description: The TSIG (Transaction Signature) record present in this DNS section,
          used to authenticate the entire DNS message. Per RFC 2845, at most one TSIG record
          is permitted per DNS message.
  OcsfDomainContact:
    title: Domain Contact
    description: The contact information related to a domain registration, e.g., registrant,
      administrator, abuse, billing, or technical contact.
    class_uri: ocsf:OcsfDomainContact
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: domain_contact
    slots:
      - email_addr
      - location
      - name
      - phone_number
      - type
      - type_id
      - uid
    slot_usage:
      email_addr:
        title: Contact Email
        recommended: true
      location:
        title: Contact Location Information
        description: Location details for the contract such as the city, state/province, country,
          etc.
        recommended: true
      name:
        description: The individual or organization name for the contact.
      type:
        title: Domain Contact Type
        description: The Domain Contact type, normalized to the caption of the <code>type_id</code>
          value. In the case of 'Other', it is defined by the source
      type_id:
        title: Domain Contact Type ID
        description: The normalized domain contact type ID.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: Registrant
            description: The contact information provided is for the domain registrant.
          - equals_number: 2
            title: Administrative
            description: The contact information provided is for the domain administrator.
          - equals_number: 3
            title: Technical
            description: The contact information provided is for the domain technical lead.
          - equals_number: 4
            title: Billing
            description: The contact information provided is for the domain billing lead.
          - equals_number: 5
            title: Abuse
            description: The contact information provided is for the domain abuse contact.
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        required: true
      uid:
        description: The unique identifier of the contact information, typically provided
          in WHOIS information.
  OcsfDownloadInfo:
    title: Download Info
    description: The Download Info object contains metadata pertaining to a downloaded file.
    class_uri: ocsf:OcsfDownloadInfo
    see_also:
      - https://en.wikipedia.org/wiki/Mark_of_the_Web
      - https://developer.apple.com/documentation/coreservices/kmditemwherefroms?language=objc
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: download_info
      ocsf_profiles: container
      ocsf_constraints: '{"at_least_one": ["src_endpoint", "src_url", "type_id"]}'
    any_of:
      - slot_conditions:
          src_endpoint:
            required: true
      - slot_conditions:
          src_url:
            required: true
      - slot_conditions:
          type_id:
            required: true
    slots:
      - referrer
      - src_endpoint
      - src_url
      - type
      - type_id
    slot_usage:
      referrer:
        description: The URL that referred to <code>src_url</code>. This is typically the
          URL of a web page containing a download link.
      src_endpoint:
        description: Information about the network endpoint from which the file was downloaded.
      src_url:
        description: The URL from which the file was downloaded.
        recommended: true
      type:
        description: The download type, normalized to the caption of the <code>type_id</code>
          value. In the case of 'Other', it is defined by the event source.
      type_id:
        description: The download type ID. The values correspond to the five permitted values
          of the <code>ZoneId</code> property in the Mark of the Web metadata of a downloaded
          file on Windows. Note however that each numeric value is 1 greater than its <code>ZoneId</code>
          equivalent.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The file's download type is unknown.
          - equals_number: 1
            title: Local Machine
            description: The file was downloaded from a server running on device.
          - equals_number: 2
            title: Intranet
            description: The file was downloaded from an intranet server.
          - equals_number: 3
            title: Trusted
            description: The file was downloaded from a trusted server.
          - equals_number: 4
            title: Internet
            description: The file was downloaded from an internet server.
          - equals_number: 5
            title: Untrusted
            description: The file was downloaded from an untrusted server.
          - equals_number: 99
            title: Other
            description: The file's download type is not mapped. See the <code>type</code>
              attribute, which contains an event source specific value.
        recommended: true
  OcsfEdge:
