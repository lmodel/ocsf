        description: The number of unique malware detected across all infected files.
  OcsfManagedEntity:
    title: Managed Entity
    description: The Managed Entity object describes the type and version of an entity, such
      as a user, device, or policy.  For types in the <code>type_id</code> enum list, an associated
      attribute should be populated.  If the type of entity is not in the <code>type_id</code>
      list, information can be put into the <code>data</code> attribute, <code>type_id</code>
      should be 'Other' and the <code>type</code> attribute should label the entity type.
    class_uri: ocsf:OcsfManagedEntity
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: managed_entity
      ocsf_profiles: container data_classification
      ocsf_constraints: '{"at_least_one": ["name", "uid", "device", "group", "org", "policy",
        "user"]}'
    any_of:
      - slot_conditions:
          name:
            required: true
      - slot_conditions:
          uid:
            required: true
      - slot_conditions:
          device:
            required: true
      - slot_conditions:
          group:
            required: true
      - slot_conditions:
          org:
            required: true
      - slot_conditions:
          policy:
            required: true
      - slot_conditions:
          user:
            required: true
    slots:
      - data
      - device
      - email
      - group
      - location
      - org
      - policy
      - type
      - type_id
      - user
      - version
    slot_usage:
      data:
        description: The managed entity content as a JSON object.
      device:
        recommended: true
      email:
        recommended: true
      group:
        recommended: true
      name:
        description: The name of the managed entity. It should match the name of the specific
          entity object's name if populated, or the name of the managed entity if the <code>type_id</code>
          is 'Other'.
      org:
        description: The Organization object containing details about the managed organizational
          entity. This object includes properties such as the organization name, unique identifier,
          type, and other organizational metadata. This attribute should be populated when
          <code>type_id</code> is <code>4</code> (Organization).
        recommended: true
      policy:
        description: Describes details of a managed policy.
        recommended: true
      type:
        description: 'The managed entity type. For example: <code>Policy</code>, <code>User</code>,
          <code>Organization</code>, <code>Device</code>.'
        recommended: true
      type_id:
        description: The type of the Managed Entity. It is recommended to also populate the
          <code>type</code> attribute with the associated label, or the source specific name
          if <code>Other</code>.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is unknown.
          - equals_number: 1
            title: Device
            description: A managed Device entity.  This item corresponds to population of
              the <code>device</code> attribute.
          - equals_number: 2
            title: User
            description: A managed User entity.  This item corresponds to population of the
              <code>user</code> attribute.
          - equals_number: 3
            title: Group
            description: A managed Group entity.  This item corresponds to population of the
              <code>group</code> attribute.
          - equals_number: 4
            title: Organization
            description: A managed Organization entity.  This item corresponds to population
              of the <code>org</code> attribute.
          - equals_number: 5
            title: Policy
            description: A managed Policy entity.  This item corresponds to population of
              the <code>policy</code> attribute.
          - equals_number: 6
            title: Email
            description: A managed Email entity.  This item corresponds to population of the
              <code>email</code> attribute.
          - equals_number: 7
            title: Network Zone
            description: A managed Network Zone entity. Populate the <code>name</code> attribute
              with the zone name and/or the <code>uid</code> attribute with the zone ID. Additional
              zone information can be added to the <code>data</code> attribute.
          - equals_number: 99
            title: Other
            description: The type is not mapped. See the <code>type</code> attribute, which
              contains a data source specific value.
        recommended: true
      uid:
        description: The identifier of the managed entity. It should match the <code>uid</code>
          of the specific entity's object UID if populated, or the source specific ID if the
          <code>type_id</code> is 'Other'.
      user:
        recommended: true
      version:
        description: 'The version of the managed entity. For example: <code>1.2.3</code>.'
        recommended: true
  OcsfMessageContext:
    title: Message Context
    description: Communication context for AI system interactions including protocols, roles,
      clients, and session information for MCP and other AI communication systems.
    class_uri: ocsf:OcsfMessageContext
    see_also:
      - https://owasp.org/www-project-ai-security-and-privacy-guide/
      - https://modelcontextprotocol.io/
    is_a: OcsfEntity
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: message_context
      ocsf_profiles: data_classification
      ocsf_constraints: '{"at_least_one": ["application", "service"]}'
    any_of:
      - slot_conditions:
          application:
            required: true
      - slot_conditions:
          service:
            required: true
    slots:
      - ai_role
      - ai_role_id
      - application
      - completion_tokens
      - prompt_text
      - prompt_tokens
      - response_text
      - service
      - total_tokens
    slot_usage:
      ai_role_id:
        description: Specifies the functional role of the AI within the context of this message,
          such as retrieving information, assisting reasoning, executing a tool, or generating
          content.
        any_of:
          - equals_number: 0
            title: Unknown
            description: Unknown role type.
          - equals_number: 1
            title: User
            description: The human user initiating a request.
          - equals_number: 2
            title: Assistant
            description: The AI model generating a response.
          - equals_number: 3
            title: Tool
            description: A callable tool or API invoked by the assistant.
          - equals_number: 4
            title: Agent
            description: A software agent that performs tasks with autonomy or delegated intent.
          - equals_number: 5
            title: Orchestrator
            description: The component coordinating multiple agents or tools.
          - equals_number: 6
            title: Retriever
            description: A component that retrieves information or context from a knowledge
              source (e.g., vector DB, search system, or API).
          - equals_number: 99
            title: Other
            description: Other role type not covered above.
        recommended: true
      application:
        description: The initiating client application. In AI systems, this represents the
          client-side application or framework that initiates requests (e.g., LangChain application,
          web browser, mobile app, SDK implementation).
        recommended: true
      name:
        description: The name or identifier of the message context. In AI systems, this could
          be the conversation ID, session name, thread identifier, or interaction name (e.g.,
          'user-session-123', 'conversation-abc', 'chat-thread-456').
      service:
        description: The server or service handling the request. In AI systems, this represents
          the AI service, API endpoint, or agent that processes and responds to requests (e.g.,
          OpenAI API service, Claude API service, internal AI model service).
        recommended: true
      uid:
        description: The unique identifier of the message context. This could be a session
          ID, conversation ID, or other unique identifier that allows correlation of messages
          within the same context.
  OcsfMetadata:
    title: Metadata
    description: The Metadata object describes the metadata associated with the event.
    class_uri: ocsf:OcsfMetadata
    see_also:
      - https://d3fend.mitre.org/dao/artifact/d3f:Metadata/
    is_a: OcsfObjectBase
    mixins:
      - OcsfDataClassificationProfile
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: metadata
      ocsf_profiles: container data_classification datetime
    related_mappings:
      - d3f:Metadata
    slots:
      - correlation_uid
      - debug
      - event_code
      - extension
      - extensions
      - is_truncated
      - labels
      - log_format
      - log_level
      - log_name
      - log_provider
      - log_source
      - log_version
      - logged_time
      - logged_time_dt
      - loggers
      - modified_time
      - modified_time_dt
      - original_event_uid
      - original_time
      - processed_time
      - processed_time_dt
      - product
      - profiles
      - reporter
      - sequence
      - source
      - tags
      - tenant_uid
      - total_queued_duration
      - transformation_info_list
      - transmit_time
      - transmit_time_dt
      - type
      - uid
      - untruncated_size
      - version
    slot_usage:
      correlation_uid:
        description: A unique identifier used to correlate this OCSF event with other related
          OCSF events, distinct from the event's <code>uid</code> value. This enables linking
          multiple OCSF events that are part of the same activity, transaction, or security
          incident across different systems or time periods.
      event_code:
        description: The identifier of the original event. For example the numerical Windows
          Event Code or Cisco syslog code.
      is_truncated:
        description: Indicates whether the OCSF event data has been truncated due to size
          limitations. When <code>true</code>, some event data may have been omitted to fit
          within system constraints.
      labels:
        description: 'The list of labels attached to the event. For example: <code>["sample",
          "dev"]</code>'
      log_format:
        title: Log Source Format
        description: The format of data in the log where the data originated. For example
          CSV, XML, Windows Multiline, JSON, syslog or Cisco Log Schema.
      log_level:
        description: The level at which an event was logged. This can be log provider specific.
          For example the audit level.
      log_name:
        description: The event log name, typically for the consumer of the event. For example,
          the storage bucket name, SIEM repository index name, etc.
        recommended: true
      log_provider:
        description: The logging provider or logging service that logged the event. For example
          AWS CloudWatch or Splunk.
      log_source:
        description: The log system or component where the data originated. For example, a
          file path, syslog server name or a Windows hostname and logging subsystem such as
          Security.
      log_version:
        description: The event log schema version of the original event. For example the syslog
          version or the Cisco Log Schema version
      logged_time:
        description: The ultimate logged time in the event pipeline - when the event reached
          its final destination (e.g., SIEM, data lake). If <code>loggers</code> is populated,
          this should match the <code>logged_time</code> of the last entry in the <code>loggers</code>
          array. This is distinct from <code>time</code> (when the activity occurred) and
          <code>processed_time</code> (when an intermediate system processed the event).
      logged_time_dt:
        description: The ultimate logged time in the event pipeline - when the event reached
          its final destination (e.g., SIEM, data lake). If <code>loggers</code> is populated,
          this should match the <code>logged_time</code> of the last entry in the <code>loggers</code>
          array. This is distinct from <code>time</code> (when the activity occurred) and
          <code>processed_time</code> (when an intermediate system processed the event).
        annotations:
          ocsf_profiles: datetime
      loggers:
        description: An ordered array of Logger objects describing each hop in the event pipeline
          between the source and its final destination. Each entry captures the logging product,
          device, and timestamps (<code>logged_time</code>, <code>transmit_time</code>) at
          that stage. The last entry's <code>logged_time</code> should match <code>metadata.logged_time</code>.
      modified_time:
        description: The time when the event was last modified or enriched.
      modified_time_dt:
        description: The time when the event was last modified or enriched.
        annotations:
          ocsf_profiles: datetime
      original_time:
        recommended: true
      processed_time:
        description: The time when the event was processed by an intermediate system (e.g.,
          ETL pipeline, event processor) before reaching its final destination. Can be used
          with <code>logged_time</code> to calculate queuing duration via <code>total_queued_duration</code>.
      processed_time_dt:
        description: The time when the event was processed by an intermediate system (e.g.,
          ETL pipeline, event processor) before reaching its final destination. Can be used
          with <code>logged_time</code> to calculate queuing duration via <code>total_queued_duration</code>.
        annotations:
          ocsf_profiles: datetime
      product:
        required: true
      reporter:
        description: The entity from which the event or finding was first reported.
        recommended: true
      source:
        description: The source of the event or finding. This can be any distinguishing name
          for the logical origin of the data — for example, 'CloudTrail Events', or a use
          case like 'Attack Simulations' or 'Vulnerability Scans'.
      tags:
        description: The list of tags; <code>{key:value}</code> pairs associated to the event.
      tenant_uid:
        recommended: true
      total_queued_duration:
        description: The amount of time an event spent in a queue awaiting processing. In
          this case, the value is the difference between <code>processed_time</code> and <code>logged_time</code>.
          This duration is inclusive of all queues between the originator of the event and
          the intended long-term storage destination of the event.
      transmit_time:
        description: The time when the event was transmitted from the logging device to it's
          next destination.
      transmit_time_dt:
        description: The time when the event was transmitted from the logging device to it's
          next destination.
        annotations:
          ocsf_profiles: datetime
      type:
        description: The type of the event or finding as a subset of the <code>source</code>
          of the event. This can be any distinguishing characteristic of the data. For example
          'Management Events' or 'Device Penetration Test'.
      uid:
        title: Event UID
        description: A unique identifier assigned to the OCSF event. This ID is specific to
          the OCSF event itself and is distinct from the original event identifier in the
          source system (see <code>original_event_uid</code>).
      untruncated_size:
        description: The original size of the OCSF event data in kilobytes before any truncation
          occurred. This field is typically populated when <code>is_truncated</code> is <code>true</code>
          to indicate the full size of the original event.
      version:
        description: 'The version of the OCSF schema, using Semantic Versioning Specification
          (SemVer). For example: <code>1.0.0</code>. Event consumers use the version to determine
          the available event attributes.'
        see_also:
          - https://semver.org
        required: true
  OcsfMetric:
    title: Metric
