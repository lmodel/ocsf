        recommended: true
  OcsfDataClassification:
    title: Data Classification
    description: The Data Classification object includes information about data classification
      levels and data category types.
    class_uri: ocsf:OcsfDataClassification
    is_a: OcsfObjectBase
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: data_classification
      ocsf_constraints: '{"at_least_one": ["category_id", "confidentiality_id"]}'
    any_of:
      - slot_conditions:
          category_id:
            required: true
      - slot_conditions:
          confidentiality_id:
            required: true
    slots:
      - category
      - category_id
      - classifier_details
      - confidentiality
      - confidentiality_id
      - discovery_details
      - policy
      - size
      - src_url
      - status
      - status_details
      - status_id
      - total
      - uid
    slot_usage:
      category:
        description: The name of the data classification category that data matched into,
          e.g. Financial, Personal, Governmental, etc.
      category_id:
        description: The normalized identifier of the data classification category.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The type is not mapped. See the <code>data_type</code> attribute,
              which contains a data source specific value.
          - equals_number: 1
            title: Personal
            description: Any Personally Identifiable Information (PII), Electronic Personal
              Health Information (ePHI), or similarly personal information. E.g., full name,
              home address, date of birth, etc.
          - equals_number: 2
            title: Governmental
            description: Any sensitive government identification number related to a person
              or other classified material. E.g., Passport numbers, driver license numbers,
              business identification, taxation identifiers, etc.
          - equals_number: 3
            title: Financial
            description: Any financially-related sensitive information or Cardholder Data
              (CHD). E.g., banking account numbers, credit card numbers, International Banking
              Account Numbers (IBAN), SWIFT codes, etc.
          - equals_number: 4
            title: Business
            description: Any business-specific sensitive data such as intellectual property,
              trademarks, copyrights, human resource data, Board of Directors meeting minutes,
              and similar.
          - equals_number: 5
            title: Military and Law Enforcement
            description: Any mission-specific sensitive data for military, law enforcement,
              or other government agencies such as specifically classified data, weapon systems
              information, or other planning data.
          - equals_number: 6
            title: Security
            description: Any sensitive security-related data such as passwords, passkeys,
              IP addresses, API keys, credentials and similar secrets. E.g., AWS Access Secret
              Key, SaaS API Keys, user passwords, database credentials, etc.
          - equals_number: 99
            title: Other
            description: Any other type of data classification or a multi-variate classification
              made up of several other classification categories.
        recommended: true
      classifier_details:
        recommended: true
      confidentiality_id:
        recommended: true
      discovery_details:
        description: Details about the data discovered by classification job.
      policy:
        description: Details about the data policy that governs data handling and security
          measures related to classification.
      size:
        description: Size of the data classified.
      src_url:
        description: The source URL pointing towards the full classification job details.
      status:
        description: The resultant status of the classification job normalized to the caption
          of the <code>status_id</code> value. In the case of 'Other', it is defined by the
          event source.
        recommended: true
      status_details:
        description: The contextual description of the <code>status, status_id</code> value.
      status_id:
        description: The normalized status identifier of the classification job.
        any_of:
          - equals_number: 0
            title: Unknown
            description: The status is unknown.
          - equals_number: 1
            title: Complete
            description: The classification job completed for the evaluated resource.
          - equals_number: 2
            title: Partial
            description: The classification job partially completed for the evaluated resource.
          - equals_number: 3
            title: Fail
            description: The classification job failed for the evaluated resource.
          - equals_number: 99
            title: Other
            description: The classification job type id is not mapped.
        recommended: true
      total:
        description: The total count of discovered entities, by the classification job.
      uid:
        description: The unique identifier of the classification job.
