    deprecated: Use the <code>group.name</code> attribute instead.
    range: ocsf_string_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.1.0
      ocsf_superseded_by: group.name
  handshake_dur:
    title: Handshake Duration
    description: The amount of total time for the TLS handshake to complete after the TCP
      connection is established, including client-side delays, in milliseconds.
    slot_uri: ocsf:handshake_dur
    range: ocsf_integer_t
  has_mfa:
    title: MFA Assigned
    description: The user has a multi-factor or secondary-factor device assigned.
    slot_uri: ocsf:has_mfa
    range: ocsf_boolean_t
  hire_time:
    title: Hire Time
    description: The timestamp when the user was or will be hired by the organization.
    slot_uri: ocsf:hire_time
    range: ocsf_timestamp_t
  hire_time_dt:
