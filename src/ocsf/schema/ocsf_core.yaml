    slot_uri: ocsf:dmarc
    range: ocsf_string_t
  dmarc_override:
    title: DMARC Override
    description: The Domain-based Message Authentication, Reporting and Conformance (DMARC)
      override action.
    slot_uri: ocsf:dmarc_override
    range: ocsf_string_t
  dmarc_policy:
    title: DMARC Policy
    description: The Domain-based Message Authentication, Reporting and Conformance (DMARC)
      policy status.
    slot_uri: ocsf:dmarc_policy
    range: ocsf_string_t
  dnssec_status:
    title: DNSSEC Status
    description: The normalized value of dnssec_status_id.
    slot_uri: ocsf:dnssec_status
    range: ocsf_string_t
  dnssec_status_id:
    title: DNSSEC Status ID
    description: Describes the normalized status of DNS Security Extensions (DNSSEC) for a
      domain.
    slot_uri: ocsf:dnssec_status_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The disposition is unknown.
      - equals_number: 1
        title: Signed
        description: The related domain enables the signing of DNS records using DNSSEC.
      - equals_number: 2
        title: Unsigned
        description: The related domain does not enable the signing of DNS records using DNSSEC.
      - equals_number: 99
        title: Other
        description: The DNSSEC status is not mapped. See the <code>dnssec_status</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: dnssec_status
  domain:
    title: Domain
    description: The name of the domain. See specific usage.
    slot_uri: ocsf:domain
    range: ocsf_string_t
  drive_type:
    title: Drive Type
    description: The drive type, normalized to the caption of the <code>drive_type_id</code>
      value. In the case of <code>Other</code>, it is defined by the source.
    slot_uri: ocsf:drive_type
    range: ocsf_string_t
  drive_type_id:
    title: Drive Type ID
    description: Identifies the type of a disk drive, i.e. fixed, removable, etc.
    slot_uri: ocsf:drive_type_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The drive type is unknown.
      - equals_number: 1
        title: Removable
        description: The drive has removable media; for example, a floppy drive, thumb drive,
          or flash card reader.
      - equals_number: 2
        title: Fixed
        description: The drive has fixed media; for example, a hard disk drive or flash drive.
      - equals_number: 3
        title: Remote
        description: The drive is a remote (network) drive.
      - equals_number: 4
        title: CD-ROM
        description: The drive is a CD-ROM drive.
      - equals_number: 5
        title: RAM Disk
        description: The drive is a RAM disk.
      - equals_number: 99
        title: Other
        description: The drive type is not mapped. See the <code>drive_type</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: drive_type
  duration:
