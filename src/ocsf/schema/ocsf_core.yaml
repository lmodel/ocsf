    slot_uri: ocsf:section_a
    range: ocsf_string_t
  section_b:
    title: JA4 Section B
    description: The 'b' section of the JA4 fingerprint.
    slot_uri: ocsf:section_b
    range: ocsf_string_t
  section_c:
    title: JA4 Section C
