    annotations:
      ocsf_deprecated_since: 1.4.0
      ocsf_superseded_by: account.uid
  prompt_text:
    title: Prompt Text
    description: The text of the input prompt provided to the model for this message. This
      is the verbatim instruction, query, or context supplied to the AI system that drove
      the operation.
    slot_uri: ocsf:prompt_text
    range: ocsf_string_t
  prompt_tokens:
    title: Prompt Tokens
    description: Number of tokens in the input prompt for this message.
    slot_uri: ocsf:prompt_tokens
    range: ocsf_integer_t
  protocol_name:
    title: Protocol Name
    description: The protocol name. See specific usage.
    slot_uri: ocsf:protocol_name
    range: ocsf_string_t
  protocol_num:
    title: Protocol Number
    description: 'The IP protocol number, as defined by the Internet Assigned Numbers Authority
      (IANA). For example: <code>6</code> for TCP and <code>17</code> for UDP.'
    slot_uri: ocsf:protocol_num
    range: ocsf_integer_t
    see_also:
      - https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml
  protocol_ver:
    title: Protocol Version
    description: The Protocol version, normalized to the caption of the protocol_ver_id value.
      In the case of 'Other', it is defined by the event source.
    slot_uri: ocsf:protocol_ver
    range: ocsf_string_t
  protocol_ver_id:
    title: Protocol Version ID
    description: The normalized identifier of the Protocol version. See specific usage.
    slot_uri: ocsf:protocol_ver_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The protocol version is unknown.
      - equals_number: 99
        title: Other
        description: The protocol version is not mapped. See the <code>protocol_ver</code>
          attribute, which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: protocol_ver
  provider:
    title: Provider
    description: The origin of information associated with the event. See specific usage.
    slot_uri: ocsf:provider
    range: ocsf_string_t
  ptid:
    title: Process Thread ID
    description: The identifier of the process thread associated with the event, as returned
      by the operating system.
    slot_uri: ocsf:ptid
    range: ocsf_long_t
  purl:
    title: Package URL
    description: A purl is a URL string used to identify and locate a software package in
      a mostly universal and uniform way across programming languages, package managers, packaging
      conventions, tools, APIs and databases.
    slot_uri: ocsf:purl
    range: ocsf_string_t
  query_language:
    title: Query Language
    description: The query language, normalized to the caption of the <code>query_language_id</code>
      value. See specific usage.
    slot_uri: ocsf:query_language
    range: ocsf_string_t
  query_language_id:
    title: Query Language ID
    description: The normalized identifier of the query language. See specific usage.
    slot_uri: ocsf:query_language_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The Query Language is unknown.
      - equals_number: 99
        title: Other
        description: The Query Language is not mapped. See the <code>query_language</code>
          attribute, which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: query_language
  query_result:
    title: Query Result
    description: The result of the query.
    slot_uri: ocsf:query_result
    range: ocsf_string_t
  query_result_id:
    title: Query Result ID
    description: The normalized identifier of the query result.
    slot_uri: ocsf:query_result_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The query result is unknown.
      - equals_number: 1
        title: Exists
        description: The target was found.
      - equals_number: 2
        title: Partial
        description: The target was partially found.
      - equals_number: 3
        title: Does not exist
        description: The target was not found.
      - equals_number: 4
        title: Error
        description: The discovery attempt failed.
      - equals_number: 5
        title: Unsupported
        description: Discovery of the target was not supported.
      - equals_number: 99
        title: Other
        description: The query result is not mapped. See the <code>query_result</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: query_result
  query_string:
    title: HTTP Query String
    description: 'The query portion of the URL. For example: the query portion of the URL
      <code>http://www.example.com/search?q=bad&sort=date</code> is <code>q=bad&sort=date</code>.'
    slot_uri: ocsf:query_string
    range: ocsf_string_t
  query_time:
    title: Query Time
    description: The Domain Name System (DNS) query time.
    slot_uri: ocsf:query_time
    range: ocsf_timestamp_t
  query_time_dt:
    title: Query Time
    description: The Domain Name System (DNS) query time.
    slot_uri: ocsf:query_time_dt
    range: ocsf_datetime_t
  query_type:
    title: Query Type
    description: The normalized caption of query_type_id or the source-specific query type.
    slot_uri: ocsf:query_type
    range: ocsf_string_t
  query_type_id:
    title: Query Type ID
    description: The normalized type of system query performed against a device or system
      component.
    slot_uri: ocsf:query_type_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The query type was unknown or not specified.
      - equals_number: 1
        title: Kernel
        description: A query about kernel resources including system calls, shared mutex,
          or other kernel components.
      - equals_number: 2
        title: File
        description: A query about file attributes, metadata, content, hash values, or properties.
      - equals_number: 3
        title: Folder
        description: A query about folder attributes, metadata, content, or structure.
      - equals_number: 4
        title: Admin Group
        description: A query about group membership, privileges, domain, or group properties.
      - equals_number: 5
        title: Job
        description: A query about scheduled jobs, their command lines, run states, or execution
          times.
      - equals_number: 6
        title: Module
        description: A query about loaded modules, their base addresses, load types, or function
          entry points.
      - equals_number: 7
        title: Network Connection
        description: A query about active network connections, boundaries, protocols, or TCP
          states.
      - equals_number: 8
        title: Network Interfaces
        description: A query about physical or virtual network interfaces, their IP/MAC addresses,
          or types.
      - equals_number: 9
        title: Peripheral Device
        description: A query about attached peripheral devices, their classes, models, or
          vendor information.
      - equals_number: 10
        title: Process
        description: A query about running processes, command lines, ancestry, loaded modules,
          or execution context.
      - equals_number: 11
        title: Service
        description: A query about system services, their names, versions, labels, or properties.
      - equals_number: 12
        title: Session
        description: A query about authenticated user or service sessions, their creation
          times, or issuer details.
      - equals_number: 13
        title: User
        description: A query about user accounts, their properties, credentials, or domain
          information.
      - equals_number: 14
        title: Users
        description: A query about multiple users belonging to an administrative group.
      - equals_number: 15
        title: Startup Item
        description: A query about startup configuration items, their run modes, start types,
          or current states.
      - equals_number: 16
        title: Registry Key
        description: A Windows-specific query about registry keys, their paths, security descriptors,
          or modification times.
      - equals_number: 17
        title: Registry Value
        description: A Windows-specific query about registry values, their data types, content,
          or names.
      - equals_number: 18
        title: Prefetch
        description: A Windows-specific query about prefetch files, their run counts, last
          execution times, or existence.
      - equals_number: 99
        title: Other
        description: The query type was not mapped to a standard category. See the query_type
          attribute for source-specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: query_type
  radius:
    title: Radius
    description: 'Farthest horizontal distance from the reported location at which any UA
      in a group may be located (meters). Also allows defining the area where an Intent-Based
      Network Participant operation is taking place. Default: 0 m.'
    slot_uri: ocsf:radius
    range: ocsf_string_t
  ram_size:
    title: RAM Size
    description: 'The total amount of installed RAM, in Megabytes. For example: <code>2048</code>.'
    slot_uri: ocsf:ram_size
    range: ocsf_integer_t
  rate_limit:
    title: Rate Limit
    description: The rate limit for a rate-based rule.
    slot_uri: ocsf:rate_limit
    range: ocsf_integer_t
  raw_data:
    title: Raw Data
    description: The original event/finding data as received from the source, before normalization
      into OCSF. Populate this with the verbatim log line, JSON payload, or other native format
      for forensic and debugging purposes. This field is not intended for structured querying
      - use the normalized OCSF attributes instead.
    slot_uri: ocsf:raw_data
    range: ocsf_string_t
  raw_data_size:
    title: Raw Data Size
    description: The size of the original event data (as captured in <code>raw_data</code>)
      in bytes, before OCSF normalization. Useful for metering and capacity planning.
    slot_uri: ocsf:raw_data_size
    range: ocsf_long_t
  raw_header:
    title: Raw Header
    description: The email authentication header.
    slot_uri: ocsf:raw_header
    range: ocsf_string_t
  rcode:
    title: Response Code
    description: The server response code, normalized to the caption of the rcode_id value.
      In the case of 'Other', it is defined by the event source.
    slot_uri: ocsf:rcode
    range: ocsf_string_t
  rcode_id:
    title: Response Code ID
    description: The normalized identifier of the server response code. See specific usage.
    slot_uri: ocsf:rcode_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The DNS response code is unknown.
      - equals_number: 99
        title: Other
        description: The DNS response code is not defined by the RFC. See the <code>rcode</code>
          attribute, which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: rcode
  rdata:
    title: DNS RData
    description: The data describing the DNS resource. The meaning of this data depends on
      the type and class of the resource record.
    slot_uri: ocsf:rdata
    range: ocsf_string_t
  read_count:
    title: Read Count
    description: The read count. See specific usage.
    slot_uri: ocsf:read_count
    range: ocsf_integer_t
  record_index_in_array:
    title: Record Index in Array
    description: The index of the record in the array of records.
    slot_uri: ocsf:record_index_in_array
    range: ocsf_integer_t
  references:
    title: References
    description: A list of reference URLs supporting the finding/detection.
    slot_uri: ocsf:references
    range: ocsf_string_t
    multivalued: true
  referrer:
    title: HTTP Referrer
    description: The request header that identifies the address of the previous web page,
      which is linked to the current web page or resource being requested.
    slot_uri: ocsf:referrer
    range: ocsf_string_t
  reg_binary_data:
    title: Registry Binary Data
    description: The data of the registry value when <code>type_id</code> is <code>REG_BINARY</code>
      or <code>REG_NONE</code>.
    slot_uri: ocsf:reg_binary_data
    range: ocsf_bytestring_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_extension: win
  reg_integer_data:
    title: Registry Integer Data
    description: The data of the registry value when <code>type_id</code> is <code>REG_DWORD</code>,
      <code>REG_DWORD_BIG_ENDIAN</code>, or <code>REG_QWORD</code>.
    slot_uri: ocsf:reg_integer_data
    range: ocsf_long_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_extension: win
  reg_string_data:
    title: Registry String Data
    description: The data of the registry value when <code>type_id</code> is <code>REG_SZ</code>,
      <code>REG_EXPAND_SZ</code>, or <code>REG_LINK</code>.
    slot_uri: ocsf:reg_string_data
    range: ocsf_string_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_extension: win
  reg_string_list_data:
    title: Registry String List Data
    description: The data of the registry value when <code>type_id</code> is <code>REG_MULTI_SZ</code>.
    slot_uri: ocsf:reg_string_list_data
    range: ocsf_string_t
    multivalued: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_extension: win
  region:
    title: Region
    description: The name or the code of a region. See specific usage.
    slot_uri: ocsf:region
    range: ocsf_string_t
  registrar:
    title: Domain Registrar
    description: The domain registrar.
    slot_uri: ocsf:registrar
    range: ocsf_string_t
  related_component:
    title: Related Component
    description: The package URL (PURL) of the component that this software component has
      a relationship with.
    slot_uri: ocsf:related_component
    range: ocsf_string_t
  related_events_count:
    title: Related Events/Findings Count
    description: Number of related events or findings.
    slot_uri: ocsf:related_events_count
    range: ocsf_integer_t
  related_vulnerabilities:
    title: Related Vulnerability IDs
    description: List of vulnerability IDs (e.g. CVE ID) that are related to this vulnerability.
    slot_uri: ocsf:related_vulnerabilities
    range: ocsf_string_t
    multivalued: true
  relation:
    title: Relation
    description: The relationship between two entities. See specific usage.
    slot_uri: ocsf:relation
    range: ocsf_string_t
  relationship:
    title: Relationship
    description: The relationship between two software components, normalized to the caption
      of the <code>relationship_id</code> value. In the case of 'Other', it is defined by
      the source.
    slot_uri: ocsf:relationship
    range: ocsf_string_t
  relationship_id:
    title: Relationship ID
    description: The normalized identifier of the relationship between two software components.
    slot_uri: ocsf:relationship_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The relationship is unknown.
      - equals_number: 1
        title: Depends On
        description: The component is a dependency of another component. Can be used to define
          both direct and transitive dependencies.
      - equals_number: 99
        title: Other
        description: The relationship is not mapped. See the <code>relationship</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: relationship
  release:
    title: Software Release Details
    description: Release is the number of times a version of the software has been packaged.
    slot_uri: ocsf:release
    range: ocsf_string_t
  reply_to:
    title: Reply To
    description: The machine-readable email header Reply-To value, as defined by RFC 5322.
      For example <code>example.user@usersdomain.com</code>
    slot_uri: ocsf:reply_to
    deprecated: Use the <code>reply_to_list</code> attribute instead.
    range: ocsf_email_t
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5322
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.4.0
      ocsf_superseded_by: reply_to_list
  reply_to_list:
    title: Reply To List
    description: The machine-readable email header Reply-To values, as defined by RFC 5322.
      For example <code>example.user@usersdomain.com</code>
    slot_uri: ocsf:reply_to_list
    range: ocsf_email_t
    multivalued: true
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5322
  reply_to_mailboxes:
    title: Reply To Mailboxes
    description: The human-readable email header Reply To Mailbox values. For example <code>'Example
      User &lt;example.user@usersdomain.com&gt;'</code>.
    slot_uri: ocsf:reply_to_mailboxes
    range: ocsf_string_t
    multivalued: true
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  requested_permissions:
    title: Requested Permissions
    description: The permissions mask. See specific usage.
    slot_uri: ocsf:requested_permissions
    range: ocsf_integer_t
  requirements:
    title: Compliance Requirements
    description: A list of requirements associated to a specific control in an industry or
      regulatory framework. e.g. <code>NIST.800-53.r5 AU-10</code>
    slot_uri: ocsf:requirements
    range: ocsf_string_t
    multivalued: true
  resource_type:
    title: Resource Type
    description: The resource type as defined by the event source.
    slot_uri: ocsf:resource_type
    range: ocsf_string_t
  response_text:
    title: Response Text
    description: The text of the model's response generated for this message. For agent-mediated
      operations, this is the content returned by the assistant, tool, or agent.
    slot_uri: ocsf:response_text
    range: ocsf_string_t
  response_time:
    title: Response Time
    description: The Domain Name System (DNS) response time.
    slot_uri: ocsf:response_time
    range: ocsf_timestamp_t
  response_time_dt:
    title: Response Time
    description: The Domain Name System (DNS) response time.
    slot_uri: ocsf:response_time_dt
    range: ocsf_datetime_t
  return_path:
    title: Return Path
    description: The address found in the 'Return-Path' header, which indicates where bounce
      messages (non-delivery reports) should be sent. This address is often set by the sending
      system and may differ from the 'From' or 'Sender' addresses. For example, <code>mailer-daemon@senderserver.com</code>.
    slot_uri: ocsf:return_path
    range: ocsf_email_t
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5322
      - https://datatracker.ietf.org/doc/html/rfc5321#section-4.4
  return_value:
    title: Return Value
    description: The value returned from a function.
    slot_uri: ocsf:return_value
    range: ocsf_string_t
  risk_details:
    title: Risk Details
    description: Describes the risk associated with the finding.
    slot_uri: ocsf:risk_details
    range: ocsf_string_t
  risk_level:
    title: Risk Level
    description: The risk level, normalized to the caption of the risk_level_id value.
    slot_uri: ocsf:risk_level
    range: ocsf_string_t
  risk_level_id:
    title: Risk Level ID
    description: The normalized risk level id.
    slot_uri: ocsf:risk_level_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Info
      - equals_number: 1
        title: Low
      - equals_number: 2
        title: Medium
      - equals_number: 3
        title: High
      - equals_number: 4
        title: Critical
      - equals_number: 99
        title: Other
        description: The risk level is not mapped. See the <code>risk_level</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: risk_level
      ocsf_suppress_checks: enum_convention
  risk_score:
    title: Risk Score
    description: The risk score as reported by the event source.
    slot_uri: ocsf:risk_score
    range: ocsf_integer_t
  role:
    title: Role
    description: The role of an entity in the context of the event or finding, normalized
      to the caption of the role_id value. In the case of 'Other', it is defined by the event
      source. See specific usage.
    slot_uri: ocsf:role
    range: ocsf_string_t
  role_id:
    title: Role ID
    description: The normalized identifier of an entity's role in the context of the event
      or finding. See specific usage.
    slot_uri: ocsf:role_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The role is unknown.
      - equals_number: 99
        title: Other
        description: The role is not mapped. See the role attribute, which contains a data
          source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: role
  row_number:
    title: Row Number
    description: The row number. See specific usage.
    slot_uri: ocsf:row_number
    range: ocsf_integer_t
  rssi:
    title: RSSI
    description: Received Signal Strength Indicator (RSSI) is a measurement of the power of
      a radio signal. See specific usage.
    slot_uri: ocsf:rssi
    range: ocsf_integer_t
  run_count:
    title: Run Count
    description: The prefetch file run count.
    slot_uri: ocsf:run_count
    range: ocsf_integer_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_extension: win
  run_mode_ids:
    title: Run Mode IDs
    description: The list of normalized identifiers that describe application attributes when
      it is running. See specific usage.
    slot_uri: ocsf:run_mode_ids
    range: ocsf_integer_t
    multivalued: true
    any_of:
      - equals_number: 0
        title: Unknown
        description: The run mode is unknown.
      - equals_number: 99
        title: Other
        description: The run mode is not mapped. See the <code>run_modes</code> attribute,
          which contains data source specific values.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: run_modes
  run_modes:
    title: Run Modes
    description: The list of run_modes, normalized to the captions of the run_mode_ids values.  In
      the case of 'Other', they are defined by the event source. See specific usage.
    slot_uri: ocsf:run_modes
    range: ocsf_string_t
    multivalued: true
  run_state:
    title: Run State
    description: The state of the job or service, normalized to the caption of the run_state_id
      value. In the case of 'Other', it is defined by the event source. See specific usage.
    slot_uri: ocsf:run_state
    range: ocsf_string_t
  run_state_id:
    title: Run State ID
    description: The normalized identifier of the state of the job or service. See specific
      usage.
    slot_uri: ocsf:run_state_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The run state is unknown.
      - equals_number: 99
        title: Other
        description: The run state is not mapped. See the <code>run_state</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: run_state
  runtime:
    title: Runtime
    description: The backend running the container, such as containerd or cri-o.
    slot_uri: ocsf:runtime
    range: ocsf_string_t
  samesite:
    title: SameSite
    description: 'The cookie attribute that lets servers specify whether/when cookies are
      sent with cross-site requests. Values are: Strict, Lax or None'
    slot_uri: ocsf:samesite
    range: ocsf_string_t
  sandbox:
    title: Sandbox
    description: The name of the containment jail (i.e., sandbox). For example, hardened_ps,
      high_security_ps, oracle_ps, netsvcs_ps, or default_ps.
    slot_uri: ocsf:sandbox
    range: ocsf_string_t
  scale_factor:
    title: Scale Factor
    description: The numeric scale factor of display.
    slot_uri: ocsf:scale_factor
    range: ocsf_integer_t
  schedule_uid:
    title: Schedule UID
    description: The unique identifier of the schedule associated with a scan job.
    slot_uri: ocsf:schedule_uid
    range: ocsf_string_t
  scheme:
    title: Scheme
    description: 'The scheme portion of the URL. For example: <code>http</code>, <code>https</code>,
      <code>ftp</code>, or <code>sftp</code>.'
    slot_uri: ocsf:scheme
    range: ocsf_string_t
  scim_group_schema:
    title: SCIM Group Schema
    description: 'SCIM provides a schema for representing groups, identified using the following
      schema URI: <code>urn:ietf:params:scim:schemas:core:2.0:Group</code> as defined in RFC
      7634. This attribute will capture key-value pairs for the scheme implemented in a SCIM
      resource.'
    slot_uri: ocsf:scim_group_schema
    range: string
    any_of:
      - range: OcsfJsonValue
      - range: OcsfJsonValue
        multivalued: true
    see_also:
      - https://datatracker.ietf.org/doc/html/rfc7643
  scim_user_schema:
    title: SCIM User Schema
    description: 'SCIM provides a resource type for user resources. The core schema for user
      is identified using the following schema URI: <code>urn:ietf:params:scim:schemas:core:2.0:User</code>
      as defined in RFC 7634. This attribute will capture key-value pairs for the scheme implemented
      in a SCIM resource. This object is inclusive of both the basic and Enterprise User Schema
      Extension.'
    slot_uri: ocsf:scim_user_schema
    range: string
    any_of:
      - range: OcsfJsonValue
      - range: OcsfJsonValue
        multivalued: true
    see_also:
      - https://datatracker.ietf.org/doc/html/rfc7643
  scopes:
    title: Scopes
    description: Scopes define the specific permissions or actions that the client is allowed
      to perform on behalf of the user. Each scope represents a different set of permissions,
      and the user can selectively grant or deny access to specific scopes during the authorization
      process.
    slot_uri: ocsf:scopes
    range: ocsf_string_t
    multivalued: true
  score:
    title: Reputation Score
    description: The reputation score, normalized to the caption of the score_id value. In
      the case of 'Other', it is defined by the event source.
    slot_uri: ocsf:score
    range: ocsf_string_t
  score_id:
    title: Reputation Score ID
    description: The normalized reputation score identifier.
    slot_uri: ocsf:score_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The reputation score is unknown.
      - equals_number: 1
        title: Very Safe
        description: Long history of good behavior.
      - equals_number: 2
        title: Safe
        description: Consistently good behavior.
      - equals_number: 3
        title: Probably Safe
        description: Reasonable history of good behavior.
      - equals_number: 4
        title: Leans Safe
        description: Starting to establish a history of normal behavior.
      - equals_number: 5
        title: May not be Safe
        description: No established history of normal behavior.
      - equals_number: 6
        title: Exercise Caution
        description: Starting to establish a history of suspicious or risky behavior.
      - equals_number: 7
        title: Suspicious/Risky
        description: A site with a history of suspicious or risky behavior. (spam, scam, potentially
          unwanted software, potentially malicious).
      - equals_number: 8
        title: Possibly Malicious
        description: Strong possibility of maliciousness.
      - equals_number: 9
        title: Probably Malicious
        description: Indicators of maliciousness.
      - equals_number: 10
        title: Malicious
        description: Proven evidence of maliciousness.
      - equals_number: 99
        title: Other
        description: The reputation score is not mapped. See the <code>rep_score</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: score
  section_a:
    title: JA4 Section A
