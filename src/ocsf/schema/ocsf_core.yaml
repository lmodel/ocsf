    slot_uri: ocsf:full_name
    range: ocsf_string_t
  function_keys:
    title: Function Keys
    description: The number of function keys on client keyboard.
    slot_uri: ocsf:function_keys
    range: ocsf_integer_t
  function_name:
    title: Function Name
    description: The function name. See specific usage.
    slot_uri: ocsf:function_name
    range: ocsf_string_t
  geodetic_altitude:
    title: Geodetic Altitude
    description: 'The aircraft distance above or below the ellipsoid as measured along a line
      that passes through the aircraft and is normal to the surface of the WGS-84 ellipsoid.
      This value is provided in meters and must have a minimum resolution of 1 m. Special
      Values: <code>Invalid</code>, <code>No Value</code>, or <code>Unknown: -1000 m</code>.'
    slot_uri: ocsf:geodetic_altitude
    range: ocsf_string_t
  geodetic_vertical_accuracy:
    title: Geodetic Vertical Accuracy
    description: Provides quality/containment on geodetic altitude. This is based on ADS-B
      Geodetic Vertical Accuracy (GVA). Measured in meters.
    slot_uri: ocsf:geodetic_vertical_accuracy
    range: ocsf_string_t
  geohash:
    title: Geohash
    description: <p>Geohash of the geo-coordinates (latitude and longitude).</p>Geohashing
      is a geocoding system used to encode geographic coordinates in decimal degrees, to a
      single string.
    slot_uri: ocsf:geohash
    range: ocsf_string_t
    see_also:
      - https://en.wikipedia.org/wiki/Geohash
  given_name:
    title: Given Name
    description: The given or first name of the user.
    slot_uri: ocsf:given_name
    range: ocsf_string_t
  gpu_count:
    title: GPU Count
    description: 'The number of GPU''s on a system. For example: <code>1</code>.'
    slot_uri: ocsf:gpu_count
    range: ocsf_integer_t
  granted_privileges:
