    slot_uri: ocsf:injection_type_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The injection type is unknown.
      - equals_number: 1
        title: Remote Thread
      - equals_number: 2
        title: Load Library
      - equals_number: 3
        title: Queue APC
      - equals_number: 99
        title: Other
        description: The injection type is not mapped. See the <code>injection_type</code>
          attribute, which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: injection_type
  install_state:
