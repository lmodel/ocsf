  evidence:
    title: Evidence
    description: The data the finding exposes to the analyst.
    slot_uri: ocsf:evidence
    deprecated: Use the <code>evidences</code> attribute instead.
    range: string
    any_of:
      - range: OcsfJsonValue
      - range: OcsfJsonValue
        multivalued: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.1.0
      ocsf_superseded_by: evidences
  execute_count:
    title: Execute Count
    description: The execute count. See specific usage.
    slot_uri: ocsf:execute_count
    range: ocsf_integer_t
  exit_code:
    title: Exit Code
    description: The exit code reported by a process when it terminates. The convention is
      that zero indicates success and any non-zero exit code indicates that some error occurred.
    slot_uri: ocsf:exit_code
    range: ocsf_integer_t
  expiration_reason:
    title: Expiration Reason
    description: The expiration reason. See specific usage.
    slot_uri: ocsf:expiration_reason
    range: ocsf_string_t
  expiration_time:
    title: Expiration Time
    description: The expiration time. See specific usage.
    slot_uri: ocsf:expiration_time
    range: ocsf_timestamp_t
  expiration_time_dt:
    title: Expiration Time
    description: The expiration time. See specific usage.
    slot_uri: ocsf:expiration_time_dt
    range: ocsf_datetime_t
  exploit_last_seen_time:
    title: Exploit Last Seen Time
    description: The time when the exploit was most recently observed.
    slot_uri: ocsf:exploit_last_seen_time
    range: ocsf_timestamp_t
  exploit_last_seen_time_dt:
    title: Exploit Last Seen Time
    description: The time when the exploit was most recently observed.
    slot_uri: ocsf:exploit_last_seen_time_dt
    range: ocsf_datetime_t
  exploit_ref_url:
    title: Exploit URL
    description: The URL of the exploit code or Proof-of-Concept (PoC).
    slot_uri: ocsf:exploit_ref_url
    range: ocsf_url_t
  exploit_requirement:
    title: Exploit Requirement
    description: The requirement description related to any constraints around exploit execution.
    slot_uri: ocsf:exploit_requirement
    range: ocsf_string_t
  exploit_type:
    title: Exploit Type
    description: The categorization or type of Exploit. E.g., <code>Network</code> or <code>Physical</code>.
    slot_uri: ocsf:exploit_type
    range: ocsf_string_t
  ext:
    title: Extension
    description: The extension. See specific usage.
    slot_uri: ocsf:ext
    range: ocsf_string_t
  external_uid:
    title: External ID
    description: A unique identifier assigned by an external system for cross-referencing.
    slot_uri: ocsf:external_uid
    range: ocsf_string_t
  factor_type:
    title: Factor Type
    description: The type of authentication factor used in an authentication attempt.
    slot_uri: ocsf:factor_type
    range: ocsf_string_t
  factor_type_id:
    title: Factor Type ID
    description: The normalized identifier for the authentication factor.
    slot_uri: ocsf:factor_type_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
      - equals_number: 1
        title: SMS
        description: User receives and inputs a code sent to their mobile device via SMS text
          message.
      - equals_number: 2
        title: Security Question
        description: The user responds to a security question as part of a question-based
          authentication factor
      - equals_number: 3
        title: Phone Call
        description: System calls the user's registered phone number and requires the user
          to answer and provide a response.
      - equals_number: 4
        title: Biometric
        description: Devices that verify identity-based on user's physical identifiers, such
          as fingerprint scanners or retina scanners.
      - equals_number: 5
        title: Push Notification
        description: Push notification is sent to user's registered device and requires the
          user to acknowledge.
      - equals_number: 6
        title: Hardware Token
        description: Physical device that generates a code to be used for authentication.
      - equals_number: 7
        title: OTP
        description: Application generates a one-time password (OTP) for use in authentication.
      - equals_number: 8
        title: Email
        description: A code or link is sent to a user's registered email address.
      - equals_number: 9
        title: U2F
        description: Typically involves a hardware token, which the user physically interacts
          with to authenticate.
      - equals_number: 10
        title: WebAuthn
        description: Web-based API that enables users to register devices as authentication
          factors.
      - equals_number: 11
        title: Password
        description: The user enters a password that they have previously established.
      - equals_number: 99
        title: Other
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: factor_type
  file_diff:
    title: File Diff
    description: File content differences used for change detection. For example, a common
      use case is to identify itemized changes within INI or configuration/property setting
      values.
    slot_uri: ocsf:file_diff
    range: ocsf_string_t
  first_seen_time:
    title: First Seen
    description: The initial detection time of the activity or object. See specific usage
    slot_uri: ocsf:first_seen_time
    range: ocsf_timestamp_t
  first_seen_time_dt:
    title: First Seen
    description: The initial detection time of the activity or object. See specific usage
    slot_uri: ocsf:first_seen_time_dt
    range: ocsf_datetime_t
  fix_available:
    title: Fix Availability
    description: Indicates if a fix is available for the reported vulnerability.
    slot_uri: ocsf:fix_available
    deprecated: Use the <code>is_fix_available</code> attribute instead.
    range: ocsf_boolean_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.1.0
      ocsf_superseded_by: is_fix_available
  fix_coverage:
    title: Fix Coverage
    description: The fix coverage, normalized to the caption of the <code>fix_coverage_id</code>
      value. See specific usage.
    slot_uri: ocsf:fix_coverage
    range: ocsf_string_t
  fix_coverage_id:
    title: Fix Coverage ID
    description: The normalized identifier for fix coverage. See specific usage.
    slot_uri: ocsf:fix_coverage_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The fix coverage is unknown.
      - equals_number: 99
        title: Other
        description: The fix coverage is not mapped. See the <code>fix_coverage</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: fix_coverage
  fixed_in_version:
    title: Fixed In Version
