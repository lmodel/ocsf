    title: Intrusion Sets
    description: A grouping of adversarial behaviors and resources believed to be associated
      with specific threat actors or campaigns. Intrusion sets often encompass multiple campaigns
      and are used to organize related activities under a common label.
    slot_uri: ocsf:intrusion_sets
    range: ocsf_string_t
    multivalued: true
  invoked_by:
    title: Invoked by
    description: The name of the service that invoked the activity as described in the event.
    slot_uri: ocsf:invoked_by
    range: ocsf_string_t
  ip:
    title: IP Address
    description: The IP address, in either IPv4 or IPv6 format.
    slot_uri: ocsf:ip
    range: ocsf_ip_t
  is_alert:
    title: Alert
    description: Indicates that the event is considered to be an alertable signal.
    slot_uri: ocsf:is_alert
    range: ocsf_boolean_t
  is_applied:
    title: Applied
    description: A determination if a policy, rule, or enforcement action was applied.
    slot_uri: ocsf:is_applied
    range: ocsf_boolean_t
  is_backed_up:
    title: Back Ups Configured
    description: Indicates whether the device or resource has a backup enabled, such as an
      automated snapshot or a cloud backup. For example, this is indicated by the <code>cloudBackupEnabled</code>
      value within JAMF Pro mobile devices or the registration of an AWS ARN with the AWS
      Backup service.
    slot_uri: ocsf:is_backed_up
    range: ocsf_boolean_t
  is_cleartext:
    title: Cleartext Credentials
    description: Indicates whether the credentials were passed in clear text.<p><b>Note:</b>
      True if the credentials were passed in a clear text protocol such as FTP or TELNET,
      or if Windows detected that a user's logon password was passed to the authentication
      package in clear text.</p>
    slot_uri: ocsf:is_cleartext
    range: ocsf_boolean_t
  is_compliant:
    title: Compliant Device
    description: The event occurred on a compliant device.
    slot_uri: ocsf:is_compliant
    range: ocsf_boolean_t
  is_default:
    title: Default Value
    description: The indication of whether the value is from a default value name. For example,
      the value name could be missing.
    slot_uri: ocsf:is_default
    range: ocsf_boolean_t
  is_deleted:
    title: Deleted
    description: Indicates if the entity was deleted. See specific usage.
    slot_uri: ocsf:is_deleted
    range: ocsf_boolean_t
  is_directed:
    title: Directed
    description: Indicates if the entity has directionality. See specific usage.
    slot_uri: ocsf:is_directed
    range: ocsf_boolean_t
  is_disabled:
    title: Disabled
    description: Indicates if the entity is disabled. See specific usage.
    slot_uri: ocsf:is_disabled
    range: ocsf_boolean_t
  is_encrypted:
    title: Encrypted
    description: Indicates if the entity was encrypted. See specific usage.
    slot_uri: ocsf:is_encrypted
    range: ocsf_boolean_t
  is_exploit_available:
    title: Exploit Availability
    description: Indicates if an exploit or a PoC (proof-of-concept) is available for the
      reported vulnerability.
    slot_uri: ocsf:is_exploit_available
    range: ocsf_boolean_t
  is_fix_available:
    title: Fix Availability
    description: Indicates if a fix is available for the reported vulnerability.
    slot_uri: ocsf:is_fix_available
    range: ocsf_boolean_t
  is_group_provisioning_enabled:
    title: Group Provisioning Enabled
    description: Indicates whether group provisioning is automated (e.g., for a SCIM resource).
      See specific usage.
    slot_uri: ocsf:is_group_provisioning_enabled
    range: ocsf_boolean_t
  is_hotp:
    title: HMAC-based One-time Password (HOTP)
    description: Whether the authentication factor is an HMAC-based One-time Password (HOTP).
    slot_uri: ocsf:is_hotp
    range: ocsf_boolean_t
  is_http_only:
    title: HTTP Only
    description: This attribute prevents the cookie from being accessed via JavaScript.
    slot_uri: ocsf:is_http_only
    range: ocsf_boolean_t
  is_locked:
    title: Locked
    description: Indicates if the entity is locked. See specific usage.
    slot_uri: ocsf:is_locked
    range: ocsf_boolean_t
  is_managed:
    title: Managed Device
    description: The event occurred on a managed device.
    slot_uri: ocsf:is_managed
    range: ocsf_boolean_t
  is_mfa:
    title: Multi Factor Authentication
    description: Indicates whether Multi Factor Authentication was used during authentication.
    slot_uri: ocsf:is_mfa
    range: ocsf_boolean_t
  is_mobile_account_active:
    title: Mobile Account Active
    description: Indicates whether the device has an active mobile account. For example, this
      is indicated by the <code>itunesStoreAccountActive</code> value within JAMF Pro mobile
      devices.
    slot_uri: ocsf:is_mobile_account_active
    range: ocsf_boolean_t
  is_new_logon:
    title: New Logon
    description: Indicates logon is from a device not seen before or a first time account
      logon.
    slot_uri: ocsf:is_new_logon
    range: ocsf_boolean_t
  is_on_premises:
    title: On-Premises
    description: Indicates whether the location is on-premises.
    slot_uri: ocsf:is_on_premises
    range: ocsf_boolean_t
  is_on_premises_sync_enabled:
    title: On-Premises Sync Enabled
    description: Indicates whether synchronization with an on-premises directory service is
      enabled. For example, Microsoft Entra Connect.
    slot_uri: ocsf:is_on_premises_sync_enabled
    range: ocsf_boolean_t
  is_personal:
    title: Personal Device
    description: The event occurred on a personal device.
    slot_uri: ocsf:is_personal
    range: ocsf_boolean_t
  is_public:
    title: Public
    description: Determination of the public accessibility. See specific usage.
    slot_uri: ocsf:is_public
    range: ocsf_boolean_t
  is_read:
    title: Read
    description: The indication of whether the email has been read.
    slot_uri: ocsf:is_read
    range: ocsf_boolean_t
  is_readonly:
    title: Read-Only
    description: Indicates that an object cannot be modified. See specific usage
    slot_uri: ocsf:is_readonly
    range: ocsf_boolean_t
  is_remote:
    title: Remote
    description: The indication of whether the session is remote.
    slot_uri: ocsf:is_remote
    range: ocsf_boolean_t
  is_renewable:
    title: Renewable
    description: The indication of whether something is renewable. See specific usage.
    slot_uri: ocsf:is_renewable
    range: ocsf_boolean_t
  is_renewal:
    title: Renewal
    description: The indication of whether the event or object represents a renewal. See specific
      usage.
    slot_uri: ocsf:is_renewal
    range: ocsf_boolean_t
  is_secure:
    title: Secure
    description: The cookie attribute indicates that cookies are sent to the server only when
      the request is encrypted using the HTTPS protocol.
    slot_uri: ocsf:is_secure
    range: ocsf_boolean_t
  is_self_signed:
    title: Certificate Self-Signed
    description: Denotes whether a digital certificate is self-signed or signed by a known
      certificate authority (CA).
    slot_uri: ocsf:is_self_signed
    range: ocsf_boolean_t
  is_shared:
    title: Shared Device
    description: The event occurred on a shared device.
    slot_uri: ocsf:is_shared
    range: ocsf_boolean_t
  is_src_dst_assignment_known:
    title: Source/Destination Assignment Known
    description: <code>true</code> denotes that <code>src_endpoint</code> and <code>dst_endpoint</code>
      correctly identify the initiator and responder respectively. <code>false</code> denotes
      that the event source has arbitrarily assigned one peer to <code>src_endpoint</code>
      and the other to <code>dst_endpoint</code>, in other words that initiator and responder
      are not being asserted. This can occur, for example, when the event source is a network
      appliance that has not observed the initiation of a given connection. In the absence
      of this attribute, interpretation of the initiator and responder is implementation-specific.
    slot_uri: ocsf:is_src_dst_assignment_known
    deprecated: Use <code>initiator_id</code> instead, which provides richer semantics for
      bi-flow and asymmetric flow scenarios.
    range: ocsf_boolean_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.9.0
      ocsf_superseded_by: initiator_id
  is_superseded:
    title: The patch is superseded.
    description: The vendor patch has been replaced by another.
    slot_uri: ocsf:is_superseded
    range: ocsf_boolean_t
  is_supervised:
    title: Supervised Device
    description: The event occurred on a supervised device. Devices that are supervised are
      typically mobile devices managed by a Mobile Device Management solution and are restricted
      from specific behaviors such as Apple AirDrop.
    slot_uri: ocsf:is_supervised
    range: ocsf_boolean_t
  is_suspected_breach:
    title: Suspected Breach
    description: A determination based on analytics as to whether a potential breach was found.
    slot_uri: ocsf:is_suspected_breach
    range: ocsf_boolean_t
  is_system:
    title: System
    description: The indication of whether the object is part of the operating system.
    slot_uri: ocsf:is_system
    range: ocsf_boolean_t
  is_totp:
    title: Time-based One-time Password (TOTP)
    description: Whether the authentication factor is a Time-based One-time Password (TOTP).
    slot_uri: ocsf:is_totp
    range: ocsf_boolean_t
  is_truncated:
    title: Is Truncated
    description: Indicates that an attribute has been truncated. See specific usage.
    slot_uri: ocsf:is_truncated
    range: ocsf_boolean_t
  is_trusted:
    title: Trusted Device
    description: The event occurred on a trusted device.
    slot_uri: ocsf:is_trusted
    range: ocsf_boolean_t
  is_unused:
    title: Is Unused
    description: Indicates whether an item is unused. See specific usage.
    slot_uri: ocsf:is_unused
    range: ocsf_boolean_t
  is_user_provisioning_enabled:
    title: User Provisioning Enabled
    description: Indicates whether user provisioning is automated (e.g., for a SCIM resource).
      See specific usage.
    slot_uri: ocsf:is_user_provisioning_enabled
    range: ocsf_boolean_t
  is_vpn:
    title: VPN Session
    description: The indication of whether the session is a VPN session.
    slot_uri: ocsf:is_vpn
    range: ocsf_boolean_t
  isp:
    title: ISP Name
    description: The name of the Internet Service Provider (ISP).
    slot_uri: ocsf:isp
    range: ocsf_string_t
  isp_org:
    title: ISP Org
    description: The organization name of the Internet Service Provider (ISP). This represents
      the parent organization or company that owns/operates the ISP. For example, Comcast
      Corporation would be the ISP org for Xfinity internet service. This attribute helps
      identify the ultimate provider when ISPs operate under different brand names.
    slot_uri: ocsf:isp_org
    range: ocsf_string_t
  issuer:
    title: Issuer Details
    description: The identifier of the issuer. See specific usage.
    slot_uri: ocsf:issuer
    range: ocsf_string_t
  issuer_uid:
    title: Issuer ID
    description: The unique identifier of the entity that issued an object. See specific usage.
    slot_uri: ocsf:issuer_uid
    range: ocsf_string_t
  job_title:
    title: Job Title
    description: The user's job title.
    slot_uri: ocsf:job_title
    range: ocsf_string_t
  json_path:
    title: JSON Path
    description: The JSON path of the attribute. See specific usage.
    slot_uri: ocsf:json_path
    range: ocsf_string_t
  kb_articles:
    title: Knowledgebase Articles
    description: The KB article/s related to the entity. A KB Article contains metadata that
      describes the patch or an update.
    slot_uri: ocsf:kb_articles
    deprecated: Use the <code>kb_article_list</code> attribute instead.
    range: ocsf_string_t
    multivalued: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.1.0
      ocsf_superseded_by: kb_article_list
  kerberos_flags:
    title: Kerberos Flags
    description: A bitmask, either in hexadecimal or decimal form, which encodes various attributes
      or permissions associated with a Kerberos ticket. These flags delineate specific characteristics
      of the ticket, such as its renewability or forwardability.
    slot_uri: ocsf:kerberos_flags
    range: ocsf_string_t
    see_also:
      - https://www.rfc-editor.org/rfc/rfc4120#section-5.2.8
      - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769
  kernel_release:
    title: Kernel Release
    description: The kernel release of the operating system. On Unix-based systems, this is
      determined from the <code>uname -r</code> command output, for example "5.15.0-122-generic".
    slot_uri: ocsf:kernel_release
    range: ocsf_string_t
  key_length:
    title: Key Length
    description: The length of the encryption key.
    slot_uri: ocsf:key_length
    range: ocsf_integer_t
  key_name:
    title: Key Name
    description: The name of a key. See specific usage.
    slot_uri: ocsf:key_name
    range: ocsf_string_t
  key_uid:
    title: Key UID
    description: The unique identifier of the key. See specific usage.
    slot_uri: ocsf:key_uid
    range: ocsf_string_t
  keyboard_layout:
    title: Keyboard Layout
    description: The keyboard locale identifier name (e.g., en-US).
    slot_uri: ocsf:keyboard_layout
    range: ocsf_string_t
  keyboard_subtype:
    title: Keyboard Subtype
    description: The keyboard numeric code.
    slot_uri: ocsf:keyboard_subtype
    range: ocsf_integer_t
  keyboard_type:
    title: Keyboard Type
    description: The keyboard type (e.g., xt, ico).
    slot_uri: ocsf:keyboard_type
    range: ocsf_string_t
  labels:
    title: Labels
    description: The list of labels attached to an entity. See specific usage.
    slot_uri: ocsf:labels
    range: ocsf_string_t
    multivalued: true
  lang:
    title: Language
    description: 'The two letter lower case language codes, as defined by ISO 639-1. For example:
      <code>en</code> (English), <code>de</code> (German), or <code>fr</code> (French).'
    slot_uri: ocsf:lang
    range: ocsf_string_t
    see_also:
      - https://en.wikipedia.org/wiki/ISO_639-1
  last_authentication_time:
    title: Last Authentication Time
    description: The timestamp when this identity last successfully authenticated to any system
      or service. See specific usage.
    slot_uri: ocsf:last_authentication_time
    range: ocsf_timestamp_t
  last_authentication_time_dt:
    title: Last Authentication Time
    description: The timestamp when this identity last successfully authenticated to any system
      or service. See specific usage.
    slot_uri: ocsf:last_authentication_time_dt
    range: ocsf_datetime_t
  last_login_time:
    title: Last Login
    description: The last time when the user logged in.
    slot_uri: ocsf:last_login_time
    range: ocsf_timestamp_t
  last_login_time_dt:
    title: Last Login
    description: The last time when the user logged in.
    slot_uri: ocsf:last_login_time_dt
    range: ocsf_datetime_t
  last_run_time:
    title: Last Run
    description: The last run time of application or service. See specific usage.
    slot_uri: ocsf:last_run_time
    range: ocsf_timestamp_t
  last_run_time_dt:
    title: Last Run
    description: The last run time of application or service. See specific usage.
    slot_uri: ocsf:last_run_time_dt
    range: ocsf_datetime_t
  last_seen_time:
    title: Last Seen
    description: The most recent detection time of the activity or object. See specific usage.
    slot_uri: ocsf:last_seen_time
    range: ocsf_timestamp_t
  last_seen_time_dt:
    title: Last Seen
    description: The most recent detection time of the activity or object. See specific usage.
    slot_uri: ocsf:last_seen_time_dt
    range: ocsf_datetime_t
  last_used_time:
    title: Last Used Time
    description: The most recent usage time of an entity. See specific usage.
    slot_uri: ocsf:last_used_time
    range: ocsf_timestamp_t
  last_used_time_dt:
    title: Last Used Time
    description: The most recent usage time of an entity. See specific usage.
    slot_uri: ocsf:last_used_time_dt
    range: ocsf_datetime_t
  lat:
    title: Latitude
    description: 'The geographical Latitude coordinate represented in Decimal Degrees (DD).
      For example: <code>42.361145</code>.'
    slot_uri: ocsf:lat
    range: ocsf_float_t
  latency:
    title: Latency
    description: The HTTP response latency measured in milliseconds.
    slot_uri: ocsf:latency
    range: ocsf_integer_t
  launch_type:
    title: Launch Type
    description: The specific type of <code>Launch</code> activity, normalized to the caption
      of the <code>launch_type_id</code> value. In the case of <code>Other</code> it is defined
      by the event source.
    slot_uri: ocsf:launch_type
    range: ocsf_string_t
  launch_type_id:
    title: Launch Type ID
    description: The normalized identifier for the specific type of <code>Launch</code> activity.
    slot_uri: ocsf:launch_type_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The launch type is unknown or not specified.
      - equals_number: 1
        title: Spawn
        description: Denotes that the <code>Launch</code> event represents atomic creation
          of a new process on Windows. This launch type ID may also be used to represent both
          steps of Unix process creation in a single <code>Launch</code> event.
      - equals_number: 2
        title: Fork
        description: Denotes that the <code>Launch</code> event represents the "fork" step
          of Unix process creation, where a process creates a clone of itself in a parent-child
          relationship. WSL1 pico processes on Windows also use the 2-step Unix model.
      - equals_number: 3
        title: Exec
        description: Denotes that the <code>Launch</code> event represents the "exec" step
          of Unix process creation, where a process replaces its executable image, command
          line, and environment. WSL1 pico processes on Windows also use the 2-step Unix model.
      - equals_number: 99
        title: Other
        description: The launch type is not mapped. See the <code>launch_type</code> attribute,
          which contains a data source specific value.
    see_also:
      - https://www.man7.org/linux/man-pages/man2/fork.2.html
      - https://www.man7.org/linux/man-pages/man2/execve.2.html
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: launch_type
  ldap_cn:
    title: LDAP Common Name
    description: The LDAP and X.500 <code>commonName</code> attribute, typically the full
      name of the person. For example, <code>John Doe</code>.
    slot_uri: ocsf:ldap_cn
    range: ocsf_string_t
  ldap_dn:
    title: LDAP Distinguished Name
    description: The X.500 Distinguished Name (DN) is a structured string that uniquely identifies
      an entry, such as a user, in an X.500 directory service For example, <code>cn=John Doe,ou=People,dc=example,dc=com</code>.
    slot_uri: ocsf:ldap_dn
    range: ocsf_string_t
  lease_dur:
    title: Lease Duration
    description: This represents the length of the DHCP lease in seconds. This is present
      in DHCP Ack events.
    slot_uri: ocsf:lease_dur
    range: ocsf_integer_t
  leave_time:
    title: Leave Time
    description: The timestamp when the user left or will be leaving the organization.
    slot_uri: ocsf:leave_time
    range: ocsf_timestamp_t
  leave_time_dt:
    title: Leave Time
    description: The timestamp when the user left or will be leaving the organization.
    slot_uri: ocsf:leave_time_dt
    range: ocsf_datetime_t
  length:
    title: Response Length
    description: The HTTP response length, in number of bytes.
    slot_uri: ocsf:length
    range: ocsf_integer_t
  license:
    title: Software License
    description: The name or identifier of the license applied on package or software. For
      example <code>Apache-2.0</code>.
    slot_uri: ocsf:license
    range: ocsf_string_t
    see_also:
      - https://spdx.org/licenses/
  license_url:
    title: Software License URL
    description: The URL pointing to the license applied on package or software. This is typically
      a <code>LICENSE.md</code> file within a repository.
    slot_uri: ocsf:license_url
    range: ocsf_url_t
  lineage:
    title: Lineage
    description: 'The lineage of the process, represented by a list of paths for each ancestor
      process. For example: <code>[''/usr/sbin/sshd'', ''/usr/bin/bash'', ''/usr/bin/whoami'']</code>.'
    slot_uri: ocsf:lineage
    range: ocsf_file_path_t
    multivalued: true
  load_order_group:
    title: Load Order Group
    description: The name of the load ordering group of which this service is a member.
    slot_uri: ocsf:load_order_group
    range: ocsf_string_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_extension: win
  load_type:
    title: Load Type
    description: The load type, normalized to the caption of the load_type_id value. In the
      case of 'Other', it is defined by the event source.
    slot_uri: ocsf:load_type
    range: ocsf_string_t
  load_type_id:
    title: Load Type ID
    description: The normalized identifier of the load type. See specific usage.
    slot_uri: ocsf:load_type_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The load type is unknown.
      - equals_number: 99
        title: Other
        description: The load type is not mapped. See the <code>load_type</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: load_type
  loaded_modules:
    title: Loaded Modules
    description: The list of loaded module names.
    slot_uri: ocsf:loaded_modules
    range: ocsf_string_t
    multivalued: true
  log_format:
    title: Log Format
    description: The format of data in the log. See specific usage.
    slot_uri: ocsf:log_format
    range: ocsf_string_t
  log_level:
    title: Log Level
    description: The log specific level at which an event was generated. See specific usage.
    slot_uri: ocsf:log_level
    range: ocsf_string_t
  log_name:
    title: Log Name
    description: The log name. See specific usage.
    slot_uri: ocsf:log_name
    range: ocsf_string_t
  log_provider:
    title: Log Provider
    description: The logging provider or logging service that logged the event. See specific
      usage.
    slot_uri: ocsf:log_provider
    range: ocsf_string_t
  log_source:
    title: Log Source
    description: The log where the data originated. See specific usage.
    slot_uri: ocsf:log_source
    range: ocsf_string_t
  log_sources:
    title: Log Sources
    description: A collection of log systems or components that pertains to an entity. See
      specific usage.
    slot_uri: ocsf:log_sources
    range: ocsf_string_t
    multivalued: true
  log_type:
    title: Log Type
    description: The log type, normalized to the caption of the <code>log_type_id</code> value.
      In the case of 'Other', it is defined by the event source.
    slot_uri: ocsf:log_type
    range: ocsf_string_t
  log_type_id:
    title: Log Type ID
    description: The normalized log type identifier.
    slot_uri: ocsf:log_type_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The log type is unknown.
      - equals_number: 1
        title: OS
        description: The log type is an Operating System log.
      - equals_number: 2
        title: Application
        description: The log type is an Application log.
      - equals_number: 99
        title: Other
        description: The log type is not mapped. See the <code>log_type</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: log_type
  log_version:
    title: Log Version
    description: The log version. See specific usage.
    slot_uri: ocsf:log_version
    range: ocsf_string_t
  logged_time:
    title: Logged Time
    description: The time when a system in the event pipeline collected and logged the event.
      See specific usage.
    slot_uri: ocsf:logged_time
    range: ocsf_timestamp_t
  logged_time_dt:
    title: Logged Time
    description: The time when a system in the event pipeline collected and logged the event.
      See specific usage.
    slot_uri: ocsf:logged_time_dt
    range: ocsf_datetime_t
  login_endpoint:
    title: Login Endpoint
    description: URL for initiating a login request. See specific usage.
    slot_uri: ocsf:login_endpoint
    range: ocsf_url_t
  logon_type:
    title: Logon Type
    description: The logon type, normalized to the caption of the logon_type_id value. In
      the case of 'Other', it is defined by the event source.
    slot_uri: ocsf:logon_type
    range: ocsf_string_t
  logon_type_id:
    title: Logon Type ID
    description: The normalized logon type identifier.
    slot_uri: ocsf:logon_type_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The logon type is unknown.
      - equals_number: 1
        title: System
        description: Used only by the System account, for example at system startup.
      - equals_number: 2
        title: Interactive
        description: A local logon to device console.
      - equals_number: 3
        title: Network
        description: A user or device logged onto this device from the network.
      - equals_number: 4
        title: Batch
        description: A batch server logon, where processes may be executing on behalf of a
          user without their direct intervention.
      - equals_number: 5
        title: OS Service
        description: A logon by a service or daemon that was started by the OS.
      - equals_number: 7
        title: Unlock
        description: A user unlocked the device.
      - equals_number: 8
        title: Network Cleartext
        description: A user logged on to this device from the network. The user's password
          in the authentication package was not hashed.
      - equals_number: 9
        title: New Credentials
        description: A caller cloned its current token and specified new credentials for outbound
          connections. The new logon session has the same local identity, but uses different
          credentials for other network connections.
      - equals_number: 10
        title: Remote Interactive
        description: A remote logon using Terminal Services or remote desktop application.
      - equals_number: 11
        title: Cached Interactive
        description: A user logged on to this device with network credentials that were stored
          locally on the device and the domain controller was not contacted to verify the
          credentials.
      - equals_number: 12
        title: Cached Remote Interactive
        description: Same as Remote Interactive. This is used for internal auditing.
      - equals_number: 13
        title: Cached Unlock
        description: Workstation logon.
      - equals_number: 99
        title: Other
        description: The logon type is not mapped. See the <code>logon_type</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: logon_type
  logout_endpoint:
