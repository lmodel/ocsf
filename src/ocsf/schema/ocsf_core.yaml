    slot_uri: ocsf:section_c
    range: ocsf_string_t
  section_d:
    title: JA4 Section D
    description: The 'd' section of the JA4 fingerprint.
    slot_uri: ocsf:section_d
    range: ocsf_string_t
  secure:
