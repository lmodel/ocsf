  severity:
    title: Severity
    description: 'The event/finding severity label, normalized to the caption of the <code>severity_id</code>
      value. When <code>severity_id</code> is <code>99</code> (Other), this attribute <b>must</b>
      contain the source-specific severity label. For all other values, this should match
      the caption defined for that <code>severity_id</code> enum value (e.g., <code>"High"</code>
      for <code>severity_id: 4</code>).'
    slot_uri: ocsf:severity
    range: ocsf_string_t
  severity_id:
    title: Severity ID
    description: <p>The normalized identifier of the event/finding severity.</p>The normalized
      severity is a measurement the effort and expense required to manage and resolve an event
      or incident. Smaller numerical values represent lower impact events, and larger numerical
      values represent higher impact events.
    slot_uri: ocsf:severity_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The event/finding severity is unknown.
      - equals_number: 1
        title: Informational
        description: Informational message. No action required.
      - equals_number: 2
        title: Low
        description: The user decides if action is needed.
      - equals_number: 3
        title: Medium
        description: Action is required but the situation is not serious at this time.
      - equals_number: 4
        title: High
        description: Action is required immediately.
      - equals_number: 5
        title: Critical
        description: Action is required immediately and the scope is broad.
      - equals_number: 6
        title: Fatal
        description: An error occurred but it is too late to take remedial action.
      - equals_number: 99
        title: Other
        description: The event/finding severity is not mapped. See the <code>severity</code>
          attribute, which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: severity
