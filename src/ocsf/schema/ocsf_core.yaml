  security_questions:
    title: Security Questions
    description: The question(s) provided to user for a question-based authentication factor.
    slot_uri: ocsf:security_questions
    range: ocsf_string_t
    multivalued: true
  sender:
    title: Sender
    description: The machine readable email address of the system or server that actually
      transmitted the email message, extracted from the email headers per RFC 5322. This differs
      from the <code>from</code> field, which shows the message author. The sender field is
      most commonly used when multiple addresses appear in the <code> from_list </code> field,
      or when the transmitting system is different from the message author (such as when sending
      on behalf of someone else).
    slot_uri: ocsf:sender
    range: ocsf_email_t
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5322
  sender_mailbox:
    title: Sender Mailbox
    description: The human readable email address of the system or server that actually transmitted
      the email message, extracted from the email headers per RFC 5322. This differs from
      the <code>from_mailbox</code> field, which shows the message author. The sender mailbox
      field is most commonly used when multiple addresses appear in the <code> from_mailboxes
      </code> field, or when the transmitting system is different from the message author
      (such as when sending on behalf of someone else).
    slot_uri: ocsf:sender_mailbox
    range: ocsf_string_t
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5322
  sensitivity:
    title: Sensitivity
    description: 'The sensitivity of the firewall rule in the matched event. For example:
      HIGH.'
    slot_uri: ocsf:sensitivity
    range: ocsf_string_t
  sensor_layer:
    title: Sensor Layer
    description: The normalized identifier of the sensor layer that emitted the data for the
      analysis. For example, use this to classify the detection surface (e.g., IPS sensor,
      endpoint agent, email gateway). When the type is not listed, use <code>99</code> (Other)
      and populate <code>sensor_layer</code> with the source-specific label.
    slot_uri: ocsf:sensor_layer
    range: ocsf_string_t
  sensor_layer_id:
    title: Sensor Layer ID
    description: The technology or sensor layer that the event or finding originated from.
      See specific usage.
    slot_uri: ocsf:sensor_layer_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The sensor layer type is Unknown.
      - equals_number: 1
        title: Network
        description: The analyzed data is emitted by, or originates from a network, firewall,
          or IPS sensor.
      - equals_number: 2
        title: Endpoint
        description: The analyzed data is emitted by, or originates from an endpoint device
          or agent running on an OS.
      - equals_number: 3
        title: Email
        description: The analyzed data is emitted by, or originates from an email gateway
          or email security system.
      - equals_number: 4
        title: IAM
        description: The analyzed data is emitted by, or originates from an identity and access
          management (IAM) system or service.
      - equals_number: 5
        title: Proxy
        description: The analyzed data is emitted by, or originates from a proxy server (e.g.,
          forward or reverse proxy, web gateway).
      - equals_number: 6
        title: Threat Intel
        description: The analyzed data is emitted by, or originates from a cyber threat intelligence
          (CTI) system or by matching observables against a threat intelligence feed or report.
      - equals_number: 7
        title: Application
        description: The analyzed data is emitted by, or originates from an application (e.g.,
          web application, SaaS platform, or custom business application).
      - equals_number: 99
        title: Other
        description: The sensor layer type is not mapped. See the <code>sensor_layer</code>
          attribute, which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: sensor_layer
  sequence:
    title: Sequence Number
    description: Sequence number of the event. The sequence number is a value available in
      some events, to make the exact ordering of events unambiguous, regardless of the event
      time precision.
    slot_uri: ocsf:sequence
    range: ocsf_integer_t
  sequence_number:
    title: Sequence Number
    description: The sequence number. See specific usage.
    slot_uri: ocsf:sequence_number
    range: ocsf_long_t
  serial_number:
    title: Serial Number
    description: The serial number that pertains to the object. See specific usage.
    slot_uri: ocsf:serial_number
    range: ocsf_string_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_observable: '37'
  serialization:
    title: Serialization
    description: The canonical serialization or signing-envelope scheme used to produce the
      deterministic byte sequence that was signed, e.g. <code>JCS</code> (RFC 8785). Normalized
      to the captions of the <code>serialization_id</code> values.
    slot_uri: ocsf:serialization
    range: ocsf_string_t
  serialization_id:
    title: Serialization ID
    description: The normalized identifier of the canonical serialization or signing-envelope
      scheme used to produce the signed byte sequence. A verifier must apply the same scheme
      to reproduce the signing input.
    slot_uri: ocsf:serialization_id
    range: ocsf_integer_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: serialization
  server_ciphers:
