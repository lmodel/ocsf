    description: The cyber kill chain phase.
    slot_uri: ocsf:phase
    range: ocsf_string_t
  phase_id:
    title: Kill Chain Phase ID
    description: The cyber kill chain phase identifier.
    slot_uri: ocsf:phase_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The kill chain phase is unknown.
      - equals_number: 1
        title: Reconnaissance
        description: The attackers pick a target and perform a detailed analysis, start collecting
          information (email addresses, conferences information, etc.) and evaluate the victim’s
          vulnerabilities to determine how to exploit them.
      - equals_number: 2
        title: Weaponization
        description: The attackers develop a malware weapon and aim to exploit the discovered
          vulnerabilities.
      - equals_number: 3
        title: Delivery
        description: The intruders will use various tactics, such as phishing, infected USB
          drives, etc.
      - equals_number: 4
        title: Exploitation
        description: The intruders start leveraging vulnerabilities to executed code on the
          victim’s system.
      - equals_number: 5
        title: Installation
        description: The intruders install malware on the victim’s system.
      - equals_number: 6
        title: Command & Control
        description: Malware opens a command channel to enable the intruders to remotely manipulate
          the victim's system.
      - equals_number: 7
        title: Actions on Objectives
        description: With hands-on keyboard access, intruders accomplish the mission’s goal.
      - equals_number: 99
        title: Other
        description: The kill chain phase is not mapped. See the <code>phase</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: phase
