    range: ocsf_string_t
    multivalued: true
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_extension: win
  service_error_control:
    title: Service Error Control
    description: The service error control, normalized to the caption of the <code>service_error_control_id</code>
      value. In the case of 'Other', it is defined by the event source.
    slot_uri: ocsf:service_error_control
    range: ocsf_string_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_extension: win
  service_error_control_id:
    title: Service Error Control ID
    description: The normalized identifier of the service error control.
    slot_uri: ocsf:service_error_control_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The service error control is unknown.
      - equals_number: 1
        title: Ignore
        description: The startup program ignores the error and continues the startup operation.
      - equals_number: 2
        title: Normal
        description: The startup program logs the error in the event log but continues the
          startup operation.
      - equals_number: 3
        title: Severe
        description: The startup program logs the error in the event log. If the last-known-good
          configuration is being started, the startup operation continues. Otherwise, the
          system is restarted with the last-known-good configuration.
      - equals_number: 4
        title: Critical
        description: The startup program logs the error in the event log, if possible. If
          the last-known-good configuration is being started, the startup operation fails.
          Otherwise, the system is restarted with the last-known good configuration.
      - equals_number: 99
        title: Other
        description: The service error control is not mapped. See the <code>service_error_control</code>
          attribute, which contains an event source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: service_error_control
      ocsf_extension: win
  service_start_name:
    title: Service Start Name
    description: For a user mode service, this attribute represents the name of the account
      under which the service is run. For a kernel mode driver, this attribute represents
      the object name used to load the driver.
    slot_uri: ocsf:service_start_name
    range: ocsf_string_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_extension: win
  service_start_type:
    title: Service Start Type
    description: The service start type, normalized to the caption of the <code>service_start_type_id</code>
      value. In the case of 'Other', it is defined by the event source.
    slot_uri: ocsf:service_start_type
    range: ocsf_string_t
    instantiates:
