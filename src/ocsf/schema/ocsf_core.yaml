    slot_uri: ocsf:initiator_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
      - equals_number: 99
        title: Other
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: initiator
  injection_type:
