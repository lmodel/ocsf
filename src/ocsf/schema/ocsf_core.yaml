    slot_uri: ocsf:hostname
    range: ocsf_hostname_t
  http_method:
    title: HTTP Method
    description: The HTTP request method indicates the desired action to be performed for
      a given resource.
    slot_uri: ocsf:http_method
    range: ocsf_string_t
  http_only:
    title: HTTP Only
    description: A cookie attribute to make it inaccessible via JavaScript
    slot_uri: ocsf:http_only
