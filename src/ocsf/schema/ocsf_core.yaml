        description: The bus type is unknown or not reported.
      - equals_number: 1
        title: Onboard
        description: The device is attached directly on the motherboard or SoC (often referred
          to as 'integrated' or 'onboard').
      - equals_number: 2
        title: PCIe x16
        description: Peripheral Component Interconnect Express slot with 16 lanes, typically
          used for high‑bandwidth add‑in devices.
      - equals_number: 3
        title: PCIe x8
        description: Peripheral Component Interconnect Express slot with 8 lanes; common for
          high‑performance NICs, storage controllers, and accelerators.
      - equals_number: 4
        title: MXM Type A
        description: Mobile PCI Express Module (MXM) Type A form factor (compact laptop/embedded
          GPU module).
      - equals_number: 5
        title: MXM Type B
        description: Mobile PCI Express Module (MXM) Type B form factor (larger laptop/embedded
          GPU module).
      - equals_number: 6
        title: M.2
        description: M.2 (NGFF) internal module form factor/connector exposing PCIe (and/or
          SATA/USB) for SSDs and add‑in modules.
      - equals_number: 7
        title: CXL
        description: Compute Express Link (CXL), an open cache‑coherent interconnect for processors,
          memory expansion, and accelerators built on the PCIe physical layer.
      - equals_number: 99
        title: Other
        description: A bus or interface standard not covered by the defined values; the exact
          value is reported by the event source.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: bus_type
