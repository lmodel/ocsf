    description: The normalized identifier of the process integrity level (Windows only).
    slot_uri: ocsf:integrity_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The integrity level is unknown.
      - equals_number: 1
        title: Untrusted
      - equals_number: 2
        title: Low
      - equals_number: 3
        title: Medium
      - equals_number: 4
        title: High
      - equals_number: 5
        title: System
      - equals_number: 6
        title: Protected
      - equals_number: 99
        title: Other
        description: The integrity level is not mapped. See the <code>integrity</code> attribute,
