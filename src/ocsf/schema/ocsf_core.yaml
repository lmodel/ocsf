    title: Priority ID
    description: The normalized priority. Priority identifies the relative importance of the
      incident or finding. It is a measurement of urgency.
    slot_uri: ocsf:priority_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: No priority is assigned.
      - equals_number: 1
        title: Low
        description: Application or personal procedure is unusable, where a workaround is
          available or a repair is possible.
      - equals_number: 2
        title: Medium
        description: Non-critical function or procedure is unusable or hard to use causing
          operational disruptions with no direct impact on a service's availability. A workaround
          is available.
      - equals_number: 3
        title: High
        description: Critical functionality or network access is interrupted, degraded or
          unusable, having a severe impact on services availability. No acceptable alternative
          is possible.
      - equals_number: 4
        title: Critical
        description: Interruption making a critical functionality inaccessible or a complete
          network interruption causing a severe impact on services availability. There is
          no possible alternative.
      - equals_number: 99
        title: Other
        description: The priority is not normalized.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: priority
