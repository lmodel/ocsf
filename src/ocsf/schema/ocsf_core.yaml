    range: ocsf_string_t
  intermediate_ips:
    title: Intermediate IP Addresses
    description: The intermediate IP Addresses. For example, the IP addresses in the HTTP
      X-Forwarded-For header.
    slot_uri: ocsf:intermediate_ips
    range: ocsf_ip_t
    multivalued: true
  internal_name:
