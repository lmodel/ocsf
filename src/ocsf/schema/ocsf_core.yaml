      <code>VMware</code>, <code>Hyper-V</code>, <code>VirtualBox</code>, etc.
    slot_uri: ocsf:hypervisor
    range: ocsf_string_t
  iccid:
    title: ICCID
    description: The Integrated Circuit Card Identification of a mobile device. Typically
      it is a unique 18 to 22 digit number that identifies a SIM card.
    slot_uri: ocsf:iccid
    range: ocsf_string_t
  identifier_cookie:
    title: Identifier Cookie
    description: The client identifier cookie during client/server exchange.
    slot_uri: ocsf:identifier_cookie
    range: ocsf_string_t
