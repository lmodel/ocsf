    description: The Input Method Editor (IME) file name.
    slot_uri: ocsf:ime
    range: ocsf_string_t
  imei:
    title: IMEI
    description: The International Mobile Equipment Identity that is associated with the device.
    slot_uri: ocsf:imei
    deprecated: Use the <code>imei_list</code> attribute instead.
    range: ocsf_string_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.4.0
      ocsf_superseded_by: imei_list
  imei_list:
    title: IMEI List
    description: The International Mobile Equipment Identity values that are associated with
      the device.
    slot_uri: ocsf:imei_list
    range: ocsf_string_t
    multivalued: true
  impact:
    title: Impact
    description: The impact , normalized to the caption of the impact_id value. In the case
      of 'Other', it is defined by the event source.
    slot_uri: ocsf:impact
    range: ocsf_string_t
  impact_id:
    title: Impact ID
    description: The normalized impact of the incident or finding. Per NIST, this is the magnitude
      of harm that can be expected to result from the consequences of unauthorized disclosure,
      modification, destruction, or loss of information or information system availability.
    slot_uri: ocsf:impact_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The normalized impact is unknown.
      - equals_number: 1
        title: Low
        description: The magnitude of harm is low.
      - equals_number: 2
        title: Medium
        description: The magnitude of harm is moderate.
      - equals_number: 3
        title: High
        description: The magnitude of harm is high.
      - equals_number: 4
        title: Critical
        description: The magnitude of harm is high and the scope is widespread.
      - equals_number: 99
        title: Other
        description: The impact is not mapped. See the <code>impact</code> attribute, which
          contains a data source specific value.
    see_also:
      - https://doi.org/10.6028/NIST.FIPS.199
      - https://doi.org/10.6028/NIST.FIPS.199
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: impact
      ocsf_source_note: impact value; impact level
  impact_score:
    title: Impact Score
    description: The impact as an integer value of the finding, valid range 0-100.
    slot_uri: ocsf:impact_score
    range: ocsf_integer_t
  imported_symbols:
