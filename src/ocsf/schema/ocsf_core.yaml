---
id: https://w3id.org/lmodel/ocsf/ocsf_core
name: ocsf_core
title: OCSF data types and scalar dictionary attributes
description: The data types of OCSF's attribute dictionary, and every attribute whose value
  is not an object. Each slot keeps OCSF's key, so a real event validates unchanged.
version: 1.9.0
source: https://github.com/ocsf/ocsf-schema/tree/1.9.0
license: Apache-2.0
see_also:
  - https://lmodel.github.io/ocsf
  - https://schema.ocsf.io/1.9.0/
prefixes:
  ocsf: https://w3id.org/lmodel/ocsf/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  attack: https://w3id.org/lmodel/attack/
  cve: https://w3id.org/lmodel/cve/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  stix: https://w3id.org/lmodel/stix/
default_prefix: ocsf
default_range: string
imports:
  - linkml:types
subsets:
  ocsf_category_application:
    title: Application Activity
    description: Application Activity events report detailed information about the behavior
      of applications and services.
    annotations:
      ocsf_category_uid: '6'
  ocsf_category_discovery:
    title: Discovery
    description: Discovery events report the existence and state of devices, files, configurations,
      processes, registry keys, and other objects.
    annotations:
      ocsf_category_uid: '5'
  ocsf_category_findings:
    title: Findings
    description: Findings events report findings, detections, and possible resolutions of
      malware, anomalies, or other actions performed by security products.
    annotations:
      ocsf_category_uid: '2'
  ocsf_category_iam:
    title: Identity & Access Management
    description: Identity & Access Management (IAM) events relate to the supervision of the
      system's authentication and access control model. Examples of such events are the success
      or failure of authentication, granting of authority, password change, entity change,
      privileged use etc.
    annotations:
      ocsf_category_uid: '3'
  ocsf_category_network:
    title: Network Activity
    description: Network Activity events.
    annotations:
      ocsf_category_uid: '4'
  ocsf_category_remediation:
    title: Remediation
    description: Remediation events report the results of remediation commands targeting files,
      processes, and other objects.
    annotations:
      ocsf_category_uid: '7'
  ocsf_category_system:
    title: System Activity
    description: System Activity events.
    annotations:
      ocsf_category_uid: '1'
  ocsf_category_unmanned_systems:
    title: Unmanned Systems
    description: Unmanned Systems events report the activity, existence, and/or state of unmanned
      systems for tracking, mission planning, and other related activities.
    annotations:
      ocsf_category_uid: '8'
  ocsf_extension_linux:
    title: Linux
    description: The Linux extension defines Linux specific attributes, profiles, objects,
      and classes.
    annotations:
      ocsf_extension_uid: '1'
  ocsf_extension_macos:
    title: macOS
    description: The macOS extension defines macOS specific attributes, profiles, objects,
      and classes.
    annotations:
      ocsf_extension_uid: '3'
  ocsf_extension_win:
    title: Windows
    description: The Windows extension defines Windows specific attributes, objects, and classes.
    annotations:
      ocsf_extension_uid: '2'
types:
  ocsf_boolean_t:
    title: Boolean
    description: Boolean value. One of <code>true</code> or <code>false</code>.
    typeof: boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: boolean_t
  ocsf_bytestring_t:
    title: Byte String
    description: Base 64 encoded immutable byte sequence. Traditional Base 64 is preferred
      but publishers may use URL-safe Base 64 when known to be acceptable to consumers. These
      encodings are described in RFC 4648.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    pattern: ^(?:(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)|(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-]{2}==|[A-Za-z0-9_-]{3}=))?$
    see_also:
      - https://www.rfc-editor.org/rfc/rfc4648.html
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: bytestring_t
  ocsf_datetime_t:
    title: Datetime
    description: The Internet Date/Time format as defined in RFC 3339. For example:<br><code>2024-09-10T23:20:50.520Z</code>,<br><code>2024-09-10
      23:20:50.520789Z</code>.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    pattern: ^\d{4}-\d{2}-\d{2}[Tt]\d{2}:\d{2}:\d{2}(?:\.\d+)?([Zz]|[\+-]\d{2}:\d{2})?$
    see_also:
      - https://www.rfc-editor.org/rfc/rfc3339.html
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: datetime_t
  ocsf_email_t:
    title: Email Address
    description: Email address. For example:<br><code>john_doe@example.com</code>.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    pattern: ^[a-zA-Z0-9!#$%&'*+-/=?^_`{|}~.]+@[a-zA-Z0-9-]+\.[a-zA-Z0-9-.]+$
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: email_t
      ocsf_observable: '5'
  ocsf_file_hash_t:
    title: Hash
    description: Fingerprint. A value, in any format, that maps an arbitrarily large data
      item to a much shorter string that uniquely identifies the original data. Examples include
      cryptographic hashing of a file, code signing, and Network Protocol Fingerprinting (NPF).<p><b>Note
      about name.</b> The type name <code>file_hast_t</code> and the caption &quot;Hash&quot;
      are used for legacy reasons. This type has been generalized from a file hash to a general
      fingerprint. The existing type name and caption were retained for backwards compatibility.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: file_hash_t
      ocsf_observable: '8'
  ocsf_file_name_t:
    title: File Name
    description: File name. For example:<br><code>text-file.txt</code>.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: file_name_t
      ocsf_observable: '7'
  ocsf_file_path_t:
    title: File Path
    description: 'The full path to the file. For example: For example:<br><code>c:\windows\system32\svchost.exe</code>.'
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: file_path_t
      ocsf_observable: '45'
  ocsf_float_t:
    title: Float
    description: Real floating-point value. For example:<br><code>3.14</code>.
    typeof: float
    base: float
    uri: xsd:float
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: float_t
  ocsf_hostname_t:
    title: Hostname
    description: Unique name assigned to a device connected to a computer network. It may
      be a fully qualified domain name (FQDN). For example:<br><code>r2-d2.example.com.</code>,<br><code>mx.example.com</code>
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: hostname_t
      ocsf_observable: '1'
  ocsf_integer_t:
    title: Integer
    description: Signed integer value.
    typeof: integer
    base: int
    uri: xsd:integer
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: integer_t
  ocsf_ip_t:
    title: IP Address
    description: Internet Protocol address (IP address), in either IPv4 or IPv6 format. For
      example:<br><code>192.168.200.24</code>, <br> <code>2001:0db8:85a3:0000:0000:8a2e:0370:7334</code>.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    pattern: ((^\s*((([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5]).){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5]))\s*$)|(^\s*((([0-9A-Fa-f]{1,4}:){7}([0-9A-Fa-f]{1,4}|:))|(([0-9A-Fa-f]{1,4}:){6}(:[0-9A-Fa-f]{1,4}|((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){5}(((:[0-9A-Fa-f]{1,4}){1,2})|:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){4}(((:[0-9A-Fa-f]{1,4}){1,3})|((:[0-9A-Fa-f]{1,4})?:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){3}(((:[0-9A-Fa-f]{1,4}){1,4})|((:[0-9A-Fa-f]{1,4}){0,2}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){2}(((:[0-9A-Fa-f]{1,4}){1,5})|((:[0-9A-Fa-f]{1,4}){0,3}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){1}(((:[0-9A-Fa-f]{1,4}){1,6})|((:[0-9A-Fa-f]{1,4}){0,4}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(:(((:[0-9A-Fa-f]{1,4}){1,7})|((:[0-9A-Fa-f]{1,4}){0,5}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:)))(%.+)?\s*$))
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: ip_t
      ocsf_max_len: '40'
      ocsf_observable: '2'
  ocsf_long_t:
    title: Long
    description: 8-byte long, signed integer value.
    typeof: integer
    base: int
    uri: xsd:integer
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: long_t
  ocsf_mac_t:
    title: MAC Address
    description: Media Access Control (MAC) address. For example:<br><code>18:36:F3:98:4F:9A</code>.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    pattern: ^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: mac_t
      ocsf_max_len: '32'
      ocsf_observable: '3'
  ocsf_port_t:
    title: Port
    description: The TCP/UDP port number. For example:<br><code>80</code>,<br><code>22</code>.
    typeof: ocsf_integer_t
    base: int
    uri: xsd:integer
    minimum_value: 0
    maximum_value: 65535
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: port_t
      ocsf_observable: '11'
  ocsf_process_name_t:
    title: Process Name
    description: Process name. For example:<br><code>Notepad</code>.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: process_name_t
      ocsf_observable: '9'
  ocsf_reg_key_path_t:
    title: Registry Key Path
    description: Full path of registry key.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: reg_key_path_t
      ocsf_observable: '46'
      ocsf_extension: win
  ocsf_resource_uid_t:
    title: Resource UID
    description: Resource unique identifier. For example, S3 Bucket name or EC2 Instance ID.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: resource_uid_t
      ocsf_observable: '10'
  ocsf_string_t:
    title: String
    description: UTF-8 encoded byte sequence.
    typeof: string
    base: str
    uri: xsd:string
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: string_t
  ocsf_subnet_t:
    title: Subnet
    description: The subnet represented in a CIDR notation, using the format network_address/prefix_length.
      The network_address can be in either IPv4 or IPv6 format. The prefix length indicates
      the number of bits used for the network portion, and the remaining bits are available
      for host addresses within that subnet. For example:<br><code>192.168.1.0/24</code>,<br><code>2001:0db8:85a3:0000::/64</code>
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: subnet_t
      ocsf_max_len: '42'
      ocsf_observable: '12'
  ocsf_timestamp_t:
    title: Timestamp
    description: The timestamp format is the number of milliseconds since the Epoch 01/01/1970
      00:00:00 UTC. For example:<br><code>1618524549901</code>.
    typeof: ocsf_long_t
    base: int
    uri: xsd:integer
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: timestamp_t
  ocsf_url_t:
    title: URL String
    description: Uniform Resource Locator (URL) string. For example:<br><code>http://www.example.com/download/trouble.exe</code>.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: url_t
      ocsf_observable: '6'
  ocsf_username_t:
    title: User Name
    description: User name. For example:<br><code>john_doe</code>.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: username_t
      ocsf_observable: '4'
  ocsf_uuid_t:
    title: UUID
    description: 128-bit universal unique identifier. For example:<br><code>123e4567-e89b-12d3-a456-42661417400</code>.
    typeof: ocsf_string_t
    base: str
    uri: xsd:string
    pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: uuid_t
enums:
  OcsfDepth:
    title: CVSS Depth
    description: The values OCSF lists for depth.
    permissible_values:
      Base:
        title: Base
      Environmental:
        title: Environmental
      Temporal:
        title: Temporal
  OcsfHttpMethod:
    title: HTTP Method
    description: The values OCSF lists for http_method.
    permissible_values:
      ACL:
        title: ACL
        description: The ACL method modifies the access control list of the specified resource.
      BASELINE-CONTROL:
        title: Baseline Control
        description: The BASELINE-CONTROL method places the specified collection resource
          under baseline control.
      BIND:
        title: Bind
        description: The BIND method adds a binding to the specified collection resource.
      CHECKIN:
        title: Check In
        description: The CHECKIN method creates a new version from a checked-out version-controlled
          resource.
      CHECKOUT:
        title: Check Out
        description: The CHECKOUT method prepares a version-controlled resource for modification.
      CONNECT:
        title: Connect
        description: The CONNECT method establishes a tunnel to the server identified by the
          target resource.
      COPY:
        title: Copy
        description: The COPY method duplicates the specified resource.
      DELETE:
        title: Delete
        description: The DELETE method deletes the specified resource.
      GET:
        title: Get
        description: The GET method requests a representation of the specified resource. Requests
          using GET should only retrieve data.
      HEAD:
        title: Head
        description: The HEAD method asks for a response identical to a GET request, but without
          the response body.
      LABEL:
        title: Label
        description: The LABEL method adds, sets, or removes labels on a version-controlled
          resource.
      LINK:
        title: Link
        description: The LINK method establishes one or more links between resources.
      LOCK:
        title: Lock
        description: The LOCK method acquires or refreshes a lock on the specified resource.
      MERGE:
        title: Merge
        description: The MERGE method merges changes from another resource into the specified
          resource.
      MKACTIVITY:
        title: Make Activity
        description: The MKACTIVITY method creates a new activity resource.
      MKCALENDAR:
        title: Make Calendar
        description: The MKCALENDAR method creates a new calendar collection resource.
      MKCOL:
        title: Make Collection
        description: The MKCOL method creates a new collection resource.
      MKREDIRECTREF:
        title: Make Redirect Reference
        description: The MKREDIRECTREF method creates a new redirect reference resource.
      MKWORKSPACE:
        title: Make Workspace
        description: The MKWORKSPACE method creates a new workspace resource.
      MOVE:
        title: Move
        description: The MOVE method atomically duplicates and deletes the specified resource.
      OPTIONS:
        title: Options
        description: The OPTIONS method describes the communication options for the target
          resource.
      ORDERPATCH:
        title: Order Patch
        description: The ORDERPATCH method changes the ordering of members in an ordered collection.
      PATCH:
        title: Patch
        description: The PATCH method applies partial modifications to a resource.
      POST:
        title: Post
        description: The POST method submits an entity to the specified resource, often causing
          a change in state or side effects on the server.
      PRI:
        title: PRI
        description: The PRI method appears in the HTTP/2 connection preface to confirm the
          protocol.
      PROPFIND:
        title: Property Find
        description: The PROPFIND method retrieves properties defined on the specified resource.
      PROPPATCH:
        title: Property Patch
        description: The PROPPATCH method sets and/or removes properties defined on the specified
          resource.
      PUT:
        title: Put
        description: The PUT method replaces all current representations of the target resource
          with the request payload.
      QUERY:
        title: Query
        description: The QUERY method performs a safe query request that can include a request
          body.
      REBIND:
        title: Rebind
        description: The REBIND method moves a binding from one collection to another.
      REPORT:
        title: Report
        description: The REPORT method retrieves a report about the specified resource.
      SEARCH:
        title: Search
        description: The SEARCH method searches a resource or collection using the request
          payload.
      TRACE:
        title: Trace
        description: The TRACE method performs a message loop-back test along the path to
          the target resource.
      UNBIND:
        title: Unbind
        description: The UNBIND method removes a binding from the specified collection resource.
      UNCHECKOUT:
        title: Un-Check Out
        description: The UNCHECKOUT method cancels a checkout and restores the resource to
          its previous state.
      UNLINK:
        title: Unlink
        description: The UNLINK method removes one or more links between resources.
      UNLOCK:
        title: Unlock
        description: The UNLOCK method releases a lock on the specified resource.
      UPDATE:
        title: Update
        description: The UPDATE method updates a version-controlled resource to match a specified
          version.
      UPDATEREDIRECTREF:
        title: Update Redirect Reference
        description: The UPDATEREDIRECTREF method changes the target of a redirect reference
          resource.
      VERSION-CONTROL:
        title: Version Control
        description: The VERSION-CONTROL method places the specified resource under version
          control.
  OcsfTlp:
    title: Traffic Light Protocol
    description: The values OCSF lists for tlp.
    permissible_values:
      AMBER:
        title: TLP:AMBER
        description: 'TLP:AMBER is for limited disclosure, recipients can only spread this
          on a need-to-know basis within their organization and its clients. Note that TLP:AMBER+STRICT
          restricts sharing to the organization only. Sources may use TLP:AMBER when information
          requires support to be effectively acted upon, yet carries risk to privacy, reputation,
          or operations if shared outside of the organizations involved. Recipients may share
          TLP:AMBER information with members of their own organization and its clients, but
          only on a need-to-know basis to protect their organization and its clients and prevent
          further harm. Note: if the source wants to restrict sharing to the organization
          only, they must specify TLP:AMBER+STRICT.'
      AMBER STRICT:
        title: TLP:AMBER+STRICT
        description: 'TLP:AMBER is for limited disclosure, recipients can only spread this
          on a need-to-know basis within their organization and its clients. Note that TLP:AMBER+STRICT
          restricts sharing to the organization only. Sources may use TLP:AMBER when information
          requires support to be effectively acted upon, yet carries risk to privacy, reputation,
          or operations if shared outside of the organizations involved. Recipients may share
          TLP:AMBER information with members of their own organization and its clients, but
          only on a need-to-know basis to protect their organization and its clients and prevent
          further harm. Note: if the source wants to restrict sharing to the organization
          only, they must specify TLP:AMBER+STRICT.'
      CLEAR:
        title: TLP:CLEAR
        description: TLP:CLEAR denotes that recipients can spread this to the world, there
          is no limit on disclosure. Sources may use TLP:CLEAR when information carries minimal
          or no foreseeable risk of misuse, in accordance with applicable rules and procedures
          for public release. Subject to standard copyright rules, TLP:CLEAR information may
          be shared without restriction.
      GREEN:
        title: TLP:GREEN
        description: 'TLP:GREEN is for limited disclosure, recipients can spread this within
          their community. Sources may use TLP:GREEN when information is useful to increase
          awareness within their wider community. Recipients may share TLP:GREEN information
          with peers and partner organizations within their community, but not via publicly
          accessible channels. TLP:GREEN information may not be shared outside of the community.
          Note: when “community” is not defined, assume the cybersecurity/defense community.'
      RED:
        title: TLP:RED
        description: TLP:RED is for the eyes and ears of individual recipients only, no further
          disclosure. Sources may use TLP:RED when information cannot be effectively acted
          upon without significant risk for the privacy, reputation, or operations of the
          organizations involved. Recipients may therefore not share TLP:RED information with
          anyone else. In the context of a meeting, for example, TLP:RED information is limited
          to those present at the meeting.
      WHITE:
        title: TLP:WHITE
        description: TLP:WHITE and TLP:CLEAR may be used interchangeably, TLP:WHITE is the
          most up to date (as of TLP 2.0) usage.
slots:
  access_level:
    title: Access Level
    description: The access level of an entity. See specific usage.
    slot_uri: ocsf:access_level
    range: ocsf_string_t
  access_list:
    title: Access List
    description: The list of requested access rights.
    slot_uri: ocsf:access_list
    range: ocsf_string_t
    multivalued: true
  access_mask:
    title: Access Mask
    description: The access mask in a platform-native format.
    slot_uri: ocsf:access_mask
    range: ocsf_integer_t
  access_result:
    title: Access Check Result
    description: The list of access check results.
    slot_uri: ocsf:access_result
    range: string
    any_of:
      - range: OcsfJsonValue
      - range: OcsfJsonValue
        multivalued: true
  access_type:
    title: Access Type
    description: The type or category of access being granted to the identity. See specific
      usage.
    slot_uri: ocsf:access_type
    range: ocsf_string_t
  accessed_time:
    title: Accessed Time
