    title: Data Lifecycle State ID
    description: The stage or state that the data was in when it was assessed or scanned by
      a data security tool.
    slot_uri: ocsf:data_lifecycle_state_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The data lifecycle state is unknown.
      - equals_number: 1
        title: Data at-Rest
        description: The data was stored on physical or logical media and was not actively
          moving through the network nor was being processed. E.g., data stored in a database,
          PDF files in a file share, or EHR records in object storage.
      - equals_number: 2
        title: Data in-Transit
        description: The data was actively moving through the network or from one physical
          or logical location to another. E.g., emails being send, data replication or Change
          Data Capture (CDC) streams, or sensitive data processed on an API.
      - equals_number: 3
        title: Data in-Use
        description: The data was being processed, accessed, or read by a system, making it
          active in memory or CPU. E.g., sensitive data in a Business Intelligence tool, ePHI
          being processed in an EHR application or a user viewing data stored in a spreadsheet
          or PDF.
      - equals_number: 99
        title: Other
        description: The data lifecycle state is not mapped. See the <code>data_lifecycle_state</code>
          attribute, which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: data_lifecycle_state
  data_sources:
    title: Data Sources
    description: A list of data sources utilized in generation of the finding.
    slot_uri: ocsf:data_sources
    range: ocsf_string_t
    multivalued: true
  debug:
    title: Debug Information
    description: Debug information about non-fatal issues with this OCSF event. Each issue
      is a line in this string array.
    slot_uri: ocsf:debug
    range: ocsf_string_t
    multivalued: true
  decision:
    title: Authorization Decision/Outcome
    description: Decision/outcome of the authorization mechanism (e.g. Approved, Denied)
    slot_uri: ocsf:decision
    range: ocsf_string_t
  delay:
    title: Root Delay
    description: The total round-trip delay to the reference clock in milliseconds.
    slot_uri: ocsf:delay
    range: ocsf_integer_t
  deleted_time:
    title: Deleted Time
    description: The timestamp when the user was deleted. In Active Directory (AD), when a
      user is deleted they are moved to a temporary container and then removed after 30 days.
      So, this field can be populated even after a user is deleted for the next 30 days.
    slot_uri: ocsf:deleted_time
    range: ocsf_timestamp_t
  deleted_time_dt:
    title: Deleted Time
    description: The timestamp when the user was deleted. In Active Directory (AD), when a
      user is deleted they are moved to a temporary container and then removed after 30 days.
      So, this field can be populated even after a user is deleted for the next 30 days.
    slot_uri: ocsf:deleted_time_dt
    range: ocsf_datetime_t
  delivered_to:
    title: Delivered To
    description: The machine-readable <strong>Delivered-To</strong> email header field. For
      example <code>example.user@usersdomain.com</code>
    slot_uri: ocsf:delivered_to
    deprecated: Use the <code>delivered_to_list</code> attribute instead.
    range: ocsf_email_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.4.0
      ocsf_superseded_by: delivered_to_list
  delivered_to_list:
    title: Delivered To List
    description: The machine-readable <strong>Delivered-To</strong> email header values. For
      example <code>example.user@usersdomain.com</code>
    slot_uri: ocsf:delivered_to_list
    range: ocsf_email_t
    multivalued: true
    see_also:
      - https://www.rfc-editor.org/rfc/rfc9228
  department:
    title: Department
    description: The name of the department or organizational unit where the entity is assigned
      or belongs. See specific usage.
    slot_uri: ocsf:department
    range: ocsf_string_t
  dependency_chain:
    title: Dependency Chain
    description: Information about the chain of dependencies related to the issue as reported
      by an Application Security or Vulnerability Management tool. E.g., <code>serverless-offline
      -> @serverless/utils -> memoizee -> es5-ext</code>.
    slot_uri: ocsf:dependency_chain
    range: ocsf_string_t
  depth:
    title: CVSS Depth
    description: The CVSS depth represents a depth of the equation used to calculate CVSS
      score.
    slot_uri: ocsf:depth
    range: OcsfDepth
  desc:
    title: Description
    description: The description that pertains to the object or event. See specific usage.
    slot_uri: ocsf:desc
    range: ocsf_string_t
  details:
    title: Details
    description: Details of an entity. See specific usage
    slot_uri: ocsf:details
    range: ocsf_string_t
  detection_pattern:
    title: Detection Pattern
    description: Specific pattern, algorithm, fingerprint, or model used for detection.
    slot_uri: ocsf:detection_pattern
    range: ocsf_string_t
  detection_pattern_type:
    title: Detection Pattern
    description: The detection pattern type, normalized to the caption of the detection_pattern_type_id
      value. In the case of 'Other', it is defined by the event source.
    slot_uri: ocsf:detection_pattern_type
    range: ocsf_string_t
  detection_pattern_type_id:
    title: Detection Pattern Type ID
    description: Specifies the type of detection pattern used to identify the associated threat
      indicator.
    slot_uri: ocsf:detection_pattern_type_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The type is not mapped.
      - equals_number: 1
        title: STIX
      - equals_number: 2
        title: PCRE
      - equals_number: 3
        title: SIGMA
      - equals_number: 4
        title: Snort
      - equals_number: 5
        title: Suricata
      - equals_number: 6
        title: YARA
      - equals_number: 99
        title: Other
        description: The detection pattern type is not mapped. See the <code>detection_pattern_type</code>
          attribute, which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: detection_pattern_type
  detection_system:
    title: Detection System
    description: The data security tool or system that the finding, detection, or alert originated
      from, normalized to the caption of <code>detection_system_id</code>. E.g., Endpoint,
      Secure Email Gateway, etc. When <code>detection_system_id</code> is <code>99</code>
      (Other), this attribute must contain the source-specific label.
    slot_uri: ocsf:detection_system
    range: ocsf_string_t
  detection_system_id:
    title: Detection System ID
    description: The normalized identifier of the data security tool or system type from which
      the finding, detection, or alert originated. When the type is not listed, use <code>99</code>
      (Other) and populate <code>detection_system</code> with the source-specific label.
    slot_uri: ocsf:detection_system_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The detection system type is Unknown.
      - equals_number: 1
        title: Endpoint
        description: A dedicated agent or sensor installed on a device, either a dedicated
          data security tool or an Endpoint Detection & Response (EDR) tool that can detect
          sensitive data and/or enforce data security policies. E.g., Forcepoint DLP, Symantec
          DLP, Microsoft Defender for Endpoint (MDE).
      - equals_number: 2
        title: DLP Gateway
        description: A Data Loss Prevention (DLP) gateway that is positioned in-line of an
          information store such as a network share, a database, or otherwise that can detect
          sensitive data and/or enforce data security policies.
      - equals_number: 3
        title: Mobile Device Management
        description: A Mobile Device Management (MDM) or Enterprise Mobility Management (EMM)
          tool that can detect sensitive data and/or enforce data security policies on mobile
          devices (e.g., cellphones, tablets, End User Devices [EUDs]).
      - equals_number: 4
        title: Data Discovery & Classification
        description: A tool that actively identifies and classifies sensitive data in digital
          media and information stores in accordance with a policy or automated functionality.
          E.g, Amazon Macie, Microsoft Purview.
      - equals_number: 5
        title: Secure Web Gateway
        description: A Secure Web Gateway (SWG) is any tool that can detect sensitive data
          and/or enforce data security policies at a network-edge such as within a proxy or
          firewall service.
      - equals_number: 6
        title: Secure Email Gateway
        description: A Secure Email Gateway (SEG) is any tool that can detect sensitive data
          and/or enforce data security policies within email systems. E.g., Microsoft Defender
          for Office, Google Workspaces.
      - equals_number: 7
        title: Digital Rights Management
        description: A Digital Rights Management (DRM) or a dedicated Information Rights Management
          (IRM) are tools which can detect sensitive data and/or enforce data security policies
          on digital media via policy or user access rights.
      - equals_number: 8
        title: Cloud Access Security Broker
        description: A Cloud Access Security Broker (CASB) that can detect sensitive data
          and/or enforce data security policies in-line to cloud systems such as the public
          cloud or Software-as-a-Service (SaaS) tool. E.g., Forcepoint CASB, SkyHigh Security.
      - equals_number: 9
        title: Database Activity Monitoring
        description: A Database Activity Monitoring (DAM) tool that can detect sensitive data
          and/or enforce data security policies as part of a dedicated database or warehouse
          monitoring solution.
      - equals_number: 10
        title: Application-Level DLP
        description: A built in Data Loss Prevention (DLP) or other data security capability
          within a tool or platform such as an Enterprise Resource Planning (ERP) or Customer
          Relations Management (CRM) tool that can detect sensitive data and/or enforce data
          security policies.
      - equals_number: 11
        title: Developer Security
        description: Any Developer Security tool such as an Infrastructure-as-Code (IAC) security
          scanner, Secrets Detection, or Secure Software Development Lifecycle (SSDLC) tool
          that can detect sensitive data and/or enforce data security policies. E.g., TruffleHog,
          GitGuardian, Git-Secrets.
      - equals_number: 12
        title: Data Security Posture Management
        description: A Data Security Posture Management (DSPM) tool is a continuous monitoring
          and data discovery solution that can detect sensitive data and/or enforce data security
          policies for local and cloud environments. E.g., Cyera, Sentra, IBM Polar Security.
      - equals_number: 99
        title: Other
        description: The detection system type is not mapped. See the <code>detection_system</code>
          attribute, which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: detection_system
  detection_uid:
    title: Detection UID
    description: 'The associated unique detection event identifier. For example: detection
      response events include the <b>Detection ID</b> of the original event.'
    slot_uri: ocsf:detection_uid
    range: ocsf_string_t
  developer_uid:
    title: Developer UID
    description: The developer ID on the certificate that signed the file.
    slot_uri: ocsf:developer_uid
    range: ocsf_string_t
  dialect:
    title: Dialect
    description: The negotiated protocol dialect.
    slot_uri: ocsf:dialect
    range: ocsf_string_t
  direction:
    title: Direction
    description: The direction of the initiated connection, traffic, or email, normalized
      to the caption of the direction_id value. In the case of 'Other', it is defined by the
      event source.
    slot_uri: ocsf:direction
    range: ocsf_string_t
  direction_id:
    title: Direction ID
    description: The normalized identifier of the direction of the initiated connection, traffic,
      or email.
    slot_uri: ocsf:direction_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The connection direction is unknown.
      - equals_number: 1
        title: Inbound
        description: Inbound network connection. The connection originated from the Internet
          or outside network, destined for services on the inside network.
      - equals_number: 2
        title: Outbound
        description: Outbound network connection. The connection originated from inside the
          network, destined for services on the Internet or outside network.
      - equals_number: 3
        title: Lateral
        description: Lateral network connection. The connection originated from inside the
          network, destined for services on the inside network.
      - equals_number: 4
        title: Local
        description: Local network connection (<code>localhost</code>). The connection is
          intra-device, originating from and destined for services running on the same device.
      - equals_number: 99
        title: Other
        description: The direction is not mapped. See the <code>direction</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: direction
  dispersion:
    title: Root Dispersion
    description: The dispersion in the NTP protocol is the estimated time error or uncertainty
      relative to the reference clock in milliseconds.
    slot_uri: ocsf:dispersion
    range: ocsf_integer_t
  display_name:
    title: Display Name
    description: The display name. See specific usage.
    slot_uri: ocsf:display_name
    range: ocsf_string_t
  disposition:
    title: Disposition
    description: The disposition name, normalized to the caption of the disposition_id value.
      In the case of 'Other', it is defined by the event source.
    slot_uri: ocsf:disposition
    range: ocsf_string_t
  disposition_id:
    title: Disposition ID
    description: Describes the outcome or action taken by a security control, such as access
      control checks, malware detections or various types of policy violations.
    slot_uri: ocsf:disposition_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The disposition is unknown.
      - equals_number: 1
        title: Allowed
        description: Granted access or allowed the action to the protected resource.
      - equals_number: 2
        title: Blocked
        description: Denied access or blocked the action to the protected resource.
      - equals_number: 3
        title: Quarantined
        description: A suspicious file or other content was moved to a benign location.
      - equals_number: 4
        title: Isolated
        description: A session was isolated on the network or within a browser.
      - equals_number: 5
        title: Deleted
        description: A file or other content was deleted.
      - equals_number: 6
        title: Dropped
        description: The request was detected as a threat and resulted in the connection being
          dropped.
      - equals_number: 7
        title: Custom Action
        description: A custom action was executed such as running of a command script. Use
          the <code>message</code> attribute of the base class for details.
      - equals_number: 8
        title: Approved
        description: A request or submission was approved. For example, when a form was properly
          filled out and submitted. This is distinct from <code>1</code> 'Allowed'.
      - equals_number: 9
        title: Restored
        description: A quarantined file or other content was restored to its original location.
      - equals_number: 10
        title: Exonerated
        description: A suspicious or risky entity was deemed to no longer be suspicious (re-scored).
      - equals_number: 11
        title: Corrected
        description: A corrupt file or configuration was corrected.
      - equals_number: 12
        title: Partially Corrected
        description: A corrupt file or configuration was partially corrected.
      - equals_number: 13
        title: Uncorrected
        description: A corrupt file or configuration was not corrected.
      - equals_number: 14
        title: Delayed
        description: An operation was delayed, for example if a restart was required to finish
          the operation.
      - equals_number: 15
        title: Detected
        description: Suspicious activity or a policy violation was detected without further
          action.
      - equals_number: 16
        title: No Action
        description: The outcome of an operation had no action taken.
      - equals_number: 17
        title: Logged
        description: The operation or action was logged without further action.
      - equals_number: 18
        title: Tagged
        description: A file or other entity was marked with extended attributes.
      - equals_number: 19
        title: Alert
        description: The request or activity was detected as a threat and resulted in a notification
          but request was not blocked.
      - equals_number: 20
        title: Count
        description: Counted the request or activity but did not determine whether to allow
          it or block it.
      - equals_number: 21
        title: Reset
        description: The request was detected as a threat and resulted in the connection being
          reset.
      - equals_number: 22
        title: Captcha
        description: Required the end user to solve a CAPTCHA puzzle to prove that a human
          being is sending the request.
      - equals_number: 23
        title: Challenge
        description: Ran a silent challenge that required the client session to verify that
          it's a browser, and not a bot.
      - equals_number: 24
        title: Access Revoked
        description: 'The requestor''s access has been revoked due to security policy enforcements.
          Note: use the <code>Host</code> profile if the <code>User</code> or <code>Actor</code>
          requestor is not present in the event class.'
      - equals_number: 25
        title: Rejected
        description: A request or submission was rejected.  For example, when a form was improperly
          filled out and submitted. This is distinct from <code>2</code> 'Blocked'.
      - equals_number: 26
        title: Unauthorized
        description: An attempt to access a resource was denied due to an authorization check
          that failed. This is a more specific disposition than <code>2</code> 'Blocked' and
          can be complemented with the <code>authorizations</code> attribute for more detail.
      - equals_number: 27
        title: Error
        description: An error occurred during the processing of the activity or request. Use
          the <code>message</code> attribute of the base class for details.
      - equals_number: 99
        title: Other
        description: The disposition is not mapped. See the <code>disposition</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: disposition
  dkim:
    title: DKIM Status
    description: The DomainKeys Identified Mail (DKIM) status of the email.
    slot_uri: ocsf:dkim
    range: ocsf_string_t
  dkim_domain:
    title: DKIM Domain
    description: The DomainKeys Identified Mail (DKIM) signing domain of the email.
    slot_uri: ocsf:dkim_domain
