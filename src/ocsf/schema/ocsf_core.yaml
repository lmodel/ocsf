    annotations:
      ocsf_sibling: service_start_type
      ocsf_extension: win
  service_type:
    title: Service Type
    description: The service type, normalized to the caption of the service_type_id value.
      In the case of 'Other', it is defined by the event source.
    slot_uri: ocsf:service_type
    range: ocsf_string_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
