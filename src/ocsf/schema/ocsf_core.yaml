    title: Boundary
    description: The boundary of the connection, normalized to the caption of 'boundary_id'.
      In the case of 'Other', it is defined by the event source. <p> For cloud connections,
      this translates to the traffic-boundary(same VPC, through IGW, etc.). For traditional
      networks, this is described as Local, Internal, or External.</p>
    slot_uri: ocsf:boundary
    range: ocsf_string_t
  boundary_id:
    title: Boundary ID
    description: <p>The normalized identifier of the boundary of the connection. </p><p> For
      cloud connections, this translates to the traffic-boundary (same VPC, through IGW, etc.).
      For traditional networks, this is described as Local, Internal, or External.</p>
    slot_uri: ocsf:boundary_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The connection boundary is unknown.
      - equals_number: 1
        title: Localhost
        description: Local network traffic on the same endpoint.
      - equals_number: 2
        title: Internal
        description: Internal network traffic between two endpoints inside network.
      - equals_number: 3
        title: External
        description: External network traffic between two endpoints on the Internet or outside
          the network.
      - equals_number: 4
        title: Same VPC
        description: Through another resource in the same VPC
      - equals_number: 5
        title: Internet/VPC Gateway
        description: Through an Internet gateway or a gateway VPC endpoint
      - equals_number: 6
        title: Virtual Private Gateway
        description: Through a virtual private gateway
      - equals_number: 7
        title: Intra-region VPC
        description: Through an intra-region VPC peering connection
      - equals_number: 8
        title: Inter-region VPC
        description: Through an inter-region VPC peering connection
      - equals_number: 9
        title: Local Gateway
        description: Through a local gateway
      - equals_number: 10
        title: Gateway VPC
        description: Through a gateway VPC endpoint (Nitro-based instances only)
      - equals_number: 11
        title: Internet Gateway
        description: Through an Internet gateway (Nitro-based instances only)
      - equals_number: 99
        title: Other
        description: The boundary is not mapped. See the <code>boundary</code> attribute,
          which contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: boundary
