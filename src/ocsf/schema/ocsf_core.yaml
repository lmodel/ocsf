      ocsf_extension: win
  service_category_id:
    title: Service Category ID
    description: The normalized identifier of the service category.
    slot_uri: ocsf:service_category_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The service category is unknown.
      - equals_number: 1
        title: Kernel Mode
        description: A kernel mode driver.
      - equals_number: 2
