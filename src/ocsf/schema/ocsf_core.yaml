    description: The state of the event or object, normalized to the caption of the state_id
      value. In the case of 'Other', it is defined by the event source. See specific usage.
    slot_uri: ocsf:state
    range: ocsf_string_t
  state_id:
    title: State ID
    description: The normalized state ID of the event or object. See specific usage.
    slot_uri: ocsf:state_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The state is unknown.
      - equals_number: 99
        title: Other
        description: The state is not mapped. See the <code>state</code> attribute, which
          contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: state
  status:
    title: Status
    description: The status label, normalized to the caption of the <code>status_id</code>
      value. When <code>status_id</code> is <code>99</code> (Other), this attribute <b>must</b>
      contain a source-specific status label. See specific usage.
    slot_uri: ocsf:status
    range: ocsf_string_t
  status_code:
    title: Status Code
    description: The source-specific status or error code. This preserves the original code
      for detailed troubleshooting beyond what <code>status_id</code> conveys. See specific
      usage.
    slot_uri: ocsf:status_code
    range: ocsf_string_t
  status_detail:
    title: Status Detail
    description: Additional context about the outcome, beyond the normalized <code>status_id</code>
      and source-specific <code>status_code</code>. See specific usage.
    slot_uri: ocsf:status_detail
    range: ocsf_string_t
  status_details:
    title: Status Details
    description: A list of descriptions providing additional context about the outcome. See
      specific usage.
    slot_uri: ocsf:status_details
    range: ocsf_string_t
    multivalued: true
  status_id:
    title: Status ID
    description: The normalized status identifier. See specific usage.
    slot_uri: ocsf:status_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The status is unknown.
      - equals_number: 99
        title: Other
        description: The status is not mapped. See the <code>status</code> attribute, which
          contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: status
  storage_class:
    title: Storage Class
    description: The storage class of the entity. See specific usage.
    slot_uri: ocsf:storage_class
    range: ocsf_string_t
  stratum:
    title: Stratum
    description: The stratum level of the NTP server's time source, normalized to the caption
      of the stratum_id value.
    slot_uri: ocsf:stratum
    range: ocsf_string_t
  stratum_id:
    title: Stratum ID
    description: The normalized identifier of the stratum level of an NTP server's time source,
      as defined in RFC 5905. Levels range from 0 to 16, with lower numbers representing higher
      accuracy and greater proximity to the root clock.
    slot_uri: ocsf:stratum_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: Unspecified or invalid.
      - equals_number: 1
        title: Primary Server
        description: The highest precision primary server (e.g atomic clock or GPS).
      - equals_number: 2
        title: Secondary Server
        description: 'A secondary level server (possible values: 2-15).'
      - equals_number: 16
        title: Unsynchronized
      - equals_number: 17
        title: Reserved
        description: 'Reserved stratum (possible values: 17-255).'
      - equals_number: 99
        title: Other
        description: The stratum level is not mapped. See the <code>stratum</code> attribute,
          which contains a data source specific value.
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5905.html
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: stratum
  string_data:
    title: String Data
    description: The item's data if it can be represented as a UTF-8 string.
    slot_uri: ocsf:string_data
    range: ocsf_string_t
  subdomain:
    title: Subdomain
    description: 'The subdomain portion of the URL. For example: <code>sub</code> in <code>https://sub.example.com</code>
      or <code>sub2.sub1</code> in <code>https://sub2.sub1.example.com</code>.'
    slot_uri: ocsf:subdomain
    range: ocsf_string_t
  subdomains:
    title: Subdomains
    description: An array of subdomain strings. Can be used to collect several subdomains
      such as those from Domain Generation Algorithms (DGAs).
    slot_uri: ocsf:subdomains
    range: ocsf_string_t
    multivalued: true
  subject:
    title: Subject Details
    description: The identifier of the subject. See specific usage.
    slot_uri: ocsf:subject
    range: ocsf_string_t
  subnet:
    title: Subnet
    description: The subnet mask.
    slot_uri: ocsf:subnet
    range: ocsf_subnet_t
  subnet_prefix:
    title: Subnet Prefix Length
    description: The subnet prefix length determines the number of bits used to represent
      the network part of the IP address. The remaining bits are reserved for identifying
      individual hosts within that subnet.
    slot_uri: ocsf:subnet_prefix
    range: ocsf_integer_t
  subnet_uid:
    title: Subnet UID
    description: The unique identifier of a virtual subnet.
    slot_uri: ocsf:subnet_uid
    range: ocsf_string_t
  supporting_data:
    title: Supporting Data
    description: Additional data supporting a finding as provided by security tool
    slot_uri: ocsf:supporting_data
    range: string
    any_of:
      - range: OcsfJsonValue
      - range: OcsfJsonValue
        multivalued: true
  surname:
    title: Surname
    description: The last or family name for the user.
    slot_uri: ocsf:surname
    range: ocsf_string_t
  svc_name:
    title: Service Name
    description: The service name in service-to-service connections. For example, AWS VPC
      logs the pkt-src-aws-service and pkt-dst-aws-service fields identify the connection
      is coming from or going to an AWS service.
    slot_uri: ocsf:svc_name
    range: ocsf_string_t
  system_call:
    title: System Call
    description: The system call that was invoked.
    slot_uri: ocsf:system_call
    range: ocsf_string_t
  tag:
    title: Image Tag
    description: 'The image tag. For example: <code>1.11-alpine</code>.'
    slot_uri: ocsf:tag
    deprecated: Use the <code>labels</code> or <code>tags</code> attribute instead.
    range: ocsf_string_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.4.0
      ocsf_superseded_by: labels tags
  target:
    title: Target
    description: The target of the event or object. See specific usage.
    slot_uri: ocsf:target
    range: ocsf_string_t
  tcp_flags:
    title: TCP Flags
    description: The network connection TCP header flags (i.e., control bits).
    slot_uri: ocsf:tcp_flags
    range: ocsf_integer_t
  tcp_state_id:
    title: TCP State ID
    description: The state of the TCP socket for the network connection.
    slot_uri: ocsf:tcp_state_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The socket state is unknown.
      - equals_number: 1
        title: ESTABLISHED
        description: The socket has an established connection between a local application
          and a remote peer.
      - equals_number: 2
        title: SYN-SENT
        description: The socket is actively trying to establish a connection to a remote peer.
      - equals_number: 3
        title: SYN-RECEIVED
        description: The socket has passively received a connection request from a remote
          peer.
      - equals_number: 4
        title: FIN-WAIT-1
        description: The socket connection has been closed by the local application, the remote
          peer has not yet acknowledged the close, and the system is waiting for it to close
          its half of the connection.
      - equals_number: 5
        title: FIN-WAIT-2
        description: The socket connection has been closed by the local application, the remote
          peer has acknowledged the close, and the system is waiting for it to close its half
          of the connection.
      - equals_number: 6
        title: TIME-WAIT
        description: The socket connection has been closed by the local application, the remote
          peer has closed its half of the connection, and the system is waiting to be sure
          that the remote peer received the last acknowledgement.
      - equals_number: 7
        title: CLOSED
        description: The socket is not in use.
      - equals_number: 8
        title: CLOSE-WAIT
        description: The socket connection has been closed by the remote peer, and the system
          is waiting for the local application to close its half of the connection.
      - equals_number: 9
        title: LAST-ACK
        description: The socket connection has been closed by the remote peer, the local application
          has closed its half of the connection, and the system is waiting for the remote
          peer to acknowledge the close.
      - equals_number: 10
        title: LISTEN
        description: The socket is listening for incoming connections.
      - equals_number: 11
        title: CLOSING
        description: The socket connection has been closed by the local application and the
          remote peer simultaneously, and the remote peer has not yet acknowledged the close
          attempt of the local application.
    see_also:
      - https://datatracker.ietf.org/doc/html/rfc9293
  tenant_uid:
    title: Tenant UID
    description: The unique tenant identifier.
    slot_uri: ocsf:tenant_uid
    range: ocsf_string_t
  terminal:
    title: Terminal
    description: 'The Pseudo Terminal. Ex: the tty or pts value.'
    slot_uri: ocsf:terminal
    range: ocsf_string_t
  terminated_time:
    title: Terminated Time
    description: The time when the entity was terminated. See specific usage.
    slot_uri: ocsf:terminated_time
    range: ocsf_timestamp_t
  terminated_time_dt:
    title: Terminated Time
    description: The time when the entity was terminated. See specific usage.
    slot_uri: ocsf:terminated_time_dt
    range: ocsf_datetime_t
  tid:
    title: Thread ID
    description: The identifier of the thread associated with the event, as returned by the
      operating system.
    slot_uri: ocsf:tid
    deprecated: <code>tid</code> is deprecated in favor of <code>ptid</code>. <code>ptid</code>
      has type <code>long_t</code> which can accommodate the thread identifiers returned by
      all platforms (e.g. 64-bit on MacOS).
    range: ocsf_integer_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_deprecated_since: 1.6.0
      ocsf_superseded_by: ptid
  time:
    title: Event Time
    description: The normalized event occurrence time. See specific usage.
    slot_uri: ocsf:time
    range: ocsf_timestamp_t
  time_dt:
    title: Event Time
    description: The normalized event occurrence time. See specific usage.
    slot_uri: ocsf:time_dt
    range: ocsf_datetime_t
  timezone_offset:
    title: Timezone Offset
    description: The number of minutes that the reported event <code>time</code> is ahead
      or behind UTC, in the range -1,080 to +1,080. This allows consumers to reconstruct the
      local time at the event source. For example, US Eastern Standard Time is <code>-300</code>.
      Populate this when the source provides local time zone information.
    slot_uri: ocsf:timezone_offset
    range: ocsf_integer_t
  title:
    title: Title
    description: The title of an entity. See specific usage.
    slot_uri: ocsf:title
    range: ocsf_string_t
  tlp:
    title: Traffic Light Protocol
    description: The Traffic Light Protocol (TLP) was created to facilitate greater sharing
      of potentially sensitive information and more effective collaboration. TLP provides
      a simple and intuitive schema for indicating with whom potentially sensitive information
      can be shared.
    slot_uri: ocsf:tlp
    range: ocsf_string_t
    see_also:
      - https://www.first.org/tlp/
  to:
    title: To
    description: The machine-readable email header To values, as defined by RFC 5322. For
      example <code>example.user@usersdomain.com</code>
    slot_uri: ocsf:to
    range: ocsf_email_t
    multivalued: true
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5322
  to_mailboxes:
    title: To Mailboxes
    description: The human-readable email header To Mailbox values. For example <code>'Example
      User &lt;example.user@usersdomain.com&gt;'</code>.
    slot_uri: ocsf:to_mailboxes
    range: ocsf_string_t
    multivalued: true
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  total:
    title: Total
    description: The total number of items. See specific usage.
    slot_uri: ocsf:total
    range: ocsf_integer_t
  total_potential_attacks_count:
    title: Total Potential Attacks Count
    description: The total count of privilege-to-attack technique mappings identified across
      all analyzed privileges.
    slot_uri: ocsf:total_potential_attacks_count
    range: ocsf_integer_t
  total_tokens:
    title: Total Tokens
    description: Total number of tokens used for this message (prompt + completion).
    slot_uri: ocsf:total_tokens
    range: ocsf_integer_t
  track_direction:
    title: Track Direction
    description: Direction of flight expressed as a “True North-based” ground track angle.
      This value is provided in clockwise degrees with a minimum resolution of 1 degree. If
      aircraft is not moving horizontally, use the “Unknown” value
    slot_uri: ocsf:track_direction
    range: ocsf_string_t
  transaction_id:
    title: Transaction ID
    description: The identifier of a transaction. See specific usage.
    slot_uri: ocsf:transaction_id
    range: ocsf_integer_t
  transaction_uid:
    title: Transaction UID
    description: The unique identifier of the transaction.
    slot_uri: ocsf:transaction_uid
    range: ocsf_string_t
  transmit_time:
    title: Transmission Time
    description: The event transmission time from one device to another.  See specific usage.
    slot_uri: ocsf:transmit_time
    range: ocsf_timestamp_t
  transmit_time_dt:
    title: Transmission Time
    description: The event transmission time from one device to another.  See specific usage.
    slot_uri: ocsf:transmit_time_dt
    range: ocsf_datetime_t
  tree_uid:
    title: Tree UID
    description: The tree id is a unique SMB identifier which represents an open connection
      to a share.
    slot_uri: ocsf:tree_uid
    range: ocsf_string_t
  ttl:
    title: TTL
    description: The time interval that the resource record may be cached. Zero value means
      that the resource record can only be used for the transaction in progress, and should
      not be cached.
    slot_uri: ocsf:ttl
    range: ocsf_integer_t
  tunnel_type:
    title: Tunnel Type
    description: The type of tunnel configuration, normalized to the caption of the <code>tunnel_type_id</code>
      value, indicating the scope of traffic routed through the connection. See specific usage.
    slot_uri: ocsf:tunnel_type
    range: ocsf_string_t
  tunnel_type_id:
    title: Tunnel Type ID
    description: The normalized identifier for the type of tunnel configuration, indicating
      the scope of traffic routed through the connection. See specific usage.
    slot_uri: ocsf:tunnel_type_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The type of tunnel configuration is unknown.
      - equals_number: 1
        title: Split Tunnel
        description: The tunnel configuration routes only specific traffic through the tunnel.
      - equals_number: 2
        title: Full Tunnel
        description: The tunnel configuration routes all traffic through the tunnel.
      - equals_number: 99
        title: Other
        description: The type of tunnel configuration is not defined by the event source.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: tunnel_type
  type:
    title: Type
    description: The type of an object or value, normalized to the caption of the type_id
      value. In the case of 'Other', it is defined by the event source. See specific usage.
    slot_uri: ocsf:type
    range: ocsf_string_t
  type_id:
    title: Type ID
    description: The normalized type identifier of an object. See specific usage.
    slot_uri: ocsf:type_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The type is unknown.
      - equals_number: 99
        title: Other
        description: The type is not mapped. See the <code>type</code> attribute, which contains
          a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: type
  type_name:
    title: Type Name
    description: 'The event/finding type name, combining the class and activity (e.g., <code>"Detection
      Finding: Create"</code>). The value must match the <code>class_name</code> and <code>activity_name</code>
      joined by <code>": "</code>.'
    slot_uri: ocsf:type_name
    range: ocsf_string_t
  type_uid:
    title: Type ID
    description: 'The event/finding type ID. It identifies the event''s semantics and structure.
      Producers and mappers <b>must</b> compute this as <code>class_uid * 100 + activity_id</code>.
      It uniquely identifies the combination of event class and activity across the entire
      schema. For example, <code>Detection Finding: Create</code> is <code>200401</code>.'
    slot_uri: ocsf:type_uid
    range: ocsf_long_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: type_name
  types:
    title: Types
    description: The type/s of an entity. See specific usage.
    slot_uri: ocsf:types
    range: ocsf_string_t
    multivalued: true
  udid:
    title: Unique Device Identifier
    description: 'The Apple assigned Unique Device Identifier (UDID). For iOS, iPadOS, tvOS,
      watchOS and visionOS devices, this is the UDID. For macOS devices, it is the Provisioning
      UDID. For example: <code>00008020-008D4548007B4F26</code>'
    slot_uri: ocsf:udid
    range: ocsf_string_t
    see_also:
      - https://theapplewiki.com/wiki/UDID
  uid:
    title: Unique ID
    description: The unique identifier. See specific usage.
    slot_uri: ocsf:uid
    range: ocsf_string_t
  uid_alt:
    title: Alternate ID
    description: The alternate unique identifier. See specific usage.
    slot_uri: ocsf:uid_alt
    range: ocsf_string_t
  uid_numeric:
    title: Numeric Unique ID
    description: The unique identifier in numeric form. See specific usage.
    slot_uri: ocsf:uid_numeric
    range: ocsf_long_t
  unique_malware_count:
    title: Unique Malware Count
    description: The number of unique malware detected during a scan. See specific usage.
    slot_uri: ocsf:unique_malware_count
    range: ocsf_integer_t
  untruncated_size:
    title: Untruncated Size
    description: The size in bytes of an attribute before truncation. See specific usage.
    slot_uri: ocsf:untruncated_size
    range: ocsf_integer_t
  unused_privileges_count:
    title: Unused Privileges Count
    description: The number of unused Privileges. See specific usage.
    slot_uri: ocsf:unused_privileges_count
    range: ocsf_integer_t
  unused_services_count:
    title: Unused Services Count
    description: The number of unused services. See specific usage.
    slot_uri: ocsf:unused_services_count
    range: ocsf_integer_t
  uploaded_time:
    title: Uploaded Time
    description: The timestamp at which an entity was uploaded. See specific usage.
    slot_uri: ocsf:uploaded_time
    range: ocsf_timestamp_t
  uploaded_time_dt:
    title: Uploaded Time
    description: The timestamp at which an entity was uploaded. See specific usage.
    slot_uri: ocsf:uploaded_time_dt
    range: ocsf_datetime_t
  uri:
    title: URI
    description: A Uniform Resource Identifier (URI) is a string of characters that identifies
      a resource on the Internet. URIs can identify physical resources, like webpages and
      documents. See specific usage.
    slot_uri: ocsf:uri
    range: ocsf_url_t
    see_also:
      - https://datatracker.ietf.org/doc/html/rfc3986
  url_string:
    title: URL String
    description: 'The URL string. See RFC 1738. For example: <code>http://www.example.com/download/trouble.exe</code>.'
    slot_uri: ocsf:url_string
    range: ocsf_url_t
  user_agent:
    title: HTTP User-Agent
    description: The request header that identifies the operating system and web browser.
    slot_uri: ocsf:user_agent
    range: ocsf_string_t
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_observable: '16'
  uuid:
    title: UUID
    description: The universally unique identifier. See specific usage.
    slot_uri: ocsf:uuid
    range: ocsf_uuid_t
  value:
    title: Value
    description: The value associated to an attribute. See specific usage.
    slot_uri: ocsf:value
    range: ocsf_string_t
  values:
    title: Values
    description: An array of values associated to an attribute. See specific usage.
    slot_uri: ocsf:values
    range: ocsf_string_t
    multivalued: true
  vector_string:
    title: Vector String
    description: 'The CVSS vector string is a text representation of a set of CVSS metrics.
      It is commonly used to record or transfer CVSS metric information in a concise form.
      For example: <code>3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:H</code>.'
    slot_uri: ocsf:vector_string
    range: ocsf_string_t
    exact_mappings:
      - cve:vectorString
  vendor_id_list:
    title: Vendor ID List
    description: The list of vendor IDs. See specific usage.
    slot_uri: ocsf:vendor_id_list
    range: ocsf_string_t
    multivalued: true
  vendor_name:
    title: Vendor Name
    description: The name of the vendor. See specific usage.
    slot_uri: ocsf:vendor_name
    range: ocsf_string_t
  verdict:
    title: Verdict
    description: The verdict assigned to an Incident finding.
    slot_uri: ocsf:verdict
    range: ocsf_string_t
  verdict_id:
    title: Verdict ID
    description: The normalized verdict of an Incident.
    slot_uri: ocsf:verdict_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The type is unknown.
      - equals_number: 1
        title: False Positive
        description: The incident is a false positive.
      - equals_number: 2
        title: True Positive
        description: The incident is a true positive.
      - equals_number: 3
        title: Disregard
        description: The incident can be disregarded as it is unimportant, an error or accident.
      - equals_number: 4
        title: Suspicious
        description: The incident is suspicious.
      - equals_number: 5
        title: Benign
        description: The incident is benign.
      - equals_number: 6
        title: Test
        description: The incident is a test.
      - equals_number: 7
        title: Insufficient Data
        description: The incident has insufficient data to make a verdict.
      - equals_number: 8
        title: Security Risk
        description: The incident is a security risk.
      - equals_number: 9
        title: Managed Externally
        description: The incident remediation or required actions are managed externally.
      - equals_number: 10
        title: Duplicate
        description: The incident is a duplicate.
      - equals_number: 99
        title: Other
        description: The type is not mapped. See the <code>type</code> attribute, which contains
          a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: verdict
  version:
    title: Version
    description: The version that pertains to the event or object. See specific usage.
    slot_uri: ocsf:version
    range: ocsf_string_t
  vertical_speed:
    title: Vertical Speed
    description: 'Vertical speed upward relative to the WGS-84 datum, measured in meters per
      second. Special Values: <code>Invalid</code>, <code>No Value</code>, or <code>Unknown:
      63 m/s</code>.'
    slot_uri: ocsf:vertical_speed
    range: ocsf_string_t
  vlan_uid:
    title: VLAN
    description: The Virtual LAN identifier.
    slot_uri: ocsf:vlan_uid
    range: ocsf_string_t
  volume:
    title: Volume
    description: The volume on the storage device where the file is located. See specific
      usage.
    slot_uri: ocsf:volume
    range: ocsf_string_t
  vpc_uid:
    title: VPC UID
    description: The unique identifier of the Virtual Private Cloud (VPC).
    slot_uri: ocsf:vpc_uid
    range: ocsf_string_t
  vram_mode:
    title: VRAM Mode
    description: The video memory attachment mode, indicating how the VRAM hardware is integrated
      with the system (e.g., shared or dedicated), normalized to the caption of the vram_mode_id
      value. For 'Other', the exact attachment mode is defined by the event source.
    slot_uri: ocsf:vram_mode
    range: ocsf_string_t
  vram_mode_id:
    title: VRAM Mode ID
    description: The normalized identifier of the video memory attachment mode.
    slot_uri: ocsf:vram_mode_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The VRAM mode is unknown or not reported.
      - equals_number: 1
        title: Shared
        description: Video memory is allocated from system memory.
      - equals_number: 2
        title: Dedicated
        description: Video memory is physically separate from system memory.
      - equals_number: 99
        title: Other
        description: A VRAM mode not covered by the defined values; the exact value is reported
          by the event source.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: vram_mode
  vram_size:
    title: VRAM Size
    description: The total amount of installed video RAM.
    slot_uri: ocsf:vram_size
    range: ocsf_integer_t
  working_directory:
    title: Working Directory
    description: The working directory of a process.
    slot_uri: ocsf:working_directory
    range: ocsf_string_t
  write_count:
    title: Write Count
    description: The write count. See specific usage.
    slot_uri: ocsf:write_count
    range: ocsf_integer_t
  x_forwarded_for:
    title: X-Forwarded-For
    description: The X-Forwarded-For header identifying the originating IP address(es) of
      a client connecting to a web server through an HTTP proxy or a load balancer.
    slot_uri: ocsf:x_forwarded_for
    range: ocsf_ip_t
    multivalued: true
  x_originating_ip:
    title: X-Originating-IP
    description: The X-Originating-IP header identifying the emails originating IP address(es).
    slot_uri: ocsf:x_originating_ip
    range: ocsf_ip_t
    multivalued: true
  zone:
    title: Network Zone
    description: The network zone or LAN segment. See specific usage.
    slot_uri: ocsf:zone
    range: ocsf_string_t
classes:
  OcsfFacts:
    description: 'What an annotation states about an OCSF element where the metamodel has
      no slot for it. No data holds this class: it declares the annotation keys, and each
      annotated element names it through instantiates.'
    class_uri: ocsf:OcsfFacts
    abstract: true
    attributes:
      ocsf_key:
        description: The item's key in OCSF, scoped by its extension where it has one.
      ocsf_category:
        description: The event class's category, by OCSF's key.
      ocsf_category_uid:
        description: The category's number, on the subset that stands for it.
      ocsf_extension:
        description: The extension that defines the element.
      ocsf_extension_uid:
        description: The extension's number, on the subset that stands for it.
      ocsf_group:
        description: 'An attribute''s group: classification, context, occurrence or primary.'
      ocsf_profiles:
        description: The profiles behind an element, by OCSF's key and space separated. An
          event holds an attribute that names any only if metadata.profiles lists one of them.
          On a class, they are every profile OCSF lists for it, its nested objects' included.
      ocsf_requirement:
        description: OCSF's requirement on an attribute a profile brings, which applies only
          when the event lists the profile.
      ocsf_sibling:
        description: The string attribute that holds the label of an enumerated one.
      ocsf_observable:
        description: OCSF's observable type id for the element.
      ocsf_source_note:
        description: OCSF's note on where an attribute comes from.
      ocsf_suppress_checks:
        description: The convention checks OCSF turns off for an attribute.
      ocsf_max_len:
        description: OCSF's longest allowed value of a data type, in characters.
      ocsf_constraints:
        description: A class's at_least_one and just_one constraints, as JSON.
      ocsf_associations:
        description: A class's associations between attributes, as JSON.
      ocsf_deprecated_since:
        description: The OCSF version that deprecated the element.
      ocsf_superseded_by:
        description: What OCSF names as the replacement, space separated.
  OcsfJsonValue:
    title: JSON
    description: Embedded JSON value. A value can be a string, or a number, or true or false
      or null, or an object or an array. These structures can be nested.
    class_uri: linkml:Any
    annotations:
      ocsf_key: json_t
    instantiates:
      - ocsf:OcsfFacts
  OcsfObject:
    title: Object
    description: An unordered collection of attributes. It defines a set of attributes available
      in all objects. It can be also used as a generic object to log objects that are not
      otherwise defined by the schema.
    class_uri: linkml:Any
    annotations:
      ocsf_key: object
    instantiates:
      - ocsf:OcsfFacts
