    see_also:
      - https://docs.zeek.org/en/master/scripts/base/protocols/conn/main.zeek.html#detailed-interface:~:text=Records%20the%20state%20history%20of%20connections%20as%20a%20string%20of%20letters.%20The%20meaning%20of%20those%20letters%20is
  flag_ids:
    title: Communication Flag IDs
    description: The list of normalized identifiers of the communication flag IDs. See specific
      usage.
    slot_uri: ocsf:flag_ids
    range: ocsf_integer_t
    multivalued: true
    any_of:
      - equals_number: 0
        title: Unknown
        description: The flag is unknown.
      - equals_number: 99
        title: Other
        description: The flag is not mapped. See the <code>flags</code> attribute, which contains
          a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: flags
  flags:
    title: Flags
    description: The list of communication flags, normalized to the captions of the flag_ids
      values. See specific usage.
    slot_uri: ocsf:flags
    range: ocsf_string_t
    multivalued: true
  format:
    title: Format
    description: The format, normalized to the caption of the format_id value. In the case
      of 'Other', it is defined by the event source. See specific usage.
    slot_uri: ocsf:format
    range: ocsf_string_t
  format_id:
    title: Format ID
    description: The normalized identifier of the format. See specific usage.
    slot_uri: ocsf:format_id
    range: ocsf_integer_t
    any_of:
      - equals_number: 0
        title: Unknown
        description: The format is unknown.
      - equals_number: 99
        title: Other
        description: The format is not mapped. See the <code>format</code> attribute, which
          contains a data source specific value.
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_sibling: format
  forward_addr:
    title: Forwarding Address
    description: The user's forwarding email address.
    slot_uri: ocsf:forward_addr
    range: ocsf_email_t
  from:
    title: From
    description: The machine-readable email header From value, as defined by RFC 5322. For
