      the value in <code>from</code>. For example <code>example.user@usersdomain.com</code>.
    slot_uri: ocsf:from_list
    range: ocsf_email_t
    multivalued: true
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  from_mailbox:
    title: From Mailbox
    description: The human-readable email header From Mailbox value. For example <code>'Example
      User &lt;example.user@usersdomain.com&gt;'</code>.
    slot_uri: ocsf:from_mailbox
    range: ocsf_string_t
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  from_mailboxes:
    title: From Mailboxes
    description: The human-readable email header From Mailbox values. This array should contain
      the value in <code>from_mailbox</code>. For example <code>'Example User &lt;example.user@usersdomain.com&gt;'</code>.
    slot_uri: ocsf:from_mailboxes
    range: ocsf_email_t
    multivalued: true
    see_also:
      - https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  full_name:
