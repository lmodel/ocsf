    slot_usage:
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Process Remediation
          Activity</code>.'
      class_uid:
        equals_number: 7003
      process:
        description: The process that pertains to the remediation event.
        required: true
        annotations:
