---
id: https://w3id.org/lmodel/ocsf/ocsf_events_remediation
name: ocsf_events_remediation
title: 'OCSF event classes: Remediation'
description: Remediation events report the results of remediation commands targeting files,
  processes, and other objects.
version: 1.9.0
source: https://github.com/ocsf/ocsf-schema/tree/1.9.0
license: Apache-2.0
see_also:
  - https://lmodel.github.io/ocsf
  - https://schema.ocsf.io/1.9.0/
prefixes:
  ocsf: https://w3id.org/lmodel/ocsf/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  attack: https://w3id.org/lmodel/attack/
  cve: https://w3id.org/lmodel/cve/
  cwe: https://w3id.org/lmodel/cwe/
  d3f: http://d3fend.mitre.org/ontologies/d3fend.owl#
  kev_catalog: https://w3id.org/lmodel/kev-catalog/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/
  stix: https://w3id.org/lmodel/stix/
default_prefix: ocsf
default_range: string
imports:
  - linkml:types
  - ocsf_core
  - ocsf_objects
  - ocsf_events_base
classes:
  OcsfRemediationActivity:
    title: Remediation Activity
    description: Remediation Activity events report on attempts at remediating a compromised
      device or computer network.
    class_uri: ocsf:OcsfRemediationActivity
    see_also:
      - https://d3fend.mitre.org/
    is_a: OcsfBaseEvent
    in_subset:
      - ocsf_category_remediation
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: remediation_activity
      ocsf_category: remediation
      ocsf_profiles: cloud container data_classification datetime host linux/linux_users macos/macos_users
        osint record_integrity security_control
    slots:
      - command_uid
      - countermeasures
      - remediation
      - scan
    slot_usage:
      activity_id:
        description: 'Matches the countermeasure tactic. Note: the Model tactic is not supported
          by the OCSF Remediation event class.'
        any_of:
          - equals_number: 0
            title: Unknown
            description: The event activity is unknown.
          - equals_number: 1
            title: Isolate
            description: Creates logical or physical barriers in a system which reduces opportunities
              for adversaries to create further accesses.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Isolate/
          - equals_number: 2
            title: Evict
            description: Removes an adversary or malicious resource from a device or computer
              network.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Evict/
          - equals_number: 3
            title: Restore
            description: Returns the system to a better state.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Restore/
          - equals_number: 4
            title: Harden
            description: Increases the opportunity cost of computer network exploitation.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Harden/
          - equals_number: 5
            title: Detect
            description: Identify adversary access to or unauthorized activity on computer
              networks.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Detect/
          - equals_number: 6
            title: Deceive
            description: Advertise, entice, and allow potential attackers access to an observed
              or controlled environment.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Deceive/
          - equals_number: 99
            title: Other
            description: The event activity is not mapped. See the <code>activity_name</code>
              attribute, which contains a data source specific value.
      category_name:
        description: 'The event category name, as defined by category_uid value: <code>Remediation</code>.'
      category_uid:
        equals_number: 7
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Remediation
          Activity</code>.'
      class_uid:
        equals_number: 7001
      command_uid:
        description: The unique identifier of the remediation command that pertains to this
          event.
        required: true
        annotations:
          ocsf_group: primary
      countermeasures:
        recommended: true
        annotations:
          ocsf_group: primary
      remediation:
        annotations:
          ocsf_group: context
      scan:
        description: The remediation scan that pertains to this event.
        annotations:
          ocsf_group: context
      status_id:
        any_of:
          - equals_number: 0
            title: Unknown
            description: The status is unknown.
          - equals_number: 1
            title: Success
            description: The activity completed successfully.
          - equals_number: 2
            title: Failure
            description: The activity failed.
          - equals_number: 3
            title: Does Not Exist
            description: The target of the remediation does not exist.
          - equals_number: 4
            title: Partial
            description: The remediation was partially completed.
          - equals_number: 5
            title: Unsupported
            description: The remediation was not supported.
          - equals_number: 6
            title: Error
            description: There was an error during the remediation process.
          - equals_number: 99
            title: Other
            description: The status is not mapped. See the <code>status</code> attribute,
              which contains a data source specific value.
      type_uid:
        any_of:
          - equals_number: 700100
            title: 'Remediation Activity: Unknown'
          - equals_number: 700101
            title: 'Remediation Activity: Isolate'
            description: Creates logical or physical barriers in a system which reduces opportunities
              for adversaries to create further accesses.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Isolate/
          - equals_number: 700102
            title: 'Remediation Activity: Evict'
            description: Removes an adversary or malicious resource from a device or computer
              network.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Evict/
          - equals_number: 700103
            title: 'Remediation Activity: Restore'
            description: Returns the system to a better state.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Restore/
          - equals_number: 700104
            title: 'Remediation Activity: Harden'
            description: Increases the opportunity cost of computer network exploitation.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Harden/
          - equals_number: 700105
            title: 'Remediation Activity: Detect'
            description: Identify adversary access to or unauthorized activity on computer
              networks.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Detect/
          - equals_number: 700106
            title: 'Remediation Activity: Deceive'
            description: Advertise, entice, and allow potential attackers access to an observed
              or controlled environment.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Deceive/
          - equals_number: 700199
            title: 'Remediation Activity: Other'
  OcsfFileRemediationActivity:
