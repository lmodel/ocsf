  OcsfProcessRemediationActivity:
    title: Process Remediation Activity
    description: Process Remediation Activity events report on attempts at remediating processes.
      Sub-techniques of countermeasures will include Process Eviction, such as Process Termination
      or Kernel-based Process Isolation.
