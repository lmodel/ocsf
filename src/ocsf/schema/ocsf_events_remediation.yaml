    annotations:
      ocsf_key: file_remediation_activity
      ocsf_category: remediation
      ocsf_profiles: cloud container data_classification datetime host linux/linux_users macos/macos_users
        osint record_integrity security_control
    slots:
      - file
    slot_usage:
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>File Remediation
          Activity</code>.'
      class_uid:
        equals_number: 7002
      file:
        description: The file that pertains to the remediation event.
        required: true
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 700200
            title: 'File Remediation Activity: Unknown'
          - equals_number: 700201
            title: 'File Remediation Activity: Isolate'
            description: Creates logical or physical barriers in a system which reduces opportunities
              for adversaries to create further accesses.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Isolate/
          - equals_number: 700202
            title: 'File Remediation Activity: Evict'
            description: Removes an adversary or malicious resource from a device or computer
              network.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Evict/
          - equals_number: 700203
            title: 'File Remediation Activity: Restore'
            description: Returns the system to a better state.
