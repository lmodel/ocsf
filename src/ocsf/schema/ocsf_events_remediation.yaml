  OcsfNetworkRemediationActivity:
    title: Network Remediation Activity
    description: Network Remediation Activity events report on attempts at remediating computer
      networks. Techniques and Sub-techniques of countermeasures will include Network, such
      as Network Isolation or Network Traffic Filtering.
    class_uri: ocsf:OcsfNetworkRemediationActivity
    see_also:
      - https://d3fend.mitre.org/
    is_a: OcsfRemediationActivity
    in_subset:
      - ocsf_category_remediation
    instantiates:
      - ocsf:OcsfFacts
    annotations:
      ocsf_key: network_remediation_activity
      ocsf_category: remediation
      ocsf_profiles: cloud container data_classification datetime host linux/linux_users macos/macos_users
        osint record_integrity security_control
    slots:
      - connection_info
    slot_usage:
      class_name:
        description: 'The event class name, as defined by class_uid value: <code>Network Remediation
          Activity</code>.'
      class_uid:
        equals_number: 7004
      connection_info:
        description: The network connection that pertains to the remediation event.
        required: true
        annotations:
          ocsf_group: primary
      type_uid:
        any_of:
          - equals_number: 700400
            title: 'Network Remediation Activity: Unknown'
          - equals_number: 700401
            title: 'Network Remediation Activity: Isolate'
            description: Creates logical or physical barriers in a system which reduces opportunities
              for adversaries to create further accesses.
            see_also:
              - https://d3fend.mitre.org/tactic/d3f:Isolate/
