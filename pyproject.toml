[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
# Named like lmodel/slsa's slsa-linkml, so the PyPI name says what it holds;
# the import package stays ocsf. PyPI publishing is off.
name = "ocsf-linkml"
description = "Open Cybersecurity Schema Framework (OCSF) 1.9.0 (LinkML)"
authors = [
  {name = "Noel McLoughlin", email = "noel.mcloughlin@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
]

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    # tests/test_upstream.py compiles the copy again. OCSF's compiler needs Python 3.14.
    "ocsf-schema-compiler==1.1.1 ; python_version >= '3.14'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ocsf"]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/ocsf/_version.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/ocsf/datamodel/ocsf_pydantic.py",
  "src/ocsf/datamodel/ocsf.py",
  # OCSF's own words, spellings included, as the converter copies them from the tag;
  # the upstream's files, copied as published; the neighbours' adapt copies, copied as
  # released; what `lokf adapt` writes from them; and files copied in by the KTL sidecar
  # sync or written by npm, not by hand.
  "src/ocsf/schema/*",
  "docs/schema/*",
  "upstream/*",
  "tests/neighbours/*",
  "tests/upstream/*",
  ".lokf/schema/ocsf.yaml",
  ".lokf/schema/lokf.yaml",
  ".lokf/scripts/*",
  "website/package-lock.json",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke,actvity"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
# OCSF's own name for its Event Log Activity class, which tests/test_coverage.py holds.
actvity = "actvity"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/ocsf/datamodel/ocsf_pydantic.py",
  "src/ocsf/datamodel/ocsf.py",
  "src/ocsf/schema/*",
  "docs/schema/*",
  "upstream/*",
  "tests/neighbours/*",
  "tests/upstream/*",
  ".lokf/schema/ocsf.yaml",
  ".lokf/schema/lokf.yaml",
  ".lokf/scripts/*",
  "website/package-lock.json",
]
